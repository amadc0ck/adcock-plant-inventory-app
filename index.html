    const l = state.locations.find((x) => x.id === data.locationId);
    // Exclude itself from the parent picker to avoid self-referencing loops
    const parentOptions = locationOptionList().filter((o) => o.id !== l.id);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">Edit location</h3>
      <form id="edit-location-form">
        <label>Name *</label>
        <input id="el-name" required value="${escapeHtml(l.name)}" />
        <label>Type</label>
        <select id="el-type" onchange="syncHoldsPlants('el')">
          <option value="">— Unspecified —</option>
          ${Object.entries(LOCATION_TYPE_LABELS).map(([k, v]) =>
            `<option value="${k}" ${l.type === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <div class="checkbox-row">
          <input type="checkbox" id="el-holdsplants" ${locationHoldsPlants(l) ? "checked" : ""} />
          <label for="el-holdsplants">Plants are assigned directly to this location</label>
        </div>
        <div class="field-help">On for buckets, pots and In Ground. Off for areas like The Wall, whose photos are views of the whole area. Plants already here stay visible either way.</div>
        <label>Show in the Gallery as</label>
        <select id="el-galleryrow">
          ${Object.entries(GALLERY_ROW_LABELS).map(([k, v]) =>
            `<option value="${k}" ${(l.gallery_row || "none") === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <div class="field-help">Areas become Garden Albums. Somewhere the collection used to live — an old flat or office — becomes an Archive.</div>

        <div class="section-label">If this is a former location</div>
        <label>Locality</label>
        <input id="el-locality" placeholder="e.g. SF, CA" value="${escapeHtml(l.locality || "")}" />
        <div class="row" style="gap:10px;align-items:flex-end;">
          <div style="flex:1;"><label>From</label><input type="date" id="el-activefrom" value="${l.active_from || ""}" /></div>
          <div style="flex:1;"><label>Until</label><input type="date" id="el-activeto" value="${l.active_to || ""}" /></div>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="el-archived" ${l.archived ? "checked" : ""} />
          <label for="el-archived">Archived — hide from location pickers</label>
        </div>
        <div class="field-help">For a container that no longer exists (repotted) or a place the collection has left. History is kept either way. Separate from the Gallery setting above.</div>
        <label>Parent location</label>
        <select id="el-parent">
          <option value="">— None (top-level) —</option>
          ${parentOptions.map((o) => `<option value="${o.id}" ${l.parent_location_id === o.id ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}
        </select>
        <label>Sort order</label>
        <input id="el-sort" type="number" value="${l.sort_order ?? ""}" placeholder="Lower numbers appear first" />
        <label>Code</label>
        <input id="el-code" value="${escapeHtml(l.code || "")}" placeholder="e.g. W-T-12" />
        <label>Notes</label>
        <textarea id="el-notes" rows="2">${escapeHtml(l.notes || "")}</textarea>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Save changes</button>
      </form>
      ${/* Amanda went looking for delete HERE, from the Locations list's edit
           pencil, and it only existed on the location's own detail page. Same
           pattern as editTask's "Delete task" — the way out of a record belongs
           on the form you opened to change it.

           Routes to the removeLocation modal rather than deleting outright:
           that screen explains archive versus delete, counts what is filed
           here, and disables delete for a location with children. Duplicating
           any of that would mean two places to keep honest. */""}
      <button class="btn-ghost" style="margin-top:10px;font-weight:600;"
        onclick="closeModal();openModal('removeLocation',{locationId:'${l.id}'})">Archive or delete this location</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "newTask" || type === "editTask") {
    const editing = type === "editTask";
    const t = editing ? state.tasks.find((x) => x.id === data.taskId) : null;
    if (editing && !t) return `<p class="subtle">This task no longer exists.</p><button class="btn-ghost" onclick="closeModal()">Close</button>`;
    const q = (state.taskSubjectSearch || "").toLowerCase();
    const picked = state.taskSubjectDraft;
    const isPicked = (kind, id) => picked.some((d) => d.kind === kind && d.id === id);

    // Searching across all three kinds at once, because she does not think
    // "now I will add a location subject" — she thinks "bucket 87", and that
    // string should find it whatever kind of record it is.
    const matches = [];
    if (q) {
      state.locations.filter((l) => locationPath(l).toLowerCase().includes(q) || (l.code || "").toLowerCase().includes(q))
        .slice(0, 8).forEach((l) => matches.push({ kind: "location", id: l.id, label: locationPath(l), ic: icon("pin") }));
      state.plants.filter((pl) => plantSearchText(pl).includes(q))
        .slice(0, 8).forEach((pl) => matches.push({ kind: "plant", id: pl.id, label: `${pl.accession_number} · ${plantDisplayName(pl)}`, ic: icon("seedling") }));
      state.taxa.filter((x) => taxonDisplayName(x).toLowerCase().includes(q) || (x.common_name || "").toLowerCase().includes(q))
        .slice(0, 8).forEach((x) => matches.push({ kind: "taxa", id: x.id, label: taxonDisplayName(x), ic: icon("leaf") }));
    }

    const pickedLabel = (d) => {
      if (d.kind === "plant") { const pl = state.plants.find((x) => x.id === d.id); return pl ? `${pl.accession_number} · ${plantDisplayName(pl)}` : "?"; }
      if (d.kind === "location") { const l = locationById(d.id); return l ? locationPath(l) : "?"; }
      const x = taxonById(d.id); return x ? taxonDisplayName(x) : "?";
    };

    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">${editing ? "Edit task" : "New task"}</h3>
      <p class="subtle" style="margin:0 0 14px;">A task can point at any number of buckets, plants or species &mdash; it then shows up on each of them.</p>

      <label>What needs doing</label>
      <input id="task-title" placeholder="e.g. Pull these buckets and re-evaluate composition" value="${escapeHtml(t?.title || "")}" />
      <label>Detail (optional)</label>
      <textarea id="task-detail" rows="3" placeholder="e.g. a lot of these are mixed with multiple species &mdash; rearrange and consolidate">${escapeHtml(t?.detail || "")}</textarea>
      <label>Due date (optional)</label>
      <input type="date" id="task-due" value="${escapeHtml(t?.due_date || "")}" />

      <div class="section-label">Applies to</div>
      ${picked.length ? `<div class="task-chips">${picked.map((d) => `
        <button class="task-chip" onclick="toggleTaskSubjectDraft('${d.kind}','${d.id}')">${escapeHtml(pickedLabel(d))} ${icon("close")}</button>`).join("")}</div>`
        : `<p class="subtle" style="margin:0 0 8px;font-size:12.5px;">Nothing yet. A task with no subjects is fine &mdash; it just won't appear on any record.</p>`}
      <input placeholder="Search buckets, plants, species…" value="${escapeHtml(state.taskSubjectSearch || "")}"
        oninput="state.taskSubjectSearch=this.value;scheduleRender()" />
      ${q ? `<div class="stack" style="max-height:34vh;overflow-y:auto;margin-top:10px;">
        ${matches.length === 0 ? `<p class="subtle">Nothing matches.</p>` : matches.map((m) => `
          <button class="task-pick ${isPicked(m.kind, m.id) ? "is-picked" : ""}" onclick="toggleTaskSubjectDraft('${m.kind}','${m.id}')">
            ${m.ic}<span style="flex:1;text-align:left;">${escapeHtml(m.label)}</span>${isPicked(m.kind, m.id) ? icon("check") : ""}
          </button>`).join("")}
      </div>` : ""}

      <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="saveTask(${editing ? `'${t.id}'` : "null"})">${editing ? "Save changes" : "Create task"}</button>
      ${editing ? `<button class="btn-ghost" style="margin-top:10px;color:var(--terracotta);" onclick="deleteTask('${t.id}')">Delete task</button>` : ""}
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "waterPlants") {
    const d = state.waterDraft;
    if (!d) return `<p>Nothing selected.</p>`;
    const eff = effectiveWateringInterval();
    const reason = wateringIntervalReason();
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Record watering</h3>
      <p class="subtle" style="margin:0 0 14px;">
        ${countLabel(d.ids.length, "plant", "plants")}${d.label ? ` \u2014 ${escapeHtml(d.label)}` : ""}${d.kind === "location" ? ", including everything nested below it" : ""}.
      </p>
      <label>Date</label>
      <input type="date" id="water-date" value="${d.date}" max="${todayISO()}" />
      <div class="field-help">Defaults to today. Set it back if you are recording a watering you did earlier.</div>
      <label style="margin-top:12px;">Notes (optional)</label>
      <textarea id="water-notes" rows="2" placeholder="e.g. deep soak, first since the heat"></textarea>
      ${reason ? `<div class="field-help" style="margin-top:10px;">Currently flagging plants after <strong>${eff} days</strong> rather than ${wateringIntervalDays()}, because of ${escapeHtml(reason)}.</div>` : ""}
      <button class="btn btn-accent btn-block" style="margin-top:18px;" onclick="confirmWatering()">
        ${icon("droplets")} Water ${countLabel(d.ids.length, "plant", "plants")}
      </button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="state.waterDraft=null;closeModal()">Cancel</button>`;
  }

  if (type === "upload") {
    const loc = data.locationId ? locationById(data.locationId) : null;
    // v1.85.0: uploading straight onto a specimen. uploadPhoto() has always
    // taken a plantId; nothing ever passed one, so the only way to get a photo
    // onto a plant was to upload to the Inbox and file it afterwards.
    const upl = data.plantId ? state.plants.find((x) => x.id === data.plantId) : null;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">${upl ? `Add photo — ${escapeHtml(plantPickerName(upl).primary)}` : loc ? `Add photo — ${escapeHtml(loc.name)}` : "Add photos"}</h3>
      <p class="subtle" style="margin:0 0 14px;">${upl ? "Lands straight on this specimen's timeline — no filing step." : loc ? "Photo of this location/container — won't need attaching to a plant." : "Select multiple to upload them all at once — each lands in To Do separately."}</p>
      <form id="upload-form">
        <input type="file" id="upload-file" accept="image/*" ${loc || upl ? "" : "multiple"} required style="padding:10px;" />
        <label>Notes (optional${loc || upl ? "" : ", applied to all selected"})</label>
        <textarea id="upload-notes" rows="2" placeholder="e.g. new growth on the west side"></textarea>
        <button type="submit" class="btn btn-accent btn-block" style="margin-top:20px;" id="upload-submit-btn">${loc || upl ? "Upload" : "Upload to Inbox"}</button>
      </form>
      <div class="divider"></div>
      <button class="btn btn-secondary btn-block" onclick="openModal('photosPicker',${loc ? `{locationId:'${loc.id}'}` : "{}"})">${icon("photo")} Import from Google Photos</button>
      <div class="field-help">Pick from your Google Photos library. Capture dates come across automatically.</div>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "editPhoto") {
    const ph = state.photos.find((x) => x.id === data.photoId);
    if (!ph) return `<p>Not found.</p>`;
    const plant = ph.plant_id ? state.plants.find((x) => x.id === ph.plant_id) : null;
    // photo_type was effectively write-once: set at upload or by marking a
    // photo historical, and never editable afterwards. Marking one historical
    // also removes it from the Inbox, so a mistake here used to be permanent.
    const TYPES = PHOTO_TYPE_LABELS;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Edit photo</h3>
      <p class="mono subtle" style="margin:0 0 12px;">${fmtDate(photoDate(ph))}</p>
      ${/* Click the picture to say what matters in it. Every crop in the app
           then centres on that point instead of defaulting to the top, which
           is right for an upright specimen and wrong for a wide planting. */""}
      <div class="focal-stage" id="focal-target" onclick="setFocalFromClick(event, '${ph.id}')">
        ${photoImg(ph, "", `id="focal-img"`)}
        <div id="focal-marker" style="position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
             border:2px solid var(--parchment);box-shadow:0 0 0 2px rgba(20,32,26,0.6);pointer-events:none;
             left:${ph.focal_x == null ? 50 : ph.focal_x}%;top:${ph.focal_y == null ? 0 : ph.focal_y}%;"></div>
      </div>
      ${/* Only the two ratios the app actually crops to. A preview of a shape
           that never appears would mislead rather than help. */""}
      <div class="focal-previews">
        <div>
          <div class="focal-prev r-1x1">${photoImg(ph, "", `id="focal-prev-1x1"`)}</div>
          <span class="focal-prev-cap">Square<br/>tiles, thumbnails</span>
        </div>
        <div>
          <div class="focal-prev r-4x3">${photoImg(ph, "", `id="focal-prev-4x3"`)}</div>
          <span class="focal-prev-cap">4:3<br/>cards, heroes</span>
        </div>
      </div>
      ${suggestionBlock(ph.id)}
      <div class="row" style="margin:10px 0 14px;">
        <span class="subtle" style="font-size:11.5px;">Tap the photo to set what every crop centres on.</span>
        ${ph.focal_x != null ? `<button class="btn-ghost" style="font-size:11.5px;padding:0;" onclick="clearFocal('${ph.id}')">Reset</button>` : ""}
      </div>
      <form id="edit-photo-form">
        <label>Type</label>
        <select id="eph-type">
          ${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${(ph.photo_type || "general") === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        ${/* The `historical` type was removed in v1.56.0 — archive-ness comes
             from the photo's location being an archive, not from a type. This
             help text described the removed option for four versions. */""}
        <div class="field-help">What the photo shows, never how it is filed. Archive photos are archive photos because of where they are filed, not their type.
          ${/* The queue consequence was invisible. Amanda had photos of an
               ACTIVE container showing plants she will not catalogue, and no
               way to know that Overview already says exactly that — so they sat
               in "File to a plant" as permanent, unfinishable work. The
               behaviour was right; nothing surfaced it. */""}
          <br /><strong>Overview</strong> and <strong>Progress</strong> mean the photo shows the place rather than a specimen, so it stops being counted under &ldquo;File to a plant&rdquo;.</div>

        ${photosHaveHistorical() ? `
        <div class="checkbox-row">
          <input type="checkbox" id="eph-historical" ${ph.historical ? "checked" : ""} />
          <label for="eph-historical">Historical &mdash; records how this place used to be</label>
        </div>
        <div class="field-help">For a photo of a container showing plants that have since gone and will not be catalogued. It keeps its type and its location, stays in the timeline, and stops being counted under &ldquo;File to a plant&rdquo;. It is still asked for a location if it has none.</div>` : ""}

        <label>Location</label>
        ${(() => {
          const chosen = state.editPhotoLocation ? locationById(state.editPhotoLocation) : null;
          const parent = chosen && chosen.parent_location_id ? locationById(chosen.parent_location_id) : null;
          return `
          <div class="tag-card plant-list-card" style="padding:8px 10px;margin-bottom:8px;">
            <span class="suggestion-icon" style="color:var(--moss-dim);">${icon("pin")}</span>
            <div style="flex:1;min-width:0;">
              ${chosen ? `
                <div style="font-size:13.5px;font-weight:500;">${escapeHtml(chosen.name)}</div>
                <div style="font-size:11.5px;color:var(--ink-soft);">${parent ? escapeHtml(locationPath(parent)) : locationTypeLabel(chosen.type)}</div>`
              : `<div class="value-blank" style="font-size:13px;">Not filed to a location</div>`}
            </div>
            <div style="display:flex;gap:10px;flex-shrink:0;">
              <button type="button" class="btn-ghost" style="padding:0;font-size:12px;" onclick="state.editPhotoLocPickerOpen=!state.editPhotoLocPickerOpen;state.locPickerNewOpen=false;render()">${state.editPhotoLocPickerOpen ? "Close" : (chosen ? "Change" : "Choose")}</button>
              ${chosen ? `<button type="button" class="btn-ghost" style="padding:0;font-size:12px;color:var(--terracotta);" onclick="setEditPhotoLocation('')">Clear</button>` : ""}
            </div>
          </div>
          ${state.editPhotoLocPickerOpen ? locationPicker("setEditPhotoLocation('{id}')", { onCreatePick: "setEditPhotoLocation" }) : ""}`;
        })()}
        ${(() => {
          // The specimen already knows where it stands, and a photo of it was
          // almost certainly taken there. Offered rather than applied: a photo
          // can show a plant that has since moved, or been photographed
          // somewhere else entirely, and silently filing it to the wrong
          // container is worse than one extra tap.
          const chosen = state.editPhotoPlant ? state.plants.find((x) => x.id === state.editPhotoPlant) : null;
          const loc = chosen && chosen.location_id ? locationById(chosen.location_id) : null;
          if (!loc || loc.id === state.editPhotoLocation) return "";
          return `
            <div class="suggestion-row">
              <span class="suggestion-icon">${icon("pin")}</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:12.5px;color:var(--cream);"><strong>${escapeHtml(plantPickerName(chosen).primary)}</strong> lives in</div>
                <div style="font-size:13px;color:var(--blue);font-weight:600;">${escapeHtml(locationPath(loc))}</div>
              </div>
              <button type="button" class="btn btn-accent btn-sm" style="flex-shrink:0;" onclick="setEditPhotoLocation('${loc.id}')">File it here</button>
            </div>`;
        })()}

        ${/* PL-3. Was a dropdown of all 52 specimens labelled by accession
             number — the one picker PL-2 missed, and the one that matters most,
             since this is where a photo gets filed. Accession numbers are not
             memorised and a bare list gives no way to tell two Crassulas apart.
             Same plantPicker() as everywhere else, defaulted to this photo's
             own container. */""}
        <label>Plant</label>
        ${(() => {
          const chosen = state.editPhotoPlant ? state.plants.find((x) => x.id === state.editPhotoPlant) : null;
          const nm = chosen ? plantPickerName(chosen) : null;
          const cover = chosen ? plantCoverPhoto(chosen) : null;
          return `
          <div class="tag-card plant-list-card" style="padding:8px 10px;margin-bottom:8px;">
            <div class="plant-list-thumb" style="width:44px;height:44px;flex-shrink:0;">
              ${cover ? photoImg(cover) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
            </div>
            <div style="flex:1;min-width:0;">
              ${chosen ? `
                <div style="font-size:13.5px;font-weight:500;">${escapeHtml(nm.primary)}</div>
                ${nm.secondary ? `<div style="font-size:11.5px;font-style:italic;color:var(--ink-soft);">${escapeHtml(nm.secondary)}</div>` : ""}
                <div class="mono tag-id">${chosen.accession_number}</div>`
              : `<div class="value-blank" style="font-size:13px;">Not attached to a plant</div>`}
            </div>
            <div style="display:flex;gap:10px;flex-shrink:0;">
              <button type="button" class="btn-ghost" style="padding:0;font-size:12px;" onclick="state.editPhotoPickerOpen=!state.editPhotoPickerOpen;render()">${state.editPhotoPickerOpen ? "Close" : (chosen ? "Change" : "Choose")}</button>
              ${chosen ? `<button type="button" class="btn-ghost" style="padding:0;font-size:12px;color:var(--terracotta);" onclick="setEditPhotoPlant('')">Clear</button>` : ""}
            </div>
          </div>
          ${state.editPhotoPickerOpen ? plantPicker(`setEditPhotoPlant('{id}')`, {
            onNew: `newPlantFromEditPhoto('${ph.id}')`,
            onNewSameSpecies: `addSiblingSpecimen('{taxonId}')`,
            taxonId: state.editPhotoPlant ? (state.plants.find((x) => x.id === state.editPhotoPlant) || {}).taxa_id : null,
          }) : ""}`;
        })()}
        ${plant ? `<div class="field-help">Clearing this returns the photo to To Do, unless it still has a location.</div>` : ""}

        <label>Notes</label>
        <textarea id="eph-notes" rows="2">${escapeHtml(ph.notes || "")}</textarea>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Save</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "photosPicker") {
    const st = state.photosImport;
    if (!st) {
      return `
        <div class="modal-handle"></div>
        <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Import from Google Photos</h3>
        <p class="subtle" style="margin:0 0 14px;">Google Photos opens in a new tab. Pick as many as you like and press <strong>Done</strong> — that tab closes itself and you land back here while they import.</p>
        <button class="btn btn-accent btn-block" onclick="startPhotosPicker(${data.locationId ? `'${data.locationId}'` : "null"})">Choose photos</button>
        <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
    }
    if (st.phase === "picking") {
      return `
        <div class="modal-handle"></div>
        <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Waiting for your selection</h3>
        <p class="subtle" style="margin:0 0 14px;">Pick your photos in the Google Photos tab and press <strong>Done</strong>. It closes itself and brings you back here — nothing to do in this window.</p>
        ${st.pickerUri ? `<button class="btn btn-secondary btn-block" onclick="window.open('${st.pickerUri}','_blank')">Reopen Google Photos</button>` : ""}
        <button class="btn-ghost" style="margin-top:10px;" onclick="cancelPhotosImport()">Cancel</button>`;
    }
    if (st.phase === "importing") {
      return `
        <div class="modal-handle"></div>
        <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Importing</h3>
        <p class="subtle" style="margin:0 0 8px;">Downloading from Google Photos and filing into your collection.</p>
        <div class="mono" id="import-progress" style="font-size:13px;">${st.done} of ${st.total}${st.failed ? ` · ${st.failed} failed` : ""}</div>
        ${(() => {
          const elapsed = Math.max(1, Math.round((Date.now() - (st.startedAt || Date.now())) / 1000));
          const rate = st.done / elapsed;
          const left = rate > 0 ? Math.round((st.total - st.done) / rate / 60) : null;
          const idle = Math.round((Date.now() - (st.lastProgressAt || Date.now())) / 1000);
          return `<div class="mono subtle" style="font-size:11px;margin-top:6px;line-height:1.6;">
            running ${elapsed < 90 ? elapsed + "s" : Math.round(elapsed / 60) + " min"}${left !== null && st.done ? ` · about ${left} min left` : ""}<br/>
            last one ${idle < 5 ? "just now" : idle + "s ago"}${st.lastError ? ` · ${escapeHtml(st.lastError)}` : ""}
          </div>`;
        })()}
        ${(st.skippedTotal || st.alreadyIn) ? `<p class="subtle" style="margin:8px 0 0;font-size:11.5px;">${st.selected} selected, ${st.total} new${st.alreadyIn ? ` · ${st.alreadyIn} already imported` : ""}${st.skippedTotal ? ` · ${skippedReason(st.skipped)}` : ""}.</p>` : ""}
        <button class="btn-ghost" style="margin-top:14px;" onclick="cancelPhotosImport()">Stop</button>`;
    }
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Done</h3>
      <p class="subtle" style="margin:0 0 10px;">${st.done} imported${st.alreadyIn ? `, ${st.alreadyIn} already in your collection` : ""}${st.failed ? `, ${st.failed} failed` : ""}${st.skippedTotal ? `, ${skippedReason(st.skipped)}` : ""}. They're in the Inbox${data.locationId ? " and filed to this location" : ""}.</p>
      ${st.failReasons && Object.keys(st.failReasons).length ? `
        <div class="surface" style="padding:10px 12px;margin-bottom:12px;">
          <div class="subtle" style="font-size:11.5px;margin-bottom:4px;">Why they failed</div>
          ${Object.entries(st.failReasons).sort((a, b) => b[1] - a[1])
            .map(([reason, n]) => `<div class="mono" style="font-size:11.5px;">${n} · ${escapeHtml(reason)}</div>`).join("")}
        </div>` : ""}
      ${(() => {
        const attempted = st.done + st.failed + (st.alreadyIn || 0);
        const untouched = st.total - attempted;
        if (untouched <= 0) return "";
        return `<p class="subtle" style="margin:0 0 12px;">${countLabel(untouched, "photo", "photos")} were never attempted${st.stoppedEarly ? ` — the run stopped because ${st.stoppedEarly}` : ""}. Pick them again: anything already imported is skipped automatically.</p>`;
      })()}
      <button class="btn btn-primary btn-block" onclick="cancelPhotosImport()">Close</button>`;
  }

  return "";
}

/* ============================================================
   ACTIONS
   ============================================================ */
async function handleConnectDrive() {
  try { await startDriveConnect(); } catch (e) { toast(e.message, true); }
}
async function identifyPhoto(photoId) {
  state.identifyingPhotoId = photoId;
  render();
  try {
    const res = await authedFetch(`${CONFIG.SUPABASE_URL}/functions/v1/identify-plant`, () => ({
      method: "POST",
      headers: apiHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ photo_id: photoId }),
    }));
    const data = await res.json();
    state.identifyingPhotoId = null;
    if (data.error) {
      toast(driveErrorMessage(res.status, data.error), true);
      render();
      return;
    }
    state.identifications.unshift(data.identification);
    render();
  } catch (e) {
    state.identifyingPhotoId = null;
    toast(e.message, true);
    render();
  }
}
// AI-1. "Ask Claude" stopped being a second opinion on species — Pl@ntNet does
// that, cheaper and purpose-built — and became "where does this belong?". The
// answers are ids from her own catalogue, so each one is a single tap rather
// than a name to match by hand.
// One shape for every suggestion, so accept and dismiss mean the same thing
// wherever they appear.
// #4. Diagnosing health is only worth asking once the photo is filed: the read
// is against what THIS species should look like, which needs the specimen. So
// the button appears only when there is a plant behind the photo.
/* ------------------------------------------------------------
   ONE photo action row for every surface (v1.85.0).

   The audit found the same photo offering different powers depending on which
   screen you reached it from: Favourite existed on 3 of 11 surfaces, "tag the
   other plants in this planter" was missing from the location feed where mixed
   planters actually live, and the location lightbox had two actions where the
   gallery had five. Each surface had grown its own button set, so each fix was
   local and the next gap was inevitable.

   Amanda's rule: minimal on cards, everything in the lightbox. Gating lives
   here and nowhere else, so "does Favourite show up here?" has one answer.
   ------------------------------------------------------------ */
function photoActionList(p, ctx) {
  const c = ctx || {};
  const full = c.variant === "full";
  const assigned = plantsAssignedToPhoto(p.id);
  const plantnet = pendingIdentifications(p.id).find((x) => x.source !== "Claude");
  const busyId = state.identifyingPhotoId === p.id;
  const busyAsk = state.suggestingPhotoId === p.id;
  const isPrimary = (c.mode === "location" && c.locationId && locationById(c.locationId)?.primary_photo_id === p.id)
    || (c.mode === "plant" && c.plantId && state.plants.find((x) => x.id === c.plantId)?.primary_photo_id === p.id);
  const A = [];
  const add = (o) => { if (o.show !== false) A.push(o); };

  // --- identification: only while the photo is still unplaced ---
  if (full || !p.plant_id) {
    if (plantnet) {
      add({ key: "dismissId", label: "Dismiss Pl@ntNet", ic: "close",
            onclick: `dismissIdentification('${plantnet.id}')`, show: full });
    } else {
      // Amanda's call: the photo-with-a-question-mark belongs to Pl@ntNet, which
      // is literally "what is this picture of?". Asking Claude is a different
      // kind of question and gets Claude's own mark.
      add({ key: "identify", label: "Identify", ic: "photoQuestion", busy: busyId,
            onclick: `identifyPhoto('${p.id}')`, show: !p.plant_id });
    }
    add({ key: "ask", label: "Ask Claude", ic: "claude", busy: busyAsk,
          onclick: `askClaudeAboutPhoto('${p.id}')`, show: !p.plant_id || !p.location_id });
  }
  // Diagnosing needs the specimen — the read is against what THIS species
  // should look like, not against cacti in general.
  add({ key: "health", label: "How is it doing?", ic: "ambulance", busy: busyAsk,
        onclick: `askClaudeAboutPhoto('${p.id}',{focus:'health'})`, show: !!p.plant_id && full });

  // --- the relationships ---
  add({ key: "plants", ic: "link",
        label: assigned.length ? `Plants (${assigned.length})` : "Assign plant",
        onclick: `openModal('assignPlants',{photoId:'${p.id}'${c.locationId ? `, locationId:'${c.locationId}'` : ""}})`,
        show: full || !p.plant_id });
  add({ key: "location", label: "Location", ic: "pin",
        onclick: `openModal('attachLocation',{photoId:'${p.id}'})`,
        show: full || c.mode === "inbox" });
  add({ key: "newPlant", label: "New plant", ic: "plus",
        // v1.85.0 dropped this and left the comment behind. The old gallery
        // button seeded the form with the photo's OWN location whenever that
        // location expects plants — which is what photoAwaitsPlant() means —
        // so a photo filed to Copper Rectangle Planter 1 opened the New plant
        // form already pointing there instead of at "None". Pre-filling an Area
        // or an Archive is still wrong: that would record a specimen living in
        // a former home.
        onclick: `openModal('newPlantFromPhoto',{photoId:'${p.id}'${(() => {
          const loc = (c.mode === "location" && c.locationId) ? c.locationId : (photoAwaitsPlant(p) ? p.location_id : null);
          return loc ? `, locationId:'${loc}'` : "";
        })()}})`,
        show: !p.plant_id });

  // --- the photo itself: available everywhere, which was the whole finding ---
  add({ key: "primary", ic: "photoStar",
        label: c.mode === "location" ? "Set as main photo" : "Set as profile",
        onclick: c.mode === "location" ? `setLocationPhoto('${c.locationId}','${p.id}')` : `setPrimaryPhoto('${c.plantId}','${p.id}')`,
        show: full && !isPrimary && (c.mode === "plant" || c.mode === "location") && !!(c.plantId || c.locationId) });
  add({ key: "favourite", label: p.is_favorite ? "Favourited" : "Favourite", ic: "heartStar",
        onclick: `toggleFavorite('${p.id}')`, tint: p.is_favorite ? "var(--pink)" : "" });
  add({ key: "edit", label: "Edit photo", ic: "edit",
        onclick: `openModal('editPhoto',{photoId:'${p.id}'})` });
  add({ key: "delete", label: "Delete", ic: "trash", danger: true,
        onclick: `deletePhoto('${p.id}')` });
  return A;
}

// Rendered in each surface's own button language, so the row looks native
// wherever it lands. `modalFirst` closes the lightbox before opening a modal.
function photoActionsHtml(p, ctx) {
  const c = ctx || {};
  const cls = c.cls || "btn-ghost icon-btn";
  const style = c.style || "padding:0;font-size:12px;";
  const pre = c.fromLightbox ? "prepareLightboxResume();closeLightbox();" : "";
  const omit = c.omit || [];
  return photoActionList(p, c).filter((a) => !omit.includes(a.key)).map((a) => {
    const guard = a.onclick.startsWith("openModal") ? pre : "";
    const tint = a.danger ? "color:var(--terracotta);" : a.tint ? `color:${a.tint};` : "";
    const body = a.busy ? '<span class="spinner"></span>' : `${icon(a.ic)}${c.iconOnly ? "" : " " + a.label}`;
    return `<button class="${cls}" style="${style}${tint}" ${a.busy ? "disabled" : ""} title="${escapeHtml(a.label)}"
      onclick="event.stopPropagation();${guard}${a.onclick}">${body}</button>`;
  }).join("");
}

function suggestionLine(sg) {
  const pl = sg.value_id ? state.plants.find((x) => x.id === sg.value_id) : null;
  const loc = sg.value_id ? locationById(sg.value_id) : null;
  const tx = sg.value_id ? taxonById(sg.value_id) : null;
  let ic = "info", label = sg.value_text || "";
  if (sg.kind === "plant_tag") { ic = "link"; label = pl ? `${plantDisplayName(pl)} · ${pl.accession_number}` : "a plant that no longer exists"; }
  else if (sg.kind === "new_specimen") { ic = "plus"; label = tx ? `Create a new ${taxonDisplayName(tx)} here` : "a species that no longer exists"; }
  else if (sg.kind === "location_tag") { ic = "pin"; label = loc ? locationPath(loc) : "a location that no longer exists"; }
  else if (sg.kind === "photo_type") { ic = "photo"; label = `Type: ${listOptionsFor("photo_type")[sg.value_text] || PHOTO_TYPE_LABELS[sg.value_text] || sg.value_text}`; }
  else if (sg.kind === "bloom") { ic = "plant2"; label = "Looks like it is in bloom — record a bloom"; }
  else if (sg.kind === "health_note") { ic = "alertTriangle"; label = sg.value_text; }
  else if (sg.kind === "health_status") { ic = "ambulance"; label = `Set health to ${HEALTH_LABELS[sg.value_text] || sg.value_text}`; }
  else if (sg.kind === "species_field") { ic = "leaf"; label = `${FIELD_LABELS[sg.field] || sg.field}: ${sg.value_text}`; }
  const stale = (sg.kind === "plant_tag" && !pl) || (sg.kind === "location_tag" && !loc) || (sg.kind === "new_specimen" && !tx);
  return `
    <div class="suggestion-row" style="margin-top:6px;">
      <span class="suggestion-icon">${icon(ic)}</span>
      <div style="flex:1;min-width:0;">
        <div class="sg-label">${escapeHtml(label)}</div>
        ${sg.rationale ? `<div class="sg-why">${escapeHtml(sg.rationale)}</div>` : ""}
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;align-items:center;">
        ${stale ? `<span class="subtle" style="font-size:11px;">out of date</span>`
          : `<button type="button" class="btn btn-accent btn-sm" onclick="event.stopPropagation();acceptSuggestion('${sg.id}')">Accept</button>`}
        <button type="button" class="btn-ghost" style="padding:0;font-size:12px;color:var(--terracotta);" onclick="event.stopPropagation();dismissSuggestion('${sg.id}')">Dismiss</button>
      </div>
    </div>`;
}
// Pl@ntNet and Claude identifications live in `identifications`, NOT in
// `suggestions` — different table, different renderer. suggestionBlock() below
// shows Claude's filing suggestions; this shows a proposed NAME.
//
// v1.85.0 folded every photo surface into one action row and, in doing so, lost
// the Gallery's identification badge: with a pending Pl@ntNet suggestion the row
// shows no Identify button (correctly — it has already run) and offered its
// "Dismiss" only in the lightbox, so on a card the suggestion vanished
// entirely. "Needs a plant" is a Gallery view, which is exactly where it was
// needed. Two near-identical local copies existed in photoRow and
// screenLocationDetail; this is the single one.
function identificationBadge(s, opts) {
  if (!s) return "";
  const o = opts || {};
  return `
    <div class="ident-badge${o.dark ? " on-dark" : ""}" ${o.inert ? "" : `onclick="event.stopPropagation();openModal('identificationDetail',{identificationId:'${s.id}'})"`}
         style="${o.inert ? "" : "cursor:pointer;"}">
      <span class="mono ident-source">${escapeHtml(s.source)}</span>
      <em>${escapeHtml(s.suggested_name)}</em>${s.confidence ? ` (${Math.round(s.confidence * 100)}%)` : ""}${o.inert ? "" : ` <span style="color:var(--blue);">&mdash; compare &rarr;</span>`}
    </div>`;
}
function identificationBadges(photoId, opts) {
  return pendingIdentifications(photoId).map((s) => identificationBadge(s, opts)).join("");
}

// onCream: the Inbox and Location photo cards are parchment; the edit-photo
// modal and the lightbox are not.
function suggestionBlock(photoId, onCream) {
  const rows = suggestionsForPhoto(photoId);
  if (!rows.length) return "";
  return `
    <div class="${onCream ? "on-cream-ground" : ""}" style="margin-top:10px;">
      <div class="suggestion-head">Claude suggests</div>
      ${rows.map(suggestionLine).join("")}
    </div>`;
}

// Ordered by what she acts on first, not by insertion. They arrive newest-first
// from the API and are unshifted into state, so the raw order put the photo
// type above the identification that justifies it.
const SUGGESTION_ORDER = ["plant_tag", "new_specimen", "location_tag", "bloom", "photo_type", "health_status", "health_note"];
function suggestionsForPhoto(photoId) {
  return state.suggestions
    .filter((x) => x.photo_id === photoId && x.status === "pending")
    .sort((a, b) => SUGGESTION_ORDER.indexOf(a.kind) - SUGGESTION_ORDER.indexOf(b.kind));
}
// Photos Claude has proposed for this species — either onto one of its
// specimens, or by offering to create a new one. Derived from suggestions
// already stored, so opening a species page costs nothing: run a batch over the
// archives, then come here and see everything Claude thinks belongs to it.
function suggestedPhotosForTaxon(taxaId) {
  const specimenIds = new Set(specimensOfTaxon(taxaId).map((sp) => sp.id));
  return state.suggestions
    .filter((sg) => sg.status === "pending" && sg.photo_id &&
      ((sg.kind === "plant_tag" && specimenIds.has(sg.value_id)) ||
       (sg.kind === "new_specimen" && sg.value_id === taxaId)))
    .map((sg) => ({ sg, photo: state.photos.find((p) => p.id === sg.photo_id) }))
    .filter((x) => x.photo)
    .sort((a, b) => new Date(photoDate(b.photo)) - new Date(photoDate(a.photo)));
}

function suggestionsForTaxon(taxaId) {
  return state.suggestions.filter((x) => x.taxa_id === taxaId && x.status === "pending");
}

async function askClaudeAboutPhoto(photoId, opts) {
  const quiet = opts && opts.quiet;
  const focus = (opts && opts.focus) || "all";
  if (!quiet) { state.suggestingPhotoId = photoId; render(); }
  try {
    const res = await authedFetch(`${CONFIG.SUPABASE_URL}/functions/v1/suggest-photo`, () => ({
      method: "POST",
      headers: apiHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ photo_id: photoId, focus }),
    }));
    // A function that is not deployed answers with an HTML 404, which is not
    // JSON — and res.json() throwing looked identical to "Claude failed".
    // Reporting the status is the difference between a diagnosis and a shrug.
    let data;
    try {
      data = await res.json();
    } catch {
      throw new Error(res.status === 404
        ? "suggest-photo is not deployed yet — run: supabase functions deploy suggest-photo"
        : `The suggest-photo function returned ${res.status} with no JSON body`);
    }
    if (data.error) throw new Error(data.error);
    state.suggestions = state.suggestions.filter((x) => x.photo_id !== photoId);
    (data.suggestions || []).forEach((row) => state.suggestions.unshift(row));
    if (!quiet) {
      toast(data.suggestions && data.suggestions.length
        ? `${countLabel(data.suggestions.length, "suggestion", "suggestions")} from Claude`
        : (data.note || "Nothing Claude could match"), !(data.suggestions || []).length);
    }
    return null;
  } catch (e) {
    if (!quiet) toast(e.message, true);
    // Handed back so a batch can report WHY, rather than a count of failures
    // with no cause — which is what nine silent failures looked like.
    return e.message || "Unknown error";
  } finally {
    if (!quiet) { state.suggestingPhotoId = null; render(); }
  }
}

async function askClaudeAboutSpecies(taxaId, opts) {
  const focus = (opts && opts.focus) || "all";
  state.suggestingTaxaId = taxaId;
  render();
  try {
    const res = await authedFetch(`${CONFIG.SUPABASE_URL}/functions/v1/suggest-species`, () => ({
      method: "POST",
      headers: apiHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ taxa_id: taxaId, focus }),
    }));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    state.suggestions = state.suggestions.filter((x) => x.taxa_id !== taxaId);
    (data.suggestions || []).forEach((row) => state.suggestions.unshift(row));
    toast(data.suggestions && data.suggestions.length
      ? `Claude filled in ${countLabel(data.suggestions.length, "field", "fields")} — review below`
      : (data.note || "Nothing to suggest"), !(data.suggestions || []).length);
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.suggestingTaxaId = null;
    render();
  }
}

// Batch, on a selection she made — never automatic on upload. At 1,605 unfiled
// photos an automatic call would run on every duplicate and every blurry shot,
// which is both expensive and useless. Sequential on purpose: three concurrent
// vision calls is how you meet a rate limit halfway through a run.
function askClaudeAboutSelection() {
  if (!activeBulkSelection().size) { toast("Select some photos first", true); return; }
  openModal("askClaude");
}

// One question at a time beats all of them at once: a narrower prompt is
// cheaper and the model is not splitting attention across five answers. With
// 932 photos needing only a location, that difference is the whole feature.
async function runClaudeBatch(focus) {
  const ids = Array.from(activeBulkSelection());
  if (!ids.length) { toast("Select some photos first", true); return; }
  closeModal();
  state.suggestBatch = { done: 0, total: ids.length, failed: 0 };
  render();
  let firstError = null;
  for (const id of ids) {
    const err = await askClaudeAboutPhoto(id, { quiet: true, focus });
    state.suggestBatch.done += 1;
    if (err) {
      state.suggestBatch.failed += 1;
      if (!firstError) firstError = err;
      // Every photo failing the same way means the cause is the setup, not the
      // photos. Stopping after three saves 37 pointless calls and a bill.
      if (state.suggestBatch.failed >= 3 && state.suggestBatch.done === state.suggestBatch.failed) break;
    }
    refreshImportProgress();
  }
  const { done, failed } = state.suggestBatch;
  state.suggestBatch = null;
  if (failed) toast(`${failed} of ${done} failed — ${firstError}`, true);
  else toast(`Asked about ${done} photo${done === 1 ? "" : "s"}`);
  await loadAll();
}

async function dismissSuggestion(id) {
  try {
    await restPatch("suggestions", `id=eq.${id}`, { status: "dismissed" });
    state.suggestions = state.suggestions.filter((x) => x.id !== id);
    render();
  } catch (e) { toast(e.message, true); }
}

// Accepting writes the record AND marks the suggestion, in that order: if the
// write fails the suggestion stays pending rather than vanishing having done
// nothing.
async function acceptSuggestion(id) {
  const sg = state.suggestions.find((x) => x.id === id);
  if (!sg) return;
  try {
    if (sg.kind === "plant_tag") {
      await restPatch("photos", `id=eq.${sg.photo_id}`, { plant_id: sg.value_id });
    } else if (sg.kind === "location_tag") {
      await restPatch("photos", `id=eq.${sg.photo_id}`, { location_id: sg.value_id });
    } else if (sg.kind === "photo_type") {
      await restPatch("photos", `id=eq.${sg.photo_id}`, { photo_type: sg.value_text });
    } else if (sg.kind === "new_specimen") {
      const ph = state.photos.find((x) => x.id === sg.photo_id);
      const locId = ph && ph.location_id && locationHoldsPlants(locationById(ph.location_id)) ? ph.location_id : null;
      const [created] = await restPost("plants", {
        taxa_id: sg.value_id, location_id: locId,
        identification_status: "tentative", collection_category: "current",
        status: "active", health_status: "healthy",
      });
      if (!created) throw new Error("Could not create the specimen");
      await restPatch("photos", `id=eq.${sg.photo_id}`, { plant_id: created.id });
      toast(`Created ${created.accession_number}`);
    } else if (sg.kind === "bloom") {
      const ph = state.photos.find((x) => x.id === sg.photo_id);
      if (!ph || !ph.plant_id) { toast("Attach the photo to a plant first, then record the bloom", true); return; }
      await restPost("bloom_events", {
        plant_id: ph.plant_id,
        started_on: String(photoDate(ph) || new Date().toISOString()).slice(0, 10),
      });
      await restPatch("photos", `id=eq.${sg.photo_id}`, { photo_type: "bloom" });
    } else if (sg.kind === "health_note") {
      const ph = state.photos.find((x) => x.id === sg.photo_id);
      if (!ph || !ph.plant_id) { toast("Attach the photo to a plant first, then keep the note", true); return; }
      await restPost("care_notes", {
        plant_id: ph.plant_id,
        noted_on: String(photoDate(ph) || new Date().toISOString()).slice(0, 10),
        body: `Claude, from a photo: ${sg.value_text}`,
      });
    } else if (sg.kind === "health_status") {
      const ph = state.photos.find((x) => x.id === sg.photo_id);
      if (!ph || !ph.plant_id) { toast("Attach the photo to a plant first", true); return; }
      await restPatch("plants", `id=eq.${ph.plant_id}`, { health_status: sg.value_text, updated_at: new Date().toISOString() });
    } else if (sg.kind === "species_field") {
      // Both booleans, and both arrive as the STRING "true"/"false" because
      // suggestions.value_text is text. frost_tender was special-cased; NAME-2
      // adds is_hybrid, which would otherwise be written as the string "true"
      // and read as truthy forever after.
      const BOOL_FIELDS = ["frost_tender", "is_hybrid"];
      // v2.8.0. `light_conditions` is text[], and suggestions.value_text is
      // text, so an accepted light suggestion would have written the STRING
      // "direct; morning" into an array column and failed outright. Claude is
      // told to return them semicolon-separated; this is where they become an
      // array again.
      const ARRAY_FIELDS = ["light_conditions"];
      const v = BOOL_FIELDS.includes(sg.field) ? String(sg.value_text) === "true"
        : ARRAY_FIELDS.includes(sg.field)
          ? String(sg.value_text).split(";").map((x) => x.trim().toLowerCase().replace(/\s+/g, "_")).filter(Boolean)
          : sg.value_text;
      await restPatch("taxa", `id=eq.${sg.taxa_id}`, { [sg.field]: v, updated_at: new Date().toISOString() });
    }
    await restPatch("suggestions", `id=eq.${id}`, { status: "accepted" });
    state.suggestions = state.suggestions.filter((x) => x.id !== id);
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function acceptAllSpeciesSuggestions(taxaId) {
  const rows = suggestionsForTaxon(taxaId);
  if (!rows.length) return;
  if (!confirm(`Accept all ${rows.length} suggested values for this species?`)) return;
  for (const r of rows) await acceptSuggestion(r.id);
}

async function linkPlantToLocation(plantId, locationId) {
  const pl = state.plants.find((p) => p.id === plantId);
  try {
    // SPECIES-2 retired `plant_locations` for specimens: a physical individual
    // is in exactly one place. This still wrote a second row when the plant
    // already had a location, quietly recreating the many-to-many the split
    // removed — and a plant would then show in two places at once.
    //
    // Linking a plant that lives elsewhere IS a move. Set the location; the

    const from = pl.location_id ? locationById(pl.location_id) : null;
    await restPatch("plants", `id=eq.${plantId}`, { location_id: locationId, updated_at: new Date().toISOString() });
    toast(from ? `Moved from ${locationPath(from)}` : "Plant linked");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function startBloom(plantId) {
  const pl = state.plants.find((p) => p.id === plantId);
  if (!pl) return;
  if (activeBloom(plantId)) { toast("Already recorded as blooming", true); return; }
  const started = document.getElementById("bl-start")?.value || todayLocalISO();
  try {
    await restPost("bloom_events", {
      plant_id: plantId,
      // Snapshot, like photo locations: a bloom happened somewhere, and that
      // stays true after the plant moves.
      location_id: pl.location_id || null,
      started_on: started,
      notes: document.getElementById("bl-notes")?.value || null,
    });
    toast("Recorded as blooming");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function endBloom(bloomId) {
  const ended = document.getElementById("bl-end")?.value || todayLocalISO();
  const bloom = state.bloomEvents.find((b) => b.id === bloomId);
  if (bloom && ended < bloom.started_on) { toast("It can't finish before it started", true); return; }
  try {
    await restPatch("bloom_events", `id=eq.${bloomId}`, { ended_on: ended });
    toast("Bloom closed");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function mergePlants(keepId, removeId) {
  const keep = state.plants.find((p) => p.id === keepId);
  const remove = state.plants.find((p) => p.id === removeId);
  if (!confirm(`Merge "${plantDisplayName(remove)}" (${remove.accession_number}) into "${plantDisplayName(keep)}" (${keep.accession_number})? All photos and tags move over, then ${remove.accession_number} is deleted. This can't be undone.`)) return;
  try {
    // Move photos primarily attached to the removed plant
    await restPatch("photos", `plant_id=eq.${removeId}`, { plant_id: keepId });

    // Move multi-plant photo tags, skipping any that would duplicate an existing tag
    const tagsToMove = state.photoPlants.filter((pp) => pp.plant_id === removeId);
    for (const t of tagsToMove) {
      const exists = state.photoPlants.some((pp) => pp.plant_id === keepId && pp.photo_id === t.photo_id);
      if (exists) await restDelete("photo_plants", `id=eq.${t.id}`);
      else await restPatch("photo_plants", `id=eq.${t.id}`, { plant_id: keepId });
    }

    // Reparent anything propagated from the plant being removed
    await restPatch("plants", `parent_plant_id=eq.${removeId}`, { parent_plant_id: keepId });

    // Reassign location history rows (FK would otherwise block deletion)
    await restPatch("plant_location_history", `plant_id=eq.${removeId}`, { plant_id: keepId });

    // Care notes move to the surviving plant. They must be REASSIGNED, not
    // deleted — the observations happened, and the merged record inherits them.
    await restPatch("care_notes", `plant_id=eq.${removeId}`, { plant_id: keepId });

  } catch (e) { toast(e.message, true); }
}

// The draft lives in state, not in the DOM, because the subject picker
// re-renders on every search keystroke and checkboxes would be wiped.
function toggleTaskSubjectDraft(kind, id) {
  const i = state.taskSubjectDraft.findIndex((d) => d.kind === kind && d.id === id);
  if (i >= 0) state.taskSubjectDraft.splice(i, 1);
  else state.taskSubjectDraft.push({ kind, id });

async function saveTask(taskId) {
  const title = document.getElementById("task-title").value.trim();
  if (!title) { toast("Give the task a title", true); return; }
  const body = {
    title,
    detail: document.getElementById("task-detail").value.trim() || null,
    due_date: document.getElementById("task-due").value || null,
  };
  try {
    let id = taskId;
    if (id) {
      await restPatch("tasks", `id=eq.${id}`, body);
      await restDelete("task_subjects", `task_id=eq.${id}`);
    } else {
      const [created] = await restPost("tasks", body);
      id = created.id;
    }
    // Rewritten wholesale rather than diffed: the set is small and a diff here
    // would be more code than it saves.
    const rows = state.taskSubjectDraft.map((d) => ({
      task_id: id,
      plant_id: d.kind === "plant" ? d.id : null,
      location_id: d.kind === "location" ? d.id : null,
      taxa_id: d.kind === "taxa" ? d.id : null,
    }));
    if (rows.length) await restPost("task_subjects", rows);
    state.taskSubjectDraft = [];
    state.taskSubjectSearch = "";
    closeModal();
    toast(taskId ? "Task updated" : "Task created");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function toggleTaskDone(taskId) {
  const t = state.tasks.find((x) => x.id === taskId);
  if (!t) return;
  const done = t.status !== "done";
  try {
    await restPatch("tasks", `id=eq.${taskId}`, {
      status: done ? "done" : "open",
      completed_at: done ? new Date().toISOString() : null,
    });
    await loadAll();
    // Finishing the task does not make the plant well. Ask when to look again
    // rather than dropping it back into "needs attention" the moment the task
    // closes — which is what happened, and made completing one pointless.
    const stillUnwell = done
      ? subjectsOfTask(taskId).map((ts) => ts.plant_id)
          .filter(Boolean)
          .map((id) => state.plants.find((p) => p.id === id))
          .filter((pl) => pl && HEALTH_ATTENTION.includes(pl.health_status)
            && !(pl.next_check_date && pl.next_check_date > todayISO()))
      : [];
    if (stillUnwell.length) {
      openModal("recheck", { plantIds: stillUnwell.map((p) => p.id), from: "task" });
    } else {
      toast(done ? "Task done" : "Task reopened");
    }
  } catch (e) { toast(e.message, true); }
}

/* TODO-2. "Not this year" for a bloom that is not going to happen. It does not
   hide anything — it writes a real task carrying the date the question should
   be asked again, and hasScheduledTask() then keeps the plant off the nudge
   list until that date arrives. The note stays with the task, so next season
   the reason is still there.

   deferBloomNudge takes a LIST so the same code serves one row and all 24. */
async function deferBloomNudge(plantIds) {
  const ids = (Array.isArray(plantIds) ? plantIds : [plantIds]).filter(Boolean);
  const plants = ids.map((id) => state.plants.find((p) => p.id === id)).filter(Boolean);
  if (!plants.length) { toast("Nothing to defer", true); return; }
  try {
    for (const pl of plants) {
      const t = pl.taxa_id ? taxonById(pl.taxa_id) : null;
      const due = nextBloomSeasonStart(t && t.bloom_season);
      const [created] = await restPost("tasks", {
        title: `Check for bloom — ${taxonDisplayName(t) || pl.accession_number}`,
        detail: `Expected to bloom but nothing recorded ${fmtDate(new Date().toISOString())}. Resurfacing for the next ${t && t.bloom_season ? (BLOOM_SEASON_LABELS[t.bloom_season] || t.bloom_season).toLowerCase() : "season"}.`,
        due_date: due,
        status: "open",
      });
      if (created) await restPost("task_subjects", [{ task_id: created.id, plant_id: pl.id }]);
    }
    toast(plants.length > 1
      ? `${plants.length} bloom tasks made`
      : `Back on the list ${fmtDate(nextBloomSeasonStart((plants[0].taxa_id ? taxonById(plants[0].taxa_id) : null)?.bloom_season))}`);
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

// Opens the modal against a scope rather than a plant list, so the confirm can
// say "34 plants under Front Yard" instead of a bare count with no provenance.
function openWaterModal(kind, id) {
  let ids = [], label = "", locationId = null;
  if (kind === "plant") {
    const pl = state.plants.find((p) => p.id === id);
    if (!pl) { toast("Plant not found", true); return; }
    ids = [pl.id];
    label = plantPickerName(pl).primary;
    locationId = pl.location_id || null;
  } else if (kind === "location") {
    const loc = locationById(id);
    if (!loc) { toast("Location not found", true); return; }
    ids = plantsUnderLocation(loc.id).map((p) => p.id);
    label = locationPath(loc);
    locationId = loc.id;
  } else if (kind === "due") {
    ids = plantsNeedingWater().map((p) => p.id);
    label = "everything due";
  } else if (kind === "all") {
    ids = state.plants.filter((p) => p.status === "active").map((p) => p.id);
    label = "the whole collection";
  }
  if (!ids.length) { toast("No active plants in that scope", true); return; }
  state.waterDraft = { ids, label, kind, locationId, date: todayISO(), notes: "" };
  openModal("waterPlants");
}

/* One row per plant, one batch_id for the run. Upserted on
   (plant_id, watered_on) so re-watering the same plant on the same day merges
   instead of erroring against the unique index — watering a whole area and
   then topping up one pot is a normal thing to do, not a mistake. */
async function confirmWatering() {
  const d = state.waterDraft;
  if (!d) return;
  const dateEl = document.getElementById("water-date");
  const notesEl = document.getElementById("water-notes");
  const watered_on = (dateEl && dateEl.value) || d.date || todayISO();
  const notes = (notesEl && notesEl.value || "").trim() || null;
  // Not crypto.randomUUID() alone: older iPadOS Safari only exposes it on a
  // secure context and this must not fail on the one device that matters.
  const batch_id = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  const rows = d.ids.map((plant_id) => {
    const pl = state.plants.find((p) => p.id === plant_id);
    return {
      plant_id, watered_on, batch_id, notes,
      // A snapshot of where it was watered. The plant may move later; that it
      // was watered in Bucket 40 on this date stays true.
      location_id: (pl && pl.location_id) || null,
    };
  });
  try {
    // Chunked: a whole-collection watering is ~170 rows and a single request
    // carrying all of them is both slower to fail and harder to diagnose.
    for (let i = 0; i < rows.length; i += 100) {
      await restUpsert("watering_events", rows.slice(i, i + 100), "plant_id,watered_on");
    }
    state.waterDraft = null;
    closeModal();
    // toast() is text-only and gone in 3.2s, which is no use for undoing a
    // 170-row mistake. The Undo lives on To Do until dismissed or superseded.
    state.lastWaterBatch = { batchId: batch_id, count: rows.length, label: d.label };
    toast(`Watered ${rows.length} ${rows.length === 1 ? "plant" : "plants"}`);
    await loadAll();
  } catch (e) {
    // The shape of a missing policy is an empty-looking success or a 401/403.
    // Naming it beats "watering failed", which sent us round this loop once.
    const msg = String(e.message || e);
    toast(/42501|permission|policy/i.test(msg)
      ? "The database refused the write — check the watering_events RLS policy"
      : msg, true);
  }
}

// Undo the run, not the row. A mis-tap on "water the whole collection" is the
// case this exists for, and deleting 170 rows one at a time is not an undo.
async function undoWateringBatch(batchId, count) {
  if (!confirm(`Undo this watering? ${countLabel(count, "record", "records")} will be removed.`)) return;
  try {

function setMoveTarget(locationId) {
  state.moveTarget = locationId || "";
  state.locPickerNewOpen = false;

// A move made before the Move action existed — or made in a hurry — has no
// note. Re-running it through the Move modal is not the answer: the plant is
// already where it belongs, so that would record a fake round trip. The stay
// itself is what needs annotating.
/* ---------- BATCH-1 ----------
   A nursery trip is several DIFFERENT plants, not five of the same, so the form
   is a list of rows rather than one species and a quantity. A row carries its
   own count, so "six species, one each" and "one species, five offsets" are the
   same form. Acquisition details are shared, because they are the one thing
   genuinely identical across a purchase — that is what makes this faster than
   the single-plant form six times over. */
function addBatchRow(taxaId, newName) {
  state.batchRows.push({ taxaId: taxaId || null, newName: newName || "", qty: 1 });
  state.batchSearch = "";
  render();
}
function removeBatchRow(i) { state.batchRows.splice(i, 1); render(); }
function setBatchQty(i, v) {
  const n = Math.max(1, Math.min(99, parseInt(v, 10) || 1));
  state.batchRows[i].qty = n;
  render();
}
function batchTotal() {
  return state.batchRows.reduce((n, r) => n + (r.qty || 0), 0);
}

async function createBatch() {
  const rows = state.batchRows.filter((r) => r.taxaId || (r.newName || "").trim());
  if (!rows.length) { toast("Add at least one plant", true); return; }
  const shared = readAcquisitionFields("ba");
  const locationId = locFieldValue("ba") || null;
  const total = rows.reduce((n, r) => n + r.qty, 0);
  if (!confirm(`Create ${total} specimen${total === 1 ? "" : "s"}? Each gets its own accession number.`)) return;
  const btn = document.getElementById("ba-submit");
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating…'; }
  let made = 0;
  try {
    for (const r of rows) {
      // A typed name creates or finds the taxon ONCE for the row, so five
      // offsets of a new species share one taxon rather than making five.
      const taxaId = r.taxaId || await ensureTaxonForName(r.newName.trim(), "", {});
      const body = {
        taxa_id: taxaId || null,
        location_id: locationId,
        ...shared,
        ...(taxaId ? {} : { identification_status: "unidentified" }),
        collection_category: "current",
        status: "active",
      };
      // Inserted one at a time: the accession trigger fires per row, and a
      // single failure should not cost the whole batch.
      for (let k = 0; k < r.qty; k++) {
        await restPost("plants", body);
        made++;
      }
    }
    state.batchRows = [];
    closeModal();
    toast(`Created ${countLabel(made, "specimen", "specimens")}`);
    await loadAll();
  } catch (e) {
    toast(`Stopped after ${made} — ${e.message}`, true);
    if (made) { closeModal(); await loadAll(); }
  }
}

async function confirmMovePlant(plantId) {

    if (note) {

async function moveToHospital(plantId) {
  // Match the standardized `hospital` location type, not a literal English
  // name. The old lookup required name === "Plant Hospital" exactly AND
  // top-level, so a rename, a casing change, stray whitespace, or nesting the
  // hospital under a yard all made the button silently do nothing.
  const byType = state.locations.filter((l) => l.type === "hospital");
  const byName = state.locations.filter((l) => (l.name || "").trim().toLowerCase() === "plant hospital");
  const candidates = (byType.length ? byType : byName).sort((a, b) => a.name.localeCompare(b.name));
  if (candidates.length === 0) {
    toast("No location of type Hospital — set one on the Locations tab", true);
    return;
  }
  // More than one hospital is legitimate. Name the destination in the confirm
  // rather than silently picking for her.
  const hospital = candidates[0];
  // PD-4: the hospital is the strongest worry signal in the app. Setting Watch
  // understated it and left the real flag to be set by hand afterwards.
  if (!confirm(`Move this plant to ${locationPath(hospital)} and mark its health as Urgent care?`)) return;
  try {
    await restPatch("plants", `id=eq.${plantId}`, {
      location_id: hospital.id,
      health_status: "urgent",
      updated_at: new Date().toISOString(),
    });
    toast("Moved to Plant Hospital");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

// Was archivePhoto(), which set photo_type = 'historical' to excuse a photo
// from needing a plant or a location. That is exactly what severed archive
// photos from the specimens they show. Filing one to an archive location says
// something true instead, and keeps any plant link intact.
async function archiveLocation(locationId) {
  const l = locationById(locationId);
  if (!l) return;
  try {
    await restPatch("locations", `id=eq.${locationId}`, { archived: !l.archived });
    toast(l.archived ? "Un-archived" : "Archived — hidden from pickers, history kept");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

// Five things reference a location, all hard FKs. plant_location_history is the
// one that matters: it is a trigger-populated audit trail, and the FK means
// deleting a location destroys its history. The confirm says how many rows that
// is rather than doing it quietly — that visibility is what made the call
// obvious the last time this was done by hand.
async function deleteLocation(locationId) {
  const l = locationById(locationId);
  if (!l) return;
  if (directChildLocations(locationId).length) { toast("Move or remove what is inside it first", true); return; }
  let historyCount = 0;
  try {
    const rows = await restGet("plant_location_history", `?select=id&location_id=eq.${locationId}`);
    historyCount = rows.length;
  } catch (e) { /* counting is best-effort; the warning still stands */ }
  const plants = plantsAtLocation(locationId).length;
  const photos = photosAtLocation(locationId).length;
  const consequences = [
    plants ? `${plants} plant${plants === 1 ? "" : "s"} unassigned` : "",
    photos ? `${photos} photo${photos === 1 ? "" : "s"} unassigned` : "",
    historyCount ? `${historyCount} move record${historyCount === 1 ? "" : "s"} destroyed` : "",
  ].filter(Boolean);
  const msg = `Delete "${l.name}" permanently?` + (consequences.length ? `\n\n${consequences.join("\n")}` : "\n\nNothing is filed here.") + "\n\nThis can't be undone.";
  if (!confirm(msg)) return;
  try {
    await restPatch("plants", `location_id=eq.${locationId}`, { location_id: null });
    await restPatch("photos", `location_id=eq.${locationId}`, { location_id: null });
    // Provably a no-op — empty PATCH body, and the row is deleted three lines
    // below anyway. Verified 2026-08-29 that PostgREST answers 200 [] rather
    // than 400, so it cannot abort the delete. Left alone rather than removed:
    // it has shipped since v1.62.0 and touching it buys nothing.
    await restPatch("locations", `primary_photo_id=is.null&id=eq.${locationId}`, {});
    await restDelete("photo_locations", `location_id=eq.${locationId}`);
    await restDelete("plant_location_history", `location_id=eq.${locationId}`);
    await restDelete("locations", `id=eq.${locationId}`);
    toast("Location deleted");
    closeModal();
    goTab("locations");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function fileToArchiveLocation(photoId, locationId) {

/* ---------- Photo → plant assignment (v1.85.0) ----------
   Was four verbs for one relationship: attach (set photos.plant_id), tag
   (photo_plants), detach, untag — plus "move", which is attach to a different
   plant. Amanda's vocabulary is Assign / Unassign, and she is right: a photo
   shows some number of plants, and which ones is a single question.

   The two storage mechanisms stay, because they mean different things —
   photos.plant_id is the specimen the photo BELONGS to (its timeline), and
   photo_plants is everything else visible in the frame. The UI no longer makes
   her care which is which: the first plant assigned becomes the primary, the
   rest become tags, and promoting one is a single tap. */

function plantsAssignedToPhoto(photoId) {
  const ph = state.photos.find((x) => x.id === photoId);
  const ids = [];
  if (ph && ph.plant_id) ids.push(ph.plant_id);
  state.photoPlants.filter((pp) => pp.photo_id === photoId).forEach((pp) => {
    if (!ids.includes(pp.plant_id)) ids.push(pp.plant_id);
  });
  return ids.map((id) => state.plants.find((x) => x.id === id)).filter(Boolean);
}

async function assignPlantToPhoto(photoId, plantId) {
  const ph = state.photos.find((x) => x.id === photoId);
  if (!ph) return;
  try {
    if (!ph.plant_id) {
      await restPatch("photos", `id=eq.${photoId}`, { plant_id: plantId });
    } else if (ph.plant_id !== plantId && !state.photoPlants.some((pp) => pp.photo_id === photoId && pp.plant_id === plantId)) {
      await restPost("photo_plants", { photo_id: photoId, plant_id: plantId });

}

async function unassignPlantFromPhoto(photoId, plantId) {
  const ph = state.photos.find((x) => x.id === photoId);
  if (!ph) return;
  try {
    if (ph.plant_id === plantId) {
      // Unassigning the primary promotes the next assigned plant rather than
      // dropping the photo back to the Inbox while other plants are still on it.
      const next = state.photoPlants.find((pp) => pp.photo_id === photoId);
      await restPatch("photos", `id=eq.${photoId}`, { plant_id: next ? next.plant_id : null });
      if (next) await restDelete("photo_plants", `id=eq.${next.id}`);
    } else {
      const row = state.photoPlants.find((pp) => pp.photo_id === photoId && pp.plant_id === plantId);
      if (row) await restDelete("photo_plants", `id=eq.${row.id}`);
    }
    toast("Plant unassigned");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

// "Move to another plant" was a separate modal for what is really this.
async function makePrimaryPlantForPhoto(photoId, plantId) {

}

async function savePhotoNote(photoId) {

async function attachPhotoToLocation(photoId, locationId) {

  try {

}
async function removePhotoFromLocation(photoId, locationId) {
  if (!confirm("Remove this photo from this location?")) return;
  try {
    const photo = state.photos.find((p) => p.id === photoId);
    if (photo.location_id === locationId) {
      // Removing the primary attachment — if the photo is tagged to
      // other containers too, promote one of those to primary instead
      // of dropping the photo back into the Inbox unexpectedly.
      const others = additionalLocationRowsForPhoto(photoId);
      if (others.length > 0) {
        const promote = others[0];
        await restPatch("photos", `id=eq.${photoId}`, { location_id: promote.location_id });
        await restDelete("photo_locations", `id=eq.${promote.id}`);
      } else {
        await restPatch("photos", `id=eq.${photoId}`, { location_id: null });
      }
    } else {
      // Just a tagged (non-primary) relationship — remove that tag only
      const row = state.photoLocations.find((r) => r.photo_id === photoId && r.location_id === locationId);
      if (row) await restDelete("photo_locations", `id=eq.${row.id}`);
    }
    toast("Removed from this location");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}
// Four things reference a photo, and every one is a hard FK that blocks the
// delete. The single-delete path previously cleared only two of them — plants
// and photo_plants — so deleting a location's hero or a species' cover photo
// failed outright. taxa.primary_photo_id arrived with the species split and was
// never added here.
//
// Batched: one request per reference table regardless of how many photos, which
// matters when clearing dozens of duplicates at once.
// Chunked at 100. A uuid is 36 characters, so `id=in.(...)` with 694 of them is
// a ~26KB query string — far past the 8KB request line every proxy in front of
// PostgREST enforces. The request never reaches the database; it is rejected at
// the edge. Six requests per chunk is cheap next to silently failing.
const DELETE_CHUNK = 100;
async function deletePhotosByIds(ids, onProgress) {
  if (!ids.length) return;
  for (let i = 0; i < ids.length; i += DELETE_CHUNK) {
    const chunk = ids.slice(i, i + DELETE_CHUNK);
    const list = `(${chunk.join(",")})`;
    await restPatch("plants", `primary_photo_id=in.${list}`, { primary_photo_id: null });
    await restPatch("locations", `primary_photo_id=in.${list}`, { primary_photo_id: null });
    await restPatch("taxa", `primary_photo_id=in.${list}`, { primary_photo_id: null });
    await restDelete("photo_plants", `photo_id=in.${list}`);
    await restDelete("photo_locations", `photo_id=in.${list}`);
    await restDelete("photos", `id=in.${list}`);
    if (onProgress) onProgress(Math.min(i + DELETE_CHUNK, ids.length), ids.length);
  }
}

async function deletePhoto(photoId) {
  if (!confirm("Delete this photo? The record is removed from the app, but the file stays in your Google Drive folder.")) return;
  try {
    await deletePhotosByIds([photoId]);
    toast("Photo deleted");
    await loadAll();
    maybeResumeLightbox();
  } catch (e) { toast(e.message, true); }
}

// Of a set of identical photos, the one worth keeping is the one already filed:
// attached to a plant, then to a location, then carrying notes. Ties break to
// the earliest upload, which is the copy other records are most likely to
// reference. Everything else in the group becomes a candidate for deletion.
function bestCopyOf(group) {
  return group.slice().sort((a, b) => {
    const score = (p) => (p.plant_id ? 4 : 0) + (p.location_id ? 2 : 0) + (p.notes ? 1 : 0);
    return score(b) - score(a) || new Date(a.uploaded_at || 0) - new Date(b.uploaded_at || 0);
  })[0];
}

function toggleDupePhotoSelected(id) {
  if (state.dupeSelected.has(id)) state.dupeSelected.delete(id);
  else state.dupeSelected.add(id);
  render();
}

// Preselects every copy except the best one in each group — the usual intent,
// and the tedious part to do by hand across many groups.
function selectDuplicateExtras() {
  const groups = findDuplicatePhotoGroups();
  const keep = new Set(groups.map((g) => bestCopyOf(g).id));
  const extras = groups.flatMap((g) => g.map((p) => p.id)).filter((id) => !keep.has(id));
  const already = extras.length && extras.every((id) => state.dupeSelected.has(id));
  state.dupeSelected = already ? new Set() : new Set(extras);
  render();
}

// Deleting a duplicate can destroy the only record that a Google Photos item
// was ever imported. The newly-imported copy is the one carrying
// google_photos_id, while the copy worth keeping is usually the older, already
// filed one — which has none. Delete the new one and the next pick re-imports
// it, forever.
//
// So the id moves to the survivor before the delete. Amanda hit this the hard
// way: 279 duplicates from a re-picked selection, deleted, taking their
// dedupe ids with them.
async function carryOverGooglePhotosIds(deletingIds, onProgress) {
  const deleting = new Set(deletingIds);
  const patches = [];
  findDuplicatePhotoGroups().forEach((group) => {
    const survivors = group.filter((p) => !deleting.has(p.id));
    if (!survivors.length) return; // whole group going: nothing to carry to
    const keeper = survivors.find((p) => !p.google_photos_id);
    if (!keeper) return;           // survivor already has one
    const donor = group.find((p) => deleting.has(p.id) && p.google_photos_id);
    if (!donor) return;
    patches.push([keeper.id, donor.google_photos_id]);
  });
  let n = 0;
  for (const [id, gid] of patches) {
    // Best-effort: the unique index can reject it if another row already holds
    // that id, which is harmless — dedupe still works through that other row.
    try { await restPatch("photos", `id=eq.${id}`, { google_photos_id: gid }); } catch (e) {}
    if (onProgress) onProgress(++n, patches.length);
  }
  return patches.length;
}

// Clearing hundreds of duplicates is minutes of work: the google_photos_id
// carry-over is one request per survivor and cannot be batched, since each
// carries a different value. Without a progress banner that reads as a dead
// button, which is exactly how it read at 694.
async function deleteSelectedDuplicates() {
  const ids = Array.from(state.dupeSelected);
  if (!ids.length) { toast("Select the copies to delete first, or use Select all extras", true); return; }
  if (state.dupeDelete) { toast("Already deleting", true); return; }
  if (!confirm(`Delete ${ids.length} photo${ids.length === 1 ? "" : "s"}? The records go, the files stay in your Google Drive folder.`)) return;
  state.dupeDelete = { phase: "linking", done: 0, total: ids.length };
  render();
  try {
    const step = (phase) => (done, total) => {
      state.dupeDelete = { phase, done, total };
      refreshImportProgress();
    };
    const carried = await carryOverGooglePhotosIds(ids, step("linking"));
    state.dupeDelete = { phase: "deleting", done: 0, total: ids.length };
    refreshImportProgress();
    await deletePhotosByIds(ids, step("deleting"));
    state.dupeDelete = null;
    if (carried) toast(`Kept the Google Photos link on ${countLabel(carried, "photo", "photos")} so they are not re-imported`);
    toast(`Deleted ${countLabel(ids.length, "photo", "photos")}`);
    state.dupeSelected = new Set();
    await loadAll();
  } catch (e) {
    state.dupeDelete = null;
    toast(e.message, true);
    render();
  }
}
// Removes just this plant's tag from a photo it doesn't primarily own —
// unlike deletePhoto(), this never touches the photo record itself, so it's
// safe to use from a plant's timeline even when the photo is that plant's
// secondary tag and someone else's primary attachment/profile picture.
// PHOTO-2. Attaches a waiting photo from the specimen side, the reverse of the
// Inbox-first flow. Deliberately leaves the modal open — loadAll() re-renders
// it with this photo gone from the list, so several can be added in a row.
function toggleAssignPhoto(id) {
  if (!state.assignSelected) state.assignSelected = new Set();
  if (state.assignSelected.has(id)) state.assignSelected.delete(id);
  else state.assignSelected.add(id);
  render();
}
function toggleAssignAll(idList) {
  // Comma-joined uuids: safe inside a double-quoted attribute, unlike the JSON
  // array this used to render.
  const ids = String(idList || "").split(",").filter(Boolean);
  const all = ids.length && ids.every((id) => state.assignSelected && state.assignSelected.has(id));
  state.assignSelected = all ? new Set() : new Set(ids);
  render();
}

// Sets plant_id only. The photos already carry the right location — that is how
// they were found — so nothing else needs to change.
async function assignPhotosToPlant(plantId) {
  const ids = Array.from(state.assignSelected || []);

    state.assignSelected = new Set();
