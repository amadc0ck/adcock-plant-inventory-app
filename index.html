<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Adcock Botanical Garden</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQWRjb2NrIFBsYW50IEludmVudG9yeSIsInNob3J0X25hbWUiOiJQbGFudHMiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMjQzRTM2IiwidGhlbWVfY29sb3IiOiIjMjQzRTM2In0=" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#243E36;         /* Deep Garden Green */
    --bg-raised:#2C4A40;  /* slightly lifted shade of Deep Garden Green */
    --parchment:#F5EFE3;  /* Warm Cream */
    --parchment-dim:#E8E0D0;
    --ink:#252925;        /* Charcoal */
    --ink-soft:#5A6B5D;
    --cream:#F5EFE3;      /* Warm Cream, used as light text on dark bg */
    --moss:#70866B;       /* Aloe Green */
    --moss-dim:#576B53;
    --chicory:#7CA7A1;    /* Agave Blue */
    --gold:#7CA7A1;       /* Agave Blue (swapped from Aloe Bloom Orange) */
    --rust:#D06A4E;       /* Terra Cotta */
    --pink:#D67A9A;       /* Cactus Flower Pink */
    --line: rgba(245,239,227,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding-bottom:76px;min-height:100vh;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--gold);color:var(--ink);}

  .container{max-width:640px;margin:0 auto;padding:0 16px;}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg, var(--bg) 70%, transparent);backdrop-filter:blur(6px);padding:22px 0 14px;}
  .topbar .container{display:flex;align-items:baseline;justify-content:space-between;}
  .brand{font-family:'Fraunces',serif;font-weight:500;font-size:22px;letter-spacing:0.2px;}
  .brand .dot{color:var(--gold);}
  .subtle{color:var(--ink-soft);opacity:0.8;color:#9FB0A3;font-size:12.5px;}

  /* Bottom nav */
  .navbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-raised);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  .navbar .container{display:flex;justify-content:space-around;padding:8px 12px 6px;max-width:640px;}
  .navbtn{background:none;border:none;color:#8AA090;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 10px;border-radius:10px;cursor:pointer;letter-spacing:0.3px;}
  .navbtn.active{color:var(--cream);}
  .navbtn svg{width:20px;height:20px;}
  .navbtn .badge{position:absolute;transform:translate(10px,-8px);background:var(--rust);color:var(--cream);font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

  /* Cards - specimen tag motif */
  .tag-card{background:var(--parchment);color:var(--ink);border-radius:3px;position:relative;padding:16px 16px 14px 22px;box-shadow:0 1px 0 rgba(0,0,0,0.15), 0 6px 14px -8px rgba(0,0,0,0.4);}
  .tag-card::before{content:"";position:absolute;left:8px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);}
  .tag-id{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.4px;color:var(--moss-dim);text-transform:uppercase;}

  .surface{background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-weight:600;font-size:14px;padding:11px 16px;cursor:pointer;border:none;transition:opacity .15s;}
  .btn:active{opacity:0.75;}
  .btn-primary{background:var(--moss);color:#0F1712;}
  .btn-secondary{background:transparent;color:var(--cream);border:1px solid var(--line);}
  .btn-ghost{background:transparent;color:var(--chicory);padding:6px 8px;font-size:13px;}
  .btn-danger{background:transparent;color:var(--rust);border:1px solid rgba(168,92,60,0.4);}
  .btn:disabled{opacity:0.4;cursor:default;}
  .btn-block{width:100%;}

  input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:11px 12px;font-size:15px;font-family:inherit;width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--moss);outline-offset:1px;}
  label{font-size:12px;color:#9FB0A3;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;margin-top:14px;}
  label:first-child{margin-top:0;}

  .empty{text-align:center;padding:60px 20px;color:#8AA090;}
  .empty .display{font-size:19px;color:var(--cream);margin-bottom:6px;}

  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:0.3px;}
  .pill-moss{background:rgba(107,143,113,0.2);color:#9FCBA6;}
  .pill-gold{background:rgba(201,162,39,0.18);color:var(--gold);}
  .pill-rust{background:rgba(168,92,60,0.18);color:#E0987A;}

  .screen{padding-top:6px;padding-bottom:24px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .fab{position:fixed;right:20px;bottom:92px;z-index:25;width:56px;height:56px;border-radius:50%;background:var(--moss);color:#0F1712;border:none;box-shadow:0 8px 20px -6px rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .fab svg{width:26px;height:26px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,15,11,0.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--bg-raised);border-top-left-radius:16px;border-top-right-radius:16px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}

  .divider{height:1px;background:var(--line);margin:18px 0;}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .stack{display:flex;flex-direction:column;gap:10px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:360px;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--parchment);padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,0.4);}
  .toast.error{background:#5A2A20;color:#F5D5C6;}

  .photo-row{display:flex;gap:12px;align-items:flex-start;}
  .photo-icon{width:52px;height:52px;border-radius:6px;background:var(--parchment-dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--moss-dim);}
  .photo-icon svg{width:24px;height:24px;}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .search-input{margin-bottom:16px;}
  .connect-status{display:flex;align-items:center;gap:8px;}
  .dot-status{width:8px;height:8px;border-radius:50%;}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============================================================
   CONFIG — replace with your actual Supabase publishable key.
   Find it at: Supabase Dashboard > Project Settings > API Keys
   This key is safe to embed in client code — it's designed for it.
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: "https://fsckwgicmvviefuivgza.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_60U_SBa3qnwU2jhWzyylnA_-6A3LMDt",
};

/* ============================================================
   STATE — in-memory only. Note: this means a page refresh
   requires logging in again. That's a deliberate MVP trade-off,
   not a bug — see note in Settings tab. Fine to add persistent
   storage once this is deployed to its own real domain.
   ============================================================ */
const state = {
  configKey: CONFIG.SUPABASE_PUBLISHABLE_KEY,
  session: null, // { access_token, email }
  tab: "inbox",
  photos: [],
  plants: [],
  locations: [],
  driveToken: null, // { expires_at } summary only
  loading: false,
  modal: null, // { type, data }
};

/* ============================================================
   API HELPERS
   ============================================================ */
function apiHeaders(extra = {}) {
  return {
    apikey: state.configKey,
    Authorization: `Bearer ${state.session?.access_token || state.configKey}`,
    ...extra,
  };
}

async function restGet(table, query = "") {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}${query}`, {
    headers: apiHeaders(),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function restPost(table, body) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: apiHeaders({ "Content-Type": "application/json", Prefer: "return=representation" }),
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function restPatch(table, idFilter, body) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?${idFilter}`, {
    method: "PATCH",
    headers: apiHeaders({ "Content-Type": "application/json", Prefer: "return=representation" }),
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function login(email, password) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: state.configKey, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok || !data.access_token) throw new Error(data.error_description || data.msg || "Login failed");
  return data;
}

async function uploadPhoto(file, plantId, notes) {
  const fd = new FormData();
  fd.append("photo", file);
  if (plantId) fd.append("plant_id", plantId);
  if (notes) fd.append("notes", notes);
  const res = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/upload-photo`, {
    method: "POST",
    headers: { apikey: state.configKey, Authorization: `Bearer ${state.session.access_token}` },
    body: fd,
  });
  const data = await res.json();
  if (!res.ok || !data.success) throw new Error(data.error || "Upload failed");
  return data.photo;
}

async function startDriveConnect() {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/drive-oauth-start`, {
    method: "POST",
    headers: apiHeaders(),
  });
  const data = await res.json();
  if (!data.url) throw new Error("Could not start Google Drive connection");
  window.location.href = data.url;
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadAll() {
  state.loading = true;
  render();
  try {
    const [photos, plants, locations, tokens] = await Promise.all([
      restGet("photos", "?select=*&order=uploaded_at.desc"),
      restGet("plants", "?select=*&order=common_name.asc"),
      restGet("locations", "?select=*&order=name.asc"),
      restGet("google_auth_tokens", "?select=expires_at&limit=1"),
    ]);
    state.photos = photos;
    state.plants = plants;
    state.locations = locations;
    state.driveToken = tokens[0] || null;
  } catch (e) {
    toast(e.message, true);
  }
  state.loading = false;
  render();
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function toast(msg, isError = false) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function icon(name) {
  const icons = {
    inbox: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h4l2 3h4l2-3h4M4 12l1.5-6.5A2 2 0 0 1 7.44 4h9.12a2 2 0 0 1 1.94 1.5L20 12M4 12v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg>`,
    leaf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 20A7 7 0 0 1 4 13V6a1 1 0 0 1 1-1h1a7 7 0 0 1 7 7v8Z"/><path d="M4 13c6 0 9-3 9-8"/></svg>`,
    map: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 20 3.5 17.5V4L9 6.5m0 13.5 6-2m-6 2V6.5m6 11.5 5.5 2.5V6.5L15 4m0 14V4m0 2.5L9 4"/></svg>`,
    settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>`,
    camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>`,
    plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
    photo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`,
    back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>`,
  };
  return icons[name] || "";
}

/* ============================================================
   ROUTER / NAV
   ============================================================ */
function goTab(tab) {
  state.tab = tab;
  state.modal = null;
  render();
}

function openModal(type, data = {}) {
  state.modal = { type, data };
  render();
}
function closeModal() {
  state.modal = null;
  render();
}

/* ============================================================
   SCREENS
   ============================================================ */
function screenLogin() {
  return `
  <div class="login-wrap">
    <div class="login-box">
      <div style="text-align:center;margin-bottom:34px;">
        <div class="display" style="font-size:15px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;">Personal Collection Tool</div>
        <h1 class="display" style="font-size:30px;font-weight:500;margin:0;">Adcock<br/>Botanical Garden</h1>
      </div>
      <form id="login-form" class="stack">
        <div>
          <label>Email</label>
          <input type="email" id="login-email" required autocomplete="username" />
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:18px;" ${state.loading ? "disabled" : ""}>
          ${state.loading ? '<span class="spinner"></span>' : "Sign in"}
        </button>
      </form>
      <p class="subtle" style="text-align:center;margin-top:22px;">Private collection tool · single user</p>
    </div>
  </div>`;
}

function screenInbox() {
  const unassigned = state.photos.filter((p) => !p.plant_id);
  return `
  <div class="screen">
    <div class="container">
      <div class="row" style="margin-bottom:4px;">
        <h2 class="display" style="font-size:22px;font-weight:500;margin:0;">Inbox</h2>
        ${unassigned.length ? `<span class="pill pill-gold">${unassigned.length} waiting</span>` : ""}
      </div>
      <p class="subtle" style="margin-bottom:20px;">Photos land here first — confirm or attach them to a plant.</p>

      ${unassigned.length === 0 ? `
        <div class="empty">
          <div class="display">Nothing waiting</div>
          <div>Tap the camera button to add a photo.</div>
        </div>` : `
        <div class="stack">
          ${unassigned.map(photoRow).join("")}
        </div>`}
    </div>
  </div>`;
}

function photoRow(p) {
  return `
  <div class="tag-card">
    <div class="photo-row">
      <div class="photo-icon">${icon("photo")}</div>
      <div style="flex:1;min-width:0;">
        <div class="tag-id">Photo · ${fmtDate(p.uploaded_at)}</div>
        <div style="font-size:14px;margin-top:2px;color:var(--ink-soft);">${p.notes ? escapeHtml(p.notes) : "No notes"}</div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-secondary" style="padding:7px 12px;font-size:12.5px;color:var(--ink);border-color:rgba(31,42,34,0.2);" onclick="openModal('attach',{photoId:'${p.id}'})">Attach to plant</button>
          <button class="btn btn-secondary" style="padding:7px 12px;font-size:12.5px;color:var(--ink);border-color:rgba(31,42,34,0.2);" onclick="openModal('newPlantFromPhoto',{photoId:'${p.id}'})">New plant</button>
        </div>
      </div>
    </div>
  </div>`;
}

function screenPlants() {
  const q = (state.plantSearch || "").toLowerCase();
  const list = state.plants.filter(
    (pl) => !q || pl.common_name?.toLowerCase().includes(q) || pl.botanical_name?.toLowerCase().includes(q)
  );
  return `
  <div class="screen">
    <div class="container">
      <h2 class="display" style="font-size:22px;font-weight:500;margin:0 0 16px;">Plants</h2>
      <input class="search-input" placeholder="Search your collection…" value="${escapeHtml(state.plantSearch || "")}" oninput="state.plantSearch=this.value;render()" />
      ${list.length === 0 ? `
        <div class="empty">
          <div class="display">${state.plants.length === 0 ? "No plants yet" : "No matches"}</div>
          <div>${state.plants.length === 0 ? "Add your first plant from the Inbox or the + button." : "Try a different search."}</div>
        </div>` : `
        <div class="stack">
          ${list.map(plantRow).join("")}
        </div>`}
    </div>
  </div>`;
}

function plantRow(pl) {
  const loc = state.locations.find((l) => l.id === pl.location_id);
  const photoCount = state.photos.filter((p) => p.plant_id === pl.id).length;
  return `
  <div class="tag-card" onclick="openPlant('${pl.id}')" style="cursor:pointer;">
    <div class="row">
      <div style="min-width:0;">
        <div class="tag-id">${pl.status === "active" ? "" : pl.status.toUpperCase() + " · "}${loc ? escapeHtml(loc.name) : "No location set"}</div>
        <div style="font-family:'Fraunces',serif;font-size:17px;font-weight:500;margin-top:2px;">${escapeHtml(pl.common_name)}</div>
        ${pl.botanical_name ? `<div style="font-size:12.5px;font-style:italic;color:var(--ink-soft);">${escapeHtml(pl.botanical_name)}</div>` : ""}
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div class="mono" style="font-size:11px;color:var(--moss-dim);">${photoCount} photo${photoCount === 1 ? "" : "s"}</div>
      </div>
    </div>
  </div>`;
}

function openPlant(id) {
  state.tab = "plantDetail";
  state.currentPlantId = id;
  render();
}

function screenPlantDetail() {
  const pl = state.plants.find((p) => p.id === state.currentPlantId);
  if (!pl) return `<div class="screen container"><p>Plant not found.</p></div>`;
  const loc = state.locations.find((l) => l.id === pl.location_id);
  const photos = state.photos.filter((p) => p.plant_id === pl.id).sort((a, b) => new Date(b.uploaded_at) - new Date(a.uploaded_at));

  return `
  <div class="screen">
    <div class="container">
      <button class="btn-ghost" style="padding:4px 0 14px;display:flex;align-items:center;gap:4px;" onclick="goTab('plants')">${icon("back")} Plants</button>

      <div class="tag-card" style="padding:18px 18px 16px 24px;">
        <div class="tag-id">${loc ? escapeHtml(loc.name) : "No location set"}</div>
        <div class="display" style="font-size:24px;font-weight:500;margin-top:3px;">${escapeHtml(pl.common_name)}</div>
        ${pl.botanical_name ? `<div style="font-style:italic;color:var(--ink-soft);font-size:14px;margin-top:2px;">${escapeHtml(pl.botanical_name)}${pl.cultivar ? " '" + escapeHtml(pl.cultivar) + "'" : ""}</div>` : ""}
        <div style="margin-top:10px;"><span class="pill ${pl.status === "active" ? "pill-moss" : "pill-rust"}">${pl.status}</span></div>
        ${pl.notes ? `<div style="margin-top:12px;font-size:14px;color:var(--ink-soft);">${escapeHtml(pl.notes)}</div>` : ""}
        <button class="btn-ghost" style="padding:10px 0 0;font-size:12.5px;" onclick="openModal('editPlant',{plantId:'${pl.id}'})">Edit details</button>
      </div>

      <div class="row" style="margin-top:26px;margin-bottom:12px;">
        <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Photo timeline</h3>
        <span class="subtle">${photos.length} total</span>
      </div>

      ${photos.length === 0 ? `
        <div class="empty" style="padding:40px 20px;">
          <div>No photos attached yet.</div>
        </div>` : `
        <div class="stack">
          ${photos.map((p) => `
            <div class="surface" style="padding:14px;">
              <div class="row">
                <div class="photo-row">
                  <div class="photo-icon" style="background:rgba(107,143,113,0.15);color:var(--moss);">${icon("photo")}</div>
                  <div>
                    <div class="mono" style="font-size:11px;color:#8AA090;">${fmtDate(p.uploaded_at)}</div>
                    <div style="font-size:14px;margin-top:2px;">${p.notes ? escapeHtml(p.notes) : "—"}</div>
                  </div>
                </div>
                ${p.is_primary ? `<span class="pill pill-gold">Primary</span>` : ""}
              </div>
            </div>
          `).join("")}
        </div>`}
    </div>
  </div>`;
}

function screenLocations() {
  return `
  <div class="screen">
    <div class="container">
      <div class="row" style="margin-bottom:16px;">
        <h2 class="display" style="font-size:22px;font-weight:500;margin:0;">Locations</h2>
        <button class="btn btn-secondary" style="padding:7px 12px;font-size:13px;" onclick="openModal('newLocation')">+ Add</button>
      </div>
      ${state.locations.length === 0 ? `
        <div class="empty">
          <div class="display">No locations yet</div>
          <div>Add pots, beds, or spaces to organize your plants.</div>
        </div>` : `
        <div class="stack">
          ${state.locations.map((l) => {
            const count = state.plants.filter((p) => p.location_id === l.id).length;
            return `
            <div class="tag-card">
              <div class="row">
                <div>
                  <div class="tag-id">${l.type || "location"}</div>
                  <div style="font-family:'Fraunces',serif;font-size:16px;font-weight:500;margin-top:2px;">${escapeHtml(l.name)}</div>
                </div>
                <div class="mono" style="font-size:11px;color:var(--moss-dim);">${count} plant${count === 1 ? "" : "s"}</div>
              </div>
            </div>`;
          }).join("")}
        </div>`}
    </div>
  </div>`;
}

function screenSettings() {
  const connected = !!state.driveToken;
  const expiresAt = state.driveToken ? new Date(state.driveToken.expires_at) : null;
  const refreshLikelyStale = false; // access_token expiry != refresh_token expiry; status shown is informational
  return `
  <div class="screen">
    <div class="container">
      <h2 class="display" style="font-size:22px;font-weight:500;margin:0 0 20px;">Settings</h2>

      <div class="surface" style="padding:16px;">
        <div class="row">
          <div class="connect-status">
            <span class="dot-status" style="background:${connected ? "var(--moss)" : "var(--rust)"};"></span>
            <div>
              <div style="font-weight:600;font-size:14.5px;">Google Drive</div>
              <div class="subtle">${connected ? "Connected" : "Not connected"}</div>
            </div>
          </div>
          <button class="btn btn-primary" style="padding:9px 14px;font-size:13px;" onclick="handleConnectDrive()">
            ${connected ? "Reconnect" : "Connect"}
          </button>
        </div>
        <p class="subtle" style="margin-top:12px;line-height:1.5;">
          Drive access can expire roughly every 7 days while this app is in personal-use (unverified) mode.
          If uploads start failing, come back here and tap Reconnect — takes about 10 seconds.
        </p>
      </div>

      <div class="divider"></div>

      <div class="surface" style="padding:16px;">
        <div style="font-weight:600;font-size:14.5px;">Signed in as</div>
        <div class="subtle" style="margin-top:4px;">${state.session?.email || ""}</div>
        <button class="btn btn-danger" style="margin-top:14px;padding:9px 14px;font-size:13px;" onclick="logout()">Sign out</button>
      </div>

      <p class="subtle" style="margin-top:20px;line-height:1.5;">
        Note: sessions aren't remembered across page reloads yet in this build — you'll need to
        sign in again if you refresh or close the app. This is expected for now.
      </p>
    </div>
  </div>`;
}

/* ============================================================
   MODALS
   ============================================================ */
function modalContent() {
  if (!state.modal) return "";
  const { type, data } = state.modal;

  if (type === "attach") {
    const q = (state.attachSearch || "").toLowerCase();
    const matches = state.plants.filter((p) => !q || p.common_name.toLowerCase().includes(q));
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">Attach to plant</h3>
      <input placeholder="Search plants…" value="${escapeHtml(state.attachSearch || "")}" oninput="state.attachSearch=this.value;render()" style="margin-bottom:14px;" />
      <div class="stack" style="max-height:44vh;overflow-y:auto;">
        ${matches.length === 0 ? `<p class="subtle">No plants match. Try "New plant" instead.</p>` : matches.map((p) => `
          <button class="btn btn-secondary btn-block" style="justify-content:flex-start;" onclick="attachPhotoToPlant('${data.photoId}','${p.id}')">${escapeHtml(p.common_name)}</button>
        `).join("")}
      </div>
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>
    `;
  }

  if (type === "newPlantFromPhoto" || type === "newPlant") {
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">New plant</h3>
      <form id="new-plant-form">
        <label>Common name *</label>
        <input id="np-common" required />
        <label>Botanical name</label>
        <input id="np-botanical" />
        <label>Location</label>
        <select id="np-location">
          <option value="">— None —</option>
          ${state.locations.map((l) => `<option value="${l.id}">${escapeHtml(l.name)}</option>`).join("")}
        </select>
        <label>Notes</label>
        <textarea id="np-notes" rows="2"></textarea>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Create plant</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>
    `;
  }

  if (type === "editPlant") {
    const pl = state.plants.find((p) => p.id === data.plantId);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Edit plant</h3>
      <form id="edit-plant-form">
        <label>Common name *</label>
        <input id="ep-common" required value="${escapeHtml(pl.common_name)}" />
        <label>Botanical name</label>
        <input id="ep-botanical" value="${escapeHtml(pl.botanical_name || "")}" />
        <label>Cultivar</label>
        <input id="ep-cultivar" value="${escapeHtml(pl.cultivar || "")}" />
        <label>Status</label>
        <select id="ep-status">
          ${["active", "dormant", "given_away", "dead"].map((s) => `<option value="${s}" ${pl.status === s ? "selected" : ""}>${s}</option>`).join("")}
        </select>
        <label>Location</label>
        <select id="ep-location">
          <option value="">— None —</option>
          ${state.locations.map((l) => `<option value="${l.id}" ${pl.location_id === l.id ? "selected" : ""}>${escapeHtml(l.name)}</option>`).join("")}
        </select>
        <label>Notes</label>
        <textarea id="ep-notes" rows="2">${escapeHtml(pl.notes || "")}</textarea>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Save changes</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>
    `;
  }

  if (type === "newLocation") {
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">New location</h3>
      <form id="new-location-form">
        <label>Name *</label>
        <input id="nl-name" required placeholder="e.g. Back patio, blue pot" />
        <label>Type</label>
        <select id="nl-type">
          <option value="">— Unspecified —</option>
          <option value="pot">Pot</option>
          <option value="bed">Bed</option>
          <option value="indoor">Indoor</option>
          <option value="greenhouse">Greenhouse</option>
          <option value="hanging">Hanging</option>
          <option value="other">Other</option>
        </select>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Add location</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>
    `;
  }

  if (type === "upload") {
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">Add a photo</h3>
      <form id="upload-form">
        <input type="file" id="upload-file" accept="image/*" capture="environment" required style="padding:10px;" />
        <label>Notes (optional)</label>
        <textarea id="upload-notes" rows="2" placeholder="e.g. new growth on the west side"></textarea>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;" id="upload-submit-btn">Upload to Inbox</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>
    `;
  }

  return "";
}

/* ============================================================
   ACTIONS
   ============================================================ */
async function handleConnectDrive() {
  try {
    await startDriveConnect();
  } catch (e) {
    toast(e.message, true);
  }
}

async function attachPhotoToPlant(photoId, plantId) {
  try {
    await restPatch("photos", `id=eq.${photoId}`, { plant_id: plantId });
    toast("Photo attached");
    closeModal();
    await loadAll();
  } catch (e) {
    toast(e.message, true);
  }
}

function logout() {
  state.session = null;
  state.photos = [];
  state.plants = [];
  state.locations = [];
  render();
}

/* ============================================================
   RENDER
   ============================================================ */
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str ?? "";
  return d.innerHTML;
}

function navBar() {
  const tabs = [
    { id: "inbox", label: "Inbox", icon: "inbox", badge: state.photos.filter((p) => !p.plant_id).length },
    { id: "plants", label: "Plants", icon: "leaf" },
    { id: "locations", label: "Locations", icon: "map" },
    { id: "settings", label: "Settings", icon: "settings" },
  ];
  return `
  <div class="navbar">
    <div class="container">
      ${tabs.map((t) => `
        <button class="navbtn ${state.tab === t.id || (t.id === "plants" && state.tab === "plantDetail") ? "active" : ""}" onclick="goTab('${t.id}')" style="position:relative;">
          ${icon(t.icon)}
          <span>${t.label}</span>
          ${t.badge ? `<span class="badge">${t.badge}</span>` : ""}
        </button>
      `).join("")}
    </div>
  </div>`;
}

function topBar() {
  return `
  <div class="topbar">
    <div class="container">
      <div class="brand">Adcock<span class="dot">·</span>Botanical Garden</div>
      <div class="subtle">${state.session?.email || ""}</div>
    </div>
  </div>`;
}

function configGate() {
  return `
  <div class="login-wrap">
    <div class="login-box">
      <h1 class="display" style="font-size:22px;font-weight:500;margin-bottom:6px;">One-time setup</h1>
      <p class="subtle" style="margin-bottom:20px;line-height:1.5;">Paste your Supabase publishable key (Project Settings → API Keys). This isn't sensitive — it's meant to live in client code.</p>
      <form id="config-form">
        <input id="config-key-input" placeholder="sb_publishable_..." required />
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">Continue</button>
      </form>
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById("app");

  if (state.configKey === "REPLACE_WITH_YOUR_PUBLISHABLE_KEY" || !state.configKey) {
    app.innerHTML = configGate();
    document.getElementById("config-form").onsubmit = (e) => {
      e.preventDefault();
      state.configKey = document.getElementById("config-key-input").value.trim();
      render();
    };
    return;
  }

  if (!state.session) {
    app.innerHTML = screenLogin();
    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      state.loading = true;
      render();
      try {
        const data = await login(email, password);
        state.session = { access_token: data.access_token, email: data.user.email };
        state.loading = false;
        await loadAll();
      } catch (e) {
        state.loading = false;
        toast(e.message, true);
        render();
      }
    };
    return;
  }

  let screen = "";
  if (state.tab === "inbox") screen = screenInbox();
  else if (state.tab === "plants") screen = screenPlants();
  else if (state.tab === "plantDetail") screen = screenPlantDetail();
  else if (state.tab === "locations") screen = screenLocations();
  else if (state.tab === "settings") screen = screenSettings();

  app.innerHTML = `
    ${topBar()}
    ${screen}
    <button class="fab" onclick="openModal('upload')" aria-label="Add photo">${icon("camera")}</button>
    ${navBar()}
    ${state.modal ? `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${modalContent()}</div></div>` : ""}
  `;

  wireModalForms();
}

function wireModalForms() {
  const uploadForm = document.getElementById("upload-form");
  if (uploadForm) {
    uploadForm.onsubmit = async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("upload-file");
      const notes = document.getElementById("upload-notes").value;
      const file = fileInput.files[0];
      if (!file) return;
      const btn = document.getElementById("upload-submit-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        await uploadPhoto(file, null, notes);
        toast("Photo added to Inbox");
        closeModal();
        await loadAll();
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false;
        btn.textContent = "Upload to Inbox";
      }
    };
  }

  const newPlantForm = document.getElementById("new-plant-form");
  if (newPlantForm) {
    newPlantForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const body = {
          common_name: document.getElementById("np-common").value,
          botanical_name: document.getElementById("np-botanical").value || null,
          location_id: document.getElementById("np-location").value || null,
          notes: document.getElementById("np-notes").value || null,
        };
        const [newPlant] = await restPost("plants", body);
        if (state.modal.type === "newPlantFromPhoto") {
          await restPatch("photos", `id=eq.${state.modal.data.photoId}`, { plant_id: newPlant.id });
        }
        toast("Plant created");
        closeModal();
        await loadAll();
      } catch (e) {
        toast(e.message, true);
      }
    };
  }

  const editPlantForm = document.getElementById("edit-plant-form");
  if (editPlantForm) {
    editPlantForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const body = {
          common_name: document.getElementById("ep-common").value,
          botanical_name: document.getElementById("ep-botanical").value || null,
          cultivar: document.getElementById("ep-cultivar").value || null,
          status: document.getElementById("ep-status").value,
          location_id: document.getElementById("ep-location").value || null,
          notes: document.getElementById("ep-notes").value || null,
          updated_at: new Date().toISOString(),
        };
        await restPatch("plants", `id=eq.${state.modal.data.plantId}`, body);
        toast("Saved");
        closeModal();
        await loadAll();
      } catch (e) {
        toast(e.message, true);
      }
    };
  }

  const newLocationForm = document.getElementById("new-location-form");
  if (newLocationForm) {
    newLocationForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const body = {
          name: document.getElementById("nl-name").value,
          type: document.getElementById("nl-type").value || null,
        };
        await restPost("locations", body);
        toast("Location added");
        closeModal();
        await loadAll();
      } catch (e) {
        toast(e.message, true);
      }
    };
  }
}

render();
</script>
</body>
</html>
