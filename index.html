<style>
  /* ============================================================
     COLOR SYSTEM — Adcock Botanical Garden approved palette.
     Roles are deliberate, not decorative:
       --moss (Aloe Green)      = secondary controls, inactive nav
       --orange (Aloe Bloom)    = primary capture action, highlights, selected state
       --terracotta             = attention / waiting / unresolved
       --blue (Agave Blue)      = informational, location, photo-related
       --pink (Cactus Flower)   = special / flowering — used sparingly
     Background stays Deep Garden Green + Warm Cream + Charcoal;
     accents are functional cues, not general chrome.
     ============================================================ */
  :root{
    --bg:#243E36;          /* Deep Garden Green */
    --bg-raised:#2C4A40;
    --parchment:#F5EFE3;   /* Warm Cream */
    --parchment-dim:#E8E0D0;
    --ink:#252925;         /* Charcoal */
    --ink-soft:#5A6B5D;
    --cream:#F5EFE3;
    --moss:#70866B;        /* Aloe Green */
    --moss-dim:#576B53;
    --blue:#7CA7A1;        /* Agave Blue */
    --orange:#F2A65A;      /* Aloe Bloom Orange */
    --terracotta:#D97474;  /* Terra Cotta */
    --pink:#D67A9A;        /* Cactus Flower Pink */
    --line: rgba(245,239,227,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding-bottom:76px;min-height:100vh;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--orange);color:var(--ink);}

  .container{max-width:640px;margin:0 auto;padding:0 16px;}

  .sticky-header-group{position:sticky;top:0;z-index:20;background:var(--bg);}
  .topbar{padding:22px 0 14px;border-bottom:1px solid var(--line);}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar-right-group{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .icon-only-btn{background:none;border:none;color:#9FB0A3;padding:6px;cursor:pointer;display:flex;}
  .icon-only-btn svg{width:19px;height:19px;}
  .status-light-btn{background:none;border:none;padding:6px;cursor:default;display:flex;}
  .status-light-btn svg{width:18px;height:18px;}
  .status-light{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .inbox-subbar{padding:12px 0;border-bottom:1px solid var(--line);}

  .nav-row{display:flex;align-items:flex-end;justify-content:space-around;position:relative;}
  .nav-camera-btn{width:52px;height:52px;border-radius:50%;background:var(--orange);color:#3A2408;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transform:translateY(-16px);box-shadow:0 6px 16px -4px rgba(0,0,0,0.5);flex-shrink:0;}
  .nav-camera-btn svg{width:22px;height:22px;}
  .topbar .container{display:flex;align-items:center;justify-content:center;}
  .brand{font-family:'Fraunces',serif;font-weight:500;font-size:22px;letter-spacing:0.2px;display:flex;justify-content:center;}
  .brand img{max-width:280px;width:100%;height:auto;}
  .brand-lockup{display:flex;align-items:center;justify-content:center;gap:11px;}
  .brand-lockup img{width:38px;height:38px;object-fit:contain;flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:1.5px;color:var(--cream);}
  .brand-sub{font-family:'Fraunces',serif;font-style:italic;font-size:11px;letter-spacing:0.8px;color:var(--moss);text-transform:uppercase;margin-top:1px;}
  .brand .dot{color:var(--blue);}
  .subtle{color:#9FB0A3;font-size:12.5px;}

  .navbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-raised);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  .navbar .container{display:flex;justify-content:space-around;padding:8px 12px 6px;max-width:640px;}
  .navbtn{background:none;border:none;color:var(--moss);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 10px;border-radius:10px;cursor:pointer;letter-spacing:0.3px;position:relative;}
  .navbtn.active{color:var(--cream);}
  .navbtn svg{width:20px;height:20px;}
  .navbtn .badge{position:absolute;transform:translate(10px,-8px);background:var(--terracotta);color:var(--cream);font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

  .tag-card{background:var(--parchment);color:var(--ink);border-radius:3px;position:relative;padding:16px 16px 14px 22px;box-shadow:0 1px 0 rgba(0,0,0,0.15), 0 6px 14px -8px rgba(0,0,0,0.4);}
  .tag-id{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.4px;color:var(--moss-dim);text-transform:uppercase;}

  .surface{background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-weight:600;font-size:14px;padding:11px 16px;cursor:pointer;border:none;transition:opacity .15s;}
  .btn:active{opacity:0.75;}
  .btn-primary{background:var(--moss);color:#0F1712;}
  .btn-accent{background:var(--orange);color:#3A2408;}
  .btn-secondary{background:transparent;color:var(--cream);border:1px solid var(--line);}
  .btn-ghost{background:transparent;color:var(--blue);padding:6px 8px;font-size:13px;border:none;border-radius:6px;cursor:pointer;transition:opacity .15s;}
  .btn-ghost:active{opacity:0.7;}
  .btn-danger{background:transparent;color:var(--terracotta);border:1px solid rgba(208,106,78,0.4);}
  .btn:disabled{opacity:0.4;cursor:default;}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn-on-cream{color:var(--ink);border-color:rgba(37,41,37,0.2);}
  .icon-btn{display:inline-flex;align-items:center;gap:6px;}
  .icon-btn svg{width:15px;height:15px;flex-shrink:0;}
  .btn-danger.icon-btn{padding:9px 10px;}

  input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:11px 12px;font-size:15px;font-family:inherit;width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--moss);outline-offset:1px;}
  label{font-size:12px;color:#9FB0A3;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;margin-top:14px;}
  label:first-child{margin-top:0;}
  .field-help{font-size:11.5px;color:#7E9084;margin-top:4px;}
  .checkbox-row{display:flex;align-items:center;gap:9px;margin-top:14px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;text-transform:none;font-size:14px;color:var(--cream);letter-spacing:0;}

  .empty{text-align:center;padding:60px 20px;color:#8AA090;}
  .empty .display{font-size:19px;color:var(--cream);margin-bottom:6px;}

  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:0.3px;}
  .pill-moss{background:rgba(112,134,107,0.2);color:#B7C9B2;}
  .pill-orange{background:rgba(242,166,90,0.2);color:var(--orange);}
  .pill-terracotta{background:rgba(208,106,78,0.2);color:#E8A78F;}
  .pill-blue{background:rgba(124,167,161,0.2);color:#AECDC8;}
  .pill-pink{background:rgba(214,122,154,0.2);color:#E7A9BF;}
  .pill-outline{background:transparent;border:1px solid var(--line);color:#9FB0A3;}

  .screen{padding-top:6px;padding-bottom:24px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .fab{position:fixed;right:20px;bottom:92px;z-index:25;width:56px;height:56px;border-radius:50%;background:var(--orange);color:#3A2408;border:none;box-shadow:0 8px 20px -6px rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .fab svg{width:26px;height:26px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,15,11,0.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--bg-raised);border-top-left-radius:16px;border-top-right-radius:16px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}

  .divider{height:1px;background:var(--line);margin:18px 0;}
  .section-label{font-family:'Fraunces',serif;font-size:14px;font-style:italic;color:var(--blue);margin:22px 0 4px;}
  .section-label:first-child{margin-top:0;}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .card-grid{display:flex;flex-direction:column;gap:10px;}
  .wrap-gap{display:flex;flex-wrap:wrap;gap:6px;}

  /* ============================================================
     RESPONSIVE — mobile-first base above; from here up, use the
     extra real estate on tablet/laptop screens instead of just
     centering a phone-width column.
     ============================================================ */
  @media (min-width: 700px) {
    .container{max-width:900px;}
    .card-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:14px;align-items:start;}
    .plant-list-thumb{width:120px;height:120px;}
    .plant-hero{aspect-ratio:16/9;}
  }
  @media (min-width: 1100px) {
    .container{max-width:1280px;}
    .card-grid{grid-template-columns:repeat(3, 1fr);gap:16px;}
    .plant-list-thumb{width:140px;height:140px;}
    .login-wrap .container{max-width:none;}
  }

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:360px;}
  .login-card{
    background:var(--parchment);
    border-radius:18px;
    padding:32px 26px 28px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.5), 0 2px 0 rgba(0,0,0,0.08);
  }
  .login-card label{color:var(--ink-soft);}
  .login-card input{
    background:#FFFFFF;
    border:1px solid rgba(37,41,37,0.18);
    color:var(--ink);
  }
  .login-card input:focus{outline:2px solid var(--moss);}
  .btn-primary-dark{background:var(--bg);color:var(--parchment);}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--parchment);padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,0.4);}
  .toast.error{background:#5A2A20;color:#F5D5C6;}

  .photo-row{display:flex;gap:12px;align-items:flex-start;}
  .photo-icon{width:52px;height:52px;border-radius:6px;background:rgba(124,167,161,0.15);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--blue);}
  .photo-icon svg{width:24px;height:24px;}
  .photo-icon.on-cream{background:var(--parchment-dim);color:var(--moss-dim);}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .search-input{margin-bottom:12px;}
  .connect-status{display:flex;align-items:center;gap:8px;}
  .dot-status{width:8px;height:8px;border-radius:50%;}

  .filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
  .filter-bar select{width:auto;flex-shrink:0;font-size:13px;padding:8px 10px;background:var(--bg-raised);}

  .loc-group{margin-bottom:18px;}
  .loc-group-title{font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--blue);margin-bottom:8px;padding-left:2px;}
  .loc-child{margin-left:16px;}

  .plant-list-card{display:flex;gap:14px;cursor:pointer;padding:14px;}
  .plant-list-thumb{width:92px;height:92px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--parchment-dim);}
  .plant-list-thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--moss-dim);}
  .plant-list-thumb-empty svg{width:26px;height:26px;}

  .thumb-delete-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(37,41,37,0.75);color:var(--parchment);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .thumb-delete-btn svg{width:12px;height:12px;}

  .status-badge{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,0.45);z-index:1;}
  .status-badge svg{width:14px;height:14px;}
  .status-badge.status-active{background:var(--moss);color:#12200F;}
  .status-badge.status-attention{background:var(--terracotta);color:#3A1608;}

  .select-check{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--parchment);border:2px solid var(--moss-dim);z-index:2;display:flex;align-items:center;justify-content:center;color:#0F1712;}
  .select-check.checked{background:var(--moss);border-color:var(--moss);}
  .select-check svg{width:12px;height:12px;}

  .bulk-action-bar{position:fixed;left:0;right:0;bottom:76px;background:var(--bg-raised);border-top:1px solid var(--line);padding:12px 0;z-index:28;}

  /* Plant Detail hero image (profile picture) */
  .plant-hero{width:100%;aspect-ratio:16/9;max-height:280px;background:var(--parchment-dim);position:relative;cursor:pointer;}
  .plant-hero-empty{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--moss-dim);}
  .inbox-photo-hero{width:100%;aspect-ratio:4/3;background:var(--parchment-dim);position:relative;}
  .plant-hero-empty svg{width:36px;height:36px;}
  .plant-hero-empty span{font-size:12.5px;}
  .hero-change-btn{position:absolute;margin-top:-40px;margin-left:12px;background:rgba(37,41,37,0.72);color:var(--parchment);border:none;font-size:12px;padding:7px 12px;border-radius:20px;cursor:pointer;backdrop-filter:blur(4px);}

  /* High-contrast pill variants for use on the cream card — the
     translucent dark-bg pill styles were nearly illegible here. */
  .pill-solid{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;letter-spacing:0.2px;}
  .pill-solid-moss{background:var(--moss);color:#12200F;}
  .pill-solid-terracotta{background:var(--terracotta);color:#3A1608;}
  .pill-solid-blue{background:var(--blue);color:#0F2622;}
  .pill-solid-pink{background:var(--pink);color:#3A0F20;}
  .pill-solid-outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}
  .chicory-oncream{color:#3E6B77;}

  /* Full-screen photo lightbox */
  .lightbox-backdrop{position:fixed;inset:0;background:rgba(6,10,7,0.94);z-index:80;display:flex;flex-direction:column;}
  .lightbox-top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;color:var(--cream);}
  .lightbox-body{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px;}
  .lightbox-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;cursor:zoom-in;transition:none;}
  .lightbox-body img.zoomed{max-width:none;max-height:none;width:auto;height:auto;cursor:zoom-out;border-radius:0;}
  .lightbox-nav{background:rgba(255,255,255,0.12);border:none;color:var(--cream);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .lightbox-nav svg{width:22px;height:22px;}
  .lightbox-close{background:none;border:none;color:var(--cream);cursor:pointer;padding:6px;}
  .lightbox-close svg{width:22px;height:22px;}
  .lightbox-bottom{padding:16px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lightbox-counter{color:#9FB0A3;font-size:12.5px;}
</style>
</head>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: "https://fsckwgicmvviefuivgza.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_60U_SBa3qnwU2jhWzyylnA_-6A3LMDt",
};

/* ============================================================
   VERSION — bump this (number + date) any time the file changes,
   so you can confirm a push actually took effect after refreshing.
   Check it in Settings, or open the browser console.
   ============================================================ */
const APP_VERSION = "1.34.1";
const APP_UPDATED = "2026-08-24";
console.log(`Adcock Botanical Garden — v${APP_VERSION} (${APP_UPDATED})`);

/* ============================================================
   STATE — in-memory only (see note in Settings tab)
   ============================================================ */
const state = {
  configKey: CONFIG.SUPABASE_PUBLISHABLE_KEY,
  session: null,
  tab: "inbox",
  photos: [],
  plants: [],
  locations: [],
  driveToken: null,
  loading: false,
  modal: null,
  plantSearch: "",
  attachSearch: "",
  plantFilters: { category: "", status: "", idStatus: "", original: "", location: "" },
  photoUrlCache: {},
  photoFetchInFlight: new Set(),
  photoPlants: [],
  identifications: [],
  identifyingPhotoId: null,
  identifyingPhotoIdClaude: null,
  lightbox: null,
  plantLocations: [],
  photoLocations: [],
  inboxLimit: 20,
  tagLocationSearch: "",
  galleryFilters: { locationId: "", photoType: "", search: "" },
  inboxSelectMode: false,
  inboxSelected: new Set(),
  lightboxResumePending: false,
  lightboxResumeIndex: 0,
};

/* ============================================================
   SESSION PERSISTENCE — real localStorage now that the app is
   hosted on its own domain (not inside Claude's preview sandbox,
   which blocks browser storage). Keeps you logged in across
   refreshes, and silently refreshes the access token before it
   expires so you're not booted out mid-session either.
   ============================================================ */
function saveSession(session) {
  try { localStorage.setItem("abg_session", JSON.stringify(session)); } catch (e) {}
}
function loadStoredSession() {
  try {
    const raw = localStorage.getItem("abg_session");
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearStoredSession() {
  try { localStorage.removeItem("abg_session"); } catch (e) {}
}

async function refreshAccessToken(refresh_token) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: state.configKey, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token }),
  });
  const data = await res.json();
  if (!res.ok || !data.access_token) throw new Error(data.error_description || data.msg || "Session refresh failed");
  return data;
}

// Refreshes the access token if it's within 5 minutes of expiring.
// Called before data loads so a stale token never causes a failed request.
async function ensureFreshSession() {
  if (!state.session) return;
  if (state.session.expires_at && Date.now() < state.session.expires_at - 5 * 60 * 1000) return;
  try {
    const data = await refreshAccessToken(state.session.refresh_token);
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      email: data.user?.email || state.session.email,
      expires_at: Date.now() + data.expires_in * 1000,
    };
    saveSession(state.session);
  } catch (e) {
    clearStoredSession();
    state.session = null;
    toast("Your session expired — please sign in again.", true);
  }
}

/* ============================================================
   API HELPERS
   ============================================================ */
function apiHeaders(extra = {}) {
  return {
    apikey: state.configKey,
    Authorization: `Bearer ${state.session?.access_token || state.configKey}`,
    ...extra,
  };
}

async function restGet(table, query = "") {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}${query}`, { headers: apiHeaders() });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function restPost(table, body) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: apiHeaders({ "Content-Type": "application/json", Prefer: "return=representation" }),
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function restPatch(table, idFilter, body) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?${idFilter}`, {
    method: "PATCH",
    headers: apiHeaders({ "Content-Type": "application/json", Prefer: "return=representation" }),
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function restDelete(table, idFilter) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?${idFilter}`, {
    method: "DELETE",
    headers: apiHeaders(),
  });
  if (!res.ok) throw new Error(await res.text());
}
async function restUpsert(table, rows, conflictCol = "id") {
  if (!rows || rows.length === 0) return;
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflictCol}`, {
    method: "POST",
    headers: apiHeaders({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(rows),
  });
  if (!res.ok) throw new Error(`${table}: ${await res.text()}`);
}

function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function csvEscape(val) {
  if (val === null || val === undefined) return "";
  const s = String(val);
  if (s.includes(",") || s.includes('"') || s.includes("\n")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

async function exportFullBackup() {
  try {
    toast("Preparing backup…");
    const [locations, plants, photos, identifications, photoPlants, plantLocations, photoLocations, counters] = await Promise.all([
      restGet("locations", "?select=*"),
      restGet("plants", "?select=*"),
      restGet("photos", "?select=*"),
      restGet("identifications", "?select=*"),
      restGet("photo_plants", "?select=*"),
      restGet("plant_locations", "?select=*"),
      restGet("photo_locations", "?select=*"),
      restGet("accession_counters", "?select=*"),
    ]);
    const backup = {
      exported_at: new Date().toISOString(),
      app_version: APP_VERSION,
      locations, plants, photos, identifications,
      photo_plants: photoPlants,
      plant_locations: plantLocations,
      photo_locations: photoLocations,
      accession_counters: counters,
    };
    downloadFile(
      `adcock-botanical-garden-backup-${new Date().toISOString().slice(0, 10)}.json`,
      JSON.stringify(backup, null, 2),
      "application/json"
    );
    toast("Backup downloaded");
  } catch (e) { toast(e.message, true); }
}

function exportPlantsCsv() {
  const headers = ["accession_number", "botanical_name", "common_name", "cultivar", "family", "genus", "species",
    "identification_status", "collection_category", "original_collection", "status", "health_status",
    "location_path", "date_acquired", "acquisition_source_type", "acquisition_source_name",
    "native_range", "hardy_to", "light_requirements", "water_needs", "notes"];
  const rows = state.plants.map((pl) => {
    const loc = locationById(pl.location_id);
    return [
      pl.accession_number, pl.botanical_name, pl.common_name, pl.cultivar, pl.family, pl.genus, pl.species,
      pl.identification_status, pl.collection_category, pl.original_collection, pl.status, pl.health_status,
      loc ? locationPath(loc) : "", pl.date_acquired, pl.acquisition_source_type, pl.acquisition_source_name,
      pl.native_range, pl.hardy_to, (pl.light_conditions || []).join("; "), pl.water_needs, pl.notes,
    ].map(csvEscape).join(",");
  });
  const csv = [headers.join(","), ...rows].join("\r\n");
  downloadFile(`adcock-plants-${new Date().toISOString().slice(0, 10)}.csv`, csv, "text/csv");
  toast("CSV downloaded");
}

async function handleImportBackup() {
  const fileInput = document.getElementById("import-backup-file");
  const file = fileInput?.files?.[0];
  if (!file) { toast("Choose a backup file first", true); return; }
  if (!confirm("Import this backup? Existing records with matching IDs will be updated, not duplicated.")) return;

  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.locations || !data.plants) throw new Error("This doesn't look like a valid backup file.");

    toast("Importing — this may take a moment…");

    // Locations: two passes to satisfy self-referencing parent_location_id
    // (a child can't be inserted before its parent exists yet).
    if (data.locations?.length) {
      await restUpsert("locations", data.locations.map((l) => ({ ...l, parent_location_id: null })));
      await restUpsert("locations", data.locations);
    }
    // Plants: strip primary_photo_id first since photos don't exist yet
    if (data.plants?.length) {
      await restUpsert("plants", data.plants.map((p) => ({ ...p, primary_photo_id: null })));
    }
    if (data.photos?.length) {
      await restUpsert("photos", data.photos);
    }
    // Plants pass 2: now that photos exist, restore primary_photo_id
    if (data.plants?.length) {
      await restUpsert("plants", data.plants);
    }
    if (data.identifications?.length) await restUpsert("identifications", data.identifications);
    if (data.photo_plants?.length) await restUpsert("photo_plants", data.photo_plants);
    if (data.plant_locations?.length) await restUpsert("plant_locations", data.plant_locations);
    if (data.photo_locations?.length) await restUpsert("photo_locations", data.photo_locations);
    if (data.accession_counters?.length) await restUpsert("accession_counters", data.accession_counters, "year");

    toast("Backup imported successfully");
    fileInput.value = "";
    await loadAll();
  } catch (e) {
    toast(`Import failed: ${e.message}`, true);
  }
}

async function login(email, password) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: state.configKey, "Content-Type": "application/json" },

  const data = await res.json();
  if (!res.ok || !data.access_token) throw new Error(data.error_description || data.msg || "Login failed");
  return data;
}

function driveErrorMessage(status, fallback) {
  if (status === 401) return "Google Drive needs to reconnect — go to Settings and tap Reconnect.";
  return fallback;
}

// Reads the JPEG's embedded EXIF DateTimeOriginal, when present, so photos
// batch-uploaded from a phone/camera keep their real capture date instead
// of showing whenever they happened to be uploaded to this app.
function extractExifDate(file) {
  return new Promise((resolve) => {
    if (!file.type || (!file.type.includes("jpeg") && !file.type.includes("jpg"))) { resolve(null); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const view = new DataView(e.target.result);
        if (view.getUint16(0, false) !== 0xffd8) { resolve(null); return; }
        let offset = 2;
        while (offset < view.byteLength - 1) {
          const marker = view.getUint16(offset, false);
          offset += 2;
          if (marker === 0xffe1) {
            offset += 2; // segment length, unused
            if (view.getUint32(offset, false) !== 0x45786966) { resolve(null); return; } // "Exif"
            offset += 6;
            const tiffOffset = offset;
            const little = view.getUint16(offset, false) === 0x4949;
            offset += 4; // byte-order + magic number
            const firstIFDOffset = view.getUint32(offset, little);
            offset = tiffOffset + firstIFDOffset;
            const numEntries = view.getUint16(offset, little);
            offset += 2;
            let exifIFDOffset = null;
            for (let i = 0; i < numEntries; i++) {
              const entryOffset = offset + i * 12;
              if (view.getUint16(entryOffset, little) === 0x8769) {
                exifIFDOffset = view.getUint32(entryOffset + 8, little);
              }
            }
            if (exifIFDOffset !== null) {
              let exifOffset = tiffOffset + exifIFDOffset;
              const exifEntries = view.getUint16(exifOffset, little);
              exifOffset += 2;
              for (let i = 0; i < exifEntries; i++) {
                const entryOffset = exifOffset + i * 12;
                const tag = view.getUint16(entryOffset, little);
                if (tag === 0x9003 || tag === 0x0132) { // DateTimeOriginal / DateTime
                  const strOffset = tiffOffset + view.getUint32(entryOffset + 8, little);
                  let str = "";
                  for (let j = 0; j < 19; j++) {
                    const code = view.getUint8(strOffset + j);
                    if (!code) break;
                    str += String.fromCharCode(code);
                  }
                  const m = str.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                  if (m) { resolve(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`); return; }
                }
              }
            }
            resolve(null);
            return;
          } else if ((marker & 0xff00) !== 0xff00) {
            break;
          } else {
            offset += view.getUint16(offset, false);
          }
        }
        resolve(null);
      } catch (err) {
        resolve(null);
      }
    };
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 131072)); // EXIF lives near the start of the file
  });
}

async function uploadPhoto(file, plantId, locationId, notes) {
  const takenAt = await extractExifDate(file);
  const fd = new FormData();
  fd.append("photo", file);
  if (plantId) fd.append("plant_id", plantId);
  if (locationId) fd.append("location_id", locationId);
  if (notes) fd.append("notes", notes);
  if (takenAt) fd.append("taken_at", takenAt);
  const res = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/upload-photo`, {
    method: "POST",
    headers: { apikey: state.configKey, Authorization: `Bearer ${state.session.access_token}` },
    body: fd,
  });
  const data = await res.json();
  if (!res.ok || !data.success) throw new Error(driveErrorMessage(res.status, data.error || "Upload failed"));
  return data.photo;
}

async function startDriveConnect() {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/drive-oauth-start`, {
    method: "POST",
    headers: apiHeaders(),
  });
  const data = await res.json();
  if (!data.url) throw new Error("Could not start Google Drive connection");
  window.location.href = data.url;
}

// Fetches a photo through the get-photo proxy (Drive files are private —
// this is the only way to actually display one) and caches the result as
// a blob URL so it's only fetched once per session, not on every re-render.
// Batches re-renders triggered by photo loads completing — without this,
// dozens of thumbnails finishing within milliseconds of each other each
// trigger a full-page rebuild, causing visible flicker at any real scale.
let renderDebounceTimer = null;
function debouncedRender() {
  if (renderDebounceTimer) return;
  renderDebounceTimer = setTimeout(() => {
    renderDebounceTimer = null;
    render();
  }, 150);
}

function ensurePhotoLoaded(driveFileId) {
  if (!driveFileId) return;
  if (state.photoUrlCache[driveFileId] || state.photoFetchInFlight.has(driveFileId)) return;
  state.photoFetchInFlight.add(driveFileId);

  fetch(`${CONFIG.SUPABASE_URL}/functions/v1/get-photo?id=${encodeURIComponent(driveFileId)}`, {
    headers: apiHeaders(),
  })
    .then((res) => (res.ok ? res.blob() : Promise.reject(new Error("Failed to load photo"))))
    .then((blob) => {
      state.photoUrlCache[driveFileId] = URL.createObjectURL(blob);
      state.photoFetchInFlight.delete(driveFileId);
      debouncedRender();
    })
    .catch(() => {
      state.photoFetchInFlight.delete(driveFileId);
      // Fails silently in the UI (placeholder icon just stays) — a toast
      // per-thumbnail would be noisy if Drive is briefly unreachable.
    });
}

async function loadAll() {
  await ensureFreshSession();
  if (!state.session) { render(); return; }
  state.loading = true;
  render();
  try {
    const [photos, plants, locations, tokens, photoPlants, identifications, plantLocations, photoLocations] = await Promise.all([
      restGet("photos", "?select=*&order=uploaded_at.desc"),
      restGet("plants", "?select=*&order=accession_number.asc"),
      restGet("locations", "?select=*&order=sort_order.asc,name.asc"),
      restGet("google_auth_tokens", "?select=expires_at&limit=1"),
      restGet("photo_plants", "?select=*"),
      restGet("identifications", "?select=*&order=created_at.desc"),
      restGet("plant_locations", "?select=*"),
      restGet("photo_locations", "?select=*"),
    ]);
    state.photos = photos;
    state.plants = plants;
    state.locations = locations;
    state.driveToken = tokens[0] || null;
    state.photoPlants = photoPlants;
    state.identifications = identifications;
    state.plantLocations = plantLocations;
    state.photoLocations = photoLocations;
  } catch (e) {
    toast(e.message, true);
  }
  state.loading = false;
  render();
}

/* ============================================================
   DOMAIN HELPERS — display names, location hierarchy
   ============================================================ */
function plantDisplayName(pl) {
  if (pl.botanical_name) return pl.botanical_name;
  if (pl.common_name) return pl.common_name;
  return "Unidentified Plant";
}

function locationById(id) {
  return state.locations.find((l) => l.id === id);
}
function pendingIdentification(photoId) {
  return state.identifications.find((i) => i.photo_id === photoId && i.status === "pending");
}
function pendingIdentifications(photoId) {
  return state.identifications.filter((i) => i.photo_id === photoId && i.status === "pending");
}
// Every location a plant occupies: its primary location_id, plus any
// additional ones from plant_locations. Primary is always first.
function allLocationsForPlant(pl) {
  const ids = [];
  if (pl.location_id) ids.push(pl.location_id);
  state.plantLocations.filter((pll) => pll.plant_id === pl.id).forEach((pll) => {
    if (!ids.includes(pll.location_id)) ids.push(pll.location_id);
  });
  return ids.map((id) => locationById(id)).filter(Boolean);
}
function additionalLocationRows(plantId) {
  return state.plantLocations.filter((pll) => pll.plant_id === plantId);
}
function additionalLocationRowsForPhoto(photoId) {
  return state.photoLocations.filter((pl) => pl.photo_id === photoId);
}
function allLocationsForPhoto(photo) {
  const ids = [];
  if (photo.location_id) ids.push(photo.location_id);
  additionalLocationRowsForPhoto(photo.id).forEach((pl) => {
    if (!ids.includes(pl.location_id)) ids.push(pl.location_id);
  });
  return ids.map((id) => locationById(id)).filter(Boolean);
}
// Locations that already appear in this plant's photo timeline but aren't
// yet in plant_locations — surfaced as one-tap suggestions so locations
// don't have to be found and re-added manually from the full picker.
function suggestedLocationsForPlant(pl) {
  const existingIds = allLocationsForPlant(pl).map((l) => l.id);
  const photos = state.photos.filter((p) => p.plant_id === pl.id);
  const seen = new Map();
  photos.forEach((p) => {
    allLocationsForPhoto(p).forEach((l) => {
      if (!existingIds.includes(l.id)) seen.set(l.id, l);
    });
  });
  return Array.from(seen.values());
}
// Groups a list of photos by the location(s) they're tagged to, for
// rendering separate per-location sub-timelines on the plant detail view.
function groupPhotosByLocation(photosList) {
  const groups = new Map();
  photosList.forEach((p) => {
    const locs = allLocationsForPhoto(p);
    const keys = locs.length ? locs : [null];
    keys.forEach((l) => {
      const key = l ? l.id : "none";
      if (!groups.has(key)) groups.set(key, { location: l, photos: [] });
      groups.get(key).photos.push(p);
    });
  });
  return Array.from(groups.values()).sort((a, b) => {
    if (!a.location) return 1;
    if (!b.location) return -1;
    return a.location.name.localeCompare(b.location.name);
  });
}
// Every plant present at a location, whether as primary or additional
function plantsAtLocation(locationId) {
  const primaryIds = state.plants.filter((p) => p.location_id === locationId).map((p) => p.id);
  const additionalIds = state.plantLocations.filter((pll) => pll.location_id === locationId).map((pll) => pll.plant_id);
  const allIds = new Set([...primaryIds, ...additionalIds]);
  return state.plants.filter((p) => allIds.has(p.id));
}
function directChildLocations(locationId) {
  return state.locations.filter((l) => l.parent_location_id === locationId).sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || a.name.localeCompare(b.name));
}
// Photos primarily attached to this location, plus any tagged onto it via photo_locations
function photosAtLocation(locationId) {
  const primary = state.photos.filter((p) => p.location_id === locationId);
  const taggedIds = state.photoLocations.filter((pl) => pl.location_id === locationId).map((pl) => pl.photo_id);
  const tagged = state.photos.filter((p) => taggedIds.includes(p.id) && p.location_id !== locationId);
  return [...primary, ...tagged];
}
function descendantLocationIds(locationId) {
  const direct = directChildLocations(locationId).map((l) => l.id);
  return direct.concat(direct.flatMap((id) => descendantLocationIds(id)));
}
// Plant count including everything nested underneath this location
function aggregatePlantCount(locationId) {
  const idSet = new Set([locationId, ...descendantLocationIds(locationId)]);
  const primaryIds = state.plants.filter((p) => idSet.has(p.location_id)).map((p) => p.id);
  const additionalIds = state.plantLocations.filter((pll) => idSet.has(pll.location_id)).map((pll) => pll.plant_id);
  return new Set([...primaryIds, ...additionalIds]).size;
}
function aggregatePhotoCount(locationId) {
  const idSet = new Set([locationId, ...descendantLocationIds(locationId)]);
  let total = 0;
  idSet.forEach((id) => { total += photosAtLocation(id).length; });
  return total;
}

function locationPath(loc) {
  if (!loc) return "";
  const parts = [loc.name];
  let cur = loc;
  let guard = 0;
  while (cur.parent_location_id && guard < 10) {
    const parent = locationById(cur.parent_location_id);
    if (!parent) break;
    parts.unshift(parent.name);
    cur = parent;
    guard++;
  }
  return parts.join(" > ");
}

// Flat, depth-aware list for building <select> options that show hierarchy via indentation
function locationOptionList() {
  const byParent = {};
  state.locations.forEach((l) => {
    const key = l.parent_location_id || "root";
    (byParent[key] = byParent[key] || []).push(l);
  });
  const sortFn = (a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || a.name.localeCompare(b.name);
  const out = [];
  function walk(parentKey, depth) {
    const kids = (byParent[parentKey] || []).sort(sortFn);
    kids.forEach((l) => {
      out.push({ id: l.id, label: "  ".repeat(depth) + (depth > 0 ? "— " : "") + l.name, depth });
      walk(l.id, depth + 1);
    });
  }
  walk("root", 0);
  return out;
}

/* ============================================================
   ROUTER / NAV
   ============================================================ */
function goTab(tab) { state.tab = tab; state.modal = null; render(); }
function toggleInboxSelectMode() {
  state.inboxSelectMode = !state.inboxSelectMode;
  state.inboxSelected = new Set();
  render();
}
function toggleInboxPhotoSelected(photoId) {
  if (state.inboxSelected.has(photoId)) state.inboxSelected.delete(photoId);
  else state.inboxSelected.add(photoId);
  render();
}
async function bulkDeletePhotos() {
  const ids = Array.from(state.inboxSelected);
  if (!confirm(`Delete ${ids.length} photo${ids.length === 1 ? "" : "s"}? Files stay in Google Drive.`)) return;
  for (const id of ids) {
    try {
      await restPatch("plants", `primary_photo_id=eq.${id}`, { primary_photo_id: null });
      await restDelete("photo_plants", `photo_id=eq.${id}`);
      await restDelete("photos", `id=eq.${id}`);
    } catch (e) { toast(`Failed to delete one photo: ${e.message}`, true); }
  }
  toast(`${ids.length} photo${ids.length === 1 ? "" : "s"} deleted`);
  state.inboxSelectMode = false;
  state.inboxSelected = new Set();
  await loadAll();
}
async function bulkAttachToPlant(plantId) {
  const ids = Array.from(state.inboxSelected);
  for (const id of ids) {
    try { await restPatch("photos", `id=eq.${id}`, { plant_id: plantId }); }
    catch (e) { toast(`Failed on one photo: ${e.message}`, true); }
  }
  toast(`${ids.length} photo${ids.length === 1 ? "" : "s"} attached`);
  closeModal();
  state.inboxSelectMode = false;
  state.inboxSelected = new Set();
  await loadAll();
}
async function bulkAttachToLocation(locationId) {
  if (!locationId) { toast("Choose a location first", true); return; }
  const ids = Array.from(state.inboxSelected);
  for (const id of ids) {
    try { await restPatch("photos", `id=eq.${id}`, { location_id: locationId }); }
    catch (e) { toast(`Failed on one photo: ${e.message}`, true); }
  }
  toast(`${ids.length} photo${ids.length === 1 ? "" : "s"} attached to container`);
  closeModal();
  state.inboxSelectMode = false;
  state.inboxSelected = new Set();
  await loadAll();
}
function openModal(type, data = {}) { state.modal = { type, data }; render(); }
function closeModal() { state.modal = null; render(); }
function openPlant(id) { state.tab = "plantDetail"; state.currentPlantId = id; render(); }
function openLocation(id) { state.tab = "locationDetail"; state.currentLocationId = id; render(); }

function plantPhotosOrdered(plantId) {
  return state.photos.filter((p) => p.plant_id === plantId).sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
}
function plantCoverPhoto(pl) {
  const photos = plantPhotosOrdered(pl.id);
  if (pl.primary_photo_id) {
    const primary = photos.find((p) => p.id === pl.primary_photo_id);
    if (primary) return primary;
  }
  return photos[0] || null;
}
function openLightbox(contextId, photoId, mode = "plant") {
  state.lightbox = { mode, plantId: contextId, locationId: contextId, photoId };
  render();
}
function openInboxLightbox(photoId) {
  state.lightbox = { mode: "inbox", photoId };
  render();
}
function openGalleryLightbox(photoId) {
  state.lightbox = { mode: "gallery", photoId };
  render();
}
function prepareLightboxResume() {
  if (!state.lightbox || state.lightbox.mode !== "inbox") return;
  const list = lightboxPhotoList();
  state.lightboxResumeIndex = list.findIndex((p) => p.id === state.lightbox.photoId);
  state.lightboxResumePending = true;
}
function maybeResumeLightbox() {
  if (!state.lightboxResumePending) return;
  state.lightboxResumePending = false;
  const freshList = state.photos.filter((p) => !p.plant_id && !p.location_id && p.photo_type !== "historical").sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
  if (freshList.length > 0) {
    const idx = Math.min(state.lightboxResumeIndex, freshList.length - 1);
    const next = freshList[idx];
    state.lightbox = { mode: "inbox", photoId: next.id };
    if (!state.photoUrlCache[next.drive_file_id]) ensurePhotoLoaded(next.drive_file_id);
    render();
  }
}
function closeLightbox() {
  state.lightbox = null;
  render();
}
function lightboxPhotoList() {
  if (state.lightbox.mode === "inbox") {
    return state.photos.filter((p) => !p.plant_id && !p.location_id && p.photo_type !== "historical").sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
  }
  if (state.lightbox.mode === "gallery") {
    return filteredGalleryPhotos();
  }
  if (state.lightbox.mode === "location") {
    return photosAtLocation(state.lightbox.locationId).sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
  }
  return plantPhotosOrdered(state.lightbox.plantId);
}
function lightboxStep(delta) {
  const list = lightboxPhotoList();
  const idx = list.findIndex((p) => p.id === state.lightbox.photoId);
  const next = list[(idx + delta + list.length) % list.length];
  if (next) {
    state.lightbox.photoId = next.id;
    if (!state.photoUrlCache[next.drive_file_id]) ensurePhotoLoaded(next.drive_file_id);
    render();
  }
}
async function setLocationPhoto(locationId, photoId) {
  try {
    await restPatch("locations", `id=eq.${locationId}`, { primary_photo_id: photoId });
    toast("Main photo updated");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}
async function setPrimaryPhoto(plantId, photoId) {
  try {
    await restPatch("plants", `id=eq.${plantId}`, { primary_photo_id: photoId, updated_at: new Date().toISOString() });
    toast("Profile picture updated");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}
