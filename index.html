           than reimplemented — one definition of what "selected" means. */""}
      ${state.gallerySelectMode && photos.length ? `
        <div class="row" style="margin-bottom:12px;">
          <button class="btn-ghost" style="font-size:12.5px;" onclick="selectAllGalleryPhotos('location')">
            ${photos.every((p) => state.gallerySelected.has(p.id)) ? "Clear all" : `Select all ${photos.length}`}
          </button>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-accent btn-sm" ${state.gallerySelected.size ? "" : "disabled"} onclick="openModal('galleryBatch')">Edit ${state.gallerySelected.size}</button>
            <button class="btn btn-danger btn-sm icon-btn" ${state.gallerySelected.size ? "" : "disabled"} onclick="bulkDeletePhotos('gallery')">${icon("trash")} ${state.gallerySelected.size}</button>
          </div>
        </div>` : ""}

      ${photos.length === 0 ? `<div class="empty" style="padding:30px 20px;"><div>No photos of this location yet.</div></div>` : !locationHoldsPlants(l) ? `
        ${/* LOCP-3. Feed view. On an Area or an Archive the photos ARE the
             content, not records waiting to be filed. Identify and Ask Claude
             are dropped — there is no plant here to name — and so is "other
             containers": cross-tagging a whole-area view into buckets is noise,
             which is what LOCP-1 said when it left photo_locations unused for
             exactly this case. */""}
        <div class="photo-feed">
          ${photos.map((p) => {
            const claimedBy = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
            const taggedIds = state.photoPlants.filter((pp) => pp.photo_id === p.id).map((pp) => pp.plant_id);
            const shown = [claimedBy, ...taggedIds.map((id) => state.plants.find((x) => x.id === id))].filter(Boolean);
            return `
            <div class="photo-feed-card" style="${state.gallerySelectMode && state.gallerySelected.has(p.id) ? "outline:3px solid var(--moss);" : ""}">
              <div class="photo-feed-media" style="position:relative;" onclick="${state.gallerySelectMode ? `toggleGalleryPhotoSelected('${p.id}')` : `openLightbox('${l.id}','${p.id}','location')`}">
                ${photoImg(p)}
                ${state.gallerySelectMode ? `<div class="select-check ${state.gallerySelected.has(p.id) ? "checked" : ""}" style="top:10px;left:10px;z-index:2;">${state.gallerySelected.has(p.id) ? icon("check") : ""}</div>` : ""}
              </div>
              <div class="photo-feed-body">
                <div class="photo-feed-actions" style="${state.gallerySelectMode ? "display:none;" : ""}">
                  ${photoActionsHtml(p, { mode: "location", locationId: l.id, variant: "card", cls: "icon-only", style: "", iconOnly: true })}
                  ${l.primary_photo_id === p.id ? `<span class="pill pill-orange" style="font-size:9.5px;">Cover</span>` : ""}
                </div>
                ${p.notes
                  ? `<div class="photo-feed-cap">${escapeHtml(p.notes)}</div>`
                  : `<div class="photo-feed-cap subtle" style="cursor:pointer;" onclick="openModal('editPhoto',{photoId:'${p.id}'})">Add a caption…</div>`}
                ${shown.length ? `<div style="font-size:12px;color:var(--blue);margin-top:6px;">Shows ${shown.map((sp) => `<span style="cursor:pointer;" onclick="openPlant('${sp.id}')">${plantDisplayHtml(sp)}</span>`).join(", ")}</div>` : ""}
                <div class="photo-feed-meta">${fmtDate(photoDate(p))}${photoMetaSuffix(p)}</div>
              </div>
            </div>`;
          }).join("")}
        </div>` : `
        <div class="card-grid">
          ${photos.map((p) => {
            const suggestions = pendingIdentifications(p.id);
            const plantnetSuggestion = suggestions.find((s) => s.source === "PlantNet");
            const claudeSuggestion = suggestions.find((s) => s.source === "Claude");
            const isIdentifying = state.identifyingPhotoId === p.id;
            const claimedBy = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
            const taggedIds = state.photoPlants.filter((pp) => pp.photo_id === p.id).map((pp) => pp.plant_id);
            const taggedPlants = taggedIds.map((id) => state.plants.find((x) => x.id === id)).filter(Boolean);
            const suggestionBadge = (sg) => identificationBadge(sg);
            return `
            <div class="tag-card" style="position:relative;${state.gallerySelectMode && state.gallerySelected.has(p.id) ? "outline:3px solid var(--moss);" : ""}"
                 onclick="${state.gallerySelectMode ? `toggleGalleryPhotoSelected('${p.id}')` : ""}">
              ${state.gallerySelectMode ? `<div class="select-check ${state.gallerySelected.has(p.id) ? "checked" : ""}" style="top:8px;right:8px;z-index:2;">${state.gallerySelected.has(p.id) ? icon("check") : ""}</div>` : ""}
              <div class="photo-row">
                <div class="photo-icon on-cream" style="cursor:pointer;" onclick="${state.gallerySelectMode ? `toggleGalleryPhotoSelected('${p.id}')` : `openLightbox('${l.id}','${p.id}','location')`}">${photoImg(p, "border-radius:6px;")}</div>
                <div style="flex:1;min-width:0;">
                  <div class="tag-id">${fmtDate(photoDate(p))}${photoMetaSuffix(p)}</div>
                  <div style="font-size:13.5px;color:var(--ink-soft);margin-top:2px;">${p.notes ? escapeHtml(p.notes) : "No notes"}</div>
                  ${claimedBy || taggedPlants.length ? `<div style="font-size:11.5px;color:var(--moss-dim);margin-top:4px;">Identified: ${[claimedBy, ...taggedPlants].filter(Boolean).map((tp) => escapeHtml(plantDisplayName(tp))).join(", ")}</div>` : ""}
                  ${(() => {
                    const otherLocs = allLocationsForPhoto(p).filter((loc) => loc.id !== l.id);
                    return otherLocs.length ? `<div style="font-size:11.5px;color:var(--blue);margin-top:2px;">Also in: ${otherLocs.map((loc) => escapeHtml(loc.name)).join(", ")}</div>` : "";
                  })()}
                  ${plantnetSuggestion ? suggestionBadge(plantnetSuggestion) : ""}
                  ${claudeSuggestion ? suggestionBadge(claudeSuggestion) : ""}
                  ${suggestionBlock(p.id, true)}
                </div>
              </div>
              ${/* LOCP-2. Was six same-weight buttons whose labels did not say
                   what they did — two of them the same verb at different
                   scopes. Now: one primary action, then the same compact ghost
                   row the specimen timeline uses, so a photo offers the same
                   vocabulary wherever it is seen. */""}
              ${locationHoldsPlants(l) && !state.gallerySelectMode ? `
                <div style="margin-top:10px;">
                  <button class="btn btn-accent btn-sm" onclick="openModal('newPlantFromPhoto',{photoId:'${p.id}', locationId:'${l.id}'})">New plant from this photo</button>
                </div>` : ""}
              <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;${state.gallerySelectMode ? "display:none;" : ""}">
                ${photoActionsHtml(p, { mode: "location", locationId: l.id, variant: "card" })}
                <button class="btn-ghost icon-btn" style="padding:0;font-size:12px;color:var(--terracotta);" onclick="event.stopPropagation();removePhotoFromLocation('${p.id}','${l.id}')">${icon("link")} ${p.location_id === l.id ? "Unfile" : "Remove tag"}</button>
                <button class="btn-ghost" style="padding:0;color:var(--terracotta);" title="Delete this photo" onclick="deletePhoto('${p.id}')">${icon("trash")}</button>
              </div>
            </div>`;
          }).join("")}
        </div>`}
    </div>
  </div>`;
}

function findDuplicatePlantGroups() {
  const groups = {};
  state.plants.forEach((pl) => {
    // Keyed on the taxon now: two specimens of the same kind in one place are
    // the duplicate worth flagging, and that is exactly what taxa_id says.
    const nameKey = (pl.taxa_id || plantDisplayName(pl)).toString().trim().toLowerCase();
    if (!nameKey) return;
    const key = `${pl.location_id || "none"}|${nameKey}`;
    (groups[key] = groups[key] || []).push(pl);
  });
  return Object.values(groups).filter((g) => g.length > 1);
}

// Reports is a list of gaps, each drilled into rather than all expanded at
// once. The previous version rendered every list inline, so the screen was a
// wall of cards and the counts — the actual signal — were buried in it.
// Two photos sharing an exact capture second are almost certainly the same
// shot filed twice — the same frame cannot be taken twice. This is the only
// signal available: no file hash or size is stored, and drive_file_id is
// unique per upload, so a re-upload of the same image looks entirely new.
//
// The case this catches in practice is importing from Google Photos something
// already uploaded from the phone. Both carry the same createTime/EXIF date.
function findDuplicatePhotoGroups() {
  const byTime = new Map();
  state.photos.forEach((p) => {
    if (!p.taken_at) return; // upload dates collide constantly and mean nothing
    const key = new Date(p.taken_at).toISOString();
    if (!byTime.has(key)) byTime.set(key, []);
    byTime.get(key).push(p);
  });
  return Array.from(byTime.values())
    .filter((g) => g.length > 1)
    .sort((a, b) => new Date(photoDate(b[0])) - new Date(photoDate(a[0])));
}

function reportSections() {
  // Was a local re-implementation counting only photos.plant_id — the direct
  // attachment — while every thumbnail in the same list came from
  // plantPhotosOrdered(), which also counts photo_plants tags. So a plant whose
  // only photos were tags showed a picture and was reported as having none.
  // A tagged photo does show the plant; that is the whole point of tagging.
  return [
    { key: "emptyLocations", title: "Empty locations", sub: "No plants, no photos, nothing below",
      items: state.locations.filter((l) => directChildLocations(l.id).length === 0 && photosAtLocation(l.id).length === 0 && plantsAtLocation(l.id).length === 0),
      kind: "location" },
    { key: "plantsNoPhotos", title: "Plants missing photos", sub: "At least one photo needed",
      items: state.plants.filter((pl) => plantPhotosOrdered(pl.id).length === 0), kind: "plant" },
    { key: "plantsUnidentified", title: "Plants missing identification", sub: "Needs a name or confirmation",
      items: state.plants.filter((pl) => pl.identification_status === "unidentified"), kind: "plant" },
    { key: "frostTender", title: "Frost tender — bring in", sub: "Species marked not frost hardy",
      // Sorted by location path, not by name: on a cold night this is a route
      // through the garden, not an index.
      items: state.plants
        .filter((pl) => pl.status === "active" && plantIsFrostTender(pl))
        .sort((a, b) => {
          const la = a.location_id ? locationPath(locationById(a.location_id)) : "";
          const lb = b.location_id ? locationPath(locationById(b.location_id)) : "";
          return la.localeCompare(lb) || (a.accession_number || "").localeCompare(b.accession_number || "");
        }),
      kind: "plant" },
    // WATER-2. Interval comes from app_settings and is shortened by heat /
    // lengthened by rain (see effectiveWateringInterval). Never-watered sorts
    // to the top: unknown is not the same as freshly watered.
    { key: "needsWater", title: "Needs watering", sub: `Nothing recorded in ${effectiveWateringInterval()} days`,
      items: plantsNeedingWater(), kind: "plant" },
    // LOC-9. Finds the rest of what the New location form's unticked checkbox
    // did. Reviewable, not auto-corrected — a container genuinely used as a
    // staging shelf is a legitimate false.
    { key: "mistypedLocations", title: "Containers that hold no plants", sub: "Type says container, flag says no",
      items: locationsMistypedForPlants(), kind: "location" },
    { key: "plantsNoTaxon", title: "Specimens with no species", sub: "Not linked to a species record",
      items: state.plants.filter((pl) => !pl.taxa_id), kind: "plant" },
    { key: "plantsStaging", title: "Waiting to be planted", sub: "In a staging area, not yet in the ground",
      items: plantsAwaitingPlanting(), kind: "plant" },
    { key: "plantsNoLocation", title: "Plants with no location", sub: "Nowhere to find them",
      items: state.plants.filter((pl) => allLocationsForPlant(pl).length === 0), kind: "plant" },
    // PD-4: this filter is the third site that branches on the exact health
    // values, and the backlog only listed two. Missing it here would have been
    // the worst of the three — an urgent plant absent from the work queue.
    // Urgent sorts to the top; the tier is pointless if it queues behind Watch.
    // TODO-2. "Make a task" was the escape hatch for a count that cannot be
    // cleared — but the plant stayed in the queue, so the count did not move
    // and the escape hatch escaped nothing. A record with an open task about it
    // is being handled: it leaves the queue and lives in Tasks instead.
    //
    // Self-correcting rather than a dismissal: complete or delete the task and,
    // if the plant is still unwell, it comes straight back.
    { key: "plantsAttention", title: "Plants needing attention", sub: "Urgent care, watch or recovery",
      items: state.plants
        .filter((pl) => HEALTH_ATTENTION.includes(pl.health_status))
        .filter((pl) => !openTasksForSubject("plant", pl.id).length)
        // TODO-3. `next_check_date` used to speak only to the check-in queue,
        // so completing a task about an unwell plant put it straight back into
        // "needs attention" with no way to say when to look again. One date,
        // one meaning: "look at this plant on this day" silences both queues
        // until the day arrives.
        .filter((pl) => !(pl.next_check_date && pl.next_check_date > todayISO()))
        .sort((a, b) => (isUrgent(b) ? 1 : 0) - (isUrgent(a) ? 1 : 0)
          || (a.accession_number || "").localeCompare(b.accession_number || "")), kind: "plant" },
    // RPT-3. Two reasons a specimen wants a look, in one list: a scheduled
    // next_check_date that has arrived, or nothing photographed for longer
    // than the interval (14 days by default, adjustable in Settings).
    { key: "checkIns", title: "Due for a check-in", sub: `Scheduled, or nothing photographed in ${checkInIntervalDays()} days`,
      items: plantsNeedingCheckIn().map((x) => x.pl)
        .filter((pl) => !openTasksForSubject("plant", pl.id).length), kind: "plant" },
    { key: "locationsNoPlants", title: "Locations not catalogued", sub: "Photographed, but no specimens recorded",
      // Areas and archives are excluded: they are not expected to hold
      // specimens, so listing them here is not a finding.
      items: state.locations.filter((l) => locationHoldsPlants(l) && photosAtLocation(l.id).length > 0 && plantsAtLocation(l.id).length === 0), kind: "location" },
  ];
}

// TASK-1. Tasks are shown as rows, not as a counted tile like everything else
// in the queue. A tile answers "how many"; a task's whole value is its text —
// "bucket 11, centre is rotted, see what is salvageable" is the point, and
// hiding it behind a count would make her click to remember what she meant.
function taskRow(t, compact) {
  const subs = subjectsOfTask(t.id);
  const overdue = taskIsOverdue(t);
  const done = t.status === "done";
  return `
    <div class="task-row ${done ? "is-done" : ""}">
      <button class="task-check ${done ? "is-done" : ""}" title="${done ? "Reopen" : "Mark done"}"
        onclick="event.stopPropagation();toggleTaskDone('${t.id}')">${done ? icon("check") : ""}</button>
      <div style="flex:1;min-width:0;" onclick="openModal('editTask',{taskId:'${t.id}'})">
        <div class="task-title">${escapeHtml(t.title)}</div>
        ${t.detail && !compact ? `<div class="task-detail">${escapeHtml(t.detail)}</div>` : ""}
        ${t.due_date ? `<div class="task-due ${overdue ? "is-overdue" : ""}">${overdue ? "Due " : "Due "}${fmtDate(t.due_date)}${overdue ? " — overdue" : ""}</div>` : ""}
        ${subs.length ? `<div class="task-subjects">${subs.map((ts) => `
          <button class="task-subject"${ts.plant_id ? ` data-plant-card="${ts.plant_id}"` : ""} onclick="event.stopPropagation();openSubjectFromTask('${ts.id}')">${subjectIcon(ts)} ${escapeHtml(subjectLabel(ts))}</button>`).join("")}</div>` : ""}
      </div>
    </div>`;
}

// The same card on Plant, Location and Taxon detail. Standing at bucket 11,
// the note about the rotted centre is the thing she needs to see.
function taskSectionFor(kind, id) {
  const open = sortTasks(openTasksForSubject(kind, id));
  const doneCount = tasksForSubject(kind, id).length - open.length;
  const subj = `{kind:'${kind}',id:'${id}'}`;
  return `
    <div class="section-card">
      <div class="row" style="margin-bottom:${open.length ? "10px" : "0"};">
        <h4 style="margin:0;">Tasks</h4>
        <button class="btn-ghost icon-btn" style="padding:0;font-size:12px;" onclick="openModal('newTask',{subject:${subj}})">${icon("plus")} New</button>
      </div>
      ${open.length
        ? `<div class="stack">${open.map((t) => taskRow(t, true)).join("")}</div>`
        : `<p class="subtle" style="margin:6px 0 0;font-size:12.5px;">No open tasks${doneCount ? ` — ${countLabel(doneCount, "done", "done")}` : ""}.</p>`}
    </div>`;
}

// RPT-3, on the specimen itself.
function checkInSectionFor(pl) {
  const st = checkInStatus(pl);
  if (!st) return "";
  // Not due is not news. One line, no box, no icon — it says how fresh the
  // record is without competing with the plant for attention.
  if (!st.due) {
    return `<div class="checkin-quiet">${escapeHtml(st.label)}${st.reason === "scheduled" ? " · scheduled" : ""}</div>`;
  }
  return `
    <div class="checkin-bar">
      ${icon("alertTriangle")}
      <span class="checkin-text">Due for a check-in — ${escapeHtml(st.label)}${st.reason === "scheduled" ? " (scheduled)" : ""}</span>
      <button class="btn btn-secondary btn-sm" onclick="clearCheckIn('${pl.id}')">Checked it</button>
      <button class="btn-ghost" style="padding:0;font-size:12px;" onclick="snoozeCheckIn('${pl.id}', 14)">Remind in 14d</button>
    </div>`;
}

function taskGroup() {
  const open = sortTasks(actionableTasks());
  const later = scheduledTasks().length;
  const shown = open.slice(0, 4);
  return `
    <div class="queue-group">
      <div class="queue-head">
        <h3>Tasks</h3>
        <button class="btn btn-secondary btn-sm" onclick="openModal('newTask')">+ New task</button>
      </div>
      ${open.length === 0
        ? `<p class="subtle" style="margin:0;font-size:12.5px;">${later
            ? `Nothing due this week. ${countLabel(later, "task is", "tasks are")} scheduled for later.`
            : "Nothing on the list. A task can hang off any number of buckets, plants or species &mdash; useful for &ldquo;pull these eleven and re-evaluate&rdquo;."}</p>`
        : `<div class="stack">${shown.map((t) => taskRow(t, true)).join("")}</div>`}
      ${/* TODO-3. ALWAYS rendered. This is the only route into the task screen in
           the whole app, and it used to hide itself whenever there were four or
           fewer open tasks with nothing later and nothing done — which left task
           management with no entry point at all. The horizon added in v2.8.1
           made that state much easier to reach, since the actionable count is
           now the small one.

           Opens on "All" deliberately: the button says all tasks, so it should
           not land on a filtered view. The tabs are there to narrow from. */""}
      <button class="btn-ghost" style="padding:8px 0 0;font-size:12.5px;"
        onclick="state.taskFilter='all';state.reportView='tasks';render()">
        All tasks${openTasks().length ? ` (${openTasks().length} open${later ? `, ${later} later` : ""})` : ""} &rarr;
      </button>
    </div>`;
}

// The work queue. Was the body of the Reports tab; it is the Inbox now, because
// every row in it is something to do and the Inbox is where she already goes to
// do things. Reports as a separate destination was a place to look at work
// rather than a place to work.
function workQueue() {
  const sections = reportSections();
  const duplicateGroups = findDuplicatePlantGroups();
  // Photo gaps route to the Gallery rather than an inline list — it already has
  // the grid and the lightbox. A photo in none of plant, location or Inbox is
  // invisible everywhere else, which is what happens to archive-marked photos.
  // Mutually exclusive, so the three add up to the number of photos that are
  // not fully filed and each can be worked through without re-covering the
  // others. They previously overlapped, counting the same photos three times.
  const photoBuckets = [
    /* TODO-4. Named for the ACTION, not the gap. "Needs a location" (photos)
       sat two rows above "Plants with no location" (plants) and read as the
       same job at a glance — this group describes photographs and the group
       below describes records, but nothing in a tile said which. The three are
       still mutually exclusive and still sum to the group total. */
    { title: "File to a plant", sub: "Photo at a container or bed, not filed to a specimen", needs: "no_plant",
      count: state.photos.filter(photoAwaitsPlant).length },
    { title: "File to a location", sub: "Photo attached to a plant, nowhere on the map", needs: "no_location",
      count: state.photos.filter((p) => p.plant_id && !p.location_id).length },
    { title: "File to both", sub: "Photo with no plant and no location", needs: "neither",
      count: state.photos.filter((p) => !p.plant_id && !p.location_id).length },
    // Not a gap — an opportunity. These are the archive and whole-area shots
    // that CAN be tagged to a specimen to extend its history, but are not
    // wrong for lacking one.
    /* "Could show a specimen" was a tile here until v2.8.0. At ~2,100 photos it
       was never a job anyone could finish, and an uncompletable count on a To Do
       page is the same failure TODO-1 set out to fix: a number you can look at
       and not act on stops being read. The Gallery filter it pointed at still
       works — showGalleryNeeds('area_no_plant') — it is just not presented as
       outstanding work. */
  ];

  const dupPhotos = findDuplicatePhotoGroups();
  const dupExtras = dupPhotos.reduce((n, g) => n + g.length - 1, 0);

  // Everything that can be worked, as one vocabulary of tiles. `urgent` is for
  // the two that are about a plant's survival rather than a record's tidiness.
  // A zero is not a job. Showing it greyed out made the page a list of
  // categories rather than a list of work, and an empty To Do should read as
  // "nothing to do" rather than "nine things at zero".
  const tile = (n, title, sub, onclick, urgent) => !n ? "" : `
    <button class="queue-tile ${urgent ? "is-urgent" : ""}" onclick="${onclick}">
      <div class="queue-num">${n}</div>
      <div class="queue-title">${title}</div>
      <div class="queue-sub">${sub}</div>
    </button>`;

  const group = (title, total, tiles) => tiles.filter(Boolean).length ? `
    <div class="queue-group">
      <div class="queue-head">
        <h3>${title}</h3>
        ${total == null ? "" : `<span class="queue-total">${total}</span>`}
      </div>
      <div class="queue-grid">${tiles.filter(Boolean).join("")}</div>
    </div>` : "";

  const byKey = (k) => sections.find((x) => x.key === k);
  const sect = (k, urgent) => {
    const x = byKey(k);
    return x ? tile(x.items.length, x.title, x.sub, `state.reportView='${x.key}';render()`, urgent) : "";
  };

  const due = expectedToBloom();
  const toClose = bloomsToClose();
  const photoTotal = photoBuckets.filter((b) => !b.muted).reduce((n, b) => n + b.count, 0);
  const photoSugs = new Set(state.suggestions.filter((x) => x.photo_id).map((x) => x.photo_id));
  const taxaSugs = new Set(state.suggestions.filter((x) => x.taxa_id).map((x) => x.taxa_id));
  const missingParts = taxaMissingNameParts().length;
  const incompleteProfiles = taxaIncompleteProfiles().length;

  /* TODO-1. Six groups became three. "Species names" was a records job filed
     on its own; Claude's suggestions are something waiting on her, which is
     what "Needs you now" means; and Bloom was two status readouts rather than
     work. Grouped by WHEN she acts, not by which table the row came from. */
  const queue = `
    ${group("Needs you now", null, [
      sect("frostTender", true),
      sect("plantsAttention", true),
      sect("needsWater"),
      sect("checkIns", true),
      sect("plantsStaging"),
      photoSugs.size ? tile(photoSugs.size, "Photos Claude answered", "Filing it proposed — accept or dismiss", "showGalleryHasSuggestions()") : "",
      taxaSugs.size ? tile(taxaSugs.size, "Species Claude answered", "Blank fields it filled in", "showTaxaWithSuggestions()") : "",
      tile(due.length, "Should be blooming", "In season, nothing recorded — go and look", "state.reportView='dueToBloom';render()"),
      tile(toClose.length, "Blooms still open", "Recorded a while ago — still flowering?", "state.reportView='closeBlooms';render()"),
    ])}

    ${group("Photos to file", photoTotal, photoBuckets.map((b) =>
      tile(b.count, b.title, b.sub,
        // The two with a knowable answer get the grouped filing screen; the
        // rest still go to the Gallery, where browsing is the point.
        b.needs === "no_plant" ? "state.reportView='fileByLocation';render()"
        : b.needs === "no_location" ? "state.reportView='fileByPlant';render()"
        : `showGalleryNeeds('${b.needs}')`)))}

    ${group("Records to finish", null, [
      tile(missingParts, "Names not split up", "Free text only — cannot group with relatives", "showTaxaMissingParts()"),
      tile(incompleteProfiles, "Species profiles unfinished", "Blank fields Claude can fill", "showTaxaIncomplete()"),
      sect("plantsNoPhotos"),
      sect("plantsUnidentified"),
      sect("plantsNoTaxon"),
      sect("plantsNoLocation"),
      sect("locationsNoPlants"),
      sect("mistypedLocations"),
      sect("emptyLocations"),
      tile(dupPhotos.length, "Duplicate photos", `Same capture time — ${countLabel(dupExtras, "extra copy", "extra copies")}`, "openModal('duplicatePhotos')"),
      tile(duplicateGroups.length, "Duplicate plants", "Same species, same location", "openModal('duplicatePlants')"),
      // "In bloom now" used to sit here. It is not a record to finish — nor work
      // of any kind. It is a status, and To Do is for things that need doing,
      // which was the principle of the whole rebuild. The Gallery's In Bloom row
      // is where you look at what is flowering, and "Blooms still open" above
      // already carries the actionable half.
    ])}`;

  const nothing = !queue.trim();

  return `
    <div class="todo-split">
      <div class="todo-queue">
        ${nothing ? `
          <div class="empty" style="padding:44px 20px;">
            <div class="display">Nothing outstanding</div>
            <div>Every photo is filed, every record is complete, and nothing needs a look.</div>
          </div>` : queue}
      </div>
      <div class="todo-tasks">${taskGroup()}</div>
    </div>`;
}

// The drilled-in list for one queue row. Renders in place of the Inbox rather
// than on its own tab, so "back" means back to the queue.
function workQueueDetail() {
  const sections = reportSections();
  const bloomViews = {
    dueToBloom: { title: "Should be blooming", sub: "In season with nothing recorded — go and look", items: expectedToBloom(), kind: "plant" },
    closeBlooms: { title: "Blooms still open", sub: "Recorded a while ago — still flowering?", items: bloomsToClose().map((x) => x.pl), kind: "plant" },
  };
  // The full task list is its own view: tasks render as rows, not as the
  // photo-thumbnail record cards every other queue view uses.
  if (state.reportView === "tasks") {
    const f = state.taskFilter || "open";
    const list = sortTasks(
      f === "open" ? actionableTasks()
      : f === "later" ? scheduledTasks()
      : f === "done" ? state.tasks.filter((t) => t.status === "done")
      : state.tasks);
    const btn = (k, label) => `<button class="btn btn-sm ${f === k ? "btn-primary" : "btn-secondary"}" onclick="state.taskFilter='${k}';render()">${label}</button>`;
    return `
      <div class="screen">
        <div class="container">
          <button class="back-link" onclick="state.reportView=null;render()">${icon("back")}<span class="back-label">To Do</span></button>
          <div class="row" style="margin-bottom:6px;">
            <h2 class="display" style="font-size:22px;font-weight:500;margin:0;">Tasks</h2>
            <button class="btn btn-secondary btn-sm" onclick="openModal('newTask')">+ New task</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px;">${btn("open", `Due now${actionableTasks().length ? ` (${actionableTasks().length})` : ""}`)}${btn("later", `Later${scheduledTasks().length ? ` (${scheduledTasks().length})` : ""}`)}${btn("done", "Done")}${btn("all", "All")}</div>
          ${list.length === 0
            ? `<div class="empty"><div class="display">Nothing here</div><div>${
                f === "done" ? "No tasks completed yet."
                : f === "later" ? "Nothing scheduled beyond the next week."
                : `No tasks due in the next ${TASK_HORIZON_DAYS} days.`}</div></div>`
            : `<div class="stack">${list.map((t) => taskRow(t, false)).join("")}</div>`}
        </div>
      </div>`;
  }

  /* FILE-1. Two filing screens that group by the thing that answers the
     question, rather than listing photographs and asking it repeatedly. */
  if (state.reportView === "fileByLocation" || state.reportView === "fileByPlant") {
    const byLoc = state.reportView === "fileByLocation";
    const groups = byLoc ? photosNeedingPlantByLocation() : photosNeedingLocationByPlant();
    const total = groups.reduce((n, g) => n + g.photos.length, 0);
    const confident = groups.filter((g) => byLoc ? g.only : g.location).reduce((n, g) => n + g.photos.length, 0);
    const strip = (photos) => `<div class="file-strip">${photos.slice(0, 8).map((p) =>
      `<div class="file-thumb" onclick="openGalleryLightbox('${p.id}')">${photoImg(p)}</div>`).join("")}${
      photos.length > 8 ? `<div class="file-more">+${photos.length - 8}</div>` : ""}</div>`;

    return `
      <div class="screen">
        <div class="container">
          <button class="back-link" onclick="state.reportView=null;render()">${icon("back")}<span class="back-label">To Do</span></button>
          ${screenHeader(byLoc ? "Photos needing a plant" : "Photos needing a location",
            `${countLabel(total, "photo", "photos")} across ${countLabel(groups.length, byLoc ? "location" : "plant", byLoc ? "locations" : "plants")}${confident ? ` · <strong>${confident}</strong> can be filed in one tap` : ""}`)}
          ${groups.length === 0 ? `<div class="empty"><div class="display">Nothing to file</div><div>Every photo has one.</div></div>` : `
          <div class="stack">
            ${groups.map((g) => {
              const ids = g.photos.map((p) => p.id);
              const idList = JSON.stringify(ids).replace(/"/g, "&quot;");
              if (byLoc) {
                return `
                <div class="tag-card file-group">
                  <div class="row">
                    <div style="min-width:0;">
                      <div class="tag-id">${g.location ? escapeHtml(locationPath(g.location)) : "No location"}</div>
                      <div style="font-size:13px;color:var(--ink-soft);margin-top:2px;">${countLabel(g.photos.length, "photo needs", "photos need")} a plant</div>
                    </div>
                    <button class="btn-ghost" style="font-size:12px;flex-shrink:0;" onclick="openLocation('${g.location ? g.location.id : ""}')">Open</button>
                  </div>
                  ${strip(g.photos)}
                  ${g.only ? `
                    <div class="file-suggest">
                      <div style="flex:1;min-width:0;">
                        <div class="filter-note-head">The only plant here</div>
                        <div style="font-size:13.5px;margin-top:2px;" data-plant-card="${g.only.id}" onclick="openPlant('${g.only.id}')">${plantDisplayHtml(g.only)} <span class="mono subtle">${g.only.accession_number}</span></div>
                      </div>
                      <button class="btn btn-accent btn-sm" onclick="fileGroupToPlant(${idList}, '${g.only.id}')">File all ${g.photos.length}</button>
                    </div>`
                  : g.candidates.length ? `
                    <div class="file-suggest is-choice">
                      <div style="flex:1;min-width:0;">
                        <div class="filter-note-head">${countLabel(g.candidates.length, "plant is", "plants are")} here — pick one</div>
                        <div class="file-choices">${g.candidates.map((c) => `
                          <button class="row-act" data-plant-card="${c.id}" onclick="fileGroupToPlant(${idList}, '${c.id}')">${escapeHtml(plantPickerName(c).primary)} · ${c.accession_number}</button>`).join("")}</div>
                      </div>
                    </div>`
                  : `
                    <div class="file-suggest is-choice">
                      <div style="flex:1;min-width:0;">
                        <div class="filter-note-head">No plants recorded here</div>
                        <div class="subtle" style="font-size:12.5px;margin-top:2px;">Add the specimen that lives here and these photos have somewhere to go.</div>
                      </div>
                      <button class="btn btn-secondary btn-sm" onclick="openModal('newSpecimenHere',{locationId:'${g.location ? g.location.id : ""}'})">Add a specimen</button>
                    </div>`}
                </div>`;
              }
              return `
              <div class="tag-card file-group">
                <div class="row">
                  <div style="min-width:0;">
                    <div class="tag-id">${g.plant.accession_number}</div>
                    <div style="font-size:14px;margin-top:2px;" data-plant-card="${g.plant.id}">${plantDisplayHtml(g.plant)}</div>
                    <div style="font-size:12.5px;color:var(--ink-soft);">${countLabel(g.photos.length, "photo needs", "photos need")} a location</div>
                  </div>
                  <button class="btn-ghost" style="font-size:12px;flex-shrink:0;" onclick="openPlant('${g.plant.id}')">Open</button>
                </div>
                ${strip(g.photos)}
                ${g.location ? `
                  <div class="file-suggest">
                    <div style="flex:1;min-width:0;">
                      <div class="filter-note-head">Where this plant lives</div>
                      <div style="font-size:13.5px;margin-top:2px;">${escapeHtml(locationPath(g.location))}</div>
                    </div>
                    <button class="btn btn-accent btn-sm" onclick="fileGroupToLocation(${idList}, '${g.location.id}')">File all ${g.photos.length}</button>
                  </div>`
                : `
                  <div class="file-suggest is-choice">
                    <div style="flex:1;min-width:0;">
                      <div class="filter-note-head">This plant has no location either</div>
                      <div class="subtle" style="font-size:12.5px;margin-top:2px;">Give the specimen a home and its photos follow.</div>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="openModal('movePlant',{plantId:'${g.plant.id}'})">Set a location</button>
                  </div>`}
              </div>`;
            }).join("")}
          </div>`}
        </div>
      </div>`;
  }

  const open = state.reportView
    ? (sections.find((x) => x.key === state.reportView) || bloomViews[state.reportView] || null)
    : null;
  if (!open) return "";
  const renderItem = open.kind === "location" ? reportLocationItem : reportPlantItem;
  return `
    <div class="screen">
      <div class="container">
        <button class="back-link" onclick="state.reportView=null;render()">${icon("back")}<span class="back-label">To Do</span></button>
        <h2 class="display" style="font-size:22px;font-weight:500;margin:0 0 2px;">${open.title}</h2>
        <p class="subtle" style="margin-bottom:16px;">${open.sub} · ${countLabel(open.items.length, "record", "records")}</p>
        ${/* TODO-2. Twenty-four plants that are not going to flower is not a list
             worth walking one row at a time. One button turns the whole view
             into dated tasks and empties it. */""}
        ${state.reportView === "dueToBloom" && open.items.length ? `
          <button class="btn btn-secondary btn-sm" style="margin-bottom:16px;"
            onclick="deferBloomNudge(${escapeAttr(JSON.stringify(open.items.map((x) => x.id)))})">
            Not this year &mdash; make ${countLabel(open.items.length, "task", "tasks")}
          </button>` : ""}
        ${/* A record with an open task drops out of the count above. Say so, or
             it looks like the app lost track of it. */""}
        ${(() => {
          if (open.kind !== "plant") return "";
          const handled = state.plants.filter((pl) => openTasksForSubject("plant", pl.id).length
            && !open.items.some((x) => x.id === pl.id)
            && (open.key === "plantsAttention" ? HEALTH_ATTENTION.includes(pl.health_status)
              : open.key === "checkIns" ? !!(checkInStatus(pl) || {}).due
              : false)).length
            // dueToBloom suppresses on the narrower rule — a FUTURE-dated task
            // only — so it counts separately rather than sharing the branch above.
            + (state.reportView === "dueToBloom" ? bloomsDeferredCount() : 0)
            + (state.reportView === "plantsStaging" ? stagingDeferredCount() : 0);
          return handled ? `
            <div class="filter-note" style="margin-bottom:14px;">
              <span class="filter-note-head">${countLabel(handled, "more has a task", "more have tasks")}</span>
              <p class="subtle" style="margin:6px 0 0;font-size:12.5px;">Not counted here because you have already planned what to do. They are in <strong>Tasks</strong>, and they come back if the task is completed or deleted while the plant still needs looking at.</p>
            </div>` : "";
        })()}
        ${open.items.length === 0
          ? `<div class="empty"><div class="display">Nothing here</div><div>Everything in this category is either in good shape or has a task.</div></div>`
          : `<div class="card-grid">${open.items.map(renderItem).join("")}</div>`}
      </div>
    </div>`;
}

// The collection at a glance. Moved off the retired Reports tab onto the
// Gallery, which is the one tab about looking rather than doing.
function collectionStats() {
  return `
      <div class="tag-card" style="padding:0;overflow:hidden;margin-bottom:18px;">
        <div class="stat-row">
          ${[
            [icon("leaf"), state.taxa.length, "Species"],
            [icon("seedling"), state.plants.length, "Specimens"],
            [icon("pin"), state.locations.length, "Locations"],
            [icon("camera"), state.photos.length, "Photos"],
          ].map(([ic, val, label]) => `
            <div class="stat-cell">
              ${ic}
              <div class="stat-num">${val}</div>
              <div class="stat-label">${label}</div>
            </div>`).join("")}
        </div>
      </div>`;
}


// Opening a record from a report navigates away from Reports entirely, and the
// tab resets to the top on return. Remember the origin so the detail screen can
// offer a way back to the exact list.
// A task subject can be any of the three kinds, and tapping it should land on
// that record with a way back to the task list.
function openSubjectFromTask(subjectId) {
  const ts = state.taskSubjects.find((x) => x.id === subjectId);
  if (!ts) return;
  closeModal();
  openSubject(ts);
}

function openFromReport(kind, id, reportKey) {
  // The snapshot inside openPlant/openLocation already captures the queue view
  // it is being called from, so this no longer needs its own bookkeeping.
  if (kind === "plant") openPlant(id); else openLocation(id);
}
function reportLocationItem(l) {
  const cover = locationCoverPhoto(l);
  return `
    <div class="tag-card plant-list-card" style="padding:10px 14px;" onclick="openFromReport('location','${l.id}','${state.reportView || ""}')">
      <div class="plant-list-thumb" style="width:60px;height:60px;">
        ${cover ? photoImg(cover) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
      </div>
      <div style="flex:1;min-width:0;">
        <div class="tag-id">${locationTypeLabel(l.type)}</div>
        <div style="font-family:'Fraunces',serif;font-size:14.5px;font-weight:500;">${escapeHtml(l.name)}</div>
        <div style="font-size:11.5px;color:var(--ink-soft);">${escapeHtml(locationPath(l))}</div>
      </div>
    </div>`;
}

/* TODO-1. The queue was a list you could only navigate: six plants needing
   attention showed a red 6 you could look at and not act on, and a count that
   cannot be cleared stops being read. Each row now carries the actions that
   would resolve IT — which differ per view, because "needs attention" and
   "should be blooming" are cleared by different things.

   Every view also offers "Make a task", so a row can be dealt with honestly
   even when the answer is "not today". */
function reportRowActions(pl) {
  const v = state.reportView;
  const btn = (label, onclick) =>
    `<button class="row-act" onclick="event.stopPropagation();${onclick}">${escapeHtml(label)}</button>`;
  const out = [];
  const open = state.bloomEvents.find((x) => x.plant_id === pl.id && !x.ended_on);

  if (v === "plantsAttention" && pl.health_status !== "healthy") out.push(btn("Healthy again", `setPlantHealth('${pl.id}','healthy')`));
  if (v === "plantsAttention") {
    out.push(btn("To hospital", `moveToHospital('${pl.id}')`));
    out.push(btn("Check again…", `openModal('recheck',{plantIds:['${pl.id}']})`));
  }
  if (v === "checkIns") {
    out.push(btn("Checked it", `clearCheckIn('${pl.id}')`));
    out.push(btn("Remind me in 14d", `snoozeCheckIn('${pl.id}', 14)`));
  }
  if (v === "dueToBloom") {
    out.push(btn("Record a bloom", `startBloom('${pl.id}')`));
    out.push(btn("Not this year", `deferBloomNudge('${pl.id}')`));
  }
  if (v === "closeBlooms" && open) out.push(btn("It has finished", `endBloom('${open.id}')`));
  if (v === "needsWater") out.push(btn("Water it", `openWaterModal('plant','${pl.id}')`));
  if (v === "plantsNoLocation" || v === "frostTender") out.push(btn(v === "frostTender" ? "Move it in" : "Set a location", `openModal('movePlant',{plantId:'${pl.id}'})`));
  // The one action that resolves a staging row: put it where it is going.
  // Moving it out of staging is what clears it — there is no flag to unset.
  if (v === "plantsStaging") out.push(btn("Plant it — move", `openModal('movePlant',{plantId:'${pl.id}'})`));

  out.push(btn("Make a task", `openModal('newTask',{subject:{kind:'plant',id:'${pl.id}'}})`));
  return out.join("");
}

function filteredGalleryPhotos() {
  const f = state.galleryFilters;
  const q = (f.search || "").toLowerCase();
  // An album is a location subtree; a highlight is a taxon plant_type. Both
  // resolve to a photo id set once rather than per-photo.
  const albumIds = f.album ? new Set(photosInLocationTree(f.album).map((p) => p.id)) : null;
  let highlightIds = null;
  let inBloomIds = null;
  if (f.inBloom) {
    const ids = new Set(bloomingSpecimens().map((p) => p.id));
    const photoIds = new Set(state.photos.filter((p) => p.plant_id && ids.has(p.plant_id)).map((p) => p.id));
    inBloomIds = photoIds;
  }
  if (f.highlight) {
    const taxonType = new Map(state.taxa.map((t) => [t.id, t.plant_type]));
    const plantIds = new Set(state.plants.filter((p) => taxonType.get(p.taxa_id) === f.highlight).map((p) => p.id));
    highlightIds = new Set(state.photos.filter((p) => p.plant_id && plantIds.has(p.plant_id)).map((p) => p.id));
  }
  return state.photos.filter((p) => {
    if (albumIds && !albumIds.has(p.id)) return false;
    // RPT-2 buckets, deliberately mutually exclusive. They used to overlap —
    // "no plant" and "no location" each swallowed everything in "neither", so
    // the same 793 photos were counted three times and the numbers could not
    // be added up or worked through without repeating them.
    //
    // Each bucket now describes what is missing given what is already there:
    //   no_plant        — at a location that HOLDS plants, needs one
    //   area_no_plant   — at an area or archive, where no plant is expected
    //   no_location     — attached to a plant, needs a location
    //   neither         — has nothing
    if (f.needs === "no_plant" && !photoAwaitsPlant(p)) return false;
    if (f.needs === "area_no_plant" && !photoIsUntaggedArchiveOrArea(p)) return false;
    if (f.needs === "has_suggestions" && !suggestionsForPhoto(p.id).length) return false;
    if (f.needs === "no_location" && !(p.plant_id && !p.location_id)) return false;
    if (f.needs === "neither" && (p.plant_id || p.location_id)) return false;
    if (highlightIds && !highlightIds.has(p.id)) return false;
    if (inBloomIds && !inBloomIds.has(p.id)) return false;
    if (f.favorites && !p.is_favorite) return false;
    if (f.photoType && (p.photo_type || "general") !== f.photoType) return false;
    if (f.locationId) {
      const photoLocIds = allLocationsForPhoto(p).map((l) => l.id);
      const plant = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
      const plantLocIds = plant ? allLocationsForPlant(plant).map((l) => l.id) : [];
      if (!photoLocIds.includes(f.locationId) && !plantLocIds.includes(f.locationId)) return false;
    }
    if (q) {
      const plant = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
      const hay = [p.notes, plant ? plantSearchText(plant) : "", ...allLocationsForPhoto(p).map((l) => l.name)].filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
}

// ============================================================
// GALLERY (GAL-1..4). Every row is a query over data that already exists —
// no curation tables. Albums and archives are locations carrying a
// `gallery_row`; highlights are taxon plant_type groupings.
// ============================================================

// Everything in a location's subtree, deduped: a photo tagged onto both a
// parent and a child is still one photo.
function photosInLocationTree(locationId) {
  const ids = new Set([locationId, ...descendantLocationIds(locationId)]);
  const seen = new Set();
  const out = [];
  ids.forEach((id) => {
    photosAtLocation(id).forEach((p) => { if (!seen.has(p.id)) { seen.add(p.id); out.push(p); } });
  });
  return out.sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
}

function galleryLocationRows(row) {
  return state.locations
    .filter((l) => (l.gallery_row || "none") === row)
    .map((l) => ({ location: l, photos: photosInLocationTree(l.id) }))
    .filter((g) => g.photos.length)
    .sort((a, b) => b.photos.length - a.photos.length);
}

// A photo belongs to a highlight through its plant's taxon, so the grouping
// follows the taxa split rather than duplicating it. `cactus` genuinely earns
// this — it rolls up eight genera.
function galleryHighlights() {
  const taxonType = new Map(state.taxa.map((t) => [t.id, t.plant_type]));
  const plantType = new Map(state.plants.map((p) => [p.id, taxonType.get(p.taxa_id)]));
  const groups = new Map();
  state.photos.forEach((p) => {
    if (!p.plant_id) return;
    const type = plantType.get(p.plant_id);
    if (!type) return;
    if (!groups.has(type)) groups.set(type, []);
    groups.get(type).push(p);
  });
  const labels = listOptionsFor("plant_type");
  return Array.from(groups.entries())
    .map(([type, photos]) => ({
      type,
      label: labels[type] || type,
      photos: photos.sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a))),
    }))
    .sort((a, b) => b.photos.length - a.photos.length);
}

function galleryRecentlyAdded(limit) {
  return state.photos.slice()
    .sort((a, b) => new Date(b.uploaded_at || 0) - new Date(a.uploaded_at || 0))
    .slice(0, limit || 20);
}

// Taken in the last 30 days, by real capture date where EXIF gave us one.
function galleryRecentlyPhotographed(limit) {
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  return state.photos
    .filter((p) => new Date(photoDate(p)).getTime() >= cutoff)
    .sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)))
    .slice(0, limit || 20);
}

function archivePeriod(l) {
  const year = (d) => (d ? String(d).slice(0, 4) : "");
  const from = year(l.active_from), to = year(l.active_to);
  const span = from && to ? (from === to ? from : `${from}–${to}`) : (from || to || "");
  return [span, l.locality].filter(Boolean).join(" · ");
}

function screenGallery() {
  const f = state.galleryFilters;
  const activeFilterCount = [f.locationId, f.photoType].filter(Boolean).length;
  const searching = !!(f.search || activeFilterCount || f.album || f.highlight || f.needs || f.inBloom || f.favorites);
  const NEEDS_LABELS = { no_plant: "Filed to a container or bed, needs a plant", no_location: "Attached to a plant, needs a location", neither: "Needs a plant and a location", has_suggestions: "Photos Claude has suggestions for", area_no_plant: "Archive and area photos, not yet tagged to a plant" };
  const matches = filteredGalleryPhotos();

  const tile = (p) => `
    <button class="gal-tile" onclick="openGalleryLightbox('${p.id}')">
      <div class="card-media ratio-1x1">${photoImg(p)}</div>
      <div class="gal-tile-cap">${fmtDate(photoDate(p))}</div>
    </button>`;

  const scroller = (title, items, seeAll) => !items.length ? "" : `
    <div class="gal-row">
      <div class="gal-row-head">
        <h3>${title}</h3>
        ${seeAll ? `<button class="btn-ghost" style="padding:0;font-size:12.5px;color:var(--orange);" onclick="${seeAll}">See all →</button>` : ""}
      </div>
      <div class="gal-scroll-wrap"><div class="gal-scroll">${items.join("")}</div></div>
    </div>`;

  // Compact rows fit roughly five times more on screen, which is the difference
  // between browsing and hunting once a filter returns hundreds.
  const listRows = (photos) => `
    <div class="stack">
      ${photos.map((p) => {
        const plant = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
        const locs = allLocationsForPhoto(p);
        return `
        <div class="tag-card" style="padding:8px 12px;position:relative;${state.gallerySelectMode && state.gallerySelected.has(p.id) ? "outline:3px solid var(--moss);" : ""}"
             onclick="${state.gallerySelectMode ? `toggleGalleryPhotoSelected('${p.id}')` : `openGalleryLightbox('${p.id}')`}">
          ${state.gallerySelectMode ? `<div class="select-check ${state.gallerySelected.has(p.id) ? "checked" : ""}" style="top:6px;left:6px;z-index:2;">${state.gallerySelected.has(p.id) ? icon("check") : ""}</div>` : ""}
          <div style="display:flex;gap:14px;align-items:flex-start;">
            <div class="plant-list-thumb" style="width:52px;height:52px;">${photoImg(p)}</div>
            <div style="flex:1;min-width:0;">
              <div class="tag-id">${fmtDate(photoDate(p))}${photoMetaSuffix(p)}</div>
              ${plant ? `<div style="font-size:13px;margin-top:1px;">${plantDisplayHtml(plant)}</div>` : ""}
              ${locs.length ? `<div style="font-size:11px;color:var(--moss-dim);margin-top:1px;">📍 ${escapeHtml(locs[0].name)}</div>` : `<div class="value-blank" style="font-size:11px;margin-top:1px;">No location</div>`}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0;">
              ${photoActionsHtml(p, { mode: "gallery", plantId: plant ? plant.id : null, variant: "card", iconOnly: true })}
            </div>
          </div>
          ${/* The Gallery rendered suggestions NOWHERE — and "Needs a plant"
               and "Photos with suggestions" both route here, so Ask Claude
               answered onto a screen that could not show the answer. */""}
          ${identificationBadges(p.id)}
          <div onclick="event.stopPropagation();">${suggestionBlock(p.id, true)}</div>
        </div>`;
      }).join("")}
    </div>`;

  // Working the "Needs a plant" bucket means looking at a photo and asking what
  // it is. Pl@ntNet only — Ask Claude is a per-photo cost and belongs where the
  // decision is deliberate, not on every tile in a 317-photo grid.
  // Working "Needs a plant" often ends in "this is a plant I have not recorded
  // yet" — which is a species AND a specimen. newPlantFromPhoto creates both
  // and attaches the photo, so the answer is one tap from the tile that raised
  // the question rather than a trip through the Plants tab.
  //
  // The photo's own location is offered as the default only when that location
  // actually holds plants: pre-filling an Area or an Archive would record a
  // specimen living in a former home.
  const grid = (photos) => `
    <div class="card-grid">
      ${photos.map((p) => {
        const plant = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
        const locs = allLocationsForPhoto(p);
        return `
        <div class="tag-card" style="padding:0;overflow:hidden;cursor:pointer;position:relative;${state.gallerySelectMode && state.gallerySelected.has(p.id) ? "outline:3px solid var(--moss);" : ""}"
             onclick="${state.gallerySelectMode ? `toggleGalleryPhotoSelected('${p.id}')` : `openGalleryLightbox('${p.id}')`}">
          ${state.gallerySelectMode ? `<div class="select-check ${state.gallerySelected.has(p.id) ? "checked" : ""}" style="top:8px;left:8px;z-index:2;">${state.gallerySelected.has(p.id) ? icon("check") : ""}</div>` : ""}
          <div class="card-media ratio-1x1">${photoImg(p)}</div>
          <div style="padding:10px 12px;">
            <div class="row">
              <div class="tag-id">${fmtDate(photoDate(p))}${photoMetaSuffix(p)}</div>
              <div style="display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0;">
                ${photoActionsHtml(p, { mode: "gallery", plantId: plant ? plant.id : null, variant: "card", iconOnly: true })}
              </div>
            </div>
            ${plant ? `<div style="font-size:12.5px;margin-top:2px;">${plantDisplayHtml(plant)}</div>` : ""}
            ${locs.length ? `<div style="font-size:11px;color:var(--moss-dim);margin-top:1px;">📍 ${escapeHtml(locs[0].name)}${locs.length > 1 ? ` +${locs.length - 1}` : ""}</div>` : ""}
            ${identificationBadges(p.id)}
            <div onclick="event.stopPropagation();">${suggestionBlock(p.id, true)}</div>
          </div>
        </div>`;
      }).join("")}
    </div>`;

  const bulkBar = state.gallerySelectMode && state.gallerySelected.size ? `
    <div class="bulk-action-bar">
      <div class="container" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="mono" style="font-size:12.5px;color:var(--cream);">${state.gallerySelected.size} selected</span>
        <button class="btn btn-accent btn-sm" onclick="openModal('galleryBatch')">Edit</button>
        <button class="btn btn-secondary btn-sm" onclick="openModal('bulkAttachPlant')">Attach to plant</button>
        <button class="btn btn-secondary btn-sm" onclick="openModal('bulkAttachLocation')">Add location</button>
        <button class="btn btn-secondary btn-sm icon-btn" onclick="askClaudeAboutSelection()">${icon("claude")} Ask Claude</button>
        <button class="btn btn-danger btn-sm icon-btn" onclick="bulkDeletePhotos('gallery')">${icon("trash")} Delete</button>
        <button class="btn-ghost" style="margin-left:auto;font-size:12.5px;" onclick="toggleGallerySelectMode()">Cancel</button>
      </div>
    </div>` : "";

  return `
  <div class="screen">
    <div class="container">
      ${screenHeader("Gallery", `${countLabel(state.photos.length, "photograph", "photographs")} documenting the collection.`)}
      ${searching ? "" : collectionStats()}

      <div class="sticky-controls">
      <input class="search-input" placeholder="Search notes, plant, location…" value="${escapeHtml(f.search || "")}" id="search-gallery" oninput="state.galleryFilters.search=this.value;scheduleRender()" />
      <div class="row" style="margin-bottom:16px;">
        <button class="btn btn-secondary btn-sm" onclick="openModal('galleryFilters')">
          Filters${activeFilterCount ? ` <span class="pill pill-orange" style="margin-left:4px;">${activeFilterCount}</span>` : ""}
        </button>
        <div style="display:flex;align-items:center;gap:10px;">
          ${searching ? `<button class="btn-ghost" style="font-size:12.5px;" onclick="clearGalleryView()">Clear</button>` : ""}
          ${searching ? `<button class="btn btn-secondary btn-sm" onclick="toggleGallerySelectMode()">${state.gallerySelectMode ? "Done" : "Select"}</button>` : ""}
          <button class="btn btn-secondary btn-sm icon-btn" onclick="state.galleryView = state.galleryView === 'list' ? 'grid' : 'list';render()" title="Switch between large photos and compact rows">
            ${state.galleryView === "list" ? icon("photo") + " Large" : icon("clipboard") + " Compact"}
          </button>
        </div>
      </div>
      </div>

      ${searching ? `
        ${/* Opening an album is a drill-in, and every other drill-in in the app
             carries a back button at top left: "← Plants", "← Locations",
             "← To Do". The Gallery had none. The only way out was the "Clear"
             button in the controls row, which reads as "clear the search box",
             not "leave this album" — so an album was a dead end. Same
             affordance, same place, same words as everywhere else. */""}
        <button class="back-link" onclick="clearGalleryView()">${icon("back")}<span class="back-label">Gallery</span></button>
        ${/* A search or a chosen row collapses to one flat result set. */""}
        <div class="row" style="margin-bottom:12px;">
          <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">${f.album ? escapeHtml(locationById(f.album)?.name || "") : f.highlight ? escapeHtml(listOptionsFor("plant_type")[f.highlight] || f.highlight) : f.needs ? NEEDS_LABELS[f.needs] : f.inBloom ? "In bloom now" : f.favorites ? "Favourites" : "Results"}</h3>
          <span class="subtle">${countLabel(matches.length, "photo", "photos")}</span>
        </div>
          ${/* Select all stays inline — it belongs with the result count it
               acts on. The actions move to the fixed bar below, because an
               inline row scrolls out of reach the moment you start selecting,
               which is exactly when you need it. */""}
          ${state.gallerySelectMode ? `
            <div class="row" style="margin-bottom:12px;">
              <button class="btn-ghost" style="font-size:12.5px;" onclick="selectAllGalleryPhotos('gallery')">
                ${matches.length && matches.every((p) => state.gallerySelected.has(p.id)) ? "Clear all" : `Select all ${matches.length}`}
              </button>
              <span class="subtle" style="font-size:12px;">${state.gallerySelected.size} selected</span>
            </div>` : ""}
        ${matches.length === 0
          ? `<div class="empty"><div class="display">No photos match</div><div>Try a different search or filter.</div></div>`
          : state.galleryView === "list" ? listRows(matches) : grid(matches)}`
      : `
        ${(() => {
          const favs = favoritePhotos();
          return favs.length ? scroller("Favourites", favs.slice(0, 20).map(tile), "showGalleryFavorites()") : "";
        })()}

        ${scroller("Recently Added", galleryRecentlyAdded(20).map(tile))}

        ${(() => {
          const albums = galleryLocationRows("albums");
          if (!albums.length) return "";
          return scroller("Garden Albums", albums.map((a) => `
            <button class="gal-card" onclick="showGalleryAlbum('${a.location.id}')">
              <div class="card-media ratio-4x3">${photoImg(a.photos[0])}</div>
              <div class="gal-card-label">
                <div class="gal-card-title">${escapeHtml(a.location.name)}</div>
                <div class="gal-card-meta">${countLabel(a.photos.length, "photo", "photos")}</div>
              </div>
            </button>`));
        })()}

        ${(() => {
          // GAL-5. Derived from bloom_events rather than curated — OPEN-2's
          // answer. Every other row derives, and a hand-kept list would go
          // stale the moment a bloom ended with nothing to prompt a prune.
          const blooming = bloomingSpecimens();
          if (!blooming.length) return "";
          const photos = blooming.flatMap((pl) => {
            const bloomShots = bloomPhotosFor(pl.id);
            // Prefer photos actually tagged as blooms; fall back to the
            // specimen's cover so a plant is never missing from the row.
            return bloomShots.length ? bloomShots.slice(0, 3) : [plantCoverPhoto(pl)].filter(Boolean);
          });
          if (!photos.length) return "";
          return scroller(`In Bloom`, photos.map(tile), "showGalleryInBloom()");
        })()}

        ${(() => {
          const highlights = galleryHighlights();
          if (!highlights.length) return "";
          return scroller("Collection Highlights", highlights.map((h) => `
            <button class="gal-chip" onclick="showGalleryHighlight('${h.type}')">
              <div class="card-media ratio-1x1">${photoImg(h.photos[0])}</div>
              <div class="gal-chip-icon">${icon("leaf")}</div>
              <div class="gal-card-label">
                <div class="gal-card-title" style="font-size:13.5px;">${escapeHtml(h.label)}</div>
                <div class="gal-card-meta">${h.photos.length}</div>
              </div>
            </button>`));
        })()}

        ${(() => {
          const archives = galleryLocationRows("archives");
          if (!archives.length) return "";
          return scroller("From the Archives", archives.map((a) => `
            <button class="gal-card" onclick="showGalleryAlbum('${a.location.id}')">
              <div class="card-media ratio-4x3">${photoImg(a.photos[0])}</div>
              <div class="gal-card-label">
                <div class="gal-card-title">${escapeHtml(a.location.name)}</div>
                <div class="gal-card-meta">${escapeHtml(archivePeriod(a.location))}${archivePeriod(a.location) ? " · " : ""}${countLabel(a.photos.length, "photo", "photos")}</div>
              </div>
            </button>`));
        })()}

        ${(() => {
          const recent = galleryRecentlyPhotographed(20);
          if (!recent.length) return "";
          return `
            ${scroller("Recently Photographed", recent.map(tile))}
            <p class="subtle" style="margin:-20px 0 26px;">Photos taken in the last 30 days.</p>`;
        })()}
      `}
    </div>
  </div>
  ${bulkBar}`;
}

/* HEAD-1. Five list screens, five header shapes: To Do's title lived in the
   global top bar, Plants had no context line and put its counts BELOW the
   controls, Locations had a title and an action but no context, Settings had a
   bare title, and only the Gallery had the full set.

   One order everywhere: title and its actions, then one line of context, then
   the controls. `actions` sits beside the title because those are things you do
   TO the list; filters and search sit under the context because they change
   what the list shows. */
function screenHeader(title, context, actions) {
  return `
    <div class="screen-head">
      <div class="row">
        <h2 class="display screen-title">${title}</h2>
        ${actions ? `<div class="head-actions">${actions}</div>` : ""}
      </div>
      ${context ? `<p class="subtle screen-context">${context}</p>` : ""}
    </div>`;
}

function settingsSection(key, title, sub, body) {
  const open = !!state.settingsOpen[key];
  return `
    <div class="surface set-section ${open ? "is-open" : ""}">
      <button class="set-head" onclick="state.settingsOpen['${key}'] = !state.settingsOpen['${key}'];render()">
        <div style="flex:1;min-width:0;text-align:left;">
          <div style="font-weight:600;font-size:14.5px;">${title}</div>
          ${sub ? `<div class="subtle" style="font-size:12.5px;margin-top:2px;">${sub}</div>` : ""}
        </div>
        <span class="set-chevron">${icon("chevronRight")}</span>
      </button>
      ${open ? `<div class="set-body">${body()}</div>` : ""}
    </div>`;
}

function screenSettings() {
  const connected = !!state.driveToken;
  // Only photos that still lack a capture date AND could get one from Drive.
  const missingDates = state.photos.filter((p) => !p.taken_at && p.drive_file_id).length;
  const b = state.backfill;

  return `
  <div class="screen">
    <div class="container">
      ${screenHeader("Settings", `v${APP_VERSION} · ${APP_UPDATED}`)}

      ${/* Drive stays first because it is the app's one external dependency and
           the only thing here that can break on its own. It used to be first
           because access expired about weekly and she had to keep coming back —
           that stopped being true 2026-08-31 when the app was published to the
           Workspace (GWS-1). Reconnect is now recovery, not routine. */""}
      <div class="surface" style="padding:16px;">
        <div class="row">
          <div class="connect-status">
            <span class="dot-status" style="background:${connected ? "var(--moss)" : "var(--terracotta)"};"></span>
            <div><div style="font-weight:600;font-size:14.5px;">Google Drive</div><div class="subtle">${connected ? "Connected" : "Not connected"}</div></div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="handleConnectDrive()">${connected ? "Reconnect" : "Connect"}</button>
        </div>
        ${connected ? "" : `<p class="subtle" style="margin-top:12px;line-height:1.5;">Photos cannot upload or display until this is connected.</p>`}
        <p class="subtle" style="margin-top:12px;line-height:1.5;">
          ${connected
            ? `Photos live in Google Drive on your Workspace account. This connection <strong>does not expire</strong> &mdash; the weekly reconnect ended when the app was published. Only reconnect if photos or uploads start failing.`
            : `Photos live in Google Drive on your Workspace account. Connecting takes about 10 seconds and does not need repeating &mdash; this connection does not expire.`}
        </p>
      </div>

      <div class="divider"></div>

      ${settingsSection("data", "Your data", "Export a backup, or restore one", () => `
        <p class="subtle" style="margin:0 0 12px;line-height:1.5;">
          The full backup is the only copy of your collection you hold outside Supabase. Take one before any change you cannot undo.
        </p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button class="btn btn-accent btn-sm" onclick="exportFullBackup()">Export full backup (JSON)</button>
          <button class="btn btn-secondary btn-sm" onclick="exportPlantsCsv()">Export plants (CSV)</button>
        </div>
        <div style="margin-top:16px;">
          <label style="margin-top:0;">Restore from a backup</label>
          <input type="file" id="import-backup-file" accept="application/json" style="padding:8px;" />
          <button class="btn btn-secondary btn-sm" style="margin-top:8px;" onclick="handleImportBackup()">Import</button>
          <p class="subtle" style="margin-top:8px;line-height:1.5;">
            Matches existing records by id and updates them rather than duplicating, so it is safe to re-run. It <strong>adds and updates only</strong> &mdash; it never deletes, and it cannot bring back a dropped column. Best for restoring onto an empty or partly empty database, not for merging two datasets that grew separately.
          </p>
        </div>`)}

      ${settingsSection("prefs", "Preferences", "Check-in interval and the dropdown lists", () => `
        ${/* RPT-3. The interval that decides when an unscheduled specimen goes
             stale. A per-plant next_check_date overrides it. */""}
        <div style="font-weight:600;font-size:13.5px;">Check-in interval</div>
        <p class="subtle" style="margin:6px 0 12px;line-height:1.5;">
          A specimen with no check-in date of its own is flagged when nothing has been photographed for this many days. Currently ${countLabel(plantsNeedingCheckIn().length, "plant is", "plants are")} due.
        </p>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="number" id="setting-checkin" min="1" max="365" value="${checkInIntervalDays()}" style="max-width:110px;" />
          <span class="subtle" style="font-size:12.5px;">days</span>
          <button class="btn btn-secondary btn-sm" onclick="saveAppSetting('check_in_interval_days', document.getElementById('setting-checkin').value)">Save</button>
        </div>

        <div class="divider" style="margin:18px 0;"></div>

        ${/* WATER-2. Same shape as the check-in interval above. */""}
        <div style="font-weight:600;font-size:13.5px;">Watering interval</div>
        <p class="subtle" style="margin:6px 0 12px;line-height:1.5;">
          A plant with nothing recorded for this many days is flagged. Currently ${countLabel(plantsNeedingWater().length, "plant is", "plants are")} due${
            effectiveWateringInterval() !== wateringIntervalDays()
              ? `, using <strong>${effectiveWateringInterval()} days</strong> right now because of ${escapeHtml(wateringIntervalReason())}` : ""}.
        </p>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="number" id="setting-waterdays" min="1" max="365" value="${wateringIntervalDays()}" style="max-width:110px;" />
          <span class="subtle" style="font-size:12.5px;">days</span>
          <button class="btn btn-secondary btn-sm" onclick="saveWateringInterval()">Save</button>
        </div>
        <div class="field-help">Heat shortens this automatically; measurable rain pushes it out. The reason is always named where the number is shown.</div>

        <div class="divider" style="margin:18px 0;"></div>

        ${/* WEATHER-1. Coordinates and thresholds live in app_settings, so the
             garden can move without a code change. Defaults are Concord, CA. */""}
        <div style="font-weight:600;font-size:13.5px;">Weather</div>
        <p class="subtle" style="margin:6px 0 12px;line-height:1.5;">
          Drives the frost and heat banners on To Do. Forecast from Open-Meteo, advisories from the National Weather Service &mdash; both free, no account.
          ${state.weather ? `Last updated ${escapeHtml(fmtTime(state.weather.fetchedAt))}.` : `<span style="color:var(--terracotta);">Not loaded yet.</span>`}
        </p>
        <div class="wrap-gap" style="align-items:center;gap:8px;">
          <input type="number" step="0.0001" id="setting-lat" value="${gardenCoords().lat}" style="max-width:120px;" placeholder="latitude" />
          <input type="number" step="0.0001" id="setting-lon" value="${gardenCoords().lon}" style="max-width:120px;" placeholder="longitude" />
          <button class="btn btn-secondary btn-sm" onclick="saveGardenCoords()">Save</button>
        </div>
        <div class="field-help">Latitude and longitude of the garden.</div>
        <div class="wrap-gap" style="align-items:center;gap:8px;margin-top:12px;">
          <label style="font-size:12.5px;">Frost watch</label>
          <input type="number" id="setting-frostwatch" value="${frostWatchF()}" style="max-width:80px;" />
          <label style="font-size:12.5px;">Freeze</label>
          <input type="number" id="setting-frostalert" value="${frostAlertF()}" style="max-width:80px;" />
          <label style="font-size:12.5px;">Heat</label>
          <input type="number" id="setting-heat" value="${heatThresholdF()}" style="max-width:80px;" />
          <button class="btn btn-secondary btn-sm" onclick="saveWeatherThresholds()">Save</button>
        </div>
        <div class="field-help">
          Degrees Fahrenheit. Frost watch defaults to 38&deg;F rather than freezing: reported lows are measured at 2m, and on the still clear nights that actually produce frost, bucket level runs several degrees colder.
        </div>
        <button class="btn-ghost" style="margin-top:10px;font-size:12.5px;" onclick="loadWeather(true)">Refresh weather now</button>

        <div class="divider" style="margin:18px 0;"></div>

        <div style="font-weight:600;font-size:13.5px;">Dropdown lists</div>
        <p class="subtle" style="margin:6px 0 12px;line-height:1.5;">
          The options offered when editing a species. Values are permanent once created &mdash; only the label and the order change &mdash; so nothing already recorded can be orphaned.
        </p>
        ${state.listOptions.length === 0 ? `<p class="subtle" style="margin:0 0 12px;">Using the built-in lists. They become editable once the <span class="mono">list_options</span> table exists.</p>` : ""}
        <div class="stack">
          ${Object.entries(EDITABLE_LISTS).map(([key, label]) => {
            const opts = listOptionsFor(key);
            const retired = state.listOptions.filter((o) => o.list_name === key && o.active === false).length;
            return `
            <button class="action-row" style="border:1px solid var(--line);border-radius:8px;color:var(--cream);" onclick="openModal('editList',{listName:'${key}'})">
              <span class="action-label">${label}<span class="subtle" style="display:block;font-size:11.5px;">${countLabel(Object.keys(opts).length, "option", "options")}${retired ? ` · ${retired} retired` : ""}</span></span>
              <span class="action-chevron">${icon("chevronRight")}</span>
            </button>`;
          }).join("")}
        </div>`)}

      ${/* A finished repair job is not a setting. This was a permanent card
           reading "Every photo has a capture date" — a thing to read past
           forever, explaining a problem that no longer exists. It appears only
           when there is something to repair, or while one is running. */""}
      ${(missingDates > 0 || b) ? `
        <div class="surface" style="padding:16px;">
          <div style="font-weight:600;font-size:14.5px;">Photo capture dates ${b ? "" : `<span class="pill pill-terracotta" style="vertical-align:middle;">${missingDates}</span>`}</div>
          <p class="subtle" style="margin:6px 0 12px;line-height:1.5;">
            ${countLabel(missingDates, "photo shows", "photos show")} the date ${missingDates === 1 ? "it was" : "they were"} uploaded rather than the date the picture was taken, because ${missingDates === 1 ? "it was" : "they were"} added before the app stored capture dates. The original date is still in the file in Drive; this reads it back, which puts ${missingDates === 1 ? "it" : "them"} in the right place on a plant's timeline.
          </p>
          ${b ? `
            <div class="mono" style="font-size:12px;">${b.done} of ${b.total} · ${b.found} dated${b.failed ? ` · ${b.failed} unreadable` : ""}</div>
            <button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="cancelBackfill()">Stop</button>`
          : `<button class="btn btn-secondary btn-sm" onclick="backfillPhotoDates()">Read dates from Drive</button>`}
        </div>
        <div class="divider"></div>` : ""}

      ${settingsSection("account", "Account", state.session?.email || "", () => `
        <button class="btn btn-danger btn-sm" onclick="logout()">Sign out</button>`)}

      ${/* The note that used to live here said sessions are not remembered
           across reloads. They have been since session persistence shipped —
           loadStoredSession() restores one on boot. */""}
      <p class="mono subtle" style="margin-top:24px;opacity:0.5;">v${APP_VERSION} &middot; ${APP_UPDATED}</p>
    </div>
  </div>`;
}

function locationSelectOptions(selectedId) {
  return `<option value="">— None —</option>` + locationOptionList().map((o) =>
    `<option value="${o.id}" ${selectedId === o.id ? "selected" : ""}>${escapeHtml(o.label)}</option>`
  ).join("");
}

function modalContent() {
  if (!state.modal) return "";
  const { type, data } = state.modal;

  if (type === "batchAdd") {
    const q = (state.batchSearch || "").trim().toLowerCase();
    const chosen = new Set(state.batchRows.map((r) => r.taxaId).filter(Boolean));
    const matches = q
      ? state.taxa
          .filter((t) => !chosen.has(t.id))
          .filter((t) => [taxonDisplayName(t), t.common_name, t.genus, t.family, t.working_label]
            .filter(Boolean).join(" ").toLowerCase().includes(q))
          .slice(0, 8)
      : [];
    const exact = q && state.taxa.some((t) => nameKey(taxonDisplayName(t)) === nameKey(q));
    const total = batchTotal();
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Add several plants</h3>
      <p class="subtle" style="margin:0 0 14px;">For a nursery trip or a box of offsets. Record them now, plant and photograph them later &mdash; each one gets its own accession number.</p>

      ${state.batchRows.length ? `
        <div class="section-label">This batch &mdash; ${countLabel(total, "specimen", "specimens")}</div>
        <div class="stack" style="margin-bottom:14px;">
          ${state.batchRows.map((r, i) => {
            const t = r.taxaId ? taxonById(r.taxaId) : null;
            return `
            <div class="batch-row">
              <div style="flex:1;min-width:0;">
                <div style="font-size:13.5px;">${t ? taxonDisplayHtml(t) : escapeHtml(r.newName)}</div>
                <div class="mono tag-id">${t ? "existing species" : "new species — will be created"}</div>
              </div>
              <input type="number" min="1" max="99" value="${r.qty}" class="batch-qty"
                onchange="setBatchQty(${i}, this.value)" title="How many of this one" />
              <button class="btn-ghost icon-btn" style="padding:0;color:var(--terracotta);" title="Remove"
                onclick="removeBatchRow(${i})">${icon("close")}</button>
            </div>`;
          }).join("")}
        </div>` : ""}

      <label>Add a plant</label>
      <input id="ba-search" placeholder="Search your species, or type a new name…"
        value="${escapeHtml(state.batchSearch || "")}" oninput="state.batchSearch=this.value;scheduleRender()" />
      ${q ? `
        <div class="stack" style="margin-top:8px;max-height:30vh;overflow-y:auto;">
          ${matches.map((t) => `
            <button class="task-pick" onclick="addBatchRow('${t.id}')">
              ${icon("leaf")}<span style="flex:1;text-align:left;">${escapeHtml(taxonDisplayName(t))}</span>
            </button>`).join("")}
          ${!exact ? `
            ${/* JSON.stringify emits DOUBLE quotes, which close the onclick
                 attribute — the handler became `addBatchRow(null, ` and the
