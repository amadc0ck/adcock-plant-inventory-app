  }));
  const data = await res.json();
  if (!data.url) throw new Error("Could not start Google Drive connection");
  window.location.href = data.url;
}

// Fetches a photo through the get-photo proxy (Drive files are private —
// this is the only way to actually display one) and caches the result as
// a blob URL so it's only fetched once per session, not on every re-render.
// Batches re-renders triggered by photo loads completing — without this,
// dozens of thumbnails finishing within milliseconds of each other each
// trigger a full-page rebuild, causing visible flicker at any real scale.
let renderDebounceTimer = null;
function debouncedRender() {
  if (renderDebounceTimer) return;
  renderDebounceTimer = setTimeout(() => {
    renderDebounceTimer = null;
    render();
  }, 150);
}

// Emits an <img> that is in the DOM whether or not its blob has arrived, so
// ensurePhotoLoaded() can fill in src on arrival without a re-render (PERF-1).
// Call it only where a photo record actually exists — where there is no photo
// at all, keep rendering the placeholder icon, so "loading" and "none" stay
// visually distinct. `style` preserves each call site's existing look.
// Returns HTML, not text — do not escape at the call site.
// Blob URLs pin their data in memory until revoked, and revoking only happened
// on logout. A browsing session over a large collection therefore accumulated
// every photo it had ever shown — at a few MB each, enough to have a phone tab
// killed. Keeps the most recently loaded and releases the rest.
//
// Evicting one still on screen is harmless: its <img> has already decoded, and
// if it is re-rendered ensurePhotoLoaded simply fetches it again.
/* PERF-2 (2 of 3). 180 blob URLs against 2,664 photos, evicted in pure
   insertion order — so scrolling a gallery threw away images that were still on
   screen, and they were refetched through the Edge Function the moment the row
   re-rendered. That is the other half of the flashing, and it is also why the
   Gallery got slower the further you scrolled.

   Two changes: a larger window, and eviction that skips anything currently
   rendered. An <img> already showing a blob must keep its URL, because revoking
   it blanks a picture the user is looking at. */
const PHOTO_CACHE_LIMIT = 600;
function idsOnScreen() {
  const live = new Set();
  document.querySelectorAll("img[data-drive-id]").forEach((el) => {
    if (el.getAttribute("src")) live.add(el.dataset.driveId);
  });
  return live;
}
function evictPhotoCache() {
  const order = state.photoCacheOrder;
  if (order.length <= PHOTO_CACHE_LIMIT) return;
  const live = idsOnScreen();
  let i = 0;
  // Oldest first, but skip the on-screen ones rather than revoking them. If the
  // whole window is live there is nothing safe to drop, and holding a few extra
  // blobs is better than blanking the page.
  while (order.length > PHOTO_CACHE_LIMIT && i < order.length) {
    const id = order[i];
    if (live.has(id)) { i++; continue; }
    order.splice(i, 1);
    // An id can appear twice if it was re-fetched. Removing one entry must not
    // revoke the blob the other still stands for — that would leave the id in
    // the queue with a dead URL, which is the exact state that made every later
    // arrival fall through to a full re-render.
    if (order.includes(id)) continue;
    const url = state.photoUrlCache[id];
    if (url) {
      try { URL.revokeObjectURL(url); } catch (e) {}
      delete state.photoUrlCache[id];
    }
  }
}

// PHOTO-1. A single focal point drives every crop — square, 4:3, thumbnail —
// because they all show the same subject; per-ratio crops would be four things
// to keep in agreement instead of one. Stored as percentages so it is
// resolution-independent.
//
// Null means top, which is what every crop did before this existed: right for
// an upright specimen, wrong for a wide planting, which is the whole complaint.
function focalStyle(photo) {
  if (!photo || photo.focal_x == null || photo.focal_y == null) return "";
  return `object-position:${photo.focal_x}% ${photo.focal_y}%;`;
}

// Accepts a drive id or a whole photo row. Given the row it can apply the
// focal point, which is why most call sites now pass the object.
function photoImg(photoOrId, style, extra) {
  const isRow = photoOrId && typeof photoOrId === "object";
  const driveFileId = isRow ? photoOrId.drive_file_id : photoOrId;
  if (!driveFileId) return "";
  if (isRow) style = (style || "") + focalStyle(photoOrId);
  const url = state.photoUrlCache[driveFileId];
  // Deliberately does NOT fetch here. It used to, which meant a Gallery filter
  // matching 1000 photos fired 1000 Drive requests through an Edge Function at
  // once — every one of them, on screen or not. observeLazyPhotos() fetches
  // each image as it nears the viewport instead.
  return `<img class="photo-img" data-drive-id="${escapeHtml(driveFileId)}"`
    + `${url ? ` src="${url}"` : ""} style="${style || ""}"${extra ? " " + extra : ""} />`;
}

// Fetches an image only once it is close to being seen. Re-created after every
// render because render() replaces the whole DOM, so the previous observer's
// targets no longer exist.
let photoObserver = null;
function observeLazyPhotos() {
  if (typeof IntersectionObserver === "undefined") {
    // No observer support: fall back to the old behaviour rather than showing
    // blank boxes forever.
    document.querySelectorAll("img[data-drive-id]:not([src])").forEach((el) => ensurePhotoLoaded(el.dataset.driveId));
    return;
  }
  if (photoObserver) photoObserver.disconnect();
  photoObserver = new IntersectionObserver((entries, obs) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      obs.unobserve(entry.target);
      ensurePhotoLoaded(entry.target.dataset.driveId);
    });
  }, { rootMargin: "300px" }); // start a little before it scrolls in
  document.querySelectorAll("img[data-drive-id]:not([src])").forEach((el) => photoObserver.observe(el));
}

// For images that must be there immediately — the lightbox, a detail hero —
// rather than when they scroll into view.
function photoImgEager(photoOrId, style, extra) {
  const id = photoOrId && typeof photoOrId === "object" ? photoOrId.drive_file_id : photoOrId;
  if (id && !state.photoUrlCache[id]) ensurePhotoLoaded(id);
  return photoImg(photoOrId, style, extra);
}

function ensurePhotoLoaded(driveFileId) {
  if (!driveFileId) return;
  if (state.photoUrlCache[driveFileId] || state.photoFetchInFlight.has(driveFileId)) return;
  state.photoFetchInFlight.add(driveFileId);

  authedFetch(`${CONFIG.SUPABASE_URL}/functions/v1/get-photo?id=${encodeURIComponent(driveFileId)}`,
    () => ({ headers: apiHeaders() }))
    .then((res) => (res.ok ? res.blob() : Promise.reject(new Error("Failed to load photo"))))
    .then((blob) => {
      const url = URL.createObjectURL(blob);
      state.photoUrlCache[driveFileId] = url;
      state.photoCacheOrder.push(driveFileId);
      state.photoFetchInFlight.delete(driveFileId);
      evictPhotoCache();
      // Fill the waiting <img> elements directly instead of re-rendering.
      // render() replaces app.innerHTML wholesale, so a re-render here
      // destroyed and recreated every image on screen — already-painted ones
      // included, which then re-decoded. That was the flashing (PERF-1).
      // Compared by dataset rather than an attribute selector so Drive ids
      // never need CSS-selector escaping.
      let patched = 0;
      document.querySelectorAll("img[data-drive-id]").forEach((el) => {
        if (el.dataset.driveId === driveFileId && !el.getAttribute("src")) {
          el.setAttribute("src", url);
          patched++;
        }
      });
      // PERF-2 (3 of 3). Nothing was waiting, so fall back to a re-render —
      // except that fallback was firing constantly on the To Do page and
      // rebuilding the whole screen each time, which is the blinking Amanda
      // reported. Two causes, both now addressed: eviction used to revoke
      // blobs still on screen, leaving <img> elements holding a dead URL and a
      // src attribute, so they never matched "waiting" and every arrival fell
      // through to here; and the fallback did not check whether anything
      // actually needed redrawing.
      //
      // The only caller that genuinely needs a render is the lightbox, which
      // emits its own <img> from state rather than a data-drive-id placeholder.
      // Everything else has already been patched in place or does not need the
      // image at all.
      if (!patched && state.lightbox) debouncedRender();
    })
    .catch(() => {
      state.photoFetchInFlight.delete(driveFileId);
      // Fails silently in the UI (placeholder icon just stays) — a toast
      // per-thumbnail would be noisy if Drive is briefly unreachable.
    });
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadAll() {
  await ensureFreshSession();
  if (!state.session) { render(); return; }
  state.loading = true;
  render();
  try {
    const [photos, plants, locations, tokens, photoPlants, identifications, photoLocations, careNotes, taxa, listOptions, bloomEvents, suggestions, tasks, taskSubjects, appSettings, locHistory, wateringEvents, askedTaxa] = await Promise.all([
      restGetAll("photos", "?select=*&order=uploaded_at.desc"),
      restGetAll("plants", "?select=*&order=accession_number.asc"),
      restGetAll("locations", "?select=*&order=sort_order.asc,name.asc"),
      restGet("google_auth_tokens", "?select=expires_at&limit=1"),
      restGetAll("photo_plants", "?select=*"),
      restGetAll("identifications", "?select=*&order=created_at.desc"),
      restGetAll("photo_locations", "?select=*"),
      restGetAll("care_notes", "?select=*&order=noted_on.desc,created_at.desc"),
      restGetAll("taxa", "?select=*&order=botanical_name.asc"),
      // Resilient on purpose: if list_options does not exist yet the app falls
      // back to the built-in vocabularies rather than failing to load at all.
      optional("list_options", restGet("list_options", "?select=*&order=list_name.asc,sort_order.asc")),
      // Resilient like list_options: the app works before the migration runs,
      // it just has no bloom history to show.
      optional("bloom_events", restGetAll("bloom_events", "?select=*&order=started_on.desc")),
      // Same again: AI-1 ships ahead of its table.
      optional("suggestions", restGetAll("suggestions", "?status=eq.pending&select=*&order=created_at.desc")),
      // TASK-1 / RPT-3. Resilient in the same way — the app runs before the
      // migration and simply has no tasks to show.
      optional("tasks", restGetAll("tasks", "?select=*&order=created_at.desc")),
      optional("task_subjects", restGetAll("task_subjects", "?select=*")),
      // Keyed on `key`, not `id`. This was failing on every load since v1.84.0
      // and the .catch() swallowed it, so state.appSettings was always {} —
      // the check-in interval silently fell back to 14 no matter what Settings
      // said, and Settings showed 14 back because it reads the same empty map.
      optional("app_settings", restGetAll("app_settings", "?select=*", "key")),
      // MOVE-1. The trigger has been writing this since the schema was built and
      // NOTHING has ever read it — it was fetched in exactly one place, the JSON
      // backup, so "where did this plant used to live?" was answerable only by
      // exporting a backup and reading the JSON by hand.
      optional("plant_location_history", restGetAll("plant_location_history", "?select=*&order=started_at.desc")),
      // WATER-1. Resilient like every table added after the app existed: it
      // loads before the migration and simply has no watering history.
      optional("watering_events", restGetAll("watering_events", "?select=*&order=watered_on.desc")),
      /* PROF-2. `suggestions` above is fetched pending-only, which is right for
         rendering but cannot answer "has Claude ever been asked about this
         species" — an accepted or dismissed row means it HAS. One column, every
         status, so the cost is small even as the table grows. */
      optional("suggestion_history", restGetAll("suggestions", "?select=taxa_id&taxa_id=not.is.null")),
    ]);
    state.photos = photos;
    state.plants = plants;
    state.locations = locations;
    state.driveToken = tokens[0] || null;
    state.photoPlants = photoPlants;
    state.identifications = identifications;
    state.photoLocations = photoLocations;
    state.careNotes = careNotes;
    state.taxa = taxa;
    state.listOptions = listOptions || [];
    state.bloomEvents = bloomEvents || [];
    state.suggestions = suggestions || [];
    state.tasks = tasks || [];
    state.taskSubjects = taskSubjects || [];
    state.appSettings = Object.fromEntries((appSettings || []).map((r) => [r.key, r.value]));
    state.plantLocationHistory = locHistory || [];
    state.wateringEvents = wateringEvents || [];
    state.taxaAskedIds = new Set((askedTaxa || []).map((r) => r.taxa_id).filter(Boolean));
  } catch (e) {
    toast(e.message, true);
  }
  state.loading = false;
  render();
  // WEATHER-1. Deliberately not awaited and deliberately last: a slow or dead
  // weather API must never delay the collection appearing. loadWeather() gates
  // itself on a 3-hour staleness check, so calling it from every loadAll is
  // self-limiting rather than a request per save.
  loadWeather();
}

/* ============================================================
   DOMAIN HELPERS — display names, location hierarchy
   ============================================================ */
// PL-2. A shared plant picker. Accession numbers are not memorised and
// botanical names are not yet recognisable at a glance, so a list of
// "ABG-2026-0007 — Aeonium arboreum 'Zwartkop'" is unreadable. The thumbnail is
// the actual recognition cue; the common name is the readable one.
//
// Everything filtering happens here rather than in each caller, so search,
// species filter and location filter behave identically wherever a plant is
// picked.
function plantPickerName(pl) {
  // Inverse of plantDisplayName's precedence: common first, because that is
  // what she can read at a glance.
  const t = pl.taxa_id ? taxonById(pl.taxa_id) : null;
  const common = t && t.common_name;
  const botanical = plantDisplayName(pl);
  return { primary: common || botanical, secondary: common ? botanical : "" };
}

function plantPickerMatches(opts) {
  const o = opts || {};
  const q = (state.pickerSearch || "").toLowerCase();
  return state.plants
    .filter((p) => !o.excludeIds || !o.excludeIds.includes(p.id))
    .filter((p) => {
      if (state.pickerTaxon && p.taxa_id !== state.pickerTaxon) return false;
      if (state.pickerLocation && p.location_id !== state.pickerLocation) return false;
      if (!q) return true;
      const t = p.taxa_id ? taxonById(p.taxa_id) : null;
      const hay = [plantSearchText(p),
                   t && t.common_name, t && t.botanical_name]
        .filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    })
    .sort((a, b) => {
      if (state.pickerSort !== "name") {
        // Accession number ALONE, not created_at. It is issued sequentially by
        // the trigger, never reused, always present, and sorts correctly as a
        // string across years — so it already is creation order. Sorting on
        // created_at first pushed rows missing it to the bottom, which is the
        // opposite of "newest first" for the very rows most likely to be new.
        return (b.accession_number || "").localeCompare(a.accession_number || "");
      }
      const an = plantPickerName(a).primary, bn = plantPickerName(b).primary;
      return an.localeCompare(bn) || (a.accession_number || "").localeCompare(b.accession_number || "");
    });
}

// Returns HTML, not text — do not escape at the call site. `onPick` receives
// the plant id.
function plantPicker(onPick, opts) {
  const o = opts || {};
  const matches = plantPickerMatches(o);
  const taxaInUse = [...new Set(state.plants.map((p) => p.taxa_id).filter(Boolean))]
    .map(taxonById).filter(Boolean)
    .sort((a, b) => taxonDisplayName(a).localeCompare(taxonDisplayName(b)));
  return `
    <input placeholder="Search name or accession…" id="search-picker" value="${escapeHtml(state.pickerSearch || "")}"
           oninput="state.pickerSearch=this.value;scheduleRender()" />
    <div class="wrap-gap" style="margin:8px 0 10px;">
      <select style="width:auto;font-size:12.5px;padding:6px 8px;" onchange="state.pickerTaxon=this.value;render()">
        <option value="">Any species</option>
        ${taxaInUse.map((t) => `<option value="${t.id}" ${state.pickerTaxon === t.id ? "selected" : ""}>${escapeHtml(taxonDisplayName(t))}</option>`).join("")}
      </select>
      <select style="width:auto;font-size:12.5px;padding:6px 8px;" onchange="state.pickerLocation=this.value;render()">
        <option value="">Anywhere</option>
        ${locationSelectOptions(state.pickerLocation)}
      </select>
      <button class="btn-ghost" style="font-size:12px;padding:0 4px;" title="Change the order"
        onclick="state.pickerSort = state.pickerSort === 'name' ? 'recent' : 'name';render()">
        ${state.pickerSort === "name" ? "A–Z" : "Newest first"} &#8645;</button>
      ${(state.pickerSearch || state.pickerTaxon || state.pickerLocation)
        ? `<button class="btn-ghost" style="font-size:12px;padding:0 4px;" onclick="clearPlantPicker()">Clear</button>` : ""}
      <span class="subtle" style="font-size:11.5px;">${countLabel(matches.length, "plant", "plants")}</span>
    </div>
    ${(() => {
      // A reference shot of the filtered species. Choosing "Aeonium arboreum"
      // from a dropdown of 33 botanical names is a guess until you can see one
      // — and picking the wrong species then creating a specimen under it is
      // the expensive mistake, since every species fact follows from it.
      const t = state.pickerTaxon ? taxonById(state.pickerTaxon) : null;
      if (!t) return "";
      const cover = taxonCoverPhoto(t);
      const n = specimensOfTaxon(t.id).length;
      return `
      <div class="tag-card plant-list-card" style="padding:8px 10px;margin-bottom:10px;background:rgba(124,167,161,0.10);border-color:rgba(124,167,161,0.35);">
        <div class="plant-list-thumb" style="width:64px;height:64px;flex-shrink:0;">
          ${cover ? photoImg(cover) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
        </div>
        <div style="flex:1;min-width:0;">
          <div class="subtle" style="font-size:10.5px;letter-spacing:0.4px;text-transform:uppercase;">Filtering by species</div>
          <div style="font-size:13.5px;font-weight:600;margin-top:1px;">${taxonDisplayHtml(t)}</div>
          ${t.common_name ? `<div style="font-size:12px;color:var(--ink-soft);">${escapeHtml(t.common_name)}</div>` : ""}
          <div class="mono" style="font-size:10.5px;color:var(--moss-dim);margin-top:2px;">${countLabel(n, "specimen", "specimens")} recorded${cover ? "" : " · no photo yet"}</div>
        </div>
      </div>`;
    })()}
    <div class="stack" style="max-height:46vh;overflow-y:auto;">
      ${matches.length === 0 ? `<p class="subtle">No plants match.</p>` : matches.map((pl) => {
        const nm = plantPickerName(pl);
        const cover = plantCoverPhoto(pl);
        const loc = pl.location_id ? locationById(pl.location_id) : null;
        return `
        <button class="tag-card plant-list-card" style="width:100%;padding:8px 11px;border:none;text-align:left;cursor:pointer;"
                onclick="${onPick.replace("{id}", pl.id)}">
          <div class="plant-list-thumb" style="width:46px;height:46px;">
            ${cover ? photoImg(cover) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13.5px;font-weight:600;">${escapeHtml(nm.primary)}</div>
            ${nm.secondary ? `<div style="font-size:12px;font-style:italic;color:var(--ink-soft);">${escapeHtml(nm.secondary)}</div>` : ""}
            <div class="mono" style="font-size:10.5px;color:var(--moss-dim);margin-top:2px;">${pl.accession_number}${loc ? " · " + escapeHtml(loc.name) : ""}</div>
          </div>
        </button>`;
      }).join("")}
    </div>
    ${/* The picker is where you discover the plant is not recorded yet — most
         sharply when a species filter returns one specimen and the photo shows
         a second of the same kind. Without an escape hatch that means closing
         the modal, losing what is staged, and starting again elsewhere. */""}
    ${/* Text, no icon. icon() emits a bare viewBox, so inside a block button
         it stretched to the full width — the same no-intrinsic-size trap as
         the empty states in v1.64.0. */""}
    ${(() => {
      // Same species, new specimen: the common case when a species filter
      // returns one plant and the photo shows a second of the same kind. The
      // taxon comes from the active filter, or from whatever is already picked.
      const filterTaxon = state.pickerTaxon ? taxonById(state.pickerTaxon) : null;
      const pickedTaxon = o.taxonId ? taxonById(o.taxonId) : null;
      const t = filterTaxon || pickedTaxon;
      if (!o.onNew && !(t && o.onNewSameSpecies)) return "";
      return `
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        ${t && o.onNewSameSpecies ? `
          <button type="button" class="btn btn-accent btn-sm" style="flex:1;justify-content:center;min-width:180px;"
                  onclick="${o.onNewSameSpecies.replace(/\{taxonId\}/g, t.id)}">Another ${escapeHtml(taxonDisplayName(t))}</button>` : ""}
        ${o.onNew ? `
          <button type="button" class="btn btn-secondary btn-sm" style="flex:1;justify-content:center;min-width:180px;"
                  onclick="${o.onNew}">${escapeHtml(o.newLabel || "New plant from this photo")}</button>` : ""}
      </div>`;
    })()}`;
}

function clearPlantPicker() {
  state.pickerSearch = ""; state.pickerTaxon = ""; state.pickerLocation = "";
  render();
}

// SPECIES-1 phase 3. A specimen has no name of its own — the taxon does. This
// used to read pl.botanical_name, which was the keystone holding every species
// column on `plants` alive. taxa_id is nullable on purpose (an unidentified
// plant stays first-class), so the no-taxon path is real, not defensive.
function plantDisplayName(pl) {
  if (!pl) return "Unidentified Plant";
  const t = pl.taxa_id ? taxonById(pl.taxa_id) : null;
  if (t) return taxonDisplayName(t);
  return "Unidentified Plant";
}
// Every search box over specimens used its own inline list of fields, and each
// one still read the species columns off `plants`. One helper so they cannot
// drift apart again.
function plantSearchText(pl) {
  if (!pl) return "";
  const t = pl.taxa_id ? taxonById(pl.taxa_id) : null;
  return [pl.accession_number, plantDisplayName(pl),
          t && t.common_name, t && t.botanical_name, t && t.genus,
          t && t.family, t && t.cultivar, t && t.working_label]
    .filter(Boolean).join(" ").toLowerCase();
}
function plantDisplayHtml(pl) {
  if (!pl) return "Unidentified Plant";
  const t = pl.taxa_id ? taxonById(pl.taxa_id) : null;
  if (t) return taxonDisplayHtml(t);
  return escapeHtml(plantDisplayName(pl));
}

function locationById(id) {
  return state.locations.find((l) => l.id === id);
}
function pendingIdentification(photoId) {
  return state.identifications.find((i) => i.photo_id === photoId && i.status === "pending");
}
function pendingIdentifications(photoId) {
  return state.identifications.filter((i) => i.photo_id === photoId && i.status === "pending");
}
// Where a plant is. SPECIES-2 finished 2026-08-28: a specimen is one physical
// individual and is in exactly one place, so `plant_locations` was dropped and
// this reads `location_id` alone. Kept as a function rather than inlined
// because ~20 call sites ask "where is this plant", and that question still
// has an answer — now always one location, or none.
function allLocationsForPlant(pl) {
  return pl && pl.location_id ? [locationById(pl.location_id)].filter(Boolean) : [];
}

function additionalLocationRowsForPhoto(photoId) {
  return state.photoLocations.filter((pl) => pl.photo_id === photoId);
}
function allLocationsForPhoto(photo) {
  const ids = [];
  if (photo.location_id) ids.push(photo.location_id);
  additionalLocationRowsForPhoto(photo.id).forEach((pl) => {
    if (!ids.includes(pl.location_id)) ids.push(pl.location_id);
  });
  return ids.map((id) => locationById(id)).filter(Boolean);
}
// Locations that already appear in this plant's photo timeline but aren't
// where the plant is currently recorded — surfaced as one-tap suggestions so a
// location doesn't have to be found again in the full picker.
// Groups a list of photos by the location(s) they're tagged to, for
// rendering separate per-location sub-timelines on the plant detail view.
// A specimen's photos in date order, split wherever the location changes.
// Columns-per-location made sense when one plant record stood for several
// physical plants; since SPECIES-2 a specimen lives in one place at a time, and
// what actually varies is WHEN it moved. Amanda's Santa Rita has photos across
// four former homes — read chronologically that is the plant's life story,
// which per-location columns hid.
function photoRunsByLocation(photosList, oldestFirst) {
  const sorted = photosList.slice().sort((a, b) => {
    const d = new Date(photoDate(a)) - new Date(photoDate(b));
    return oldestFirst ? d : -d;
  });
  const runs = [];
  sorted.forEach((p) => {
    const key = p.location_id || "none";
    const last = runs[runs.length - 1];
    // Only a CHANGE starts a new run, so a plant that moved away and came back
    // shows two separate stays rather than one merged block.
    if (!last || last.key !== key) {
      runs.push({ key, location: p.location_id ? locationById(p.location_id) : null, photos: [p] });
    } else {
      last.photos.push(p);
    }
  });
  return runs;
}

// Every plant present at a location, whether as primary or additional
function plantsAtLocation(locationId) {
  return state.plants.filter((p) => p.location_id === locationId);
}
function directChildLocations(locationId) {
  return state.locations.filter((l) => l.parent_location_id === locationId).sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || a.name.localeCompare(b.name));
}
// Photos primarily attached to this location, plus any tagged onto it via photo_locations
function photosAtLocation(locationId) {
  const primary = state.photos.filter((p) => p.location_id === locationId);
  const taggedIds = state.photoLocations.filter((pl) => pl.location_id === locationId).map((pl) => pl.photo_id);
  const tagged = state.photos.filter((p) => taggedIds.includes(p.id) && p.location_id !== locationId);
  return [...primary, ...tagged];
}
function descendantLocationIds(locationId) {
  const direct = directChildLocations(locationId).map((l) => l.id);
  return direct.concat(direct.flatMap((id) => descendantLocationIds(id)));
}
// Plant count including everything nested underneath this location
function aggregatePlantCount(locationId) {
  const idSet = new Set([locationId, ...descendantLocationIds(locationId)]);
  return state.plants.filter((p) => idSet.has(p.location_id)).length;
}
// Deduped by photo id: one photo tagged onto both a parent and a child, or
// onto two sibling containers, is still one photo in the rolled-up count.
function aggregatePhotoCount(locationId) {
  const idSet = new Set([locationId, ...descendantLocationIds(locationId)]);
  const seen = new Set();
  idSet.forEach((id) => { photosAtLocation(id).forEach((p) => seen.add(p.id)); });
  return seen.size;
}

function locationPath(loc) {
  if (!loc) return "";
  const parts = [loc.name];
  let cur = loc;
  let guard = 0;
  while (cur.parent_location_id && guard < 10) {
    const parent = locationById(cur.parent_location_id);
    if (!parent) break;
    parts.unshift(parent.name);
    cur = parent;
    guard++;
  }
  return parts.join(" > ");
}

// Flat, depth-aware list for building <select> options that show hierarchy via indentation
// LOC-9. 157 locations in one flat list, indented with em-dashes, is a scroll
// hunt — and 92 of them are near-identical buckets. Three things fix it, and
// they compose: the places she just used, a level at a time instead of all of
// them, and counts so two buckets are distinguishable.
const RECENT_LOCATIONS_KEY = "abg_recent_locations";
const RECENT_LOCATIONS_MAX = 6;
function recentLocationIds() {
  try {
    const ids = JSON.parse(localStorage.getItem(RECENT_LOCATIONS_KEY) || "[]");
    return Array.isArray(ids) ? ids.filter((id) => locationById(id)) : [];
  } catch (e) { return []; }
}
function noteRecentLocation(id) {
  if (!id) return;
  try {
    const next = [id, ...recentLocationIds().filter((x) => x !== id)].slice(0, RECENT_LOCATIONS_MAX);
    localStorage.setItem(RECENT_LOCATIONS_KEY, JSON.stringify(next));
  } catch (e) {}
}

// Archived locations are excluded: the flag means "no longer somewhere you file
// things". They stay reachable from the Locations tab, just not offered here.
function pickableChildren(parentId) {
  return state.locations
    .filter((l) => (l.parent_location_id || null) === (parentId || null) && !l.archived)
    .sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || a.name.localeCompare(b.name));
}

function locPickerGo(id) { state.locPickerParent = id || null; render(); }
function locPickerReset() { state.locPickerParent = null; state.locPickerSearch = ""; state.locPickerNewOpen = false; }

// onPick is a JS snippet with {id} substituted, matching plantPicker's contract.
/* LOCFIELD-1. Eight forms used a flat `<select>` of every location while four
   used the real picker — searchable, hierarchical, with recents and a
   create-as-you-go. With 157 locations the flat list is a scroll hunt, and
   Amanda hit it creating a plant from the Gallery.

   Staged like the edit-photo one: picking sets state and the form's own submit
   commits, so choosing a location never submits the form under her. */
function setLocField(prefix, locationId) {
  state.locField[prefix] = locationId || "";
  state.locFieldOpen = "";
  state.locPickerNewOpen = false;
  if (locationId) noteRecentLocation(locationId);
  render();
}
// quickAddLocation() resolves its callback via globalThis[name], so it needs a
// real global taking (id). Only one field's picker is ever open, so
// state.locFieldOpen already identifies which one is asking.
function setLocFieldActive(locationId) {
  setLocField(state.locFieldOpen, locationId);
}
function locFieldValue(prefix) {
  return state.locField[prefix] || "";
}
function locationField(prefix, opts) {
  const o = opts || {};
  const id = locFieldValue(prefix);
  const chosen = id ? locationById(id) : null;
  const parent = chosen && chosen.parent_location_id ? locationById(chosen.parent_location_id) : null;
  const open = state.locFieldOpen === prefix;
  return `
    <div class="tag-card plant-list-card" style="padding:8px 10px;margin-bottom:8px;">
      <span class="suggestion-icon" style="color:var(--moss-dim);">${icon("pin")}</span>
      <div style="flex:1;min-width:0;">
        ${chosen ? `
          <div style="font-size:13.5px;font-weight:500;">${escapeHtml(chosen.name)}</div>
          <div style="font-size:11.5px;color:var(--ink-soft);">${parent ? escapeHtml(locationPath(parent)) : locationTypeLabel(chosen.type)}</div>`
        : `<div class="value-blank" style="font-size:13px;">${escapeHtml(o.empty || "No location")}</div>`}
      </div>
      <div style="display:flex;gap:10px;flex-shrink:0;">
        <button type="button" class="btn-ghost" style="padding:0;font-size:12px;"
          onclick="state.locFieldOpen = state.locFieldOpen === '${prefix}' ? '' : '${prefix}';state.locPickerNewOpen=false;render()">${open ? "Close" : (chosen ? "Change" : "Choose")}</button>
        ${chosen ? `<button type="button" class="btn-ghost" style="padding:0;font-size:12px;color:var(--terracotta);" onclick="setLocField('${prefix}','')">Clear</button>` : ""}
      </div>
    </div>
    ${open ? locationPicker(`setLocField('${prefix}','{id}')`, { onCreatePick: "setLocFieldActive" }) : ""}`;
}

function locationPicker(onPick, opts) {
  const o = opts || {};
  const q = (state.locPickerSearch || "").trim().toLowerCase();
  const pick = (l) => onPick.replace(/\{id\}/g, l.id);
  const row = (l, showPath) => {
    const kids = pickableChildren(l.id);
    const plants = aggregatePlantCount(l.id);
    const photos = aggregatePhotoCount(l.id);
    const parent = l.parent_location_id ? locationById(l.parent_location_id) : null;
    return `
      <div class="tag-card plant-list-card" style="padding:9px 12px;gap:10px;">
        <button class="btn-ghost" style="flex:1;min-width:0;text-align:left;padding:0;color:inherit;"
                onclick="noteRecentLocation('${l.id}');${pick(l)}">
          <div style="font-size:13.5px;font-weight:500;">${escapeHtml(l.name)}</div>
          ${showPath && parent ? `<div style="font-size:11px;color:var(--ink-soft);">${escapeHtml(locationPath(parent))}</div>` : ""}
          <div class="mono" style="font-size:10.5px;color:var(--moss-dim);margin-top:2px;">${locationTypeLabel(l.type)} · ${countLabel(plants, "plant", "plants")} · ${countLabel(photos, "photo", "photos")}</div>
        </button>
        ${kids.length ? `
          <button class="btn-ghost" style="padding:0 2px;flex-shrink:0;font-size:11px;color:var(--blue);display:flex;align-items:center;gap:3px;"
                  title="Open ${escapeHtml(l.name)}" onclick="locPickerGo('${l.id}')">${kids.length} ${icon("chevronRight")}</button>` : ""}
      </div>`;
  };

  if (q) {
    const hits = state.locations
      .filter((l) => !l.archived && (l.name.toLowerCase().includes(q) || locationPath(l).toLowerCase().includes(q)))
      .sort((a, b) => a.name.localeCompare(b.name))
      .slice(0, 40);
    return `
      <input class="search-input" id="loc-picker-search" placeholder="Search locations…" style="margin-bottom:10px;"
             value="${escapeHtml(state.locPickerSearch || "")}" oninput="state.locPickerSearch=this.value;scheduleRender()" />
      <div class="subtle" style="font-size:11.5px;margin-bottom:8px;">${countLabel(hits.length, "match", "matches")}${hits.length === 40 ? " (first 40)" : ""}</div>
      <div class="stack" style="max-height:46vh;overflow-y:auto;">
        ${hits.length ? hits.map((l) => row(l, true)).join("") : `<p class="subtle">No locations match.</p>`}
      </div>`;
  }

  const here = state.locPickerParent ? locationById(state.locPickerParent) : null;
  const kids = pickableChildren(state.locPickerParent);
  const recents = state.locPickerParent ? [] : recentLocationIds().map(locationById).filter(Boolean);
  const crumbs = [];
  for (let n = here; n; n = n.parent_location_id ? locationById(n.parent_location_id) : null) crumbs.unshift(n);

  return `
    <input class="search-input" id="loc-picker-search" placeholder="Search locations…" style="margin-bottom:10px;"
           value="${escapeHtml(state.locPickerSearch || "")}" oninput="state.locPickerSearch=this.value;scheduleRender()" />
    <div class="wrap-gap" style="margin-bottom:10px;font-size:12px;">
      <button class="btn-ghost" style="padding:0;font-size:12px;${here ? "color:var(--blue);" : "font-weight:600;"}" onclick="locPickerGo('')">All locations</button>
      ${crumbs.map((c, i) => `<span style="color:var(--moss-dim);">/</span>

    </div>

          <input id="qa-loc-name" placeholder="e.g. Large Teal Ribbed Pot 2" style="margin-bottom:8px;" />

            ${Object.entries(LOCATION_TYPE_LABELS).map(([k, v]) => `<option value="${k}" ${k === "container" ? "selected" : ""}>${v}</option>`).join("")}
          </select>
          <div style="display:flex;gap:8px;">

}

function locationOptionList() {
  const byParent = {};
  state.locations.forEach((l) => {
    const key = l.parent_location_id || "root";
    (byParent[key] = byParent[key] || []).push(l);
  });
  const sortFn = (a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || a.name.localeCompare(b.name);
  const out = [];
  function walk(parentKey, depth) {
    const kids = (byParent[parentKey] || []).sort(sortFn);
    kids.forEach((l) => {
      out.push({ id: l.id, label: "  ".repeat(depth) + (depth > 0 ? "— " : "") + l.name, depth });
      walk(l.id, depth + 1);
    });
  }
  walk("root", 0);
  return out;
}

// LOC-6. Areas nest freely — Front Yard > The Wall > Below Wall are all areas,
// and every one is a Garden Album. `slot` folded into `container` (they were the
// same thing); pot/bed/greenhouse/hanging/indoor went unused, since a container's
// name carries that detail instead ("Bucket 39", "Black Pedestal Pot 1").
// ADM-1. Editable vocabularies. The built-in maps below stay as seed data and
// as the fallback when list_options is empty or absent, so the app keeps working
// whether or not the table exists.
//
// Only lists that are PURE VOCABULARY are editable. `status`, `health_status`,
// `identification_status`, `collection_category` and `origin` are deliberately
// excluded: code branches on their exact values (needsAttention, the Plants
// filter bar, locationHoldsPlants), so a renamed or removed value would break
// logic rather than just a label. Location `type` is excluded for the same
// reason — locationHoldsPlants() tests it directly.
const EDITABLE_LISTS = {
  plant_type: "Plant type",
  growth_habit: "Growth habit",
  bloom_season: "Bloom season",
  water_needs: "Water needs",
  light_conditions: "Light needs",
};

// Values are immutable once created — they are stored on every plant that uses
// them. Only the label, the order and whether it is offered can change, which
// removes the orphaning problem entirely. Retiring a value hides it from
// dropdowns while records still using it keep displaying it.
function listOptionsFor(listName) {
  const rows = state.listOptions.filter((o) => o.list_name === listName);
  if (!rows.length) return { ...(BUILTIN_LISTS[listName] || {}) };
  const out = {};
  rows.slice().sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || String(a.label).localeCompare(String(b.label)))
      .forEach((o) => { out[o.value] = o.label; });
  return out;
}
// For dropdowns: retired values are not offered, but one already set on the
// record stays selectable so saving cannot silently change it.
function listChoicesFor(listName, currentValue) {
  const rows = state.listOptions.filter((o) => o.list_name === listName);
  if (!rows.length) return listOptionsFor(listName);
  const out = {};
  rows.slice().sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || String(a.label).localeCompare(String(b.label)))
      .forEach((o) => { if (o.active !== false || o.value === currentValue) out[o.value] = o.label; });
  return out;
}

// What the photo SHOWS. Filing — which plant, which location — is expressed by
// plant_id and location_id, not by type. Two old values conflated the two:
//   `identification` existed only to keep a reference shot out of a timeline
//   `historical`     meant "needs no plant or location", which made an archive
//                    photo and a tagged specimen photo mutually exclusive —
//                    the reason a plant's history across former homes could not
//                    be recorded (v1.56.0)
// Archive-ness now comes from the photo's location being an archive location.
const FIELD_LABELS = { family: "Family", genus: "Genus", species_epithet: "Species",
  infraspecific: "Infraspecific", parentage: "Parentage", description: "Description",
  botanical_name: "Botanical name", common_name: "Common name", cultivar: "Cultivar",
  is_hybrid: "Hybrid", working_label: "Working label",
  plant_type: "Type", growth_habit: "Growth habit", mature_size: "Mature size", bloom_season: "Bloom season",
  origin: "Origin", native_range: "Native range", hardy_to: "Hardy to", water_needs: "Water needs",
  frost_tender: "Frost tender" };
// `overview` and `progress` are photos OF A PLACE, not of a plant: a wide shot
// of the wall, or the same section re-shot over months to watch it fill in.
// Neither will ever get a specimen attached, and nagging about it is noise.
const PHOTO_TYPE_LABELS = { general: "General", bloom: "Bloom", detail: "Detail", condition: "Condition", overview: "Overview", progress: "Progress" };
const PLACE_PHOTO_TYPES = ["overview", "progress"];

/* PHOTO-4. `historical` says "no specimen will ever be created for this" — a
   photo of a container recording what it USED to hold. It is deliberately a
   flag and not a photo_type value: a photo has exactly one type, so the
   `historical` TYPE removed in v1.56.0 made "archival" and "shows a bloom"
   mutually exclusive and a plant's history across former homes unrecordable.
   As a separate column both are true at once.

   being made is about specimens, not about where the photo was taken, so a
   historical photo with no location is still asked for one.

function photosHaveHistorical() {
  return state.photos.some((p) => Object.prototype.hasOwnProperty.call(p, "historical"));
}
/* PHOTO-4. The meta line under a photo's date, shared. Fifteen surfaces render
   that line and they had drifted: some appended the photo type, most did not,
   and only the Gallery grid ever showed the archive marker — so a photo marked
   Historical looked identical to an unfiled one on the filing screens, which
   are exactly where the distinction decides whether it is work.

   Order is deliberate: what it SHOWS first, then what it IS. */
function photoMetaSuffix(p) {
  if (!p) return "";
  const bits = [];
  if (p.photo_type && p.photo_type !== "general") bits.push(PHOTO_TYPE_LABELS[p.photo_type] || p.photo_type);
  if (isArchivePhoto(p)) bits.push("Archive");
  if (isHistoricalPhoto(p)) bits.push("Historical");

function isHistoricalPhoto(p) {
  return !!(p && p.historical);
}
function isPlacePhoto(p) {
  return !!p && PLACE_PHOTO_TYPES.includes(p.photo_type);
}

// A photo is archival because of where it was taken, not because of a flag.
function isArchivePhoto(p) {
  if (!p || !p.location_id) return false;
  const loc = locationById(p.location_id);
  return !!loc && loc.gallery_row === "archives";
}

const LOCATION_TYPE_LABELS = { area: "Area", row: "Row", container: "Container", hospital: "Hospital", staging: "Staging", work_area: "Work Area", other: "Other" };
const GALLERY_ROW_LABELS = { none: "Not shown in the Gallery", albums: "Garden Albums", archives: "From the Archives" };

// Whether the Location page offers plant affordances. It deliberately never
// hides plants that exist — a wrongly flagged location would otherwise make its
// own plants invisible. Existing plants always render; the flag governs only the
// empty state and the add-specimen action.
// The types that hold plants unless a location says otherwise. Was inlined in
// locationHoldsPlants and separately (and WRONGLY) approximated as
// `type === "container"` in the quick-add form, which stamped an explicit
// false onto every hospital, staging area and work area created there.
const PLANT_HOLDING_TYPES = ["container", "hospital", "staging", "work_area"];
function typeHoldsPlants(type) {
  return PLANT_HOLDING_TYPES.includes(String(type || ""));
}
function locationHoldsPlants(l) {

  if (l.holds_plants === true) return true;
  if (l.holds_plants === false) return false;
  return typeHoldsPlants(l.type);
}
/* LOC-9. A location whose stored flag contradicts its own type. The New
   location form saved an unticked checkbox as an explicit `false`, and
   locationHoldsPlants honours an explicit false over the type default — so a
   pot created without touching that checkbox silently could not hold plants,
   and "New plant from this photo" vanished from its photo feed with no
   explanation. Found on Large Teal Ribbed Pot 3, 2026-08-30.
   Some may be deliberate, which is why this is a queue tile to review rather
   than a migration that rewrites them. */
function locationsMistypedForPlants() {
  return state.locations.filter((l) => l.holds_plants === false && typeHoldsPlants(l.type));
}

// else is half-typed in the form.
function syncHoldsPlants(prefix) {
  const t = document.getElementById(`${prefix}-type`);
  const cb = document.getElementById(`${prefix}-holdsplants`);
  if (t && cb) cb.checked = typeHoldsPlants(t.value);
}

// LOC-7. A photo with no plant is a GAP only where plants are expected. At an
// Area (a view of the whole wall) or an Archive (a former home), it is the
// normal case — flagging it made three screens nag about correct data, and at
// archive scale it would have buried the real gaps.
//
// Not the same as "cannot be tagged": an archive photo tagged to a specimen is
// exactly the Santa Rita workflow. This governs whether NOT being tagged counts
// against you, nothing else.
function photoLocationExpectsPlants(p) {
  if (!p || !p.location_id) return false;
  return locationHoldsPlants(locationById(p.location_id));
}
function photoAwaitsPlant(p) {
  // The location test alone was not enough. A wide shot of the whole wall taken
  // while standing at one bucket gets filed to that bucket — a container, which
  // does expect plants — so it was flagged as a gap forever. The type says what
  // the photo IS, and travels with it wherever it is filed.

function photoIsUntaggedArchiveOrArea(p) {

}

function locationTypeLabel(t) {
  return LOCATION_TYPE_LABELS[t] || t || "Location";
}

// Phrasing for the "N inside" indicator. It describes the children's type, not
// the parent's — "6 rows inside" under Wall Collection, never "6 areas inside".
// Mixed child types, or types with no natural plural (Indoor, Hanging, Other),
// fall back to the generic word.
const CHILD_TYPE_PLURALS = { area: ["area", "areas"], row: ["row", "rows"], container: ["container", "containers"], hospital: ["hospital", "hospitals"], staging: ["staging area", "staging areas"], work_area: ["work area", "work areas"] };
// ============================================================
// TAXA (SPECIES-1). A taxon is the kind of plant — whatever the most specific
// level known: a species, a cultivar, or a bare genus. Specimens are `plants`
// rows. Species-level facts live here once instead of on every specimen.
// ============================================================
function taxonById(id) {
  return state.taxa.find((t) => t.id === id) || null;
}
// `botanical_name` wins, and that is deliberate. The structured parts are
// barely populated in the real data — family 3/27, genus 5/27, species 3/27 —
// so composing from them would render "Aeonium" where the free text already
// says "Aeonium arboreum 'Zwartkop'". Partial parts produce a worse name than
// no parts, which is why composition requires BOTH genus and epithet and still
// only applies when there is no free-text name to beat.
// Once the names are normalized into parts (see NAME-1) this precedence flips.
// Cultivar epithets are quoted by the display layer, so a value that already
// carries quotes would render as ''doubled''. Real data has both shapes —
// "Purple Perle" and "Echeveria 'Purple Perle'" — so strip any quoting the
// value brought with it and apply exactly one pair. NAME-1 fixes the data.
function cultivarLabel(raw) {
  if (!raw) return "";
  const v = String(raw).trim();
  if (!v) return "";
  // NAME-1 normalized the column to bare cultivar epithets, so anything still
  // carrying quotes is stray punctuation rather than a full embedded name.
  // Strip whatever quoting arrived and apply exactly one pair.
  const bare = v.replace(/^['\u2018\u2019"]+|['\u2018\u2019"]+$/g, "").trim();
  return bare ? `'${bare}'` : "";
}

// NAME-1. Composed from parts first, free text second — the reverse of v1.41.0,
// which preferred botanical_name only because the parts were barely populated
// (genus 5/27, epithet 3/27). All 33 taxa are filled now, so composition is the
// better name and the only one that can be marked up per part.
//
// Two things this must not get wrong:
//   - The hybrid sign lives ONLY in the free text. `Parodia × erubescens`
//     composes from parts as "Parodia erubescens" unless is_hybrid puts the ×
//     back, which is the one record that would have silently lost information.
//   - A cultivar of hybrid origin has no epithet at all — Echeveria
//     'Purple Perle' is genus + cultivar. Requiring an epithet would send it to
//     the fallback and lose the markup, so genus + cultivar composes too.
// Infraspecific rank, e.g. "var. erinacea", "subsp. horrida", "f. monstruosa".
// Stored as the gardener types it, rank abbreviation included, because that is
// what the label and the vendor tag say. Botanical convention sets the rank
// abbreviation upright and the epithet italic, so the two are split for markup.
const INFRA_RANKS = ["nothosubsp.", "subsp.", "ssp.", "subvar.", "var.", "subf.", "f."];
function infraspecificParts(raw) {
  const v = String(raw || "").trim();
  if (!v) return null;
  const hit = INFRA_RANKS.find((r) => v.toLowerCase().startsWith(r));
  // No recognised rank means she typed a bare epithet. Default to var., which
  // is overwhelmingly the common case, rather than rendering a rankless word
  // that reads as a second species epithet.
  if (!hit) return { rank: "var.", epithet: v };
  return { rank: hit, epithet: v.slice(hit.length).trim() };
}
function infraspecificLabel(raw) {
  const p = infraspecificParts(raw);
  return p && p.epithet ? `${p.rank} ${p.epithet}` : "";
}

function taxonNameParts(t) {
  if (!t) return null;
  const genus = (t.genus || "").trim();
  const epithet = (t.species_epithet || "").trim();
  const cultivar = (t.cultivar || "").trim();
  // Only meaningful below a species, so it rides along with the epithet.
  const infra = epithet ? (t.infraspecific || "").trim() : "";
  if (!genus || (!epithet && !cultivar)) return null; // not enough to beat the free text
  return { genus, epithet, cultivar, infra, hybrid: !!t.is_hybrid };
}

function taxonDisplayName(t) {
  if (!t) return "Unknown";
  const p = taxonNameParts(t);
  if (p) {
    let sci = p.epithet ? `${p.genus} ${p.hybrid ? "\u00D7 " : ""}${p.epithet}` : p.genus;
    // Before v1.83.0 the variety was silently dropped here: composition prefers
    // the parts, and the parts had nowhere to hold it.
    if (p.infra && infraspecificLabel(p.infra)) sci += ` ${infraspecificLabel(p.infra)}`;
    return p.cultivar ? `${sci} ${cultivarLabel(p.cultivar)}` : sci;
  }
  if (t.botanical_name && t.botanical_name.trim()) return t.botanical_name.trim();
  return t.working_label || "Unnamed taxon";
}

// Marked-up form. Genus and epithet italic, the hybrid sign and the cultivar
// upright — a single free-text string can never be styled correctly, which is
// half of why NAME-1 exists. Returns HTML, so callers must NOT wrap it in
// escapeHtml(); the parts are escaped here. The plain function above stays for
// <option> labels, title attributes and CSV, where markup cannot go.
function taxonDisplayHtml(t) {
  const p = taxonNameParts(t);
  if (!p) return escapeHtml(taxonDisplayName(t));
  let html = `<i>${escapeHtml(p.genus)}</i>`;
  if (p.epithet) html += `${p.hybrid ? " \u00D7" : ""} <i>${escapeHtml(p.epithet)}</i>`;
  const ip = p.infra ? infraspecificParts(p.infra) : null;
  if (ip && ip.epithet) html += ` ${escapeHtml(ip.rank)} <i>${escapeHtml(ip.epithet)}</i>`;
  if (p.cultivar) html += ` ${escapeHtml(cultivarLabel(p.cultivar))}`;
  return html;
}
// AI-3 layer 1. Name matching for duplicate detection, and for the lookup that
// decides whether a new specimen joins an existing species or starts a new one.
//
// The old lookup compared the typed string to `botanical_name` and nothing
// else. Since v1.65.0 the display name is COMPOSED from genus / epithet /
// cultivar, so a taxon created that way often has no `botanical_name` at all —
// typing "Aeonium arboreum" against an existing Aeonium arboreum matched
// nothing and silently created a second species record. Matching the composed
// name is the fix.
function nameKey(raw) {
  return String(raw || "")
    .toLowerCase()
    .replace(/[\u2018\u2019'"]/g, "")          // quoting around cultivars varies
    .replace(/\u00D7\s*/g, "x ")               // × and a bare x are the same claim
    .replace(/\b(var|subsp|ssp|f|subvar|subf)\.?\s+/g, "")  // rank words are not identity
    .replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

// Every name a taxon answers to, so a match on any of them counts.
function taxonNameKeys(t) {
  return [taxonDisplayName(t), t.botanical_name, t.common_name, t.working_label]
    .map(nameKey)
    .filter((k) => k && k !== "unknown" && k !== "unnamed taxon");
}

function findTaxonByName(botanical, common) {
  const keys = [nameKey(botanical), nameKey(common)].filter(Boolean);
  if (!keys.length) return null;
  return state.taxa.find((t) => {
    const tk = taxonNameKeys(t);
    return keys.some((k) => tk.includes(k));
  }) || null;
}

// species record is more likely a typo than a real distinction. Same genus with
// a different epithet is the common one ("Aeonium arboreum" vs "Aeonium
// arborium"); so is one name being a prefix of the other, which is what
// happens when a cultivar is left off.
function similarTaxaByName(botanical, common) {
  const key = nameKey(botanical) || nameKey(common);
  if (!key || key.length < 4) return [];
  const [genus, ...rest] = key.split(" ");
  const epithet = rest.join(" ");
  return state.taxa
    .filter((t) => {
      const tk = taxonNameKeys(t);
      if (tk.includes(key)) return false;                 // exact match is not a near miss
      return tk.some((k) => {
        if (k.startsWith(key + " ") || key.startsWith(k + " ")) return true;
        const [g, ...r] = k.split(" ");
        return !!epithet && g === genus && r.join(" ") !== epithet;

    .slice(0, 4);

function taxonSecondaryName(t) {
  if (!t) return "";
  const primary = taxonDisplayName(t);
  return t.common_name && t.common_name !== primary ? t.common_name : "";
}
// NAME-2. A taxon whose name is only free text: no genus, no epithet, no

// infraspecific, parentage and species grouping all need the parts, so these
// records are invisible to half the app's features.
/* ============================================================
   SPECIES PROFILE COMPLETENESS — PROF-1

   Deliberately a PORT of the blank test in `suggest-species/index.ts`, not a
   second opinion. The tile has to agree with what "Ask Claude" will actually
   fill, or it can never reach zero — the uncompletable-count problem NAME-4
   and TODO-2 both had to fix. If the Edge Function's FIELDS, SENTINELS or
   HYBRID_ONLY change, change these too; they are two halves of one rule.

   `common_name` and `cultivar` are NOT counted. Claude is not asked for them
   (they are not in FIELDS), so counting them would put a permanent floor under
   the number.
   ============================================================ */
const TAXON_PROFILE_FIELDS = [
  "family", "genus", "species_epithet", "description", "plant_type",
  "growth_habit", "mature_size", "bloom_season", "origin", "native_range",
  "hardy_to", "water_needs", "frost_tender", "light_conditions",
  "parentage", "is_hybrid",

// Present, but says nothing. `origin` defaults to "unknown" on every taxon.
const TAXON_SENTINELS = { origin: ["unknown"], bloom_season: ["not_observed"] };

// that is correct — a straight species has no cross to record.
const TAXON_HYBRID_ONLY = ["parentage", "is_hybrid"];

  if (/^[x\u00D7]/i.test(g) && g.length > 1) return true;

    if (TAXON_HYBRID_ONLY.includes(f) && !hybridish) return false;
    const v = t[f];
    if (f === "frost_tender" || f === "is_hybrid") return v === null || v === undefined;
    if (Array.isArray(v)) return v.length === 0;

}
// PROF-2. An accepted or dismissed suggestion both mean Claude has been asked;
// only a taxon with no row at all is untouched.
function taxonWasAsked(t) {
