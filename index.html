            ${state.loading ? '<span class="spinner"></span>' : "Sign in"}
          </button>
        </form>
      </div>
      <p class="subtle" style="text-align:center;margin-top:22px;line-height:1.6;">
        <span style="font-size:12.5px;">© 2026 Adcock Botanical Garden. All rights reserved.</span><br/>
        <span style="font-size:10.5px;font-style:italic;letter-spacing:0.3px;">Private Botanical Collection · Authorized Access Only</span>
      </p>
    </div>
  </div>`;
}

// Page size and density are preferences rather than state — they should survive
// a reload. Everything else about the Inbox view is transient by design.
const INBOX_PREFS_KEY = "abg.inboxPrefs";
function loadInboxPrefs() {
  try {
    const raw = JSON.parse(localStorage.getItem(INBOX_PREFS_KEY) || "{}");
    if ([20, 50, 100, 250].includes(raw.pageSize)) state.inboxPageSize = raw.pageSize;
    if (raw.view === "compact" || raw.view === "grid") state.inboxView = raw.view;
  } catch (e) { /* private mode: fall back to defaults */ }
}
function saveInboxPrefs() {
  try {
    localStorage.setItem(INBOX_PREFS_KEY, JSON.stringify({ pageSize: state.inboxPageSize, view: state.inboxView }));
  } catch (e) {}
}
function setInboxPageSize(n) { state.inboxPageSize = n; state.inboxLimit = n; saveInboxPrefs(); render(); }
function setInboxView(v) { state.inboxView = v; saveInboxPrefs(); render(); }

// Sorting on capture date, not upload date. After a bulk import everything
// shares an upload timestamp, so upload order says nothing — whereas capture
// date is exactly what groups an archive era together.
function inboxPhotos() {
  const q = (state.inboxSearch || "").toLowerCase();
  let list = state.photos.filter((p) => !p.plant_id && !p.location_id);
  if (state.inboxYear) list = list.filter((p) => String(photoDate(p) || "").slice(0, 4) === state.inboxYear);
  if (q) list = list.filter((p) => (p.notes || "").toLowerCase().includes(q));
  const dir = state.inboxSort === "oldest" ? -1 : 1;
  return list.sort((a, b) => dir * (new Date(photoDate(b)) - new Date(photoDate(a))));
}

// Years present in the Inbox, so the filter offers only what is actually there.
function inboxYears() {
  const years = new Set();
  state.photos.forEach((p) => {
    if (p.plant_id || p.location_id) return;
    const y = String(photoDate(p) || "").slice(0, 4);
    if (/^\d{4}$/.test(y)) years.add(y);
  });
  return Array.from(years).sort().reverse();
}

// Compact triage row: enough to decide, not enough to admire. Roughly five
// times the density of the full card, which is what makes working through a
// four-figure Inbox feasible.
function inboxCompactRow(p, selectMode) {
  const picked = state.inboxSelected.has(p.id);
  return `
    <div class="tag-card plant-list-card" style="padding:8px 12px;position:relative;${picked ? "outline:3px solid var(--moss);" : ""}"
         onclick="${selectMode ? `toggleInboxPhotoSelected('${p.id}')` : `openInboxLightbox('${p.id}')`}">
      ${selectMode ? `<div class="select-check ${picked ? "checked" : ""}" style="top:6px;left:6px;z-index:2;">${picked ? icon("check") : ""}</div>` : ""}
      <div class="plant-list-thumb" style="width:52px;height:52px;">${photoImg(p)}</div>
      <div style="flex:1;min-width:0;">
        <div class="tag-id">${fmtDate(photoDate(p))}${photoMetaSuffix(p)}</div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:1px;">${p.notes ? escapeHtml(p.notes) : `<span class="value-blank">No notes</span>`}</div>
      </div>
      <button class="btn-ghost icon-btn" style="padding:0;font-size:12px;flex-shrink:0;" onclick="event.stopPropagation();openModal('editPhoto',{photoId:'${p.id}'})">${icon("edit")}</button>
    </div>`;
}

function screenInbox() {
  if (state.reportView) return workQueueDetail();
  const pageSize = state.inboxPageSize || 20;
  const unassigned = inboxPhotos();
  const total = state.photos.filter((p) => !p.plant_id && !p.location_id).length;
  const limit = state.inboxLimit || pageSize;
  const visible = unassigned.slice(0, limit);
  const remaining = unassigned.length - visible.length;
  const years = inboxYears();
  const filtered = !!(state.inboxYear || state.inboxSearch);
  const selectMode = state.inboxSelectMode;
  const selectedCount = state.inboxSelected.size;
  return `
  <div class="screen">
    <div class="container">
      ${screenHeader(
        /* This is inboxPhotos() — the grid BELOW the queue, which is exactly the
           same set as the "File to both" tile. Labelled "in the inbox" so it
           reads as a pointer to that grid rather than as a fourth photo count
           competing with the group total. */
        `To Do${unassigned.length ? ` <span class="pill pill-terracotta" style="vertical-align:middle;">${unassigned.length} in the inbox</span>` : ""}`,
        selectMode ? "Tap photos to select them, then choose an action below." : "Everything waiting on you — records to finish, then photos to file.",
        /* INB-2. Select used to live here, in the page header — above the whole
           work queue. You scroll down to the photos, decide to select some, and
           have to scroll back up to start. It now sits in .sticky-controls with
           the sort and search, which is position:sticky and therefore follows
           you down the grid. */
        "")}

      ${/* WEATHER-1. Above the queue, because a freeze tonight outranks every
           count below it. Suppressed in select mode along with the queue. */""}
      ${/* Undo is rendered separately from the weather banner on purpose: it
           must survive a failed or unloaded forecast, and weatherBanner()
           returns early when state.weather is null. */""}
      ${selectMode ? "" : undoStrip()}
      ${selectMode ? "" : weatherBanner()}

      ${/* The queue sits above the grid rather than behind a toggle: the counts
           are the first thing worth seeing when the app opens, and hiding them
           behind a tap is how a backlog gets forgotten. Suppressed in select
           mode, where the job is the photos in front of you. */""}
      ${selectMode ? "" : workQueue()}

      ${total === 0 ? "" : `
        <div class="sticky-controls">
        <div class="wrap-gap" style="margin-bottom:12px;align-items:center;">
          <select style="width:auto;font-size:13px;padding:7px 9px;" onchange="state.inboxSort=this.value;render()">
            <option value="newest" ${state.inboxSort === "newest" ? "selected" : ""}>Newest first</option>
            <option value="oldest" ${state.inboxSort === "oldest" ? "selected" : ""}>Oldest first</option>
          </select>
          ${years.length > 1 ? `
            <select style="width:auto;font-size:13px;padding:7px 9px;" onchange="state.inboxYear=this.value;state.inboxLimit=${pageSize};render()">
              <option value="">All years</option>
              ${years.map((y) => `<option value="${y}" ${state.inboxYear === y ? "selected" : ""}>${y}</option>`).join("")}
            </select>` : ""}
          <input id="search-inbox" placeholder="Search notes…" value="${escapeHtml(state.inboxSearch || "")}"
                 style="width:auto;flex:1;min-width:130px;font-size:13px;padding:7px 9px;"
                 oninput="state.inboxSearch=this.value;state.inboxLimit=${pageSize};scheduleRender()" />
          <button class="btn btn-secondary btn-sm icon-btn" onclick="setInboxView('${state.inboxView === "compact" ? "grid" : "compact"}')" title="Switch between full cards and compact rows">
            ${state.inboxView === "compact" ? icon("photo") + " Full" : icon("clipboard") + " Compact"}
          </button>
          ${/* INB-2. Last in the row, so entering select mode does not reflow
               the controls to its left. Accented while active because in select
               mode a tap means something different everywhere on the screen. */""}
          ${/* `|| selectMode` is not redundant: filter down to zero matches while
               selecting and `unassigned.length` is 0, which would take Cancel
               away and leave no way out of select mode — the bulk bar only
               appears once something is selected. */""}
          ${unassigned.length || selectMode ? `
            <button class="btn ${selectMode ? "btn-accent" : "btn-secondary"} btn-sm" onclick="toggleInboxSelectMode()">
              ${selectMode ? "Cancel" : "Select"}
            </button>` : ""}
        </div>
        ${selectMode ? `
          <div class="row" style="margin-bottom:10px;">
            <button class="btn-ghost" style="font-size:12.5px;" onclick="selectAllInboxPhotos()">
              ${visible.length && visible.every((p) => state.inboxSelected.has(p.id)) ? "Clear selection" : `Select all ${visible.length} shown`}
            </button>
            ${unassigned.length > visible.length ? `
              <button class="btn-ghost" style="font-size:12.5px;color:var(--blue);" onclick="selectAllMatchingInbox()">
                Select all ${unassigned.length} matching
              </button>` : ""}
            <span class="subtle" style="font-size:12px;">${state.inboxSelected.size} selected</span>
          </div>` : ""}
        <div class="row" style="margin-bottom:12px;">
          <span class="subtle">${filtered ? `${unassigned.length} of ${total}` : countLabel(total, "photo", "photos")} waiting</span>
          <span class="subtle" style="display:flex;align-items:center;gap:6px;">
            Show
            ${[20, 50, 100, 250].map((n) => `
              <button class="btn-ghost" style="padding:0 2px;font-size:12px;${pageSize === n ? "color:var(--orange);font-weight:700;" : ""}" onclick="setInboxPageSize(${n})">${n}</button>`).join("")}
          </span>
        </div>
        </div>`}

      ${/* This read "Nothing waiting" directly beneath a queue showing 2,000
           photos to file and 40 names to fix — it means "no UNFILED photos",
           which is a much narrower claim than it sounded. */""}
      ${unassigned.length === 0 ? `
        <div class="empty"><div class="display">${filtered ? "No matches" : "No unfiled photos"}</div>
        <div>${filtered ? "Try a different year or search." : "Everything you have uploaded is filed. Tap the camera button to add more."}</div>
        ${filtered ? `<button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="state.inboxYear='';state.inboxSearch='';render()">Clear filters</button>` : ""}</div>` : `
        ${state.inboxView === "compact"
          ? `<div class="stack">${visible.map((p) => inboxCompactRow(p, selectMode)).join("")}</div>`
          : `<div class="card-grid">${visible.map((p) => photoRow(p, selectMode)).join("")}</div>`}
        ${remaining > 0 ? `<button class="btn btn-secondary btn-block" style="margin-top:16px;" onclick="state.inboxLimit=(state.inboxLimit||${pageSize})+${pageSize};render()">Show ${Math.min(remaining, pageSize)} more (${remaining} left)</button>` : ""}`}
    </div>
  </div>
  ${selectMode && selectedCount > 0 ? `
    <div class="bulk-action-bar">
      <div class="container" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="mono" style="font-size:12.5px;color:var(--cream);">${selectedCount} selected</span>
        <button class="btn btn-secondary btn-sm" onclick="openModal('bulkAttachPlant')">Attach to plant</button>
        <button class="btn btn-secondary btn-sm" onclick="openModal('bulkAttachLocation')">Add Location</button>
        <button class="btn btn-secondary btn-sm icon-btn" onclick="askClaudeAboutSelection()">${icon("claude")} Ask Claude</button>
        <button class="btn btn-danger btn-sm icon-btn" onclick="bulkDeletePhotos()">${icon("trash")} Delete</button>
      </div>
    </div>` : ""}`;
}

/* WEATHER-1. Renders nothing at all when there is no weather, no risk, or the
   fetch failed — a quiet screen is the correct output most of the year. The
   frost card's whole job is the link into the frostTender report, which is
   already ordered by location path as a walking route through the garden. */
function weatherBanner() {
  const w = state.weather;
  if (!w) return "";
  const frost = frostRisk();
  const heat = heatRisk();
  const cards = [];

  if (frost) {
    const tender = state.plants.filter((pl) => pl.status === "active" && plantIsFrostTender(pl));
    const urgent = frost.level === "alert";
    cards.push(`
      <div class="wx-banner ${urgent ? "wx-urgent" : "wx-frost"}">
        ${icon("temperatureSnow")}
        <div class="wx-body">
          <div class="wx-title">${frost.event ? escapeHtml(frost.event) : (urgent ? "Freeze expected" : "Frost possible")} \u2014 ${fmtTemp(frost.day.min)} ${escapeHtml(wxDayLabel(frost.day.date))}</div>
          <div class="wx-sub">${frost.headline ? escapeHtml(frost.headline)
            : `Forecast low of ${fmtTemp(frost.day.min)}. ${countLabel(tender.length, "species marked not frost hardy is", "plants of species marked not frost hardy are")} outside.`}</div>
          ${tender.length ? `<div class="wx-act">
            <button class="btn btn-secondary btn-sm" onclick="state.reportView='frostTender';render()">Show the ${tender.length} to bring in</button>
          </div>` : ""}
        </div>
      </div>`);
  }

  if (heat) {
    const rain = recentRainInches();
    cards.push(`
      <div class="wx-banner ${heat.level === "alert" ? "wx-urgent" : "wx-heat"}">
        ${icon("temperature")}
        <div class="wx-body">
          <div class="wx-title">${heat.event ? escapeHtml(heat.event) : "Heat building"} \u2014 ${fmtTemp(heat.day.max)} ${escapeHtml(wxDayLabel(heat.day.date))}</div>
          <div class="wx-sub">${heat.headline ? escapeHtml(heat.headline)
            : `Forecast high of ${fmtTemp(heat.day.max)}. Containers dry out fastest \u2014 worth an extra check.`}${
            rain >= 0.1 ? ` ${rain.toFixed(2)}\u2033 of rain has fallen recently.` : ""}</div>
          ${(() => {
            const due = plantsNeedingWater().length;
            return due ? `<div class="wx-act">
              <button class="btn btn-secondary btn-sm" onclick="state.reportView='needsWater';render()">Show the ${due} due for water</button>
            </div>` : "";
          })()}
        </div>
      </div>`);
  }

  // The strip is the "I looked and it is fine" answer: no banner could mean no
  // risk or a failed fetch, and those are very different things.
  const today = w.days && w.days[0];
  const strip = today ? `
    <div class="wx-strip">
      <span><b>${fmtTemp(today.max)}</b> / ${fmtTemp(today.min)} today</span>
      ${today.rain >= 0.01 ? `<span><b>${today.rain.toFixed(2)}\u2033</b> rain</span>` : ""}
      <span style="opacity:0.7;">Concord \u00B7 updated ${escapeHtml(fmtTime(w.fetchedAt))}</span>
    </div>` : "";

  return cards.join("") + strip;
}

/* WATER-1. "Water everything" is one tap and can be the wrong tap. This is the
   way back, and it stays until dismissed rather than vanishing with a toast. */
function undoStrip() {
  const b = state.lastWaterBatch;
  if (!b) return "";
  return `
    <div class="wx-banner" style="border-color:rgba(124,167,161,0.4);">
      ${icon("droplets")}
      <div class="wx-body">
        <div class="wx-title">Watered ${b.count} ${b.count === 1 ? "plant" : "plants"}${b.label ? ` \u2014 ${escapeHtml(b.label)}` : ""}</div>
        <div class="wx-act" style="display:flex;gap:14px;">
          <button class="btn-ghost" style="padding:0;font-size:12.5px;color:var(--terracotta);" onclick="undoWateringBatch('${b.batchId}',${b.count})">Undo</button>
          <button class="btn-ghost" style="padding:0;font-size:12.5px;" onclick="state.lastWaterBatch=null;render()">Dismiss</button>
        </div>
      </div>
    </div>`;
}

function fmtTime(ms) {
  try {
    return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) { return ""; }
}

function photoRow(p, selectMode) {
  const suggestions = pendingIdentifications(p.id);
  const plantnetSuggestion = suggestions.find((s) => s.source === "PlantNet");
  const claudeSuggestion = suggestions.find((s) => s.source === "Claude");
  const isIdentifying = state.identifyingPhotoId === p.id;
  const isSelected = state.inboxSelected.has(p.id);

  // Shared with the Location feed and the Gallery. Inert while selecting: a tap
  // there is choosing the photo, not opening a comparison.
  const suggestionBadge = (sg) => identificationBadge(sg, { inert: selectMode });

  return `
  <div class="tag-card" style="padding:0;overflow:hidden;${selectMode ? `cursor:pointer;outline:${isSelected ? "3px solid var(--moss)" : "none"};` : ""}" ${selectMode ? `onclick="toggleInboxPhotoSelected('${p.id}')"` : ""}>
    <div class="card-media ratio-4x3" ${!selectMode ? `onclick="openInboxLightbox('${p.id}')"` : ""} style="cursor:${!selectMode ? "pointer" : "default"};">
      ${selectMode ? `<div class="select-check ${isSelected ? "checked" : ""}" style="top:8px;left:8px;z-index:1;">${isSelected ? icon("check") : ""}</div>` : ""}
      ${photoImg(p)}
    </div>
    <div style="padding:12px 14px 14px;">
      <div class="tag-id">Photo · ${fmtDate(photoDate(p))}</div>
      <div style="font-size:13.5px;margin-top:2px;color:var(--ink-soft);cursor:pointer;" onclick="openModal('editPhotoNote',{photoId:'${p.id}'})">${p.notes ? escapeHtml(p.notes) : "No notes — tap to add"}</div>
      ${plantnetSuggestion ? suggestionBadge(plantnetSuggestion) : ""}
      ${claudeSuggestion ? suggestionBadge(claudeSuggestion) : ""}
      ${suggestionBlock(p.id, true)}
      ${/* INB-1. Six same-weight buttons on every card, wrapping to two rows,
           on 1,929 cards. The two that actually move a photo out of the Inbox
           — a plant or a location — are promoted; identification and the rest
           become icons. And the location one is a jump list of the places she
           just used, because filing runs in streaks: twenty photos off the
           same shelf, then twenty off the next. */""}
      ${!selectMode ? `
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;">
        ${/* INB-1's two promoted primaries stay promoted — they are the pair
             that actually moves a photo out of the Inbox. Everything else now
             comes from the shared row so the Inbox cannot drift from the rest
             of the app again. */""}
        <button class="btn btn-accent btn-sm icon-btn" onclick="openModal('assignPlants',{photoId:'${p.id}'})">${icon("link")} Plant</button>
        <button class="btn btn-secondary btn-sm btn-on-cream icon-btn" onclick="openModal('attachLocation',{photoId:'${p.id}'})">${icon("pin")} Location</button>
        <div style="display:flex;gap:12px;margin-left:auto;align-items:center;">
          ${photoActionsHtml(p, { mode: "inbox", variant: "card", cls: "btn-ghost on-cream-icon", style: "", iconOnly: true, omit: ["plants", "location"] })}
        </div>
      </div>
      ${(() => {
        // The jump list: places she filed to most recently, plus the archives,
        // one tap each. Recents come from the shared location picker, so using
        // the full picker teaches this list what to offer.
        const recents = recentLocationIds().map(locationById).filter(Boolean);
        const archives = state.locations.filter((l) => l.gallery_row === "archives" && !l.archived);
        const chip = (l, fn) => `<button class="btn-ghost" style="font-size:11.5px;padding:3px 9px;border:1px solid rgba(37,41,37,0.18);border-radius:20px;" onclick="${fn}">${escapeHtml(l.name)}</button>`;
        // Five archives as chips wrapped to three rows on every one of 1,929
        // cards. They are a closed, rarely-changing set, which is what a select
        // is for. Recents stay one-tap: they are the streak, and the whole
        // point is not to open anything.
        return `
          ${recents.length || archives.length ? `
          <div class="wrap-gap" style="margin-top:9px;align-items:center;gap:6px;">
            ${recents.length ? `<span class="subtle" style="font-size:11px;letter-spacing:0.3px;text-transform:uppercase;">Recent</span>` : ""}
            ${recents.slice(0, 3).map((l) => chip(l, `attachPhotoToLocation('${p.id}','${l.id}')`)).join("")}
            ${archives.length ? `
              <select style="width:auto;font-size:11.5px;padding:4px 7px;margin-left:auto;"
                      onchange="if(this.value)fileToArchiveLocation('${p.id}',this.value)">
                <option value="">Former home…</option>
                ${archives.map((l) => `<option value="${l.id}">${escapeHtml(l.name)}</option>`).join("")}
              </select>` : ""}
          </div>` : ""}`;
      })()}` : ""}
    </div>
  </div>`;
}

// SPECIES-1. The Plants tab now browses taxa; specimens live one level down.
function taxonCard(t) {
  const specimens = specimensOfTaxon(t.id);
  const locs = locationsOfTaxon(t.id);
  const cover = taxonCoverPhoto(t);
  const secondary = taxonSecondaryName(t);
  return `
    <div class="tag-card plant-list-card" onclick="openTaxon('${t.id}')">
      <div class="plant-list-thumb">
        ${cover ? photoImg(cover) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
      </div>
      <div style="flex:1;min-width:0;">
        <div class="tag-id">${escapeHtml(listOptionsFor("plant_type")[t.plant_type] || t.plant_type || "Unclassified")}</div>
        <div style="font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-top:2px;line-height:1.25;">${taxonDisplayHtml(t)}${isFrostTender(t) ? " " + frostBadge() : ""}</div>
        ${(() => {
          const n = suggestionsForTaxon(t.id).length;
          return n ? `<div style="font-size:11px;color:var(--blue);margin-top:3px;">${countLabel(n, "suggestion", "suggestions")} waiting</div>` : "";
        })()}
        ${(() => {
          // PROF-1. Only while filtering, and it names the fields rather than
          // showing a bare count — "6 blank" sends her to open the record to
          // find out which, which is the trip the list exists to save.
          if (!state.taxaIncompleteOnly) return "";
          const gaps = taxonProfileGaps(t);
          if (!gaps.length) return "";
          const names = gaps.map((f) => FIELD_LABELS[f] || f);
          const shown = names.slice(0, 4).join(", ");
          return `<div style="font-size:11px;color:var(--orange);margin-top:3px;">
            ${gaps.length} of ${taxonProfileFieldCount(t)} blank &middot; ${escapeHtml(shown)}${names.length > 4 ? ` +${names.length - 4} more` : ""}
            ${taxonWasAsked(t) ? `<span class="subtle" style="color:var(--moss-dim);"> &middot; Claude already asked</span>` : ""}</div>`;
        })()}
        ${secondary ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:1px;">${escapeHtml(secondary)}</div>` : ""}
        <div class="row" style="margin-top:8px;">
          <div class="mono" style="font-size:11px;color:var(--moss-dim);">${countLabel(specimens.length, "specimen", "specimens")}</div>
          ${locs.length ? `<div style="font-size:11px;color:var(--blue);">${locs.length === 1 ? escapeHtml(locs[0].name) : locs.length + " locations"}</div>` : ""}
        </div>
      </div>
    </div>`;
}

function screenTaxa() {
  const q = (state.taxaSearch || "").toLowerCase();
  const list = state.taxa.filter((t) => {
    if (state.taxaOnlySuggestions && !suggestionsForTaxon(t.id).length) return false;
    if (state.taxaOnlyMissingParts && !taxonMissingNameParts(t)) return false;
    if (state.taxaIncompleteOnly) {
      if (!taxonProfileGaps(t).length) return false;
      if (state.taxaNeverAskedOnly && taxonWasAsked(t)) return false;
      if (taxonProfileGaps(t).length < (state.taxaMinGaps || 0)) return false;
    }
    if (!q) return true;
    const hay = [taxonDisplayName(t), t.common_name, t.botanical_name, t.genus, t.family, t.working_label]
      .filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }).sort((a, b) => taxonDisplayName(a).localeCompare(taxonDisplayName(b)));

  return `
  <div class="screen">
    <div class="container">
      ${screenHeader("Plants",
        `${countLabel(state.taxa.length, "kind", "kinds")} · ${countLabel(state.plants.length, "specimen", "specimens")}`,
        `<button class="btn btn-secondary btn-sm" onclick="openModal('batchAdd')">+ Batch</button>
         <button class="btn btn-accent btn-sm" onclick="openModal('newPlant')">+ New Plant</button>`)}
      ${state.taxaOnlyMissingParts ? `
        ${/* Was `on-cream-ground`, which sets dark ink and supplies NO
             background — it exists for use inside a cream card. On the dark
             Plants page that rendered near-invisible. */""}
        <div class="filter-note" style="margin-bottom:14px;">
          <div class="row">
            <span class="filter-note-head">Names stored as free text only</span>
            <button class="btn-ghost" style="font-size:12.5px;color:var(--blue);" onclick="state.taxaOnlyMissingParts=false;render()">Show all</button>
          </div>
          <p class="subtle" style="margin:6px 0 0;font-size:12.5px;">No genus, epithet or cultivar recorded, so these cannot group with their relatives and the name cannot be styled per part. Open one and use <strong>Check the name and split it up</strong>.</p>
        </div>` : ""}
      ${state.taxaIncompleteOnly ? (() => {
        const all = taxaIncompleteProfiles();
        const shown = taxaIncompleteFiltered();
        const asked = all.filter(taxonWasAsked).length;
        const hidden = all.length - shown.length;
        const chip = (on, label, onclick) => `
          <button class="btn-ghost" style="font-size:11.5px;padding:3px 10px;border-radius:20px;
            border:1px solid ${on ? "var(--orange)" : "rgba(245,239,227,0.25)"};
            color:${on ? "var(--orange)" : "var(--cream)"};" onclick="${onclick}">${label}</button>`;
        return `
        <div class="filter-note" style="margin-bottom:14px;">
          <div class="row">
            <span class="filter-note-head">Species with gaps in the profile</span>
            <button class="btn-ghost" style="font-size:12.5px;color:var(--blue);" onclick="state.taxaIncompleteOnly=false;render()">Show all</button>
          </div>
          <p class="subtle" style="margin:6px 0 0;font-size:12.5px;">
            Showing <strong>${shown.length}</strong> of ${all.length} incomplete${hidden ? `, ${hidden} filtered out` : ""}. Emptiest first. Open one and use <strong>Ask Claude</strong> &mdash; it proposes every blank at once and you accept them one by one.
          </p>
          ${/* PROF-2. A third of the list being two fields short is not a queue,
               it is a wall. These two chips are the difference between "here is
               everything wrong" and "here is where an Ask pays". */""}
          <div class="wrap-gap" style="margin-top:9px;align-items:center;gap:7px;">
            ${chip(state.taxaNeverAskedOnly, `Never asked Claude${asked ? ` (hides ${asked})` : ""}`,
                   "state.taxaNeverAskedOnly=!state.taxaNeverAskedOnly;render()")}
            <span class="subtle" style="font-size:11.5px;">At least</span>
            <select style="width:auto;font-size:11.5px;padding:3px 7px;"
                    onchange="state.taxaMinGaps=parseInt(this.value,10);render()">
              ${[0, 3, 5, 8, 12].map((v) => `<option value="${v}" ${(state.taxaMinGaps || 0) === v ? "selected" : ""}>${v === 0 ? "any" : v} blank</option>`).join("")}
            </select>
          </div>
          <p class="subtle" style="margin:8px 0 0;font-size:12px;">Counts the same fields Claude is asked to fill, so the number can actually reach zero. Common name and cultivar are not counted &mdash; Claude is not asked for those.</p>
        </div>`;
      })() : ""}
      ${state.taxaOnlySuggestions ? `
        <div class="row" style="margin-bottom:12px;">
          <span class="subtle">Showing only species Claude has suggestions for</span>
          <button class="btn-ghost" style="font-size:12.5px;color:var(--blue);" onclick="state.taxaOnlySuggestions=false;render()">Show all</button>
        </div>` : ""}
      <input class="search-input" placeholder="Search name, genus, family…" value="${escapeHtml(state.taxaSearch || "")}" id="search-taxa" oninput="state.taxaSearch=this.value;scheduleRender()" />
      ${/* The counts and the two buttons moved into screenHeader() in v2.1.0 and
           this row was left behind, so the whole lot rendered twice. Only the
           filtered count was unique to it, and that now lives in the header. */""}
      ${q ? `<div class="subtle" style="margin-bottom:16px;">${list.length} of ${countLabel(state.taxa.length, "kind", "kinds")} match</div>` : ""}
      ${list.length === 0 ? `
        <div class="empty"><div class="display">${state.taxa.length === 0 ? "No plants yet" : "No matches"}</div>
        <div>${state.taxa.length === 0 ? "Add your first plant from a photo." : "Try a different search."}</div></div>` : `
        <div class="card-grid">${list.map(taxonCard).join("")}</div>`}

      ${/* This tab lists taxa, so a specimen with no taxon would otherwise be
           unreachable. Surface them rather than letting them disappear. */""}
      ${(() => {
        const orphans = state.plants.filter((p) => !p.taxa_id);
        if (orphans.length === 0) return "";
        return `
        <div class="row" style="margin-top:26px;margin-bottom:8px;">
          <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Not linked to a species</h3>
          <span class="subtle">${countLabel(orphans.length, "specimen", "specimens")}</span>
        </div>
        <p class="subtle" style="margin:-4px 0 12px;">Open one and use Edit full record to give it a name, or link it from the species record.</p>
        <div class="card-grid">${orphans.map(plantRow).join("")}</div>`;
      })()}
    </div>
  </div>`;
}

function screenTaxonDetail() {
  const t = taxonById(state.currentTaxonId);
  if (!t) return `<div class="screen container"><p>Plant not found.</p></div>`;
  const roots = rootSpecimensOfTaxon(t.id);
  const all = specimensOfTaxon(t.id);
  const locs = locationsOfTaxon(t.id);
  const cover = taxonCoverPhoto(t);

  // Specimens render as a lineage tree — purchases at top level, propagated
  // offsets nested under the plant they came off. They share a name by
  // definition, so location and health are what tell them apart, never the name.
  const specimenRow = (sp, depth) => {
    const loc = sp.location_id ? locationById(sp.location_id) : null;
    const kids = offspringOf(sp.id, t.id);
    const cov = plantCoverPhoto(sp);
    return `
      <div class="tag-card plant-list-card" style="margin-left:${depth * 18}px;padding:10px 12px;" onclick="openPlant('${sp.id}')">
        <div class="plant-list-thumb" style="width:56px;height:56px;">
          ${cov ? photoImg(cov) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
        </div>
        <div style="flex:1;min-width:0;">
          <div class="row">
            <div class="mono tag-id">${sp.accession_number}</div>
            <span class="pill-solid ${healthPillClass(sp)}">${HEALTH_LABELS[sp.health_status] || sp.health_status}</span>
          </div>
          <div style="font-size:13px;color:var(--ink);margin-top:3px;">${loc ? "📍 " + escapeHtml(locationPath(loc)) : `<span class="value-blank">No location</span>`}</div>
          ${depth > 0 ? `<div style="font-size:11px;color:var(--blue);margin-top:2px;">${icon("seedling")} propagated</div>` : ""}
        </div>
      </div>
      ${kids.map((k) => specimenRow(k, depth + 1)).join("")}`;
  };

  return `
  <div class="screen">
    <div class="container">
      <button class="back-link" onclick="navBack()">${icon("back")}<span class="back-label">${escapeHtml(navBackLabel("Plants"))}</span></button>

      <div class="tag-card" style="padding:0;overflow:hidden;">
        <div class="detail-split">
          <div class="detail-media">
            <div class="card-media ratio-4x3" style="cursor:pointer;" onclick="openModal('chooseTaxonPhoto',{taxonId:'${t.id}'})">
              ${cover ? photoImgEager(cover) : `<div class="card-media-empty">${icon("photo")}<span>No photos yet</span></div>`}
              <button class="media-btn" onclick="event.stopPropagation();openModal('chooseTaxonPhoto',{taxonId:'${t.id}'})">${cover ? "Change photo" : "Choose photo"}</button>
            </div>
          </div>
          <div class="detail-body">
            <div class="tag-id">${escapeHtml(listOptionsFor("plant_type")[t.plant_type] || t.plant_type || "Unclassified")}${t.family ? " · " + escapeHtml(t.family) : ""}</div>
            <div class="display" style="font-size:25px;font-weight:600;margin-top:4px;line-height:1.2;">${taxonDisplayHtml(t)}</div>
            ${isFrostTender(t) ? `<div style="margin-top:6px;">${frostBadge("full")}</div>` : ""}
            ${(() => {
              const rows = suggestionsForTaxon(t.id);
              if (!rows.length) return "";
              return `
                <div class="on-cream-ground" style="margin-top:12px;">
                  <div class="row" style="margin-bottom:2px;">
                    <span class="suggestion-head">Claude suggests ${countLabel(rows.length, "value", "values")}</span>
                    <button type="button" class="btn-ghost" style="padding:0;font-size:12px;color:var(--blue);" onclick="acceptAllSpeciesSuggestions('${t.id}')">Accept all</button>
                  </div>
                  ${rows.map(suggestionLine).join("")}
                </div>`;
            })()}
            ${taxonSecondaryName(t) ? `<div style="color:var(--ink);font-size:14.5px;margin-top:3px;font-weight:500;">${escapeHtml(taxonSecondaryName(t))}</div>` : ""}
            ${t.description ? `<div style="margin-top:12px;font-size:14px;color:var(--ink-soft);line-height:1.5;">${escapeHtml(t.description)}</div>` : ""}
            <div style="margin-top:12px;font-size:13px;color:var(--ink);">
              ${countLabel(all.length, "specimen", "specimens")}${locs.length ? ` in ${countLabel(locs.length, "location", "locations")}` : ""}
            </div>
          </div>
          <div class="detail-actions">
            <div class="action-card">
              <button class="action-row" onclick="openModal('editTaxon',{taxonId:'${t.id}'})">${icon("edit")}<span class="action-label">Edit species record</span><span class="action-chevron">${icon("chevronRight")}</span></button>
              ${/* AI-2. No photograph: every field here follows from the name,
                   so a text call answers it for a tenth of the cost. */""}
              ${/* NAME-2. A separate ask, because it is a different question:
                   "fill the blanks" never touches what she has already typed,
                   which is exactly why a misspelled name could not be fixed. */""}
              <button class="action-row" ${state.suggestingTaxaId === t.id ? "disabled" : ""} onclick="askClaudeAboutSpecies('${t.id}',{focus:'name'})">
                ${state.suggestingTaxaId === t.id ? '<span class="spinner"></span>' : icon("claude")}
                <span class="action-label">${state.suggestingTaxaId === t.id ? "Asking Claude…" : "Check the name and split it up"}</span>
                <span class="action-chevron">${icon("chevronRight")}</span>
              </button>
              <button class="action-row" ${state.suggestingTaxaId === t.id ? "disabled" : ""} onclick="askClaudeAboutSpecies('${t.id}')">
                ${state.suggestingTaxaId === t.id ? '<span class="spinner"></span>' : icon("claude")}
                <span class="action-label">${state.suggestingTaxaId === t.id ? "Asking Claude…" : "Ask Claude to fill the blanks"}</span>
                <span class="action-chevron">${icon("chevronRight")}</span>
              </button>
              <button class="action-row" onclick="openModal('newSpecimen',{taxonId:'${t.id}'})">${icon("seedling")}<span class="action-label">Add a specimen</span><span class="action-chevron">${icon("chevronRight")}</span></button>
              <button class="action-row" onclick="openModal('chooseTaxonPhoto',{taxonId:'${t.id}'})">${icon("photoStar")}<span class="action-label">Set species photo</span><span class="action-chevron">${icon("chevronRight")}</span></button>
            </div>
          </div>
        </div>
      </div>

      <div class="section-grid">
        <div class="section-card">
          <h4>Taxonomy</h4>
          ${fieldRow("clipboard", "Family", t.family)}
          ${fieldRow("clipboard", "Genus", t.genus)}
          ${fieldRow("clipboard", "Species", t.species_epithet)}
          ${fieldRow("clipboard", "Infraspecific", infraspecificLabel(t.infraspecific))}
          ${fieldRow("tag", "Cultivar", cultivarLabel(t.cultivar))}
          ${fieldRow("seedling", "Parentage", t.parentage)}
        </div>
        <div class="section-card">
          <h4>Details</h4>
          ${fieldRow("leaf", "Type", listOptionsFor("plant_type")[t.plant_type] || t.plant_type)}
          ${fieldRow("seedling", "Growth habit", listOptionsFor("growth_habit")[t.growth_habit] || t.growth_habit)}
          ${fieldRow("map", "Mature size", t.mature_size)}
          ${fieldRow("plant2", "Bloom season", listOptionsFor("bloom_season")[t.bloom_season] || t.bloom_season)}
          ${fieldRow("pin", "Origin", ORIGIN_LABELS[t.origin] || t.origin)}
        </div>
        <div class="section-card">
          <h4>Care</h4>
          ${fieldRow("leaf", "Native to", t.native_range)}
          ${fieldRow("temperature", "Hardy to", t.hardy_to)}
          ${fieldRow("droplets", "Water", t.water_needs ? t.water_needs.charAt(0).toUpperCase() + t.water_needs.slice(1) : null)}
          ${fieldRow("brightness", "Light", null,
            (t.light_conditions && t.light_conditions.length)
              ? `<span class="wrap-gap" style="justify-content:flex-end;">${t.light_conditions.map((c) => `<span class="pill">${escapeHtml(c.replace(/_/g, " "))}</span>`).join("")}</span>`
              : null)}
        </div>
        ${taskSectionFor("taxa", t.id)}
      </div>

      <div class="row" style="margin-top:26px;margin-bottom:8px;">
        <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Specimens</h3>
        <button class="btn btn-secondary btn-sm" onclick="openModal('newSpecimen',{taxonId:'${t.id}'})">+ Add specimen</button>
      </div>
      ${all.length === 0
        ? `<div class="empty" style="padding:28px 20px;"><div>No specimens of this plant yet.</div><div class="subtle">Add one and pick the pot or bucket it lives in.</div></div>`
        : `<div class="stack">${roots.map((sp) => specimenRow(sp, 0)).join("")}</div>`}

      ${(() => {
        const proposed = suggestedPhotosForTaxon(t.id);
        if (!proposed.length) return "";
        return `
        <div class="row" style="margin-top:26px;margin-bottom:8px;">
          <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Claude thinks these are ${taxonDisplayHtml(t)}</h3>
          <span class="subtle">${countLabel(proposed.length, "photo", "photos")}</span>
        </div>
        <p class="subtle" style="margin:-4px 0 12px;font-size:12.5px;">Not filed yet. Accept to attach the photo, or dismiss and file it yourself.</p>
        <div class="card-grid">
          ${proposed.map(({ sg, photo }) => {
            const sp = sg.kind === "plant_tag" ? state.plants.find((x) => x.id === sg.value_id) : null;
            const loc = photo.location_id ? locationById(photo.location_id) : null;
            return `
            <div class="tag-card" style="padding:0;overflow:hidden;border-color:rgba(124,167,161,0.5);">
              <div class="card-media ratio-1x1" style="cursor:pointer;" onclick="openGalleryLightbox('${photo.id}')">${photoImg(photo)}</div>
              <div style="padding:9px 11px;">
                <div class="tag-id">${fmtDate(photoDate(photo))}${photoMetaSuffix(photo)}</div>
                <div style="font-size:12px;margin-top:2px;">${sp
                  ? `${escapeHtml(sp.accession_number)}`
                  : `<span style="color:var(--blue);">New specimen</span>`}</div>
                <div style="font-size:11px;color:var(--ink-soft);">${loc ? escapeHtml(locationPath(loc)) : `<span class="value-blank">No location</span>`}</div>
                ${sg.rationale ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.3;">${escapeHtml(sg.rationale)}</div>` : ""}
                <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
                  <button class="btn btn-accent btn-sm" onclick="acceptSuggestion('${sg.id}')">Accept</button>
                  <button class="btn-ghost" style="padding:0;font-size:12px;color:var(--terracotta);" onclick="dismissSuggestion('${sg.id}')">Dismiss</button>
                </div>
              </div>
            </div>`;
          }).join("")}
        </div>`;
      })()}

      ${(() => {
        const shots = taxonPhotos(t.id);
        if (!shots.length) return "";
        const limit = state.taxonPhotoLimit || 24;
        const shown = shots.slice(0, limit);
        return `
        <div class="row" style="margin-top:26px;margin-bottom:8px;">
          <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Photos</h3>
          <span class="subtle">${countLabel(shots.length, "photo", "photos")} across ${countLabel(all.length, "specimen", "specimens")}</span>
        </div>
        <div class="card-grid">
          ${shown.map(({ photo, specimen }) => {
            const loc = photo.location_id ? locationById(photo.location_id) : null;
            return `
            <div class="tag-card" style="padding:0;overflow:hidden;">
              <div class="card-media ratio-1x1" style="cursor:pointer;" onclick="openLightbox('${specimen.id}','${photo.id}')">${photoImg(photo)}</div>
              <div style="padding:9px 11px;">
                <div class="tag-id">${fmtDate(photoDate(photo))}${photoMetaSuffix(photo)}</div>
                <div class="mono" style="font-size:11px;color:var(--moss-dim);margin-top:2px;cursor:pointer;" onclick="openPlant('${specimen.id}')">${specimen.accession_number}</div>
                <div style="font-size:11px;color:var(--ink-soft);">${loc ? escapeHtml(loc.name) : `<span class="value-blank">No location</span>`}</div>
                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">
                  ${photoActionsHtml(photo, { mode: "taxon", plantId: specimen.id, variant: "card", style: "padding:0;font-size:11.5px;", iconOnly: true })}
                </div>
              </div>
            </div>`;
          }).join("")}
        </div>
        ${shots.length > limit ? `<button class="btn btn-secondary btn-block" style="margin-top:12px;" onclick="state.taxonPhotoLimit=${limit + 24};render()">Show more — ${limit} of ${shots.length}</button>` : ""}`;
      })()}
    </div>
  </div>`;
}

function plantRow(pl) {
  const photos = plantPhotosOrdered(pl.id);
  const cover = plantCoverPhoto(pl);
  const attention = needsAttention(pl);
  const urgent = isUrgent(pl);

  return `
  <div class="tag-card plant-list-card" onclick="openPlant('${pl.id}')">
    <div class="status-badge ${urgent ? "status-urgent" : attention ? "status-attention" : "status-active"}" title="${urgent ? "Urgent care" : attention ? "Needs attention" : "Active & healthy"}">${attention ? icon("alertTriangle") : icon("check")}</div>
    <div class="plant-list-thumb">
      ${cover ? photoImg(cover) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
    </div>
    <div style="flex:1;min-width:0;">
      <div class="tag-id">${pl.accession_number}</div>
      <div style="font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-top:2px;line-height:1.25;">${plantDisplayHtml(pl)}${plantIsFrostTender(pl) ? " " + frostBadge() : ""}</div>
      ${(() => {
        const t = pl.taxa_id ? taxonById(pl.taxa_id) : null;
        return t && t.common_name ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:1px;">${escapeHtml(t.common_name)}</div>` : "";
      })()}
      <div class="wrap-gap" style="margin-top:7px;">
        ${pl.collection_category === "historical" ? `<span class="pill-solid pill-solid-outline">Historical</span>` : ""}
        ${pl.original_collection ? `<span class="pill-solid pill-solid-pink">Original</span>` : ""}
        ${pl.status !== "active" ? `<span class="pill-solid pill-solid-terracotta">${STATUS_LABELS[pl.status]}</span>` : ""}
      </div>
      ${/* The Locations list card has carried inline Edit and Add-photos since
           LOC-2; the Plants list — the one she uses most — had no inline action
           at all, so every change meant opening the record first. Same two
           affordances, same place. */""}
      <div class="row" style="margin-top:8px;">
        <div style="display:flex;gap:14px;">
          <button class="btn-ghost on-cream-icon" title="Edit this plant" onclick="event.stopPropagation();openModal('editPlant',{plantId:'${pl.id}'})">${icon("edit")}</button>
          <button class="btn-ghost on-cream-icon" title="Add a photo of this plant" onclick="event.stopPropagation();openModal('upload',{plantId:'${pl.id}'})">${icon("photoPlus")}</button>
        </div>
        <div class="mono" style="font-size:11px;color:var(--moss-dim);flex-shrink:0;">${countLabel(photos.length, "photo", "photos")}</div>
      </div>
    </div>
  </div>`;
}

function screenPlantDetail() {
  const pl = state.plants.find((p) => p.id === state.currentPlantId);
  if (!pl) return `<div class="screen container"><p>Plant not found.</p></div>`;
  const loc = locationById(pl.location_id);
  const parent = pl.parent_plant_id ? state.plants.find((p) => p.id === pl.parent_plant_id) : null;
  const taxon = pl.taxa_id ? taxonById(pl.taxa_id) : null;
  const photos = plantPhotosOrdered(pl.id);
  // Reference/ID photos (e.g. a profile picture that isn't a dated
  // observation of this exact specimen) are excluded from the timeline list.
  // Previously excluded `identification` photos. That type is gone: a photo of
  // the plant belongs in its timeline whatever it was taken for.
  const timelinePhotos = photos;

  const primaryPhoto = pl.primary_photo_id ? photos.find((p) => p.id === pl.primary_photo_id) : null;
  const heroPhoto = primaryPhoto || photos[0] || null;

  return `
  <div class="screen">
    <div class="container">
      <button class="back-link" onclick="navBack()">${icon("back")}<span class="back-label">${escapeHtml(navBackLabel(taxon ? taxonDisplayName(taxon) : "Plants"))}</span></button>

      <div class="tag-card" style="padding:0;overflow:hidden;">
        <div class="detail-split">
        <div class="detail-media">
          <div class="card-media ratio-4x3" style="cursor:pointer;" ${heroPhoto ? `onclick="openLightbox('${pl.id}','${heroPhoto.id}')"` : `onclick="openModal('choosePrimaryPhoto',{plantId:'${pl.id}'})"`}>
            ${heroPhoto
              ? photoImgEager(heroPhoto)
              : `<div class="card-media-empty">${icon("photo")}<span>Tap to add a profile picture</span></div>`}
            <button class="media-btn" onclick="event.stopPropagation();openModal('choosePrimaryPhoto',{plantId:'${pl.id}'})">${heroPhoto ? "Change photo" : "Add photo"}</button>
          </div>
        </div>

        <div class="detail-body">
          <div class="tag-id">${pl.accession_number}</div>
          <div class="display" style="font-size:25px;font-weight:600;margin-top:4px;line-height:1.2;">${plantDisplayHtml(pl)}</div>
          ${plantIsFrostTender(pl) ? `<div style="margin-top:6px;">${frostBadge("full")}</div>` : ""}
          ${(() => {
            const common = taxon && taxon.common_name;
            const lineage = taxon ? [taxon.family, taxon.genus].filter(Boolean).join(" · ") : "";
            return `
            ${common ? `<div style="color:var(--ink);font-size:14.5px;margin-top:3px;font-weight:500;">${escapeHtml(common)}</div>` : ""}
            ${lineage ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:5px;letter-spacing:0.2px;">${escapeHtml(lineage)}</div>` : ""}`;
          })()}

          ${(() => { const bar = checkInSectionFor(pl); return bar ? `<div style="margin-top:13px;">${bar}</div>` : ""; })()}

          <div class="wrap-gap" style="margin-top:13px;">
            <span class="pill-solid ${pl.status === "active" ? "pill-solid-moss" : "pill-solid-terracotta"}">${STATUS_LABELS[pl.status]}</span>
            <span class="pill-solid pill-solid-outline">${CATEGORY_LABELS[pl.collection_category]}</span>
            <span class="pill-solid ${pl.identification_status === "confirmed" ? "pill-solid-moss" : "pill-solid-outline"}">${ID_STATUS_LABELS[pl.identification_status]}</span>
            ${pl.original_collection ? `<span class="pill-solid pill-solid-pink">Original Collection</span>` : ""}

// Resolution order: the location's own primary photo, then its newest direct
// photo, then the newest photo anywhere beneath it. The descendant fallback
// matters on the Locations list, which renders only top-level areas — their
// photos almost always live on nested rows and buckets, not on the area itself.
function locationCoverPhoto(l) {
  const newest = (list) => list.sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)))[0] || null;
  const photos = photosAtLocation(l.id);
  if (l.primary_photo_id) {
    const primary = photos.find((p) => p.id === l.primary_photo_id);
    if (primary) return primary;
  }
  const own = newest(photos);
  if (own) return own;
  const seen = new Set();
  const beneath = [];
  descendantLocationIds(l.id).forEach((id) => {
    photosAtLocation(id).forEach((p) => { if (!seen.has(p.id)) { seen.add(p.id); beneath.push(p); } });
  });
  return newest(beneath);
}

// Counts roll up through nested areas — a top-level area's plants and photos
// almost all live on the rows and buckets underneath it, so the direct-only
// counts read as zero on exactly the cards the Locations list renders.
function locationCard(l) {
  // locationCoverPhoto already walks descendants; the card simply never used
  // that. An area holding no photos of its own — most of them — showed an empty
  // placeholder while its buckets were full of pictures (LOC-5).
  const plantCount = aggregatePlantCount(l.id);
  const photoCount = aggregatePhotoCount(l.id);
  const children = directChildLocations(l.id);
  const cover = locationCoverPhoto(l);
  // LOC-1. Was a 92px square side thumb, which is the treatment for a specimen:
  // one plant, centred, identifiable small. A location is a *place* — a bed, a
  // wall of buckets, a yard — and a wide shot of one is unreadable at 92px. It
  // takes the PD-1 card-media band instead, full bleed at the top of the card,
  // which is what the Gallery album cards already do for the same reason.
  // 4:3 matches Location Detail's hero, so the same photo does not recompose
  // between the list and the page it opens.
  return `
    <div class="tag-card loc-card" onclick="openLocation('${l.id}')">
      <div class="card-media ratio-4x3">
        ${cover ? photoImg(cover) : `<div class="card-media-empty">${icon("photo")}<span>No photos yet</span></div>`}
      </div>
      ${/* Counts sat beside the name in a right-aligned column, so "4026
           Sacramento Creation" wrapped to three lines to make room for
           "0 plants · 3 photos". The name is what identifies the card; it gets
           the full width and the counts go underneath. */""}
      <div class="loc-card-body">
        <div class="tag-id">${locationTypeLabel(l.type)}${l.code ? " · " + escapeHtml(l.code) : ""}</div>
        <div style="font-family:'Fraunces',serif;font-size:15px;font-weight:500;margin-top:2px;line-height:1.25;">${escapeHtml(l.name)}</div>
        <div class="mono" style="font-size:11px;color:var(--moss-dim);margin-top:4px;">${countLabel(plantCount, "plant", "plants")} · ${countLabel(photoCount, "photo", "photos")}${children.length ? ` · <span style="color:var(--blue);">${nestedCountLabel(children)} →</span>` : ""}</div>
        <div style="display:flex;gap:14px;margin-top:10px;">
          <button class="btn-ghost on-cream-icon" title="Edit this location" onclick="event.stopPropagation();openModal('editLocation',{locationId:'${l.id}'})">${icon("edit")}</button>
          <button class="btn-ghost on-cream-icon" title="Add photos here" onclick="event.stopPropagation();openModal('upload',{locationId:'${l.id}'})">${icon("photoPlus")}</button>
        </div>
      </div>
    </div>`;
}

function screenLocations() {
  const topLevel = state.locations.filter((l) => !l.parent_location_id).sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || a.name.localeCompare(b.name));

  return `
  <div class="screen">
    <div class="container">
      ${screenHeader("Locations",
        `${countLabel(state.locations.length, "place", "places")} · ${countLabel(topLevel.length, "area", "areas")} at the top level`,
        `<button class="btn btn-secondary btn-sm" onclick="openModal('newLocation')">+ Add</button>`)}
      ${(() => {
        if (state.locations.length === 0) return `
          <div class="empty"><div class="display">No locations yet</div><div>Add areas, rows, or containers to organize your plants.</div></div>`;
        // A former home is not somewhere you file a plant today. Mixing the two
        // meant scanning past five places the collection has left to reach the
        // Front Yard, and it made "0 plants" look like a gap rather than a fact.
        const isArchive = (l) => l.gallery_row === "archives" || l.archived;
        const active = topLevel.filter((l) => !isArchive(l));
        const archived = topLevel.filter(isArchive);
        return `
          ${active.length ? `<div class="card-grid">${active.map(locationCard).join("")}</div>` : ""}
          ${archived.length ? `
            <div class="row" style="margin-top:30px;margin-bottom:12px;">
              <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">From the Archives</h3>
              <span class="subtle">${countLabel(archived.length, "former place", "former places")}</span>
            </div>
            <p class="subtle" style="margin:-6px 0 12px;font-size:12.5px;">Places the collection used to live. Their photos still tag to specimens — that is how a plant's history across homes gets recorded.</p>
            <div class="card-grid">${archived.map(locationCard).join("")}</div>` : ""}`;
      })()}
    </div>
  </div>`;
}

function screenLocationDetail() {
  const l = locationById(state.currentLocationId);
  if (!l) return `<div class="screen container"><p>Location not found.</p></div>`;
  const plants = plantsAtLocation(l.id);
  const photos = photosAtLocation(l.id).sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));

  const heroPhoto = l.primary_photo_id ? photos.find((p) => p.id === l.primary_photo_id) : photos[0];

  return `
  <div class="screen">
    <div class="container">
      <button class="back-link" onclick="navBack()">${icon("back")}<span class="back-label">${escapeHtml(navBackLabel(l.parent_location_id && locationById(l.parent_location_id) ? locationById(l.parent_location_id).name : "Locations"))}</span></button>

      <div class="tag-card" style="padding:0;overflow:hidden;">
        <div class="detail-split">
        <div class="detail-media">
          <div class="card-media ratio-4x3" style="cursor:pointer;" ${heroPhoto ? `onclick="openLightbox('${l.id}','${heroPhoto.id}','location')"` : `onclick="openModal('chooseLocationPhoto',{locationId:'${l.id}'})"`}>
            ${heroPhoto
              ? photoImgEager(heroPhoto)
              : `<div class="card-media-empty">${icon("photo")}<span>Tap to add a main photo</span></div>`}
            <button class="media-btn" onclick="event.stopPropagation();openModal('chooseLocationPhoto',{locationId:'${l.id}'})">${heroPhoto ? "Change photo" : "Add photo"}</button>
          </div>
        </div>

        <div class="detail-body" style="padding:16px 16px 14px 20px;">
        ${(() => {
          // LOC-8. The panel was type, name, then the path — which for a
          // top-level location is the name again — and two links, leaving most
          // of it empty. What actually identifies a location is what is in it,
          // and for an archive, when and where it was.
          const kids = directChildLocations(l.id);
          const allPlants = aggregatePlantCount(l.id);
          const allPhotos = aggregatePhotoCount(l.id);
          const period = archivePeriod(l);
          const parent = l.parent_location_id ? locationById(l.parent_location_id) : null;
          const stat = (n, one, many, colour) =>
            `<div><div class="display" style="font-size:20px;font-weight:600;line-height:1;color:${colour || "var(--ink)"};">${n}</div>
             <div style="font-size:11px;color:var(--ink-soft);letter-spacing:0.3px;text-transform:uppercase;margin-top:3px;">${n === 1 ? one : many}</div></div>`;
          return `
          <div class="tag-id">${locationTypeLabel(l.type)}${l.code ? " · " + escapeHtml(l.code) : ""}${period ? " · " + escapeHtml(period) : ""}</div>
          <div class="display" style="font-size:22px;font-weight:600;margin-top:3px;">${escapeHtml(l.name)}</div>
          ${parent ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px;">${escapeHtml(locationPath(parent))}</div>` : ""}

          <div style="display:flex;gap:26px;margin-top:16px;flex-wrap:wrap;">
            ${stat(allPlants, "plant", "plants")}
            ${stat(allPhotos, "photo", "photos")}
            ${kids.length ? stat(kids.length, locationTypeLabel(kids[0].type).toLowerCase(), nestedCountLabel(kids).replace(/^\d+\s*/, "")) : ""}
          </div>
          ${(allPlants || allPhotos) && kids.length ? `<div class="subtle" style="font-size:11px;margin-top:6px;">Includes everything nested inside</div>` : ""}

          ${l.notes ? `<div style="font-size:13.5px;color:var(--ink-soft);margin-top:12px;">${escapeHtml(l.notes)}</div>` : ""}
          ${!locationHoldsPlants(l) ? `<div class="subtle" style="font-size:11.5px;margin-top:10px;">Plants are not assigned directly here — they live in the containers inside.</div>` : ""}

          ${(() => {
            // WATER-2. The rollup, not an average: "mixed — oldest 12 days"
            // is the answer that sends her somewhere, and a mean would bury
            // the one pot nobody has watered in a month.
            const w = wateringSummaryForLocation(l.id);
            if (!w) return "";
            const line = w.never === w.total ? "never watered"
              : w.never ? `${w.never} of ${w.total} never watered, rest ${fmtDaysAgo(w.newest)}`
              : w.mixed ? `mixed \u2014 oldest ${fmtDaysAgo(w.oldest)}, newest ${fmtDaysAgo(w.newest)}`
              : `all watered ${fmtDaysAgo(w.newest)}`;
            return `<div class="water-line">${icon("droplets")}${escapeHtml(line)}</div>`;
          })()}

          ${plantsUnderLocation(l.id).length ? `
          <div style="margin-top:12px;">
            ${/* btn-on-cream is not optional here: .btn-secondary is
                 color:var(--cream), which on this parchment panel rendered the
                 button as invisible text on an invisible border. */""}
            <button class="btn btn-secondary btn-on-cream btn-sm icon-btn" onclick="openWaterModal('location','${l.id}')">
              ${icon("droplets")} Water ${countLabel(plantsUnderLocation(l.id).length, "plant", "plants")} here
            </button>
          </div>` : ""}

          <div style="margin-top:14px;">
            <button class="btn-ghost" style="padding:0;font-size:12.5px;" onclick="openModal('editLocation',{locationId:'${l.id}'})">Edit location</button>
            <button class="btn-ghost" style="padding:0 0 0 14px;font-size:12.5px;color:var(--ink);font-weight:600;" onclick="openModal('removeLocation',{locationId:'${l.id}'})">Archive or delete</button>
          </div>`;
        })()}
        </div>
        </div>
      </div>

      <div style="margin-top:18px;">${taskSectionFor("location", l.id)}</div>

      ${(() => {
        // The other side of the same table: standing at Bucket 32, what left it
        // and where did it go.
        // v1.86.0 shipped this without asking whether the location expects
        // plants at all. Front Yard is an area — plants live in the containers
        // inside it — so "Previously here" was noise on exactly the screens
        // that had already opted out of plant tracking.
        if (!locationHoldsPlants(l)) return "";
        const gone = plantsPreviouslyAt(l.id);
        if (!gone.length) return "";
        return `
          <div class="section-card" style="margin-top:14px;">
            <h4 style="margin:0 0 10px;">Previously here</h4>
            <div class="stay-list">
              ${gone.map(({ h, p }) => {
                const now = p.location_id ? locationById(p.location_id) : null;
                return `
                <div class="stay">
                  <div class="stay-dot"></div>
                  <div style="flex:1;min-width:0;cursor:pointer;" onclick="openPlant('${p.id}')">
                    <div style="font-size:13.5px;">${plantDisplayHtml(p)}</div>
                    <div class="mono stay-when">${p.accession_number} · ${escapeHtml(stayRange(h))}${now ? ` · now in ${escapeHtml(locationPath(now))}` : ""}</div>
                    ${h.notes ? `<div class="stay-note">${escapeHtml(h.notes)}</div>` : ""}
                  </div>
                </div>`;
              }).join("")}
            </div>
          </div>`;
      })()}

      ${(() => {
        const children = directChildLocations(l.id);
        if (children.length === 0) return "";
        return `
          <div class="row" style="margin-top:24px;margin-bottom:12px;">
            <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Inside this ${locationTypeLabel(l.type).toLowerCase()}</h3>
            <span class="subtle">${children.length} total</span>
          </div>
          <div class="card-grid">
            ${children.map((c) => {
              const count = aggregatePlantCount(c.id);
              const photoCount = aggregatePhotoCount(c.id);
              const grandchildren = directChildLocations(c.id);
              // LOC-8. A picture is how she tells one bucket from another — 42
              // of them share a naming scheme and nothing else. The cover
              // borrows from a descendant when the child has no photo of its
              // own, so a row of full buckets is never a row of grey boxes.
              const cover = locationCoverPhoto(c);
              return `
              <div class="tag-card plant-list-card" style="cursor:pointer;padding:10px 12px;" onclick="openLocation('${c.id}')">
                <div class="plant-list-thumb" style="width:56px;height:56px;flex-shrink:0;">

                  <div class="tag-id">${locationTypeLabel(c.type)}${c.code ? " · " + escapeHtml(c.code) : ""}</div>

      })()}

      ${/* LOC-6. An area like The Wall holds no plants of its own — its photos
           are views of the whole area — so the plants block is hidden there
           rather than showing a permanent, correct zero. But plants that DO
           exist always render, whatever the flag says: a mis-set flag must
           never be able to hide a plant from its own location page. */""}
      ${(locationHoldsPlants(l) || plants.length) ? `
        <div class="row" style="margin-top:24px;margin-bottom:12px;">
          <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Plants here</h3>

          <p class="subtle" style="margin:-6px 0 12px;">This ${locationTypeLabel(l.type).toLowerCase()} isn't set up to hold plants directly — ${countLabel(plants.length, "specimen", "specimens")} assigned here probably belong in a container inside it.</p>` : ""}
        <div class="wrap-gap" style="margin-bottom:12px;">
          <button class="btn btn-accent btn-sm" onclick="openModal('newSpecimenHere',{locationId:'${l.id}'})">+ New specimen here</button>
          <button class="btn btn-secondary btn-sm" onclick="openModal('linkPlantToLocation',{locationId:'${l.id}'})">Link existing plant</button>
        </div>
        ${plants.length === 0 ? `<div class="empty" style="padding:30px 20px;"><div>No plants assigned here yet.</div></div>` : `
          <div class="card-grid">${plants.map(plantRow).join("")}</div>`}` : ""}

      ${(() => {
        // The common case, not an edge one: a photo of a container gets filed
        // to the container and never to the plant in it. 526 photos sit like
        // this. Surfacing it where the answer is obvious — standing in the
        // location, looking at what lives there — is the whole point.
        const orphans = photosAtLocation(l.id).filter((p) => !p.plant_id);
        if (!orphans.length) return "";
        const here = plantsAtLocation(l.id);
        // Where plants are not expected, the same photos are not a backlog.
        // The bulk action stays — tagging an archive shot to a specimen is the
        // point — but it reads as something available, not something owed.
        const expected = locationHoldsPlants(l);
        return `
        <div class="surface" style="padding:14px;margin-top:20px;${expected ? "border-color:var(--orange);" : ""}">
          <div class="row">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;font-size:14px;">${expected
                ? `${countLabel(orphans.length, "photo", "photos")} here with no plant`
                : `${countLabel(orphans.length, "photo", "photos")} here`}</div>
              <div class="subtle" style="font-size:12px;margin-top:2px;">${expected
                ? (here.length ? `${countLabel(here.length, "specimen lives", "specimens live")} here` : "No specimens here yet — add one first, or attach these to a plant elsewhere")
                : `${locationTypeLabel(l.type)} views are not expected to name a plant. Tag one to a specimen anywhere in the collection to add it to that plant's timeline.`}</div>
            </div>
            <button class="btn ${expected ? "btn-accent" : "btn-secondary"} btn-sm" onclick="openModal('assignLocationPhotos',{locationId:'${l.id}'})">${expected ? "Assign" : "Tag a plant"}</button>

      <div class="row" style="margin-top:26px;margin-bottom:12px;">
        <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Location photos</h3>
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="subtle">${photos.length} total</span>
          ${photos.length ? `<button class="btn btn-secondary btn-sm" onclick="toggleGallerySelectMode()">${state.gallerySelectMode ? "Done" : "Select"}</button>` : ""}
          <button class="btn btn-secondary btn-sm" onclick="openModal('upload',{locationId:'${l.id}'})">${icon("photoPlus")}</button>
        </div>
      </div>
      ${/* LOCP-4. Filing a run of twenty archive shots onto one specimen was
           twenty trips through the same modal. The Gallery's select machinery
