}
/* The list she actually works from. 133 taxa where a third are two fields short
   is not a queue, it is a wall — so the default view is the records where one
   Ask buys the most: never asked, and substantially empty. Both are relaxable
   in the banner, and the tile keeps counting the true total so the filters
   cannot hide work from the count. */
function taxaIncompleteFiltered() {
  return taxaIncompleteProfiles().filter((t) => {
    if (state.taxaNeverAskedOnly && taxonWasAsked(t)) return false;
    if (taxonProfileGaps(t).length < (state.taxaMinGaps || 0)) return false;
    return true;
  });
}
function taxaIncompleteProfiles() {
  // Most gaps first: the emptiest records are where one Ask buys the most.
  return state.taxa.filter((t) => taxonProfileGaps(t).length)
    .sort((a, b) => taxonProfileGaps(b).length - taxonProfileGaps(a).length
      || taxonDisplayName(a).localeCompare(taxonDisplayName(b)));
}

function taxonMissingNameParts(t) {
  const has = (v) => !!(v && String(v).trim());
  if (has(t.genus) || has(t.species_epithet) || has(t.cultivar)) return false;
  /* NAME-4. The test used to end there, which made the list uncompletable.
     "unidentified cactus" has no genus to find — splitting it is not a task
     anyone can finish, and it sat in the queue permanently alongside
     "Haworthiopsis", which is one tap from done. Two different problems wearing
     one count.

     A name is only a SPLIT that was skipped if a genus can actually be read out
     of it. Anything else is a plant that has not been IDENTIFIED, which is what
     "Plants missing identification" already tracks — and what a working label
     is for. Reuses parseBotanicalName so this cannot drift from what the split
     would actually produce. */
  const name = (t.botanical_name || t.working_label || "").trim();
  if (!name) return false;
  return !!parseBotanicalName(name).genus;
}
function taxaMissingNameParts() {
  return state.taxa.filter(taxonMissingNameParts)
    .sort((a, b) => specimensOfTaxon(b.id).length - specimensOfTaxon(a.id).length
      || taxonDisplayName(a).localeCompare(taxonDisplayName(b)));
}

function specimensOfTaxon(taxonId) {
  return state.plants
    .filter((p) => p.taxa_id === taxonId)
    .sort((a, b) => (a.accession_number || "").localeCompare(b.accession_number || ""));
}
// Specimens with no parent, i.e. acquired rather than propagated. Offsets hang
// underneath their mother plant via parent_plant_id.
function rootSpecimensOfTaxon(taxonId) {
  const all = specimensOfTaxon(taxonId);
  const ids = new Set(all.map((p) => p.id));
  return all.filter((p) => !p.parent_plant_id || !ids.has(p.parent_plant_id));
}
function offspringOf(plantId, taxonId) {
  return specimensOfTaxon(taxonId).filter((p) => p.parent_plant_id === plantId);
}
// The taxon's own profile photo, else the newest photo from any of its
// specimens. Once GAL-1 lands this becomes the favourited photos.
// Every photo of every specimen of a taxon, newest first, each carrying which
// specimen it belongs to. The species page previously showed only a cover, so
// the one place you would naturally go to compare your plants of a kind — or to
// spot a photo filed against the wrong one — showed nothing.
function taxonPhotos(taxonId) {
  const out = [];
  const seen = new Set();
  specimensOfTaxon(taxonId).forEach((sp) => {
    plantPhotosOrdered(sp.id).forEach((p) => {
      if (seen.has(p.id)) return; // a photo tagged onto two specimens counts once
      seen.add(p.id);
      out.push({ photo: p, specimen: sp });
    });
  });
  return out.sort((a, b) => new Date(photoDate(b.photo)) - new Date(photoDate(a.photo)));
}

// FROST-1. An explicit flag, not derived from hardy_to — that column is free
// text ("Zone 9", "20F", "Zone 10b — not frost hardy") and parsing it on the
// one night a year it matters is exactly when a wrong guess costs a plant.
function isFrostTender(t) {
  return !!(t && t.frost_tender);
}
function plantIsFrostTender(pl) {
  return isFrostTender(pl && pl.taxa_id ? taxonById(pl.taxa_id) : null);
}
function frostBadge(size) {
  return `<span class="frost-badge" title="Not frost hardy — bring in before a freeze">${icon("temperatureSnow")}${size === "full" ? " Not frost hardy" : ""}</span>`;
}

function taxonCoverPhoto(t) {
  if (!t) return null;
  if (t.primary_photo_id) {
    const p = state.photos.find((x) => x.id === t.primary_photo_id);
    if (p) return p;
  }
  const specimens = specimensOfTaxon(t.id);
  const photos = specimens.flatMap((sp) => plantPhotosOrdered(sp.id));
  // A favourite wins: hearting a photo is how a specimen shot gets promoted to
  // represent the whole taxon (SPECIES-1's gallery decision).
  const fav = photos.find((p) => p.is_favorite);
  if (fav) return fav;
  return photos.sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)))[0] || null;
}
// Every distinct location any specimen of this taxon sits in — "where can I
// find one of these". Derived, never stored.
function locationsOfTaxon(taxonId) {
  const seen = new Map();
  specimensOfTaxon(taxonId).forEach((sp) => {
    allLocationsForPlant(sp).forEach((l) => { if (l && !seen.has(l.id)) seen.set(l.id, l); });
  });
  return Array.from(seen.values());
}

// ============================================================
// BLOOM TRACKING (BLOOM-1). A bloom is an event with a start and an end, not a
// flag — a plant blooms repeatedly over its life and the history is the point.
// `ended_on` null means it is blooming right now.
//
// Deliberately manual. `taxa.bloom_season` records when a plant is EXPECTED to
// bloom; bloom_events record when one actually did. Confusing the two would
// make the Gallery claim things are in flower because the calendar says so.
// ============================================================
function bloomsForPlant(plantId) {
  return state.bloomEvents
    .filter((b) => b.plant_id === plantId)
    .sort((a, b) => String(b.started_on).localeCompare(String(a.started_on)));
}
function activeBloom(plantId) {
  return state.bloomEvents.find((b) => b.plant_id === plantId && !b.ended_on) || null;
}
function bloomingSpecimens() {
  const ids = new Set(state.bloomEvents.filter((b) => !b.ended_on).map((b) => b.plant_id));
  return state.plants.filter((p) => ids.has(p.id));
}

// Which bloom_season values match today. Northern hemisphere; the overlaps are
// intentional, since a plant tagged `summer` and one tagged `late_summer` are
// both plausibly flowering in August.
function seasonsNow(date) {
  const m = (date || new Date()).getMonth() + 1;
  const out = ["intermittent"];
  if (m >= 3 && m <= 5) out.push("spring");
  if (m === 6) out.push("early_summer");
  if (m >= 6 && m <= 8) out.push("summer");
  if (m >= 8 && m <= 9) out.push("late_summer");
  if (m >= 9 && m <= 11) out.push("fall");
  if (m === 12 || m <= 2) out.push("winter");
  return out;
}

// Specimens whose species is expected to be flowering now but which have no
// bloom recorded. This is the "go and look" list — a date comparison against
// data already held, needing no AI whatever, despite living in an epic named
// after one.
function expectedToBloom() {
  const seasons = seasonsNow();
  const blooming = new Set(state.bloomEvents.filter((b) => !b.ended_on).map((b) => b.plant_id));
  return state.plants.filter((p) => {
    if (blooming.has(p.id) || p.status !== "active") return false;
    // Already scheduled — the task holds it until its due date.
    if (hasScheduledTask("plant", p.id)) return false;
    const t = p.taxa_id ? taxonById(p.taxa_id) : null;
    // `monocarpic` is excluded: it blooms once and dies, so nudging every year
    // would be noise. `not_observed` means nobody knows yet.
    if (!t || !t.bloom_season || t.bloom_season === "monocarpic" || t.bloom_season === "not_observed") return false;
    return seasons.includes(t.bloom_season);
  });
}

/* TODO-1. An open bloom is not news forever. Recorded in March and still open
   in September, it makes the Gallery's In Bloom row lie. How long is plausible
   depends on the species, so the window comes from `bloom_season` rather than
   one number that is wrong for both a five-day Echeveria and a months-long
   Aeonium. Unknown or genuinely long-running seasons are never chased. */
const BLOOM_WINDOW_WEEKS = {
  spring: 12, summer: 12, fall: 12, winter: 12,
  early_summer: 7, late_summer: 7,
  intermittent: null,   // on and off by nature — closing it would be wrong
  monocarpic: null,     // blooms once, then the plant dies
  not_observed: 16,     // nobody knows; chase only after a long while
};
function openBlooms() {
  return state.bloomEvents.filter((b) => !b.ended_on);
}
function bloomsToClose() {
  const today = todayISO();
  return openBlooms()
    .map((b) => {
      const pl = state.plants.find((p) => p.id === b.plant_id);
      const t = pl && pl.taxa_id ? taxonById(pl.taxa_id) : null;
      const weeks = t && t.bloom_season in BLOOM_WINDOW_WEEKS
        ? BLOOM_WINDOW_WEEKS[t.bloom_season] : 12;
      if (weeks == null || !b.started_on) return null;
      const days = daysBetween(b.started_on, today);
      return days != null && days > weeks * 7 ? { b, pl, days } : null;
    })
    .filter(Boolean)
    .filter((x) => x.pl)
    .sort((a, b2) => b2.days - a.days);
}

/* FILE-1. "Needs a plant" was 95 photographs in a grid — the same question 95
   times, answered one photo at a time. But the answer is usually already in the
   data: a photo filed to Bucket 17 showing an unnamed plant, where Bucket 17
   holds exactly one specimen, is almost certainly that specimen. Grouping by
   location turns 95 decisions into a handful.

   Deterministic, not a guess. Where a location holds one specimen the app says
   so and offers one tap for the whole group; where it holds several it lists
   them; where it holds none, that is a different job and it says which. */
function photosNeedingPlantByLocation() {
  const groups = new Map();
  state.photos.filter(photoAwaitsPlant).forEach((p) => {
    const key = p.location_id;
    if (!groups.has(key)) groups.set(key, { location: locationById(key), photos: [] });
    groups.get(key).photos.push(p);
  });
  return [...groups.values()]
    .map((g) => {
      const here = g.location ? plantsAtLocation(g.location.id) : [];
      return { ...g, candidates: here, only: here.length === 1 ? here[0] : null };
    })
    // The confident ones first — those are the quick wins.
    .sort((a, b) => (b.only ? 1 : 0) - (a.only ? 1 : 0) || b.photos.length - a.photos.length);
}

// The mirror image: the photo has a plant, and the plant knows where it lives.
function photosNeedingLocationByPlant() {
  const groups = new Map();
  state.photos.filter((p) => p.plant_id && !p.location_id).forEach((p) => {
    if (!groups.has(p.plant_id)) {
      const pl = state.plants.find((x) => x.id === p.plant_id);
      groups.set(p.plant_id, { plant: pl, location: pl && pl.location_id ? locationById(pl.location_id) : null, photos: [] });
    }
    groups.get(p.plant_id).photos.push(p);
  });
  return [...groups.values()].filter((g) => g.plant)
    .sort((a, b) => (b.location ? 1 : 0) - (a.location ? 1 : 0) || b.photos.length - a.photos.length);
}

/* Applies one answer to a whole group.
   Named fileGroupTo… and NOT assignPhotosTo…: `assignPhotosToPlant(plantId)`
   already exists for the bulk-selection flow, and a same-named second copy was
   silently shadowed by it — the group button ran the selection version with an
   array where it wanted an id, and answered "Pick some photos first".

   Chunked `id=in.()` rather than one request per photo, matching
   applyGalleryBatch: 300 ids is an ~11KB query string, past what proxies
   accept, and the request is rejected at the edge before PostgREST sees it. */
async function fileGroupTo(field, photoIds, value) {
  if (!photoIds || !photoIds.length) return;
  let done = 0;
  try {
    for (let i = 0; i < photoIds.length; i += DELETE_CHUNK) {
      const slice = photoIds.slice(i, i + DELETE_CHUNK);
      await restPatch("photos", `id=in.(${slice.join(",")})`, { [field]: value });
      done += slice.length;
    }
    toast(`${countLabel(done, "photo", "photos")} filed`);
    await loadAll();
  } catch (e) {
    toast(done ? `Stopped after ${done} — ${e.message}` : e.message, true);
    if (done) await loadAll();
  }
}
const fileGroupToPlant = (ids, plantId) => fileGroupTo("plant_id", ids, plantId);
const fileGroupToLocation = (ids, locationId) => fileGroupTo("location_id", ids, locationId);

/* HOVER-1. "File all 4" asks you to trust a suggestion about a plant you cannot
   see. The card shows it without leaving the screen.

   Deliberately NOT part of render(): it lives outside #app, is built once, and
   is filled by direct DOM writes. Routing it through state would rebuild the
   whole page on every mouse movement — the exact thing PERF-2 just fixed.

   Delegated from document, so it keeps working after any re-render and any
   element can opt in with data-plant-card="<id>". */
let hoverCardEl = null;
function ensureHoverCard() {
  if (hoverCardEl && document.body.contains(hoverCardEl)) return hoverCardEl;
  hoverCardEl = document.createElement("div");
  hoverCardEl.className = "hover-card";
  hoverCardEl.setAttribute("aria-hidden", "true");
  document.body.appendChild(hoverCardEl);
  return hoverCardEl;
}

function showPlantCard(target, plantId) {
  const pl = state.plants.find((x) => x.id === plantId);
  if (!pl) return;
  const el = ensureHoverCard();
  const t = pl.taxa_id ? taxonById(pl.taxa_id) : null;
  const loc = pl.location_id ? locationById(pl.location_id) : null;
  const cover = plantCoverPhoto(pl);
  const photos = plantPhotosOrdered(pl.id).length;
  const st = checkInStatus(pl);

  el.innerHTML = `
    <div class="hover-card-media">${cover ? photoImg(cover) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}</div>
    <div class="hover-card-body">
      <div class="mono tag-id">${pl.accession_number}</div>
      <div class="hover-card-name">${plantDisplayHtml(pl)}</div>
      ${t && t.common_name ? `<div class="hover-card-sub">${escapeHtml(t.common_name)}</div>` : ""}
      <div class="hover-card-meta">
        ${loc ? `<div>${icon("pin")} ${escapeHtml(locationPath(loc))}</div>` : `<div class="value-blank">No location</div>`}
        <div>${icon("photo")} ${escapeHtml(countLabel(photos, "photo", "photos").replace(/<[^>]*>/g, ""))}</div>
        ${st ? `<div>${icon(st.due ? "alertTriangle" : "check")} ${escapeHtml(st.label)}</div>` : ""}
      </div>
      <span class="pill-solid ${healthPillClass(pl)}">${HEALTH_LABELS[pl.health_status] || pl.health_status}</span>
    </div>`;

  // The cover may not be cached yet; fetch it the same way every other image
  // gets fetched, and it patches itself into the card when it lands.
  if (cover) ensurePhotoLoaded(cover.drive_file_id);

  const r = target.getBoundingClientRect();
  el.classList.add("is-open");
  const w = el.offsetWidth, h = el.offsetHeight;
  // Flip above / left when there is not room below or right.
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
  let left = r.left;
  if (left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - w - 8);
  el.style.top = `${top + window.scrollY}px`;
  el.style.left = `${left + window.scrollX}px`;
}

function hidePlantCard() {
  if (hoverCardEl) hoverCardEl.classList.remove("is-open");
}

// Attached once, at boot. Pointer events only — a touch device gets the tap
// behaviour the element already has instead.
function wireHoverCards() {
  document.addEventListener("mouseover", (e) => {
    const t = e.target && e.target.closest ? e.target.closest("[data-plant-card]") : null;
    if (t) showPlantCard(t, t.getAttribute("data-plant-card"));
  });
  document.addEventListener("mouseout", (e) => {
    const t = e.target && e.target.closest ? e.target.closest("[data-plant-card]") : null;
    if (t) hidePlantCard();
  });
  // Scrolling or navigating away should not leave one floating.
  window.addEventListener("scroll", hidePlantCard, { passive: true });
}

/* AI-3 layer 2. Layer 1 catches a duplicate by NAME, as she types it. This
   catches one by PHOTO, at the only moment it can be prevented: the form that
   is about to create a second record for a plant she already has.

   Two sources, cheapest first:
     1. Specimens already at the photo's location. Deterministic, free, and
        usually right — the same reasoning FILE-1 uses.
     2. Claude's plant_tag suggestion, if `suggest-photo` has run on this photo.

   The location candidates come first deliberately: they cost nothing and need
   no call, so a duplicate is often caught before Claude is asked at all. */
function duplicateGuardForPhoto(photoId) {
  const p = state.photos.find((x) => x.id === photoId);
  if (!p) return { here: [], suggested: null, asked: false };
  const here = p.location_id ? plantsAtLocation(p.location_id) : [];
  const sug = suggestionsForPhoto(photoId).find((sg) => sg.kind === "plant_tag");
  const suggested = sug ? state.plants.find((x) => x.id === sug.value_id) : null;
  return {
    here,
    suggested: suggested && !here.some((x) => x.id === suggested.id) ? suggested : null,
    asked: !!suggestionsForPhoto(photoId).length,
  };
}

// "That is the plant" — attach the photo and stop, rather than creating a
// second record for something already in the collection.
async function usePlantInsteadOfNew(photoId, plantId) {
  await assignPlantToPhoto(photoId, plantId);
  closeModal();
  maybeResumeLightbox();
}

function bloomPhotosFor(plantId) {
  return plantPhotosOrdered(plantId).filter((p) => p.photo_type === "bloom");
}

// Dated care events for a plant, newest first. `noted_on` is the observation
// date Amanda sets; created_at only breaks ties between notes on the same day.
function careNotesForPlant(plantId) {
  return state.careNotes
    .filter((n) => n.plant_id === plantId)
    .sort((a, b) => (a.noted_on < b.noted_on ? 1 : a.noted_on > b.noted_on ? -1 : new Date(b.created_at) - new Date(a.created_at)));
}

// Local calendar date, not UTC. `new Date().toISOString()` rolls over to
// tomorrow during a Pacific evening, which would misdate an evening note.
function todayLocalISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// PD-2 structured fields render even when blank — an unrecorded field marks the
// record as incomplete, which is information worth showing. The Care and
// Provenance sections below still hide when empty; that convention was left
// alone deliberately, so Plant Detail follows two rules on purpose.
// Returns HTML, not text — do not escape at the call site.
// PD-7 field row: optional leading icon, label, right-aligned value. Renders
// whether or not there is a value, so Plant Detail holds the same shape on
// every plant. `html` passes pre-built markup through unescaped (light chips).
// Returns HTML, not text — do not escape at the call site.
function fieldRow(iconName, label, value, html) {
  const has = html ? true : value !== null && value !== undefined && value !== "";
  return `<div class="field-row">`
    + `<span class="field-row-icon">${iconName ? icon(iconName) : ""}</span>`
    + `<span class="field-row-label">${label}</span>`
    + `<span class="field-row-value${has ? "" : " value-blank"}">${html || (has ? escapeHtml(value) : "—")}</span>`
    + `</div>`;
}

// Returns HTML, not text — do not escape at the call site.
function countLabel(n, singular, plural) {
  const text = `${n} ${n === 1 ? singular : plural}`;
  return n === 0 ? `<span class="count-zero">${text}</span>` : text;
}
function nestedCountLabel(children) {
  const types = new Set(children.map((c) => c.type));
  const pair = (types.size === 1 && CHILD_TYPE_PLURALS[children[0].type]) || ["location", "locations"];
  return `${children.length} ${children.length === 1 ? pair[0] : pair[1]} inside`;
}

const STATUS_LABELS = { active: "Active", dormant: "Dormant", given_away: "Given Away", dead: "Dead", deaccessioned: "Deaccessioned" };
const ID_STATUS_LABELS = { confirmed: "Confirmed", tentative: "Tentative", unidentified: "Unidentified" };
const HEALTH_LABELS = { healthy: "Healthy", watch: "Watch", urgent: "Urgent care", recovery: "Recovery", unknown: "Unknown" };

// PD-4. The attention test used to be an inline expression copied into two
// screens. That is precisely how a new tier ends up reading as healthy: add the
// value, update one copy, miss the other. One helper, one source of truth.
const HEALTH_ATTENTION = ["watch", "urgent", "recovery"];
function needsAttention(pl) {
  return pl.status !== "active" || HEALTH_ATTENTION.includes(pl.health_status);
}
function isUrgent(pl) {
  return pl.health_status === "urgent";
}
// Urgent has to outrank plain attention visually or the tier buys nothing.
// Palette is fixed (§5), so it separates by weight and ring, not a new hue.
function healthPillClass(pl) {
  if (isUrgent(pl)) return "pill-solid-urgent";
  return needsAttention(pl) ? "pill-solid-terracotta" : "pill-solid-moss";
}
const CATEGORY_LABELS = { current: "Current", historical: "Historical" };
const ACQ_SOURCE_LABELS = { nursery: "Nursery", gift: "Gift", propagation: "Propagation", rescue: "Rescue", original_collection: "Original Collection", unknown: "Unknown", other: "Other" };

// PD-2 structured detail fields. Stored as plain text and standardized here
// rather than by a DB enum (§3), so extending any list is a one-line edit with
// no migration. `plant_type` doubles as the plant-level grouping GAL-2 needs.
// `cactus` leads because it is the only value doing real work: it rolls up 8
// genera (Cephalocereus, Echinopsis, Ferocactus, Mammillaria, Opuntia, Parodia,
// Austrocylindropuntia). Every other value maps 1:1 to a genus. Cotyledon,
// Haworthia, Kalanchoe, Portulacaria and Senecio added v1.41.0 — five real
// plants in the collection had no valid value before.
// v2.8.0 added five, measured against the collection rather than guessed —
// every one had taxa stranded with no valid value: Curio 5, Dracaena 3, Hoya 2,
// Haworthiopsis 2, and Lithops for the living stones. Curio and Haworthiopsis
// are kept SEPARATE from Senecio and Haworthia rather than folded in: both are
// accepted genera in their own right now, and the 1:1 convention above is what
// makes the Gallery's highlight groupings mean anything.
//
// NOTE: `suggest-species` repeats this list inside its prompt. Adding a value
// here without adding it there means Claude can never suggest it.
const PLANT_TYPE_LABELS = { cactus: "Cactus", aeonium: "Aeonium", agave: "Agave", aloe: "Aloe", cotyledon: "Cotyledon", crassula: "Crassula", curio: "Curio", dracaena: "Dracaena / snake plant", echeveria: "Echeveria", euphorbia: "Euphorbia", haworthia: "Haworthia", haworthiopsis: "Haworthiopsis", hoya: "Hoya", kalanchoe: "Kalanchoe", lithops: "Lithops / living stones", portulacaria: "Portulacaria", sedum: "Sedum", sempervivum: "Sempervivum", senecio: "Senecio" };
const GROWTH_HABIT_LABELS = { columnar: "Columnar", globular: "Globular / barrel", rosette: "Rosette", clumping: "Clumping / offsetting", caudiciform: "Caudiciform", trailing: "Trailing / sprawling", mounding: "Mounding", upright: "Upright", climbing: "Climbing", groundcover: "Groundcover", solitary: "Solitary" };
// `bloom_season` is the plant's expected trait. Observed blooming is BLOOM-1's
// bloom_events table — RPT-4 reads that, not this.
const BLOOM_SEASON_LABELS = { spring: "Spring", early_summer: "Early summer", summer: "Summer", late_summer: "Late summer", fall: "Fall", winter: "Winter", intermittent: "Intermittent / year-round", monocarpic: "Monocarpic — blooms once, then dies", not_observed: "Not yet observed" };
// Native or introduced relative to the garden's own region. Distinct from
// `native_range`, which holds where the plant is from ("Central Mexico").
const ORIGIN_LABELS = { native: "Native", introduced: "Introduced", unknown: "Unknown" };

// Seed data and fallback for ADM-1. light_conditions had no map — its values
// lived inline in two modals — so it gets one here.
const LIGHT_CONDITION_LABELS = { direct: "Direct", indirect: "Indirect", partial: "Partial", full: "Full", shade: "Shade", morning: "Morning", afternoon: "Afternoon", all_day: "All day" };
const WATER_NEEDS_LABELS = { low: "Low", moderate: "Moderate", high: "High" };
const BUILTIN_LISTS = {
  plant_type: PLANT_TYPE_LABELS,
  growth_habit: GROWTH_HABIT_LABELS,
  bloom_season: BLOOM_SEASON_LABELS,
  water_needs: WATER_NEEDS_LABELS,
  light_conditions: LIGHT_CONDITION_LABELS,
};

/* ============================================================
   UI HELPERS
   ============================================================ */
function toast(msg, isError = false) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
/* DATE-1. `new Date("2026-09-01")` is parsed by JS as UTC midnight and then
   rendered in local time, so every date-only value in this app displayed as
   THE PREVIOUS DAY anywhere west of Greenwich — Concord included. Care note
   dates, bloom starts, date_acquired, due dates and next_check_date were all
   one day early, silently, for the life of the app.

   Only date-only strings are re-parsed. A timestamptz (`taken_at`,
   `uploaded_at`, `started_at`) already carries a zone and is left alone, which
   is why the regex is anchored rather than a blanket change. */
function fmtDate(iso) {
  if (!iso) return "";
  const d = /^\d{4}-\d{2}-\d{2}$/.test(String(iso)) ? new Date(`${iso}T00:00:00`) : new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function photoDate(p) {
  return p.taken_at || p.uploaded_at;
}
/* ------------------------------------------------------------
   MOVE-1 — where a specimen has lived.

   `plant_location_history` is populated by a database trigger on `plants` and,
   until now, read by nothing. Moving a plant worked and was recorded; the
   record was simply invisible. This makes it visible, and gives the move its
   own action so it does not require opening the whole edit form.

   A move is NOT a new specimen. SPECIES-2 split plants that were in several
   places AT ONCE, because a physical individual is in one place. Moving is the
   same individual changing place over time — same accession, same photos.
   ------------------------------------------------------------ */
/* Every create path grew its own subset of these fields: "New plant" had the
   full set behind More details, "Add a specimen" had source and date, and
   "New specimen here" had source only. Same block everywhere now.

   Identification status is included deliberately (Amanda, 2026-08-28). Two
   paths used to hardcode `confirmed` on the reasoning that a specimen of a
   known taxon is identified by definition — which is true of Agave americana
   and false of a catch-all taxon like "unidentified cactus", where the link
   says "some kind of cactus", not "this species". She chooses per specimen
   rather than the taxon carrying a flag. */
function acquisitionFields(prefix, opts) {
  const o = opts || {};
  return `
    <label>Identification</label>
    <select id="${prefix}-idstatus">
      ${Object.entries(ID_STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${k === (o.defaultId || "confirmed") ? "selected" : ""}>${v}</option>`).join("")}
    </select>
    <div class="field-help">Linking to a catch-all species like &ldquo;unidentified cactus&rdquo; is not a confirmed identification &mdash; set this to Unidentified and it stays in the queue until you can name it.</div>
    <label>Acquisition source</label>
    <select id="${prefix}-acqtype">
      <option value="">&mdash; Unspecified &mdash;</option>
      ${Object.entries(ACQ_SOURCE_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
    </select>
    <label>Where from</label>
    <input id="${prefix}-acqname" placeholder="e.g. Ruth Bancroft Garden" />
    <label>Date acquired</label>
    <input type="date" id="${prefix}-dateacquired" />
    <label>Health</label>
    <select id="${prefix}-health">
      ${Object.entries(HEALTH_LABELS).map(([k, v]) => `<option value="${k}" ${k === "healthy" ? "selected" : ""}>${v}</option>`).join("")}
    </select>`;
}

// Read back whatever acquisitionFields() rendered. Defensive on every id: a
// form that omits the block must not throw.
function readAcquisitionFields(prefix) {
  const v = (id) => { const el = document.getElementById(`${prefix}-${id}`); return el && el.value ? el.value : null; };
  return {
    identification_status: v("idstatus") || "confirmed",
    acquisition_source_type: v("acqtype"),
    acquisition_source_name: v("acqname"),
    date_acquired: v("dateacquired"),
    health_status: v("health") || "healthy",
  };
}

function locationHistoryForPlant(plantId) {
  // The trigger fires on ANY update to a plant, not only a location change, so
  // the table holds redundant no-op stays: ABG-2026-0137 has two rows both
  // pointing at Bucket 13, and ABG-2026-0079 has three at Bucket 06, two of
  // them 0.2ms apart. Rendering each as its own stay reads as "moved to Bucket
  // 06, then to Bucket 06, then to Bucket 06".
  //
  // Consecutive rows at the SAME location are one stay: earliest start, latest
  // end. Non-consecutive ones are not collapsed — leaving and coming back is a
  // real thing that happened and must stay visible.
  const rows = state.plantLocationHistory
    .filter((h) => h.plant_id === plantId)
    .sort((a, b) => String(a.started_at || "").localeCompare(String(b.started_at || "")));
  const merged = [];
  rows.forEach((h) => {
    const last = merged[merged.length - 1];
    if (last && last.location_id === h.location_id) {
      // An open row absorbs a later one; a note on either survives.
      last.ended_at = last.ended_at && h.ended_at ? (last.ended_at > h.ended_at ? last.ended_at : h.ended_at) : (h.ended_at || null);
      last.notes = last.notes || h.notes || null;
    } else {
      merged.push({ ...h });
    }
  });
  return merged.reverse();   // newest first, as every caller expects
}

// The stay a plant is in NOW: the open row, or failing that whatever the
// specimen's location_id says. Written defensively because the trigger's exact
// behaviour is not recorded anywhere in the repo.
function currentStay(plantId) {
  return locationHistoryForPlant(plantId).find((h) => !h.ended_at) || null;
}

// Past stays only, newest first, with the location resolved.
function pastStays(plantId) {
  const pl = state.plants.find((x) => x.id === plantId);
  return locationHistoryForPlant(plantId)
    .filter((h) => h.ended_at || (pl && h.location_id !== pl.location_id))
    .map((h) => ({ ...h, loc: locationById(h.location_id) }));
}

// "What used to live here" — the other side of the same table.
function plantsPreviouslyAt(locationId) {
  const pl = (id) => state.plants.find((x) => x.id === id);
  const rows = state.plantLocationHistory
    .filter((h) => h.location_id === locationId)
    .map((h) => ({ h, p: pl(h.plant_id) }))
    .filter((x) => x.p && x.p.location_id !== locationId)   // still here = not "previously"
    .sort((a, b) => String(b.h.started_at || "").localeCompare(String(a.h.started_at || "")));
  // One row per plant. A plant that lived here, left, and came back before
  // leaving again has two stays at this location, and listing it twice reads as
  // two different plants. Sorted newest-first above, so the first hit is the
  // most recent stay — which is the one worth showing.
  const seen = new Set();
  return rows.filter(({ p }) => !seen.has(p.id) && seen.add(p.id));
}

function stayRange(h) {
  const from = h.started_at ? fmtDate(h.started_at) : "";
  const to = h.ended_at ? fmtDate(h.ended_at) : "now";
  return from ? `${from} – ${to}` : to;
}

/* ------------------------------------------------------------
   TASK-1 / RPT-3 — tasks, task subjects, and check-in staleness.

   Item 6 and RPT-3 turned out to be one feature. RPT-3's manual half is
   "flag this for a look"; a task is that plus a note and more than one
   subject. Building both would have given two places to look for what needs
   doing, which is the mistake v1.79.0 fixed by retiring Reports.

   A subject is exactly one of plant / location / taxon — the same
   "exactly one of" shape `identifications` already uses.
   ------------------------------------------------------------ */
const DEFAULT_CHECK_IN_DAYS = 14;

function settingInt(key, fallback) {
  const n = parseInt(state.appSettings[key], 10);
  return Number.isFinite(n) && n > 0 ? n : fallback;
}
function checkInIntervalDays() {
  return settingInt("check_in_interval_days", DEFAULT_CHECK_IN_DAYS);
}

function settingStr(key, fallback) {
  const v = state.appSettings[key];
  return v == null || String(v).trim() === "" ? fallback : String(v).trim();
}
function settingNum(key, fallback) {
  const n = parseFloat(state.appSettings[key]);
  return Number.isFinite(n) ? n : fallback;
}

/* ============================================================
   WEATHER — WEATHER-1
   Two keyless, CORS-open APIs called straight from the browser. No Edge
   Function, no secret, no migration: the coordinates and thresholds are rows
   in app_settings, which already exists.

   Open-Meteo  — daily min/max temp + precipitation. Returns Fahrenheit and
                 inches natively, so there is no unit conversion to get wrong.
   NWS alerts  — the named advisories (Frost Advisory, Heat Advisory, Extreme
                 Heat Warning...) that a raw number cannot tell you about.

   NWS GOTCHA, verified 2026-08-30: api.weather.gov returns 403 to a BLANK
   User-Agent but 200 to a browser's own. So this works from the app and would
   NOT work from an Edge Function unless that function sets a User-Agent
   explicitly. Do not "move it to the backend" without reading this first.

   Both are wrapped so that a failure renders no weather at all rather than
   breaking To Do — the same discipline as optional() in loadAll.
   ============================================================ */
const DEFAULT_GARDEN_LAT = 37.9779;   // Concord, CA
const DEFAULT_GARDEN_LON = -122.0311;
const DEFAULT_FROST_WATCH_F = 38;     // see note in frostRisk()
const DEFAULT_FROST_ALERT_F = 32;
const DEFAULT_HEAT_F = 95;
const WEATHER_MAX_AGE_MS = 3 * 60 * 60 * 1000;
const WEATHER_CACHE_KEY = "abg_weather";
// Named NWS events worth surfacing. Matched as substrings, because the API
// emits "Extreme Heat Warning", "Excessive Heat Warning" and "Heat Advisory"
// as separate events and the list grows without notice.
const WX_COLD_EVENTS = ["frost", "freeze"];
const WX_HEAT_EVENTS = ["heat"];

function gardenCoords() {
  return {
    lat: settingNum("garden_latitude", DEFAULT_GARDEN_LAT),
    lon: settingNum("garden_longitude", DEFAULT_GARDEN_LON),
  };
}
function frostWatchF() { return settingNum("frost_watch_f", DEFAULT_FROST_WATCH_F); }
function frostAlertF() { return settingNum("frost_alert_f", DEFAULT_FROST_ALERT_F); }
function heatThresholdF() { return settingNum("heat_advisory_f", DEFAULT_HEAT_F); }

function weatherIsStale() {
  return !state.weather || (Date.now() - state.weather.fetchedAt) > WEATHER_MAX_AGE_MS;
}

// Cached in localStorage so a reload inside the window costs no request and
// the banner is present on the first paint rather than arriving late.
function loadCachedWeather() {
  try {
    const raw = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || "null");
    if (raw && raw.fetchedAt && Date.now() - raw.fetchedAt < WEATHER_MAX_AGE_MS) return raw;
  } catch (e) {}
  return null;
}

async function loadWeather(force) {
  if (state.weatherFetching) return;
  if (!force) {
    if (!weatherIsStale()) return;
    const cached = loadCachedWeather();
    if (cached) { state.weather = cached; render(); return; }
  }
  state.weatherFetching = true;
  const { lat, lon } = gardenCoords();
  let days = [];
  let alerts = [];
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      + `&daily=temperature_2m_min,temperature_2m_max,precipitation_sum`
      + `&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=auto&forecast_days=7`;
    const res = await fetch(url);
    const data = await res.json();
    const d = data && data.daily;
    if (d && Array.isArray(d.time)) {
      days = d.time.map((date, i) => ({
        date,
        min: d.temperature_2m_min[i],
        max: d.temperature_2m_max[i],
        rain: d.precipitation_sum[i],
      }));
    }
  } catch (e) { /* no forecast — the banner simply does not render */ }
  try {
    const res = await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`,
                            { headers: { Accept: "application/geo+json" } });
    const data = await res.json();
    alerts = (data.features || []).map((f) => ({
      event: f.properties.event,
      severity: f.properties.severity,
      headline: f.properties.headline,
      ends: f.properties.ends,
    }));
  } catch (e) { /* advisories are the optional half; the numbers still work */ }
  state.weatherFetching = false;
  if (!days.length && !alerts.length) return;
  state.weather = { fetchedAt: Date.now(), days, alerts };
  try { localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(state.weather)); } catch (e) {}
  render();
}

// The next 72 hours only. A freeze eight days out is not something to act on
// tonight, and a banner that is always lit is a banner nobody reads.
function frostRisk() {
  const w = state.weather;
  if (!w || !w.days.length) return null;
  const soon = w.days.slice(0, 3).filter((d) => Number.isFinite(d.min));
  if (!soon.length) return null;
  const coldest = soon.reduce((a, b) => (b.min < a.min ? b : a));
  const named = w.alerts.find((a) =>
    WX_COLD_EVENTS.some((k) => String(a.event).toLowerCase().includes(k)));
  if (named) return { level: "alert", day: coldest, event: named.event, headline: named.headline };
  if (coldest.min <= frostAlertF()) return { level: "alert", day: coldest, event: null };
  if (coldest.min <= frostWatchF()) return { level: "watch", day: coldest, event: null };
  return null;
}

function heatRisk() {
  const w = state.weather;
  if (!w || !w.days.length) return null;
  const soon = w.days.slice(0, 3).filter((d) => Number.isFinite(d.max));
  if (!soon.length) return null;
  const hottest = soon.reduce((a, b) => (b.max > a.max ? b : a));
  const named = w.alerts.find((a) =>
    WX_HEAT_EVENTS.some((k) => String(a.event).toLowerCase().includes(k)));
  if (named) return { level: "alert", day: hottest, event: named.event, headline: named.headline };
  if (hottest.max >= heatThresholdF()) return { level: "watch", day: hottest, event: null };
  return null;
}

// Enough to actually wet a container, not a trace that evaporates off the rim.
function recentRainInches() {
  const w = state.weather;
  if (!w || !w.days.length) return 0;
  const today = todayISO();
  return w.days.filter((d) => d.date <= today).reduce((n, d) => n + (d.rain || 0), 0);
}

/* DATE-1. The calendar day where the garden is, not in UTC. Everything that
   compares against a `date` column wants this: `toISOString()` rolls over at
   5pm Pacific, so between then and midnight the app believed it was already
   tomorrow — a task due today read as overdue, and a date input would not let
   you pick today. todayISO() delegates here rather than the two coexisting. */
function localDateISO(d) {
  const t = d ? new Date(d) : new Date();
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
}

/* ============================================================
   WATERING — WATER-1 / WATER-2

   One row per plant per watering, not one row per run. "When was this last
   watered" is the query that matters on every screen, and a run is just a
   shared batch_id — which also makes a mis-tap undoable as one unit. At ~170
   specimens a whole-garden watering is 170 rows, which is nothing.

   `watered_on` is a DATE defaulted from the LOCAL day (DATE-1): watering at
   6pm Pacific must record as today, not tomorrow.

   The unique index on (plant_id, watered_on) makes a double-tap idempotent —
   water the Front Yard, then water one plant in it individually, and the
   second write merges rather than duplicating.
   ============================================================ */
const DEFAULT_WATERING_INTERVAL_DAYS = 7;

function wateringIntervalDays() {
  return settingInt("watering_interval_days", DEFAULT_WATERING_INTERVAL_DAYS);
}

/* The weather tie-in. Heat shortens the interval because containers dry out
   faster; measurable rain pushes it out because the sky already did the job.
   Both are bounded, and the reason is always named in the UI — this nudges a
   threshold, it does not decide anything for her. */
function effectiveWateringInterval() {
  const base = wateringIntervalDays();
  let days = base;
  if (heatRisk()) days = Math.max(2, Math.round(base * 0.6));
  if (recentRainInches() >= 0.25) days = Math.round(days * 1.5);
  return days;
}
function wateringIntervalReason() {
  const heat = heatRisk();
  const rain = recentRainInches();
  if (heat && rain >= 0.25) return `heat and ${rain.toFixed(2)}\u2033 of rain`;
  if (heat) return heat.event ? heat.event.toLowerCase() : "the heat";
  if (rain >= 0.25) return `${rain.toFixed(2)}\u2033 of rain`;
  return "";
}

function wateringsForPlant(plantId) {
  return state.wateringEvents
    .filter((w) => w.plant_id === plantId)
    .sort((a, b) => (b.watered_on || "").localeCompare(a.watered_on || ""));
}
function lastWateredFor(plantId) {
  const w = wateringsForPlant(plantId)[0];
  return w ? w.watered_on : null;
}
function daysSinceWatered(plantId) {
  const last = lastWateredFor(plantId);
  return last ? daysBetween(last, todayISO()) : null;
}
// Never watered is not "0 days overdue" — it is unknown, and it sorts above
// everything rather than being mistaken for freshly watered.
function wateringIsDue(pl) {
  if (pl.status !== "active") return false;
  const n = daysSinceWatered(pl.id);
  return n === null || n >= effectiveWateringInterval();
}
function plantsNeedingWater() {
  return state.plants.filter(wateringIsDue).sort((a, b) => {
    const da = daysSinceWatered(a.id), db = daysSinceWatered(b.id);
    if (da === null && db !== null) return -1;
    if (db === null && da !== null) return 1;
    return (db || 0) - (da || 0);
  });
}

// The whole subtree, which is the point: "water the Front Yard" must reach
// every bucket nested under it, not only plants pinned to the area itself.
function plantsUnderLocation(locationId) {
  const ids = new Set([locationId, ...descendantLocationIds(locationId)]);
  return state.plants.filter((p) => p.status === "active" && ids.has(p.location_id));
}

/* A rollup for Location Detail. "All watered 3 days ago" and "mixed — oldest
   12 days" are different answers and both are worth saying; an average would
   hide the one plant nobody has watered in a month. */
function wateringSummaryForLocation(locationId) {
  const plants = plantsUnderLocation(locationId);
  if (!plants.length) return null;
  const days = plants.map((p) => daysSinceWatered(p.id));
  const never = days.filter((d) => d === null).length;
  const known = days.filter((d) => d !== null);
  return {
    total: plants.length, never,
    oldest: known.length ? Math.max(...known) : null,
    newest: known.length ? Math.min(...known) : null,
    mixed: known.length ? Math.max(...known) !== Math.min(...known) : false,
  };
}

function fmtDaysAgo(n) {
  if (n === null || n === undefined) return "never";
  if (n <= 0) return "today";
  if (n === 1) return "yesterday";
  return `${n} days ago`;
}

function fmtTemp(f) {
  return Number.isFinite(f) ? `${Math.round(f)}\u00B0F` : "\u2014";
}
function wxDayLabel(dateISO) {
  const today = todayISO();
  if (dateISO === today) return "tonight";
  const days = daysBetween(today, dateISO);
  if (days === 1) return "tomorrow night";
  /* Its own format rather than fmtDate(): a frost three nights out reads
     better as "Tue, Sep 1" than as "Sep 1, 2026". Both parse as local since
     DATE-1. */
  const d = new Date(`${dateISO}T00:00:00`);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function todayISO() {
  return localDateISO();
}
function daysBetween(fromISO, toISO) {
  if (!fromISO) return null;
  const ms = new Date(toISO).getTime() - new Date(fromISO).getTime();
  return Math.floor(ms / 86400000);
}

function subjectsOfTask(taskId) {
  return state.taskSubjects.filter((ts) => ts.task_id === taskId);
}
function tasksForSubject(kind, id) {
  const col = kind === "plant" ? "plant_id" : kind === "location" ? "location_id" : "taxa_id";
  const ids = new Set(state.taskSubjects.filter((ts) => ts[col] === id).map((ts) => ts.task_id));
  return state.tasks.filter((t) => ids.has(t.id));
}
function openTasksForSubject(kind, id) {
  return tasksForSubject(kind, id).filter((t) => t.status !== "done");
}
function openTasks() {
  return state.tasks.filter((t) => t.status !== "done");
}

/* TODO-3. Deferring 24 bloom nudges into tasks dated June 2027 moved the clutter
   rather than clearing it — they left the tile and filled the task list instead.
   A task dated eight months out is not work, it is a reminder that has not
   arrived, and the same argument that took "Should be blooming" off the queue
   applies to it.

   So the open list is what is ACTIONABLE: overdue, due within the week, or
   undated. An undated task always shows — "I'll get to it" is not a schedule,
   and hiding those would lose them entirely.

   Nothing is hidden without a count. The To Do panel and the task screen both
   say how many are scheduled later and link straight to them, because the
   recurring bug in this app has been capability that exists and cannot be
   reached, not capability that is missing. */
const TASK_HORIZON_DAYS = 7;
function taskHorizonISO() {
  const d = new Date();
  d.setDate(d.getDate() + TASK_HORIZON_DAYS);
  return d.toISOString().slice(0, 10);
}
function taskIsScheduledLater(t) {
  return t.status !== "done" && !!t.due_date && t.due_date > taskHorizonISO();
}
function actionableTasks() {
  return openTasks().filter((t) => !taskIsScheduledLater(t));
}
function scheduledTasks() {
  return openTasks().filter(taskIsScheduledLater);
}

/* TODO-2. A plant with an open task dated in the FUTURE has been dealt with —
   the answer was "not now", and the task carries the date it comes back. That
   is enough to drop it off a nudge list, and it needs no new column: due_date
   already says exactly this.

   Deliberately narrow. An open task with NO due date does not suppress
   anything, because "I'll get to it" is not a schedule; nor does an overdue
   one, because the date it promised has passed. Known edge: any future-dated
   task silences the nudge, so a repotting task dated next month also quiets a
   bloom prompt for that plant. Accepted — if the plant is in hand for repotting
   it is not being neglected. Narrowing it further would mean a task kind. */
/* When a bloom nudge should come back. Keyed to the month the species' season
   OPENS, so "not this year" on a spring bloomer resurfaces the following March
   rather than an arbitrary twelve months from whenever it was dismissed.
   `intermittent` has no season to wait for, so it simply gets a year. */
const BLOOM_SEASON_START_MONTH = {
  spring: 3, early_summer: 6, summer: 6, late_summer: 8, fall: 9, winter: 12,
};
/* How many plants WOULD be on the bloom nudge list but for a scheduled task.
   Mirrors expectedToBloom() exactly, minus the suppression, so the two cannot
   drift into disagreeing about what counts as due. */
function bloomsDeferredCount() {
  const seasons = seasonsNow();
  const blooming = new Set(state.bloomEvents.filter((b) => !b.ended_on).map((b) => b.plant_id));
  return state.plants.filter((p) => {
    if (blooming.has(p.id) || p.status !== "active") return false;
    if (!hasScheduledTask("plant", p.id)) return false;
    const t = p.taxa_id ? taxonById(p.taxa_id) : null;
    if (!t || !t.bloom_season || t.bloom_season === "monocarpic" || t.bloom_season === "not_observed") return false;
    return seasons.includes(t.bloom_season);
  }).length;
}

function nextBloomSeasonStart(season) {
  const today = new Date();
  const m = BLOOM_SEASON_START_MONTH[season];
  if (!m) {
    const d = new Date(today); d.setFullYear(d.getFullYear() + 1);
    return d.toISOString().slice(0, 10);
  }
  let year = today.getFullYear();
  // Strictly future: dismissing in March must not resurface the same March.
  if (today.getMonth() + 1 >= m) year += 1;
  return `${year}-${String(m).padStart(2, "0")}-01`;
}

/* STAGE-1. A staging area holds specimens that have arrived but are not planted
   yet. Amanda asked for a location that creates a task when a plant is added to
   it; this DERIVES the list instead of writing task rows.

   Derived rather than triggered, deliberately. Five separate code paths set
   `location_id` — the new-plant form, Move, Edit, New specimen here, and
   moveToHospital — so a write hook would have to be right in all five, and
   missing one fails silently. Worse, a task written on arrival outlives the
   move: plant the specimen, take it out of staging, and the task is still open
   waiting to be closed by hand. A derived row cannot go stale, because the
   plant's own location IS the state.

   "Make a task" is still offered per row for the ones that want a note or a
   date, and a future-dated task defers the nudge exactly as it does for blooms
   (TODO-2). Nesting counts: a tray inside a staging bench is still staging. */
function stagingLocationIds() {
  const ids = new Set();
  state.locations.filter((l) => l.type === "staging").forEach((l) => {
    ids.add(l.id);
    descendantLocationIds(l.id).forEach((d) => ids.add(d));
  });
  return ids;
}
function plantsAwaitingPlanting() {
  const ids = stagingLocationIds();
  if (!ids.size) return [];
  return state.plants.filter((p) => p.status === "active" && p.location_id && ids.has(p.location_id))
    .filter((p) => !hasScheduledTask("plant", p.id));
}
function stagingDeferredCount() {
  const ids = stagingLocationIds();
  if (!ids.size) return 0;
  return state.plants.filter((p) => p.status === "active" && p.location_id && ids.has(p.location_id)
    && hasScheduledTask("plant", p.id)).length;
}

function hasScheduledTask(kind, id) {
  const today = todayISO();
  return openTasksForSubject(kind, id).some((t) => t.due_date && t.due_date > today);
}
// Overdue sorts first, then soonest due, then oldest created. A task with no
// due date is not overdue — it is just not scheduled.
function taskIsOverdue(t) {
  return t.status !== "done" && !!t.due_date && t.due_date <= todayISO();
}
function sortTasks(list) {
  return [...list].sort((a, b) => {
    const ao = taskIsOverdue(a) ? 0 : 1, bo = taskIsOverdue(b) ? 0 : 1;
    if (ao !== bo) return ao - bo;
    if (a.due_date && b.due_date && a.due_date !== b.due_date) return a.due_date < b.due_date ? -1 : 1;
    if (!!a.due_date !== !!b.due_date) return a.due_date ? -1 : 1;
    return (b.created_at || "").localeCompare(a.created_at || "");
  });
}

// A subject renders as a label wherever it appears, whatever its kind.
function subjectLabel(ts) {
  if (ts.plant_id) {
    const pl = state.plants.find((p) => p.id === ts.plant_id);
    return pl ? `${pl.accession_number} · ${plantDisplayName(pl)}` : "Deleted specimen";
  }
  if (ts.location_id) {
    const l = locationById(ts.location_id);
    return l ? locationPath(l) : "Deleted location";
  }
  const t = ts.taxa_id ? taxonById(ts.taxa_id) : null;
  return t ? taxonDisplayName(t) : "Deleted species";
}
function subjectKind(ts) {
  return ts.plant_id ? "plant" : ts.location_id ? "location" : "taxa";
}
function subjectIcon(ts) {
  return icon(ts.plant_id ? "seedling" : ts.location_id ? "pin" : "leaf");
}
function openSubject(ts) {
  if (ts.plant_id) return openPlant(ts.plant_id);
  if (ts.location_id) return openLocation(ts.location_id);
  if (ts.taxa_id) return openTaxon(ts.taxa_id);
}

/* RPT-3 — check-ins.
   Two independent reasons a specimen wants looking at:
     1. an explicit next_check_date that has arrived, and
     2. staleness — nothing photographed for longer than the interval.
   Amanda's call: the explicit date wins when set; otherwise fall back to the
   interval, which defaults to 14 days and is adjustable in Settings. */
function lastPhotoDateForPlant(plantId) {
  const dates = plantPhotosOrdered(plantId).map(photoDate).filter(Boolean);
  if (!dates.length) return null;
  return dates.sort().slice(-1)[0];
}
function checkInStatus(pl) {
  if (pl.status !== "active") return null;      // a dead or given-away plant is not a chore
  if (pl.next_check_date) {
    const over = daysBetween(pl.next_check_date, todayISO());
    return over >= 0
      ? { due: true, reason: "scheduled", days: over, label: over === 0 ? "Due today" : `${over}d overdue` }
      : { due: false, reason: "scheduled", days: over, label: `Due ${fmtDate(pl.next_check_date)}` };
  }
  const last = lastPhotoDateForPlant(pl.id);
  const interval = checkInIntervalDays();
  // Never photographed is a real gap, but it is a different one — it belongs to
  // the "no photos" queue, not here, or every new specimen would be overdue on
  // the day it is created.
  if (!last) return null;
  const age = daysBetween(last, todayISO());
  return age >= interval
    ? { due: true, reason: "stale", days: age, label: `${age}d since a photo` }
    : { due: false, reason: "stale", days: age, label: `${age}d since a photo` };
}
function plantsNeedingCheckIn() {
  return state.plants
    .map((pl) => ({ pl, st: checkInStatus(pl) }))
    .filter((x) => x.st && x.st.due)
    .sort((a, b) => b.st.days - a.st.days);
}

/* NAV-1. Back used to mean "go to the Plants tab", not "go back". Filter the
   Plants list to the 61 names needing cleanup, open one, and Back dropped the
   filter and your scroll position — so working a list meant re-filtering and
   re-scrolling after every single record. `state.backTo` existed but only the
   work queue set it, and it only remembered a tab.

   A snapshot remembers the whole view: which list, which filter, what was
   typed, and how far down you were. Capped at 12, which is deeper than any
   real path through this app and stops a long session growing without bound. */
function viewSnapshot() {
  return {
    tab: state.tab,
    reportView: state.reportView,
    currentPlantId: state.currentPlantId,
    currentLocationId: state.currentLocationId,
    currentTaxonId: state.currentTaxonId,
    taxaSearch: state.taxaSearch,
    taxaOnlySuggestions: state.taxaOnlySuggestions,
    taxaOnlyMissingParts: state.taxaOnlyMissingParts,
    galleryFilters: { ...state.galleryFilters },
    inboxSearch: state.inboxSearch,
    scrollY: window.scrollY || 0,
    label: viewLabel(),

}

// What the back button should say. Names the place you would return to, which
// is the thing that makes a back button trustworthy.
function viewLabel() {
  if (state.tab === "plants") {
    if (state.taxaOnlyMissingParts) return "Names to split";
    if (state.taxaOnlySuggestions) return "Suggestions";
    if (state.taxaSearch) return `“${state.taxaSearch}”`;
    return "Plants";
  }
  if (state.tab === "inbox") return state.reportView ? "To Do list" : "To Do";
  if (state.tab === "locations") return "Locations";
  if (state.tab === "gallery") {
    const f = state.galleryFilters;
    if (f.album) return locationById(f.album)?.name || "Album";
    if (f.needs || f.highlight || f.favorites || f.inBloom || f.search) return "Gallery results";
    return "Gallery";
  }
  if (state.tab === "taxonDetail") {
    const t = taxonById(state.currentTaxonId);
    return t ? taxonDisplayName(t) : "Species";
  }
  if (state.tab === "locationDetail") {
    const l = locationById(state.currentLocationId);
    return l ? l.name : "Location";
  }
  if (state.tab === "plantDetail") {
    const pl = state.plants.find((x) => x.id === state.currentPlantId);
    return pl ? pl.accession_number : "Specimen";
  }
  if (state.tab === "settings") return "Settings";
  return "Back";
}

function navPush() {

function navBack() {
  const snap = state.navStack.pop();
  if (!snap) { goTab("plants"); return; }
  Object.assign(state, {
    tab: snap.tab,
    reportView: snap.reportView,
    currentPlantId: snap.currentPlantId,
    currentLocationId: snap.currentLocationId,
    currentTaxonId: snap.currentTaxonId,
    taxaSearch: snap.taxaSearch,
    taxaOnlySuggestions: snap.taxaOnlySuggestions,
    taxaOnlyMissingParts: snap.taxaOnlyMissingParts,
    galleryFilters: { ...snap.galleryFilters },
    inboxSearch: snap.inboxSearch,
    modal: null,

  requestAnimationFrame(() => window.scrollTo(0, snap.scrollY || 0));
}

// Work that survives its modal needs a home. Without this, dismissing the
// import dialog — including by tapping the backdrop — leaves the import running
// with nothing on screen to say so.
/* STALE-1. GitHub Pages serves index.html from cache, so a deploy can be live
   while the open tab still runs old code. That has cost real time: a PGRST303
   was chased as a token bug when the tab simply predated the fix, and the
   version in Settings only helps if you think to look.

   Fetch our own page past the cache and compare the constant. Cheap — one
   request on boot — and it turns "why is this broken" into "there is a new
   version, reload". */
async function checkForNewVersion() {
  try {
    const res = await fetch(`${window.location.pathname}?v=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) return;
    const m = (await res.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) {
      state.newVersion = m[1];
      render();
    }
  } catch (e) { /* offline, or served from somewhere that will not give us the file */ }
}

function taskBanner() {
  if (state.newVersion) {
    return `<div class="task-banner" style="background:var(--orange);color:#2A1A05;" onclick="location.reload(true)">
      <div class="task-banner-text">Version ${escapeHtml(state.newVersion)} is available<div class="task-banner-sub">You are running ${APP_VERSION} — tap to reload. Saving may fail until you do.</div></div>
      <button class="btn-ghost" style="padding:0 4px;font-size:12px;color:#2A1A05;flex-shrink:0;" onclick="event.stopPropagation();state.newVersion='';render()">Later</button>
    </div>`;
  }
  if (state.resumableImport) {
    const r = state.resumableImport;
    return `<div class="task-banner" style="background:var(--blue);color:#0E2320;" onclick="resumePhotosImport()">
      <div class="task-banner-text">Resume importing ${r.remaining.length} more from Google Photos?<div class="task-banner-sub">${r.done} of ${r.total} done · links expire in about ${r.minutesLeft} min · tap to continue</div></div>
      <button class="btn-ghost" style="padding:0 4px;font-size:12px;color:#0E2320;flex-shrink:0;" onclick="event.stopPropagation();dismissResumableImport()">Discard</button>
    </div>`;
  }
  const sb = state.suggestBatch;
  if (sb) {
    return `<div class="task-banner">
      <div class="task-spin"></div>
      <div class="task-banner-text">Asking Claude<div class="task-banner-sub">${sb.done} of ${sb.total}${sb.failed ? ` · ${sb.failed} failed` : ""}</div></div>
    </div>`;
  }
  const dd = state.dupeDelete;
  if (dd) {
    const label = dd.phase === "linking"
      ? "Keeping Google Photos links on the copies you are keeping"
      : "Deleting duplicates";
    return `<div class="task-banner">
      <div class="task-spin"></div>
      <div class="task-banner-text">${label}<div class="task-banner-sub">${dd.done} of ${dd.total}${dd.phase === "linking" ? " · so they are not re-imported" : ""}</div></div>
    </div>`;
  }
  const imp = state.photosImport;
  const bf = state.backfill;
  if (imp && imp.phase === "picking") {
    return `<div class="task-banner" onclick="openModal('photosPicker',{})">
      <div class="task-spin"></div>
      <div class="task-banner-text">Waiting for your Google Photos selection<div class="task-banner-sub">Pick photos in the other tab, then press Done</div></div>
    </div>`;
  }
  if (imp && imp.phase === "importing") {
    const idleMs = Date.now() - (imp.lastProgressAt || Date.now());
    // A single import can legitimately run to the 120s timeout, so only call it
    // stalled well past that — otherwise a slow-but-working run looks broken.
    const stalled = idleMs > 150000;
    const detail = [
      `${imp.done} of ${imp.total}`,
      imp.failed ? `${imp.failed} failed` : "",
      imp.lastError ? imp.lastError : "",
      stalled ? `no progress for ${Math.round(idleMs / 60000)} min` : "",
    ].filter(Boolean).join(" · ");
    return `<div class="task-banner" style="${stalled ? "background:var(--terracotta);color:#3A1608;" : ""}" onclick="openModal('photosPicker',{})">
      <div class="task-spin" style="${stalled ? "animation:none;opacity:0.5;" : ""}"></div>
      <div class="task-banner-text">${stalled ? "Import may have stalled" : "Importing from Google Photos"}<div class="task-banner-sub">${detail}</div></div>
    </div>`;
  }
  if (bf && bf.running) {
    return `<div class="task-banner" onclick="goTab('settings')">
      <div class="task-spin"></div>
      <div class="task-banner-text">Reading capture dates<div class="task-banner-sub">${bf.done} of ${bf.total} · ${bf.found} dated</div></div>
    </div>`;
  }
  return "";
}

async function applyGalleryBatch() {
