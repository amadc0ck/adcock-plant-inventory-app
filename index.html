function screenInbox() {
  const unassigned = state.photos.filter((p) => !p.plant_id && !p.location_id && p.photo_type !== "historical");
  const limit = state.inboxLimit || 20;
  const visible = unassigned.slice(0, limit);
  const remaining = unassigned.length - visible.length;
  const selectMode = state.inboxSelectMode;
  const selectedCount = state.inboxSelected.size;
  return `
  <div class="screen">
    <div class="container">
      <p class="subtle" style="margin-bottom:16px;">${selectMode ? "Tap photos to select them, then choose an action below." : "Photos land here first — confirm or attach them to a plant."}</p>
      ${unassigned.length === 0 ? `
        <div class="empty"><div class="display">Nothing waiting</div><div>Tap the camera button to add a photo.</div></div>` : `
        <div class="card-grid">${visible.map((p) => photoRow(p, selectMode)).join("")}</div>
        ${remaining > 0 ? `<button class="btn btn-secondary btn-block" style="margin-top:16px;" onclick="state.inboxLimit=(state.inboxLimit||20)+20;render()">Show ${Math.min(remaining, 20)} more (${remaining} left)</button>` : ""}`}
    </div>
  </div>
  ${selectMode && selectedCount > 0 ? `
    <div class="bulk-action-bar">
      <div class="container" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="mono" style="font-size:12.5px;color:var(--cream);">${selectedCount} selected</span>
        <button class="btn btn-secondary btn-sm" onclick="openModal('bulkAttachPlant')">Attach to plant</button>
        <button class="btn btn-secondary btn-sm" onclick="openModal('bulkAttachLocation')">Add Location</button>
        <button class="btn btn-danger btn-sm icon-btn" onclick="bulkDeletePhotos()">${icon("trash")} Delete</button>
      </div>
    </div>` : ""}`;
}

function photoRow(p, selectMode) {
  const cachedUrl = state.photoUrlCache[p.drive_file_id];
  if (!cachedUrl) ensurePhotoLoaded(p.drive_file_id);
  const suggestions = pendingIdentifications(p.id);
  const plantnetSuggestion = suggestions.find((s) => s.source === "PlantNet");
  const claudeSuggestion = suggestions.find((s) => s.source === "Claude");
  const isIdentifying = state.identifyingPhotoId === p.id;
  const isIdentifyingClaude = state.identifyingPhotoIdClaude === p.id;
  const isSelected = state.inboxSelected.has(p.id);

  function suggestionBadge(s) {
    return `
      <div style="margin-top:6px;padding:7px 9px;background:rgba(124,167,161,0.15);border-radius:6px;font-size:12.5px;${selectMode ? "" : "cursor:pointer;"}" ${selectMode ? "" : `onclick="event.stopPropagation();openModal('identificationDetail',{identificationId:'${s.id}'})"`}>
        <span class="mono" style="font-size:9.5px;color:var(--blue);text-transform:uppercase;">${s.source}</span><br/>
        <em>${escapeHtml(s.suggested_name)}</em>${s.confidence ? ` (${Math.round(s.confidence * 100)}%)` : ""}${selectMode ? "" : ` <span style="color:var(--blue);">— compare →</span>`}
      </div>`;
  }

  return `
  <div class="tag-card" style="padding:0;overflow:hidden;${selectMode ? `cursor:pointer;outline:${isSelected ? "3px solid var(--moss)" : "none"};` : ""}" ${selectMode ? `onclick="toggleInboxPhotoSelected('${p.id}')"` : ""}>
    <div class="inbox-photo-hero" ${cachedUrl && !selectMode ? `onclick="openInboxLightbox('${p.id}')"` : ""} style="cursor:${cachedUrl && !selectMode ? "pointer" : "default"};">
      ${selectMode ? `<div class="select-check ${isSelected ? "checked" : ""}" style="top:8px;left:8px;">${isSelected ? icon("check") : ""}</div>` : ""}
      ${cachedUrl ? `<img src="${cachedUrl}" style="width:100%;height:100%;object-fit:cover;" />` : `<div class="plant-hero-empty">${icon("photo")}</div>`}
    </div>
    <div style="padding:12px 14px 14px;">
      <div class="tag-id">Photo · ${fmtDate(photoDate(p))}</div>
      <div style="font-size:13.5px;margin-top:2px;color:var(--ink-soft);cursor:pointer;" onclick="openModal('editPhotoNote',{photoId:'${p.id}'})">${p.notes ? escapeHtml(p.notes) : "No notes — tap to add"}</div>
      ${plantnetSuggestion ? suggestionBadge(plantnetSuggestion) : ""}
      ${claudeSuggestion ? suggestionBadge(claudeSuggestion) : ""}
      ${!selectMode ? `
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;">
        ${!plantnetSuggestion ? `<button class="btn btn-secondary btn-sm btn-on-cream icon-btn" ${isIdentifying ? "disabled" : ""} onclick="identifyPhoto('${p.id}')">${isIdentifying ? '<span class="spinner"></span>' : icon("photoQuestion")} ${isIdentifying ? "…" : "Identify"}</button>` : `<button class="btn btn-secondary btn-sm btn-on-cream" onclick="dismissIdentification('${plantnetSuggestion.id}')">Dismiss Pl@ntNet</button>`}
        ${!claudeSuggestion ? `<button class="btn btn-secondary btn-sm btn-on-cream icon-btn" ${isIdentifyingClaude ? "disabled" : ""} onclick="identifyPhotoClaude('${p.id}')">${isIdentifyingClaude ? '<span class="spinner"></span>' : icon("photoQuestion")} ${isIdentifyingClaude ? "…" : "Ask Claude"}</button>` : `<button class="btn btn-secondary btn-sm btn-on-cream" onclick="dismissIdentification('${claudeSuggestion.id}')">Dismiss Claude</button>`}
        <button class="btn btn-secondary btn-sm btn-on-cream icon-btn" onclick="openModal('attach',{photoId:'${p.id}'})">${icon("link")} Plant</button>
        <button class="btn btn-secondary btn-sm btn-on-cream icon-btn" onclick="openModal('attachLocation',{photoId:'${p.id}'})">${icon("pin")} Location</button>
        <button class="btn btn-secondary btn-sm btn-on-cream icon-btn" onclick="openModal('newPlantFromPhoto',{photoId:'${p.id}'})">${icon("plus")} New</button>
        <button class="btn btn-danger btn-sm icon-btn" onclick="deletePhoto('${p.id}')" aria-label="Delete">${icon("trash")}</button>
      </div>
      <button class="btn-ghost" style="margin-top:8px;font-size:11.5px;" onclick="archivePhoto('${p.id}')">Archive as historical (no plant/container needed)</button>` : ""}
    </div>
  </div>`;
}

function screenPlants() {
  const q = (state.plantSearch || "").toLowerCase();
  const f = state.plantFilters;
  const list = state.plants.filter((pl) => {
    if (q) {
      const hay = [pl.accession_number, pl.common_name, pl.botanical_name, pl.cultivar].filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (f.category && pl.collection_category !== f.category) return false;
    if (f.status && pl.status !== f.status) return false;
    if (f.idStatus && pl.identification_status !== f.idStatus) return false;
    if (f.original === "yes" && !pl.original_collection) return false;
    if (f.original === "no" && pl.original_collection) return false;
    if (f.location) {
      const plantLocIds = allLocationsForPlant(pl).map((l) => l.id);
      if (!plantLocIds.includes(f.location)) return false;
    }
    return true;
  });

  const activeFilterCount = [f.category, f.status, f.idStatus, f.original, f.location].filter(Boolean).length;

  return `
  <div class="screen">
    <div class="container">
      <h2 class="display" style="font-size:22px;font-weight:500;margin:0 0 16px;">Plants</h2>
      <input class="search-input" placeholder="Search name, accession #, cultivar…" value="${escapeHtml(state.plantSearch || "")}" oninput="state.plantSearch=this.value;render()" />
      <div class="row" style="margin-bottom:16px;">
        <button class="btn btn-secondary btn-sm" onclick="openModal('plantFilters')">
          Filters${activeFilterCount ? ` <span class="pill pill-orange" style="margin-left:4px;">${activeFilterCount}</span>` : ""}
        </button>
        <button class="btn btn-accent btn-sm" onclick="openModal('newPlant')">+ New Plant</button>
      </div>
      ${activeFilterCount ? `<button class="btn-ghost" style="font-size:12.5px;margin-top:-10px;" onclick="state.plantFilters={category:'',status:'',idStatus:'',original:'',location:''};render()">Clear filters</button>` : ""}
      ${(q || activeFilterCount) ? `<div class="subtle" style="margin:-8px 0 16px;">${list.length} of ${state.plants.length} plants</div>` : ""}
      ${list.length === 0 ? `
        <div class="empty"><div class="display">${state.plants.length === 0 ? "No plants yet" : "No matches"}</div>
        <div>${state.plants.length === 0 ? "Add your first plant from the Inbox or a photo." : "Try different search or filters."}</div></div>` : `
        <div class="card-grid">${list.map(plantRow).join("")}</div>`}
    </div>
  </div>`;
}

function plantRow(pl) {
  const loc = locationById(pl.location_id);
  const photos = plantPhotosOrdered(pl.id);
  const cover = plantCoverPhoto(pl);
  if (cover && !state.photoUrlCache[cover.drive_file_id]) ensurePhotoLoaded(cover.drive_file_id);
  const coverUrl = cover ? state.photoUrlCache[cover.drive_file_id] : null;
  const needsAttention = pl.status !== "active" || pl.health_status === "watch" || pl.health_status === "recovery";

  return `
  <div class="tag-card plant-list-card" onclick="openPlant('${pl.id}')">
    <div class="status-badge ${needsAttention ? "status-attention" : "status-active"}" title="${needsAttention ? "Needs attention" : "Active & healthy"}">${needsAttention ? icon("alertTriangle") : icon("check")}</div>
    <div class="plant-list-thumb">
      ${coverUrl ? `<img src="${coverUrl}" style="width:100%;height:100%;object-fit:cover;object-position:top;" />` : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
    </div>
    <div style="flex:1;min-width:0;">
      <div class="tag-id">${pl.accession_number}</div>
      <div style="font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-top:2px;font-style:${pl.botanical_name ? "italic" : "normal"};line-height:1.25;">${escapeHtml(plantDisplayName(pl))}</div>
      ${pl.botanical_name && pl.common_name ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:1px;">${escapeHtml(pl.common_name)}</div>` : ""}
      <div class="wrap-gap" style="margin-top:7px;">
        ${pl.collection_category === "historical" ? `<span class="pill-solid pill-solid-outline">Historical</span>` : ""}
        ${pl.original_collection ? `<span class="pill-solid pill-solid-pink">Original</span>` : ""}
        ${pl.identification_status !== "confirmed" ? `<span class="pill-solid pill-solid-outline">${ID_STATUS_LABELS[pl.identification_status]}</span>` : ""}
        ${pl.status !== "active" ? `<span class="pill-solid pill-solid-terracotta">${STATUS_LABELS[pl.status]}</span>` : ""}
      </div>
      <div class="row" style="margin-top:8px;">
        <div style="font-size:12px;color:var(--ink-soft);">📍 ${loc ? escapeHtml(locationPath(loc)) : "No location set"}${additionalLocationRows(pl.id).length ? ` <span style="color:var(--blue);">+${additionalLocationRows(pl.id).length} more</span>` : ""}</div>
        <div class="mono" style="font-size:11px;color:var(--moss-dim);flex-shrink:0;">${photos.length} photo${photos.length === 1 ? "" : "s"}</div>
      </div>
    </div>
  </div>`;
}

function screenPlantDetail() {
  const pl = state.plants.find((p) => p.id === state.currentPlantId);
  if (!pl) return `<div class="screen container"><p>Plant not found.</p></div>`;
  const loc = locationById(pl.location_id);
  const parent = pl.parent_plant_id ? state.plants.find((p) => p.id === pl.parent_plant_id) : null;
  const photos = state.photos.filter((p) => p.plant_id === pl.id).sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
  // Reference/ID photos (e.g. a profile picture that isn't a dated
  // observation of this exact specimen) are excluded from the timeline list.
  const timelinePhotos = photos.filter((p) => p.photo_type !== "identification");

  const primaryPhoto = pl.primary_photo_id ? photos.find((p) => p.id === pl.primary_photo_id) : null;
  const heroPhoto = primaryPhoto || photos[0] || null;
  if (heroPhoto && !state.photoUrlCache[heroPhoto.drive_file_id]) ensurePhotoLoaded(heroPhoto.drive_file_id);
  const heroUrl = heroPhoto ? state.photoUrlCache[heroPhoto.drive_file_id] : null;

  return `
  <div class="screen">
    <div class="container">
      <button class="btn-ghost" style="padding:4px 0 14px;display:flex;align-items:center;gap:4px;" onclick="goTab('plants')">${icon("back")} Plants</button>

      <div class="tag-card" style="padding:0;overflow:hidden;">
        <div class="plant-hero" ${heroUrl ? `onclick="openLightbox('${pl.id}','${heroPhoto.id}')"` : `onclick="openModal('choosePrimaryPhoto',{plantId:'${pl.id}'})"`}>
          ${heroUrl
            ? `<img src="${heroUrl}" style="width:100%;height:100%;object-fit:cover;object-position:top;" />`
            : `<div class="plant-hero-empty">${icon("photo")}<span>Tap to add a profile picture</span></div>`}
        </div>
        <button class="hero-change-btn" onclick="event.stopPropagation();openModal('choosePrimaryPhoto',{plantId:'${pl.id}'})">${heroUrl ? "Change photo" : "Add photo"}</button>

        <div style="padding:18px 18px 16px 22px;">
          <div class="tag-id">${pl.accession_number}</div>
          <div class="display" style="font-size:25px;font-weight:600;margin-top:4px;font-style:${pl.botanical_name ? "italic" : "normal"};line-height:1.2;">${escapeHtml(plantDisplayName(pl))}</div>
          ${pl.botanical_name && pl.common_name ? `<div style="color:var(--ink);font-size:14.5px;margin-top:3px;font-weight:500;">${escapeHtml(pl.common_name)}</div>` : ""}
          ${pl.cultivar ? `<div style="color:var(--ink-soft);font-size:13px;margin-top:2px;">'${escapeHtml(pl.cultivar)}'</div>` : ""}
          ${pl.family || pl.genus ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:5px;letter-spacing:0.2px;">${[pl.family, pl.genus].filter(Boolean).join(" · ")}</div>` : ""}

          <div class="wrap-gap" style="margin-top:13px;">
            <span class="pill-solid ${pl.status === "active" ? "pill-solid-moss" : "pill-solid-terracotta"}">${STATUS_LABELS[pl.status]}</span>
            <span class="pill-solid pill-solid-outline">${CATEGORY_LABELS[pl.collection_category]}</span>
            <span class="pill-solid ${pl.identification_status === "confirmed" ? "pill-solid-moss" : "pill-solid-outline"}">${ID_STATUS_LABELS[pl.identification_status]}</span>
            ${pl.original_collection ? `<span class="pill-solid pill-solid-pink">Original Collection</span>` : ""}
            <span class="pill-solid pill-solid-blue">${HEALTH_LABELS[pl.health_status]}</span>
          </div>

          <div style="margin-top:14px;">
            ${(() => {
              const allLocs = allLocationsForPlant(pl);
              const extraRows = additionalLocationRows(pl.id);
              if (allLocs.length === 0) {
                return `<div style="font-size:13px;color:var(--ink);font-weight:500;">📍 No location set</div>`;
              }
              return allLocs.map((l, i) => {
                const isPrimary = i === 0 && l.id === pl.location_id;
                const row = extraRows.find((r) => r.location_id === l.id);
                return `
                <div class="row" style="margin-top:${i > 0 ? "3" : "0"}px;">
                  <div style="font-size:13px;color:var(--ink);font-weight:500;">📍 ${escapeHtml(locationPath(l))}${isPrimary ? ` <span style="font-size:11px;color:var(--ink-soft);font-weight:400;">(main)</span>` : ""}</div>
                  ${!isPrimary && row ? `<button class="btn-ghost" style="padding:0;font-size:11.5px;color:var(--terracotta);" onclick="removePlantLocation('${row.id}')">Remove</button>` : ""}
                </div>`;
              }).join("");
            })()}
            <button class="btn-ghost" style="padding:6px 0 0;font-size:12px;color:var(--chicory-oncream);" onclick="openModal('addPlantLocation',{plantId:'${pl.id}'})">+ Add another location</button>
          </div>
          ${parent ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">Propagated from <strong>${parent.accession_number}</strong> — ${escapeHtml(plantDisplayName(parent))}</div>` : ""}

          ${pl.notes ? `<div style="margin-top:12px;font-size:14px;color:var(--ink-soft);">${escapeHtml(pl.notes)}</div>` : ""}
          <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;">
            <button class="btn-ghost" style="padding:0;font-size:12.5px;color:var(--chicory-oncream);" onclick="openModal('editPlant',{plantId:'${pl.id}'})">Edit full record</button>
            <button class="btn-ghost" style="padding:0;font-size:12.5px;color:var(--chicory-oncream);" onclick="moveToHospital('${pl.id}')">Move to Plant Hospital</button>
            <button class="btn-ghost" style="padding:0;font-size:12.5px;color:var(--chicory-oncream);" onclick="openModal('propagatePlant',{parentId:'${pl.id}'})">Propagate from this plant</button>
            <button class="btn-ghost icon-btn" style="padding:0;font-size:12.5px;color:var(--terracotta);" onclick="deletePlant('${pl.id}')">${icon("trash")} Delete plant</button>
          </div>
        </div>
      </div>

      ${(pl.identification_notes || pl.acquisition_source_type || pl.acquisition_source_name || pl.acquisition_notes || pl.date_acquired) ? `
      <div class="surface" style="padding:16px;margin-top:14px;">
        ${pl.identification_notes ? `<div class="section-label">Identification notes</div><div style="font-size:13.5px;color:#C9D6CC;">${escapeHtml(pl.identification_notes)}</div>` : ""}
        ${(pl.acquisition_source_type || pl.acquisition_source_name || pl.date_acquired || pl.acquisition_notes) ? `
          <div class="section-label">Provenance</div>
          <div style="font-size:13.5px;color:#C9D6CC;line-height:1.6;">
            ${pl.date_acquired ? `Acquired: ${fmtDate(pl.date_acquired)}<br/>` : ""}
            ${pl.acquisition_source_type ? `Source: ${ACQ_SOURCE_LABELS[pl.acquisition_source_type]}${pl.acquisition_source_name ? " — " + escapeHtml(pl.acquisition_source_name) : ""}<br/>` : ""}
            ${pl.acquisition_notes ? escapeHtml(pl.acquisition_notes) : ""}
          </div>` : ""}
      </div>` : ""}

      ${(pl.native_range || pl.hardy_to || (pl.light_conditions && pl.light_conditions.length) || pl.water_needs) ? `
      <div class="surface" style="padding:16px;margin-top:14px;">
        <div class="section-label">Care</div>
        <div style="font-size:13.5px;color:#C9D6CC;line-height:1.7;">
          ${pl.native_range ? `Native to: ${escapeHtml(pl.native_range)}<br/>` : ""}
          ${pl.hardy_to ? `Hardy to: ${escapeHtml(pl.hardy_to)}<br/>` : ""}
          ${pl.light_conditions && pl.light_conditions.length ? `Light: ${pl.light_conditions.map((c) => c.replace("_", " ")).join(", ")}<br/>` : ""}
          ${pl.water_needs ? `Water: ${pl.water_needs}` : ""}
        </div>
      </div>` : ""}

      <div class="row" style="margin-top:26px;margin-bottom:4px;">
        <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Photo timeline</h3>
        <span class="subtle">${timelinePhotos.length} total</span>
      </div>

      ${timelinePhotos.length === 0 ? `<div class="empty" style="padding:40px 20px;"><div>No photos attached yet.</div></div>` : `
        ${groupPhotosByLocation(timelinePhotos).map((group) => `
          <div class="loc-group-title" style="margin-top:18px;">${group.location ? "📍 " + escapeHtml(locationPath(group.location)) : "No location tagged"}</div>
          <div class="card-grid">
            ${group.photos.map((p) => {
              const cachedUrl = state.photoUrlCache[p.drive_file_id];
              if (!cachedUrl) ensurePhotoLoaded(p.drive_file_id);
              const taggedIds = state.photoPlants.filter((pp) => pp.photo_id === p.id).map((pp) => pp.plant_id);
              const taggedPlants = taggedIds.map((id) => state.plants.find((x) => x.id === id)).filter(Boolean);
              const photoLocs = allLocationsForPhoto(p);
              const isPrimary = pl.primary_photo_id === p.id;
              return `
              <div class="surface" style="padding:14px;">
                <div class="row">
                  <div class="photo-row">
                    <div class="photo-icon" style="cursor:${cachedUrl ? "pointer" : "default"};" ${cachedUrl ? `onclick="openLightbox('${pl.id}','${p.id}')"` : ""}>${cachedUrl ? `<img src="${cachedUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;" />` : icon("photo")}</div>
                    <div>
                      <div class="mono" style="font-size:11px;color:#8AA090;">${fmtDate(photoDate(p))}</div>
                      <div style="font-size:14px;margin-top:2px;">${p.notes ? escapeHtml(p.notes) : "—"}</div>
                      ${taggedPlants.length ? `<div style="font-size:11.5px;color:var(--blue);margin-top:4px;">Also shows: ${taggedPlants.map((tp) => escapeHtml(plantDisplayName(tp))).join(", ")}</div>` : ""}
                      ${photoLocs.length ? `<div style="font-size:11.5px;color:var(--moss-dim);margin-top:2px;">📍 ${photoLocs.map((l2) => escapeHtml(l2.name)).join(", ")}</div>` : ""}
                    </div>
                  </div>
                  ${isPrimary ? `<span class="pill pill-orange">Profile</span>` : ""}
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
                  <button class="btn-ghost icon-btn" style="padding:0;font-size:12px;" onclick="openModal('tagPlants',{photoId:'${p.id}'})">${icon("tag")} Tag plants</button>
                  <button class="btn-ghost icon-btn" style="padding:0;font-size:12px;" onclick="openModal('attachLocation',{photoId:'${p.id}'})">${icon("pin")} Location</button>
                  ${!isPrimary ? `<button class="btn-ghost" style="padding:0;font-size:12px;" onclick="setPrimaryPhoto('${pl.id}','${p.id}')">Set as profile picture</button>` : ""}
                  <button class="btn-ghost icon-btn" style="padding:0;font-size:12px;color:var(--terracotta);" onclick="deletePhoto('${p.id}')">${icon("trash")} Delete</button>
                </div>
              </div>`;
            }).join("")}
          </div>
        `).join("")}`}
    </div>
  </div>`;
}

function locationCoverPhoto(l) {
  const photos = photosAtLocation(l.id);
  if (l.primary_photo_id) {
    const primary = photos.find((p) => p.id === l.primary_photo_id);
    if (primary) return primary;
  }
  return photos.sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)))[0] || null;
}

function screenLocations() {
  const topLevel = state.locations.filter((l) => !l.parent_location_id).sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || a.name.localeCompare(b.name));

function locationCard(l) {
    const plantCount = aggregatePlantCount(l.id);
    const photoCount = photosAtLocation(l.id).length;
    const childCount = directChildLocations(l.id).length;
    const cover = locationCoverPhoto(l);
    if (cover && !state.photoUrlCache[cover.drive_file_id]) ensurePhotoLoaded(cover.drive_file_id);
    const coverUrl = cover ? state.photoUrlCache[cover.drive_file_id] : null;
    return `
      <div class="tag-card plant-list-card" onclick="openLocation('${l.id}')">
        <div class="plant-list-thumb">
          ${coverUrl ? `<img src="${coverUrl}" style="width:100%;height:100%;object-fit:cover;" />` : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
        </div>
        <div style="flex:1;min-width:0;">
        <div class="row">
          <div>
            <div class="tag-id">${locationTypeLabel(l.type)}${l.code ? " · " + escapeHtml(l.code) : ""}</div>
            <div style="font-family:'Fraunces',serif;font-size:15px;font-weight:500;margin-top:2px;">${escapeHtml(l.name)}</div>
          </div>
          <div style="text-align:right;">
            <div class="mono" style="font-size:11px;color:var(--moss-dim);">${plantCount} plant${plantCount === 1 ? "" : "s"}${photoCount ? ` · ${photoCount} photo${photoCount === 1 ? "" : "s"}` : ""}</div>
            ${childCount ? `<div style="font-size:11px;color:var(--blue);margin-top:2px;">${childCount} inside →</div>` : ""}
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-secondary btn-sm btn-on-cream" onclick="event.stopPropagation();openModal('editLocation',{locationId:'${l.id}'})">Edit</button>
          <button class="btn btn-secondary btn-sm btn-on-cream" onclick="event.stopPropagation();openModal('upload',{locationId:'${l.id}'})">Add photo</button>
        </div>
        </div>
      </div>`;
  }

  return `
  <div class="screen">
    <div class="container">
      <div class="row" style="margin-bottom:16px;">
        <h2 class="display" style="font-size:22px;font-weight:500;margin:0;">Locations</h2>
        <button class="btn btn-secondary btn-sm" onclick="openModal('newLocation')">+ Add</button>
      </div>
      ${state.locations.length === 0 ? `
        <div class="empty"><div class="display">No locations yet</div><div>Add areas, rows, or containers to organize your plants.</div></div>` : `
        <div class="card-grid">${topLevel.map(locationCard).join("")}</div>`}
    </div>
  </div>`;
}

function screenLocationDetail() {
  const l = locationById(state.currentLocationId);
  if (!l) return `<div class="screen container"><p>Location not found.</p></div>`;
  const plants = plantsAtLocation(l.id);
  const photos = photosAtLocation(l.id).sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));

  const heroPhoto = l.primary_photo_id ? photos.find((p) => p.id === l.primary_photo_id) : photos[0];
  if (heroPhoto && !state.photoUrlCache[heroPhoto.drive_file_id]) ensurePhotoLoaded(heroPhoto.drive_file_id);
  const heroUrl = heroPhoto ? state.photoUrlCache[heroPhoto.drive_file_id] : null;

  return `
  <div class="screen">
    <div class="container">
      <button class="btn-ghost" style="padding:4px 0 14px;display:flex;align-items:center;gap:4px;" onclick="${l.parent_location_id ? `openLocation('${l.parent_location_id}')` : "goTab('locations')"}">${icon("back")} ${l.parent_location_id ? escapeHtml(locationById(l.parent_location_id).name) : "Locations"}</button>

      <div class="tag-card" style="padding:0;overflow:hidden;">
        <div class="plant-hero" ${heroUrl ? `onclick="openLightbox('${l.id}','${heroPhoto.id}','location')"` : `onclick="openModal('chooseLocationPhoto',{locationId:'${l.id}'})"`}>
          ${heroUrl
            ? `<img src="${heroUrl}" style="width:100%;height:100%;object-fit:cover;object-position:top;" />`
            : `<div class="plant-hero-empty">${icon("photo")}<span>Tap to add a main photo</span></div>`}
        </div>
        <button class="hero-change-btn" onclick="event.stopPropagation();openModal('chooseLocationPhoto',{locationId:'${l.id}'})">${heroUrl ? "Change photo" : "Add photo"}</button>

        <div style="padding:16px 16px 14px 20px;">
        <div class="tag-id">${locationTypeLabel(l.type)}${l.code ? " · " + escapeHtml(l.code) : ""}</div>
        <div class="display" style="font-size:22px;font-weight:600;margin-top:3px;">${escapeHtml(l.name)}</div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px;">${escapeHtml(locationPath(l))}</div>
        ${l.notes ? `<div style="font-size:13.5px;color:var(--ink-soft);margin-top:10px;">${escapeHtml(l.notes)}</div>` : ""}
        <button class="btn-ghost" style="padding:10px 0 0;font-size:12.5px;" onclick="openModal('editLocation',{locationId:'${l.id}'})">Edit location</button>
        </div>
      </div>

      ${(() => {
        const children = directChildLocations(l.id);
        if (children.length === 0) return "";
        return `
          <div class="row" style="margin-top:24px;margin-bottom:12px;">
            <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Inside this ${locationTypeLabel(l.type).toLowerCase()}</h3>
            <span class="subtle">${children.length} total</span>
          </div>
          <div class="card-grid">
            ${children.map((c) => {
              const count = aggregatePlantCount(c.id);
              const photoCount = aggregatePhotoCount(c.id);
              const grandchildren = directChildLocations(c.id).length;
              return `
              <div class="tag-card" style="cursor:pointer;padding:12px 14px;" onclick="openLocation('${c.id}')">
                <div class="row">
                  <div>
                    <div class="tag-id">${locationTypeLabel(c.type)}${c.code ? " · " + escapeHtml(c.code) : ""}</div>
                    <div style="font-family:'Fraunces',serif;font-size:14.5px;font-weight:500;margin-top:1px;">${escapeHtml(c.name)}</div>
                  </div>
                  <div style="text-align:right;">
                    <div class="mono" style="font-size:11px;color:var(--moss-dim);">${count} plant${count === 1 ? "" : "s"}${photoCount ? ` · ${photoCount} photo${photoCount === 1 ? "" : "s"}` : ""}</div>
                    ${grandchildren ? `<div style="font-size:11px;color:var(--blue);margin-top:2px;">${grandchildren} inside →</div>` : ""}
                  </div>
                </div>
              </div>`;
            }).join("")}
          </div>`;
      })()}

      <div class="row" style="margin-top:24px;margin-bottom:12px;">
        <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Plants here</h3>
        <span class="subtle">${plants.length} total</span>
      </div>
      <button class="btn btn-secondary btn-sm" style="margin-bottom:12px;" onclick="openModal('linkPlantToLocation',{locationId:'${l.id}'})">+ Link existing plant</button>
      ${plants.length === 0 ? `<div class="empty" style="padding:30px 20px;"><div>No plants assigned here yet.</div></div>` : `
        <div class="card-grid">${plants.map(plantRow).join("")}</div>`}

      <div class="row" style="margin-top:26px;margin-bottom:12px;">
        <h3 class="display" style="font-size:17px;font-weight:500;margin:0;">Container photos</h3>
        <span class="subtle">${photos.length} total</span>
      </div>
      <p class="subtle" style="margin:-6px 0 14px;">Identify or create plants straight from a photo below — no need to re-upload the same shot for each specimen.</p>

      ${photos.length === 0 ? `<div class="empty" style="padding:30px 20px;"><div>No photos of this location yet.</div></div>` : `
        <div class="card-grid">
          ${photos.map((p) => {
            const cachedUrl = state.photoUrlCache[p.drive_file_id];
            if (!cachedUrl) ensurePhotoLoaded(p.drive_file_id);
            const suggestions = pendingIdentifications(p.id);
            const plantnetSuggestion = suggestions.find((s) => s.source === "PlantNet");
            const claudeSuggestion = suggestions.find((s) => s.source === "Claude");
            const isIdentifying = state.identifyingPhotoId === p.id;
            const isIdentifyingClaude = state.identifyingPhotoIdClaude === p.id;
            const claimedBy = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
            const taggedIds = state.photoPlants.filter((pp) => pp.photo_id === p.id).map((pp) => pp.plant_id);
            const taggedPlants = taggedIds.map((id) => state.plants.find((x) => x.id === id)).filter(Boolean);
            const suggestionBadge = (s) => `<div style="margin-top:6px;padding:6px 9px;background:rgba(124,167,161,0.15);border-radius:6px;font-size:12.5px;cursor:pointer;" onclick="openModal('identificationDetail',{identificationId:'${s.id}'})"><span class="mono" style="font-size:9px;color:var(--blue);text-transform:uppercase;">${s.source}</span> <em>${escapeHtml(s.suggested_name)}</em>${s.confidence ? ` (${Math.round(s.confidence * 100)}%)` : ""} <span style="color:var(--blue);">— compare →</span></div>`;
            return `
            <div class="tag-card">
              <div class="photo-row">
                <div class="photo-icon on-cream" style="cursor:${cachedUrl ? "pointer" : "default"};" ${cachedUrl ? `onclick="openLightbox('${l.id}','${p.id}','location')"` : ""}>${cachedUrl ? `<img src="${cachedUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;" />` : icon("photo")}</div>
                <div style="flex:1;min-width:0;">
                  <div class="tag-id">${fmtDate(photoDate(p))}</div>
                  <div style="font-size:13.5px;color:var(--ink-soft);margin-top:2px;">${p.notes ? escapeHtml(p.notes) : "No notes"}</div>
                  ${claimedBy || taggedPlants.length ? `<div style="font-size:11.5px;color:var(--moss-dim);margin-top:4px;">Identified: ${[claimedBy, ...taggedPlants].filter(Boolean).map((tp) => escapeHtml(plantDisplayName(tp))).join(", ")}</div>` : ""}
                  ${(() => {
                    const otherLocs = allLocationsForPhoto(p).filter((loc) => loc.id !== l.id);
                    return otherLocs.length ? `<div style="font-size:11.5px;color:var(--blue);margin-top:2px;">Also in: ${otherLocs.map((loc) => escapeHtml(loc.name)).join(", ")}</div>` : "";
                  })()}
                  ${plantnetSuggestion ? suggestionBadge(plantnetSuggestion) : ""}
                  ${claudeSuggestion ? suggestionBadge(claudeSuggestion) : ""}
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
                ${!plantnetSuggestion ? `<button class="btn btn-secondary btn-sm btn-on-cream" ${isIdentifying ? "disabled" : ""} onclick="identifyPhoto('${p.id}')">${isIdentifying ? '<span class="spinner"></span>' : "Identify"}</button>` : `<button class="btn btn-secondary btn-sm btn-on-cream" onclick="dismissIdentification('${plantnetSuggestion.id}')">Dismiss Pl@ntNet</button>`}
                ${!claudeSuggestion ? `<button class="btn btn-secondary btn-sm btn-on-cream" ${isIdentifyingClaude ? "disabled" : ""} onclick="identifyPhotoClaude('${p.id}')">${isIdentifyingClaude ? '<span class="spinner"></span>' : "Ask Claude"}</button>` : `<button class="btn btn-secondary btn-sm btn-on-cream" onclick="dismissIdentification('${claudeSuggestion.id}')">Dismiss Claude</button>`}
                <button class="btn btn-secondary btn-sm btn-on-cream" onclick="openModal('attachToLocalPlant',{photoId:'${p.id}', locationId:'${l.id}'})">Add to plant here</button>
                <button class="btn btn-secondary btn-sm btn-on-cream" onclick="openModal('attach',{photoId:'${p.id}'})">Attach to any plant</button>
                <button class="btn btn-secondary btn-sm btn-on-cream" onclick="openModal('tagLocations',{photoId:'${p.id}'})">Tag other containers</button>
                <button class="btn btn-accent btn-sm" onclick="openModal('newPlantFromPhoto',{photoId:'${p.id}', locationId:'${l.id}'})">New plant from this photo</button>
                <button class="btn btn-danger btn-sm" onclick="removePhotoFromLocation('${p.id}','${l.id}')">${p.location_id === l.id ? "Unattach from here" : "Remove tag"}</button>
              </div>
            </div>`;
          }).join("")}
        </div>`}
    </div>
  </div>`;
}

function findDuplicatePlantGroups() {
  const groups = {};
  state.plants.forEach((pl) => {
    const nameKey = (pl.botanical_name || pl.common_name || "").trim().toLowerCase();
    if (!nameKey) return;
    const key = `${pl.location_id || "none"}|${nameKey}`;
    (groups[key] = groups[key] || []).push(pl);
  });
  return Object.values(groups).filter((g) => g.length > 1);
}

function screenReports() {
  // Containers with photos attached but no plants recorded there yet
  const locationsNeedingReview = state.locations.filter((l) => photosAtLocation(l.id).length > 0 && plantsAtLocation(l.id).length === 0);

  // Plants with no location at all (primary or additional)
  const plantsNoLocation = state.plants.filter((pl) => allLocationsForPlant(pl).length === 0);

  // Plants with zero photos attached
  const plantsNoPhotos = state.plants.filter((pl) => state.photos.filter((p) => p.plant_id === pl.id).length === 0);

  // Never confirmed/identified
  const plantsUnidentified = state.plants.filter((pl) => pl.identification_status === "unidentified");

  // Health flagged
  const plantsNeedingAttention = state.plants.filter((pl) => pl.health_status === "watch" || pl.health_status === "recovery");

  // Completely empty leaf containers — no children, no photos, no plants
  const emptyContainers = state.locations.filter((l) => directChildLocations(l.id).length === 0 && photosAtLocation(l.id).length === 0 && plantsAtLocation(l.id).length === 0);

  // Possible duplicate plants — same location + same name
  const duplicateGroups = findDuplicatePlantGroups();

  function reportSection(title, items, emptyText, renderItem) {
    return `
      <div class="row" style="margin-top:22px;margin-bottom:10px;">
        <h3 class="display" style="font-size:16px;font-weight:500;margin:0;">${title}</h3>
        <span class="pill ${items.length ? "pill-terracotta" : "pill-moss"}">${items.length}</span>
      </div>
      ${items.length === 0 ? `<p class="subtle" style="margin:0;">${emptyText}</p>` : `<div class="card-grid">${items.map(renderItem).join("")}</div>`}`;
  }

  function locationItem(l) {
    const cover = locationCoverPhoto(l);
    if (cover && !state.photoUrlCache[cover.drive_file_id]) ensurePhotoLoaded(cover.drive_file_id);
    const coverUrl = cover ? state.photoUrlCache[cover.drive_file_id] : null;
    return `
      <div class="tag-card plant-list-card" style="padding:10px 14px;" onclick="openLocation('${l.id}')">
        <div class="plant-list-thumb" style="width:60px;height:60px;">
          ${coverUrl ? `<img src="${coverUrl}" style="width:100%;height:100%;object-fit:cover;" />` : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
        </div>
        <div>
        <div class="tag-id">${locationTypeLabel(l.type)}</div>
        <div style="font-family:'Fraunces',serif;font-size:14.5px;font-weight:500;">${escapeHtml(l.name)}</div>
        <div style="font-size:11.5px;color:var(--ink-soft);">${escapeHtml(locationPath(l))}</div>
        </div>
      </div>`;
  }

  function plantItem(pl) {
    return `
      <div class="tag-card" style="padding:10px 14px;cursor:pointer;" onclick="openPlant('${pl.id}')">
        <div class="tag-id">${pl.accession_number}</div>
        <div style="font-family:'Fraunces',serif;font-size:14.5px;font-weight:500;font-style:${pl.botanical_name ? "italic" : "normal"};">${escapeHtml(plantDisplayName(pl))}</div>
      </div>`;
  }

  return `
  <div class="screen">
    <div class="container">
      <h2 class="display" style="font-size:22px;font-weight:500;margin:0 0 4px;">Reports</h2>
      <p class="subtle" style="margin-bottom:12px;">Gaps in your records worth cleaning up — tap any item to jump straight to it.</p>
      <button class="btn btn-secondary btn-sm" style="margin-bottom:16px;" onclick="goTab('gallery')">${icon("photo")} Browse full photo gallery →</button>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:6px;">
        ${[
          ["Plants", state.plants.length],
          ["Locations", state.locations.length],
          ["Photos", state.photos.length],
          ["Inbox", state.photos.filter((p) => !p.plant_id && !p.location_id && p.photo_type !== "historical").length],
        ].map(([label, val]) => `
          <div class="surface" style="padding:12px;text-align:center;">
            <div class="display" style="font-size:22px;font-weight:600;">${val}</div>
            <div class="subtle" style="font-size:11px;text-transform:uppercase;letter-spacing:0.3px;">${label}</div>
          </div>`).join("")}
      </div>

      ${duplicateGroups.length > 0 ? `
      <div class="row" style="margin-top:22px;margin-bottom:10px;">
        <h3 class="display" style="font-size:16px;font-weight:500;margin:0;">Possible duplicate plants</h3>
        <span class="pill pill-terracotta">${duplicateGroups.length}</span>
      </div>
      <div class="stack">
        ${duplicateGroups.map((group) => `
          <div class="surface" style="padding:14px;">
            <p class="subtle" style="margin:0 0 10px;">Same name, same location — likely the same plant entered twice.</p>
            ${group.map((pl) => `
              <div class="row" style="margin-top:6px;">
                <div style="cursor:pointer;" onclick="openPlant('${pl.id}')">
                  <span class="mono" style="font-size:11px;opacity:0.7;">${pl.accession_number}</span>
                  <span style="font-size:13.5px;margin-left:6px;">${escapeHtml(plantDisplayName(pl))}</span>
                </div>
                <div style="display:flex;gap:6px;">
                  ${group.filter((other) => other.id !== pl.id).map((other) => `<button class="btn btn-secondary btn-sm" onclick="mergePlants('${pl.id}','${other.id}')" title="Keep ${pl.accession_number}, merge ${other.accession_number} into it">Keep this</button>`).join("")}
                </div>
              </div>`).join("")}
          </div>`).join("")}
      </div>` : ""}

      ${reportSection("Empty containers (no photos, no plants)", emptyContainers, "No completely empty containers.", locationItem)}
      ${reportSection("Containers with photos but no plants recorded", locationsNeedingReview, "Every container with a photo has at least one plant recorded. Nice.", locationItem)}
      ${reportSection("Plants with no location set", plantsNoLocation, "Every plant has a location.", plantItem)}
      ${reportSection("Plants with no photos", plantsNoPhotos, "Every plant has at least one photo.", plantItem)}
      ${reportSection("Unidentified plants", plantsUnidentified, "No unidentified plants remaining.", plantItem)}
      ${reportSection("Plants flagged Watch or Recovery", plantsNeedingAttention, "No plants currently flagged for health concerns.", plantItem)}
    </div>
  </div>`;
}

function filteredGalleryPhotos() {
  const f = state.galleryFilters;
  const q = (f.search || "").toLowerCase();
  return state.photos.filter((p) => {
    if (f.photoType === "historical" && p.photo_type !== "historical") return false;
    if (f.photoType && f.photoType !== "historical" && p.photo_type !== f.photoType) return false;
    if (f.locationId) {
      const photoLocIds = allLocationsForPhoto(p).map((l) => l.id);
      const plant = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
      const plantLocIds = plant ? allLocationsForPlant(plant).map((l) => l.id) : [];
      if (!photoLocIds.includes(f.locationId) && !plantLocIds.includes(f.locationId)) return false;
    }
    if (q) {
      const plant = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
      const hay = [p.notes, plant ? plantDisplayName(plant) : "", plant ? plant.accession_number : "", ...allLocationsForPhoto(p).map((l) => l.name)].filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
}

        <button class="btn btn-secondary btn-sm" onclick="openModal('galleryFilters')">

        </button>
        <span class="subtle">${matches.length} photo${matches.length === 1 ? "" : "s"}</span>

      ${matches.length === 0 ? `<div class="empty"><div class="display">No photos match</div><div>Try different filters or search.</div></div>` : `
        <div class="card-grid">

            const cachedUrl = state.photoUrlCache[p.drive_file_id];

              </div>
              <div style="padding:10px 12px;">
                <div class="tag-id">${fmtDate(photoDate(p))}${p.photo_type === "historical" ? " · Archive" : ""}</div>
                ${plant ? `<div style="font-size:12.5px;font-style:italic;margin-top:2px;">${escapeHtml(plantDisplayName(plant))}</div>` : ""}
                ${locs.length ? `<div style="font-size:11px;color:var(--moss-dim);margin-top:1px;">📍 ${escapeHtml(locs[0].name)}${locs.length > 1 ? ` +${locs.length - 1}` : ""}</div>` : ""}
              </div>
            </div>`;

        </div>`}

function locationSelectOptions(selectedId) {
  return `<option value="">— None —</option>` + locationOptionList().map((o) =>
    `<option value="${o.id}" ${selectedId === o.id ? "selected" : ""}>${escapeHtml(o.label)}</option>`
  ).join("");
}

function modalContent() {
  if (!state.modal) return "";
  const { type, data } = state.modal;

  if (type === "attach") {
    const q = (state.attachSearch || "").toLowerCase();
    const matches = state.plants.filter((p) => !q || [p.accession_number, p.common_name, p.botanical_name].filter(Boolean).join(" ").toLowerCase().includes(q));
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">Attach to plant</h3>
      <input placeholder="Search accession #, name…" value="${escapeHtml(state.attachSearch || "")}" oninput="state.attachSearch=this.value;render()" style="margin-bottom:14px;" />
      <div class="stack" style="max-height:44vh;overflow-y:auto;">
        ${matches.length === 0 ? `<p class="subtle">No plants match. Try "New plant" instead.</p>` : matches.map((p) => `
          <button class="btn btn-secondary btn-block" style="justify-content:flex-start;text-align:left;" onclick="attachPhotoToPlant('${data.photoId}','${p.id}')">
            <span class="mono" style="opacity:0.6;margin-right:6px;">${p.accession_number}</span>${escapeHtml(plantDisplayName(p))}
          </button>`).join("")}
      </div>
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "identificationDetail") {
    const suggestion = state.identifications.find((i) => i.id === data.identificationId);
    if (!suggestion) return `<p class="subtle">This suggestion is no longer available.</p><button class="btn-ghost" onclick="closeModal()">Close</button>`;
    const photo = state.photos.find((p) => p.id === suggestion.photo_id);
    const cachedUrl = photo ? state.photoUrlCache[photo.drive_file_id] : null;
    const photoBlock = cachedUrl ? `<div style="border-radius:8px;overflow:hidden;margin-bottom:16px;"><img src="${cachedUrl}" style="width:100%;max-height:220px;object-fit:cover;display:block;" /></div>` : "";

    if (suggestion.source === "Claude") {
      const r = suggestion.raw_response || {};
      return `
        <div class="modal-handle"></div>
        <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Claude's identification</h3>
        <p class="subtle" style="margin:0 0 14px;">A general-purpose read on your photo — reasoning-based, not a computed match score like Pl@ntNet.</p>
        ${photoBlock}
        <div class="surface" style="padding:14px;">
          <div class="row">
            <div>
              <div style="font-size:15px;font-style:italic;">${escapeHtml(suggestion.suggested_name)}</div>
              ${r.common_name ? `<div style="font-size:12.5px;color:#C9D6CC;margin-top:2px;">${escapeHtml(r.common_name)}</div>` : ""}
            </div>
            <span class="pill pill-orange" style="text-transform:capitalize;">${escapeHtml(r.confidence || "—")}</span>
          </div>
          ${r.reasoning ? `<p style="font-size:13px;color:#C9D6CC;margin-top:10px;line-height:1.5;">${escapeHtml(r.reasoning)}</p>` : ""}
        </div>
        <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Close</button>`;
    }

    // Pl@ntNet — candidate list with reference images
    const results = suggestion?.raw_response?.results || [];
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Compare candidates</h3>
      <p class="subtle" style="margin:0 0 14px;">Your photo on top, Pl@ntNet's reference photos below for each possible match.</p>

      ${photoBlock}

      ${results.length === 0 ? `<p class="subtle">No candidate details available for this suggestion.</p>` : `
        <div class="stack">
          ${results.map((r) => {
            const name = r.species?.scientificNameWithoutAuthor || "Unknown";
            const score = r.score ? Math.round(r.score * 100) : null;
            const refImages = (r.images || []).slice(0, 3);
            const isCurrent = suggestion.suggested_name === name;
            return `
            <div class="surface" style="padding:12px;">
              <div class="row">
                <div>
                  <div style="font-size:14.5px;font-style:italic;">${escapeHtml(name)}</div>
                  ${r.species?.family?.scientificNameWithoutAuthor ? `<div class="mono" style="font-size:10.5px;color:#8AA090;margin-top:2px;">${escapeHtml(r.species.family.scientificNameWithoutAuthor)}</div>` : ""}
                </div>
                ${score !== null ? `<span class="pill ${isCurrent ? "pill-orange" : "pill-blue"}">${score}%</span>` : ""}
              </div>
              ${refImages.length ? `
                <div style="display:flex;gap:6px;margin-top:8px;">
                  ${refImages.map((img) => `<img src="${img.url?.s || img.url?.m}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;flex-shrink:0;" />`).join("")}
                </div>` : `<p class="subtle" style="margin:8px 0 0;font-size:11.5px;">No reference photos available for this match.</p>`}
              ${!isCurrent ? `<button class="btn btn-secondary btn-sm btn-on-cream" style="margin-top:10px;" onclick="useIdentificationCandidate('${suggestion.id}','${name.replace(/'/g, "\\'")}',${r.score || "null"})">Use this instead</button>` : `<div class="mono" style="font-size:11px;color:var(--orange);margin-top:10px;">Currently selected</div>`}
            </div>`;
          }).join("")}
        </div>`}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Close</button>`;
  }

  if (type === "attachToLocalPlant") {
    const localPlants = plantsAtLocation(data.locationId);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Add to a plant here</h3>
      <p class="subtle" style="margin:0 0 14px;">Tags this photo to a plant already in this container — doesn't affect the plant's other photos.</p>
      ${localPlants.length === 0 ? `<p class="subtle">No plants assigned to this location yet. Use "New plant from this photo" instead.</p>` : `
        <div class="stack">
          ${localPlants.map((pl) => `
            <button class="btn btn-secondary btn-block" style="justify-content:flex-start;text-align:left;" onclick="attachPhotoToExistingPlant('${data.photoId}','${pl.id}')">
              <span class="mono" style="opacity:0.6;margin-right:6px;">${pl.accession_number}</span>${escapeHtml(plantDisplayName(pl))}
            </button>`).join("")}
        </div>`}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "tagLocations") {
    const photo = state.photos.find((p) => p.id === data.photoId);
    const taggedIds = new Set(additionalLocationRowsForPhoto(data.photoId).map((r) => r.location_id));
    const q = (state.tagLocationSearch || "").toLowerCase();
    const candidates = locationOptionList().filter((o) => o.id !== photo.location_id && (!q || o.label.toLowerCase().includes(q)));
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Tag other containers</h3>
      <p class="subtle" style="margin:0 0 14px;">Check every container visible in this photo, besides its primary attachment.</p>
      <input placeholder="Search locations…" value="${escapeHtml(state.tagLocationSearch || "")}" oninput="state.tagLocationSearch=this.value;render()" style="margin-bottom:14px;" />
      <div class="stack" style="max-height:44vh;overflow-y:auto;">
        ${candidates.length === 0 ? `<p class="subtle">No locations match.</p>` : candidates.map((o) => `
          <label class="checkbox-row" style="margin-top:0;background:var(--bg);padding:10px 12px;border-radius:8px;">
            <input type="checkbox" class="tag-location-checkbox" value="${o.id}" ${taggedIds.has(o.id) ? "checked" : ""} />
            <span style="white-space:pre">${escapeHtml(o.label)}</span>
          </label>`).join("")}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="saveTaggedLocations('${data.photoId}')">Save containers</button>

        <label>Common name</label>
        <input id="ep-common" value="${escapeHtml(pl.common_name || "")}" />

        <input id="ep-cultivar" value="${escapeHtml(pl.cultivar || "")}" />

  if (type === "linkPlantToLocation") {

  if (type === "choosePrimaryPhoto") {

              <button onclick="setPrimaryPhoto('${data.plantId}','${p.id}')" style="width:100%;height:100%;border-radius:8px;overflow:hidden;border:none;padding:0;cursor:pointer;background:var(--parchment-dim);">

              </button>
              <button onclick="event.stopPropagation();deletePhoto('${p.id}')" class="thumb-delete-btn" aria-label="Delete photo">${icon("trash")}</button>
            </div>`;
          }).join("")}
        </div>` : ""}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "propagatePlant") {
    const parent = state.plants.find((p) => p.id === data.parentId);
    const workArea = state.locations.find((l) => l.name === "Propagation / Work Area" && !l.parent_location_id);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Propagate plant</h3>
      <p class="subtle" style="margin:0 0 14px;">From <strong>${parent.accession_number}</strong> — ${escapeHtml(plantDisplayName(parent))}. Gets its own new accession number.</p>
      <form id="propagate-plant-form">
        <label>Botanical name</label>
        <input id="pp-botanical" value="${escapeHtml(parent.botanical_name || "")}" />
        <label>Common name</label>
        <input id="pp-common" value="${escapeHtml(parent.common_name || "")}" />
        <label>Location</label>
        <select id="pp-location">${locationSelectOptions(workArea ? workArea.id : null)}</select>
        <label>Notes</label>
        <textarea id="pp-notes" rows="2"></textarea>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Create propagated plant</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "editLocation") {
    const l = state.locations.find((x) => x.id === data.locationId);
    // Exclude itself from the parent picker to avoid self-referencing loops
    const parentOptions = locationOptionList().filter((o) => o.id !== l.id);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">Edit location</h3>
      <form id="edit-location-form">
        <label>Name *</label>
        <input id="el-name" required value="${escapeHtml(l.name)}" />
        <label>Type</label>
        <select id="el-type">
          <option value="">— Unspecified —</option>
          ${["area","row","slot","container","indoor","hospital","work_area","other"].map((t) =>
            `<option value="${t}" ${l.type === t ? "selected" : ""}>${locationTypeLabel(t)}</option>`).join("")}
        </select>
        <label>Parent location</label>
        <select id="el-parent">
          <option value="">— None (top-level) —</option>
          ${parentOptions.map((o) => `<option value="${o.id}" ${l.parent_location_id === o.id ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}
        </select>
        <label>Sort order</label>
        <input id="el-sort" type="number" value="${l.sort_order ?? ""}" placeholder="Lower numbers appear first" />
        <label>Code</label>
        <input id="el-code" value="${escapeHtml(l.code || "")}" placeholder="e.g. W-T-12" />
        <label>Notes</label>
        <textarea id="el-notes" rows="2">${escapeHtml(l.notes || "")}</textarea>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Save changes</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "tagPlants") {
    const photo = state.photos.find((p) => p.id === data.photoId);
    const taggedIds = new Set(state.photoPlants.filter((pp) => pp.photo_id === data.photoId).map((pp) => pp.plant_id));
    const q = (state.tagSearch || "").toLowerCase();
    const candidates = state.plants.filter((p) => p.id !== photo.plant_id && (!q || [p.accession_number, p.common_name, p.botanical_name].filter(Boolean).join(" ").toLowerCase().includes(q)));
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Tag plants in this photo</h3>
      <p class="subtle" style="margin:0 0 14px;">Check every plant visible in this photo, besides the one it's already attached to.</p>
      <input placeholder="Search accession #, name…" value="${escapeHtml(state.tagSearch || "")}" oninput="state.tagSearch=this.value;render()" style="margin-bottom:14px;" />
      <div class="stack" style="max-height:44vh;overflow-y:auto;">
        ${candidates.length === 0 ? `<p class="subtle">No other plants match.</p>` : candidates.map((p) => `
          <label class="checkbox-row" style="margin-top:0;background:var(--bg);padding:10px 12px;border-radius:8px;">
            <input type="checkbox" class="tag-plant-checkbox" value="${p.id}" ${taggedIds.has(p.id) ? "checked" : ""} />
            <span class="mono" style="opacity:0.6;margin-right:6px;">${p.accession_number}</span>${escapeHtml(plantDisplayName(p))}
          </label>`).join("")}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="saveTaggedPlants('${data.photoId}')">Save tags</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "upload") {
    const loc = data.locationId ? locationById(data.locationId) : null;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">${loc ? `Add photo — ${escapeHtml(loc.name)}` : "Add photos"}</h3>
      <p class="subtle" style="margin:0 0 14px;">${loc ? "Photo of this location/container — won't need attaching to a plant." : "Select multiple to upload them all at once — each lands in the Inbox separately."}</p>
      <form id="upload-form">
        <input type="file" id="upload-file" accept="image/*" ${loc ? "" : "multiple"} required style="padding:10px;" />
        <label>Notes (optional${loc ? "" : ", applied to all selected"})</label>
        <textarea id="upload-notes" rows="2" placeholder="e.g. new growth on the west side"></textarea>
        <button type="submit" class="btn btn-accent btn-block" style="margin-top:20px;" id="upload-submit-btn">${loc ? "Upload" : "Upload to Inbox"}</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  return "";
}

async function handleConnectDrive() {

async function identifyPhoto(photoId) {
  state.identifyingPhotoId = photoId;
  render();
  try {
    const res = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/identify-plant`, {
      method: "POST",
      headers: apiHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ photo_id: photoId }),
    });
    const data = await res.json();
    state.identifyingPhotoId = null;
    if (data.error) {
      toast(driveErrorMessage(res.status, data.error), true);
      render();
      return;
    }
    state.identifications.unshift(data.identification);
    render();
  } catch (e) {
    state.identifyingPhotoId = null;
    toast(e.message, true);
    render();
  }
}

async function mergePlants(keepId, removeId) {
  const keep = state.plants.find((p) => p.id === keepId);
  const remove = state.plants.find((p) => p.id === removeId);
  if (!confirm(`Merge "${plantDisplayName(remove)}" (${remove.accession_number}) into "${plantDisplayName(keep)}" (${keep.accession_number})? All photos and tags move over, then ${remove.accession_number} is deleted. This can't be undone.`)) return;
  try {
    // Move photos primarily attached to the removed plant
    await restPatch("photos", `plant_id=eq.${removeId}`, { plant_id: keepId });

    // Move multi-plant photo tags, skipping any that would duplicate an existing tag
    const tagsToMove = state.photoPlants.filter((pp) => pp.plant_id === removeId);
    for (const t of tagsToMove) {
      const exists = state.photoPlants.some((pp) => pp.plant_id === keepId && pp.photo_id === t.photo_id);
      if (exists) await restDelete("photo_plants", `id=eq.${t.id}`);
      else await restPatch("photo_plants", `id=eq.${t.id}`, { plant_id: keepId });
    }

    // Move additional locations, skipping duplicates
    const locsToMove = state.plantLocations.filter((pl2) => pl2.plant_id === removeId);
    for (const l of locsToMove) {
      const exists = state.plantLocations.some((pl2) => pl2.plant_id === keepId && pl2.location_id === l.location_id);
      if (exists) await restDelete("plant_locations", `id=eq.${l.id}`);
      else await restPatch("plant_locations", `id=eq.${l.id}`, { plant_id: keepId });
    }

    // Reparent anything propagated from the plant being removed
    await restPatch("plants", `parent_plant_id=eq.${removeId}`, { parent_plant_id: keepId });

    // Reassign location history rows (FK would otherwise block deletion)
    await restPatch("plant_location_history", `plant_id=eq.${removeId}`, { plant_id: keepId });

    await restDelete("plants", `id=eq.${removeId}`);
    toast(`Merged into ${keep.accession_number}`);
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function deletePlant(plantId) {
  const pl = state.plants.find((p) => p.id === plantId);
  if (!confirm(`Delete ${pl.accession_number} — ${plantDisplayName(pl)}? Its photos are unassigned, not deleted. This can't be undone.`)) return;
  try {
    await restPatch("photos", `plant_id=eq.${plantId}`, { plant_id: null });
    await restDelete("photo_plants", `plant_id=eq.${plantId}`);
    await restDelete("plant_locations", `plant_id=eq.${plantId}`);
    await restPatch("plants", `parent_plant_id=eq.${plantId}`, { parent_plant_id: null });
    await restDelete("plant_location_history", `plant_id=eq.${plantId}`);
    await restDelete("plants", `id=eq.${plantId}`);
    toast("Plant deleted");
    goTab("plants");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function moveToHospital(plantId) {

async function archivePhoto(photoId) {

async function attachPhotoToPlant(photoId, plantId) {

async function saveTaggedLocations(photoId) {
  const checked = Array.from(document.querySelectorAll(".tag-location-checkbox:checked")).map((el) => el.value);
  const current = additionalLocationRowsForPhoto(photoId).map((r) => r.location_id);
  const toAdd = checked.filter((id) => !current.includes(id));
  const toRemove = current.filter((id) => !checked.includes(id));
  try {
    for (const locationId of toAdd) {
      await restPost("photo_locations", { photo_id: photoId, location_id: locationId });
    }
    for (const locationId of toRemove) {
      const row = state.photoLocations.find((r) => r.photo_id === photoId && r.location_id === locationId);
      if (row) await restDelete("photo_locations", `id=eq.${row.id}`);
    }
    toast("Containers updated");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function savePhotoNote(photoId) {

  try {

    toast("Note saved");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function attachPhotoToLocation(photoId, locationId) {
  if (!locationId) { toast("Choose a location first", true); return; }
  try {
    await restPatch("photos", `id=eq.${photoId}`, { location_id: locationId });
    toast("Photo attached to container");
    closeModal();
    await loadAll();
    maybeResumeLightbox();
  } catch (e) { toast(e.message, true); }
}
async function removePhotoFromLocation(photoId, locationId) {
  if (!confirm("Remove this photo from this location?")) return;
  try {
    const photo = state.photos.find((p) => p.id === photoId);
    if (photo.location_id === locationId) {
      // Removing the primary attachment — if the photo is tagged to
      // other containers too, promote one of those to primary instead
      // of dropping the photo back into the Inbox unexpectedly.
      const others = additionalLocationRowsForPhoto(photoId);
      if (others.length > 0) {
        const promote = others[0];
        await restPatch("photos", `id=eq.${photoId}`, { location_id: promote.location_id });
        await restDelete("photo_locations", `id=eq.${promote.id}`);
      } else {
        await restPatch("photos", `id=eq.${photoId}`, { location_id: null });
      }
    } else {
      // Just a tagged (non-primary) relationship — remove that tag only
      const row = state.photoLocations.find((r) => r.photo_id === photoId && r.location_id === locationId);
      if (row) await restDelete("photo_locations", `id=eq.${row.id}`);
    }
    toast("Removed from this location");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}
async function attachPhotoToExistingPlant(photoId, plantId) {

    }
    toast("Photo added to plant");
    closeModal();
    await loadAll();

}
async function deletePhoto(photoId) {
  if (!confirm("Delete this photo? The record is removed from the app, but the file stays in your Google Drive folder.")) return;
  try {
    // Clear it as any plant's profile picture first (FK would otherwise block deletion)
    await restPatch("plants", `primary_photo_id=eq.${photoId}`, { primary_photo_id: null });
    // Remove any multi-plant tags pointing at this photo
    await restDelete("photo_plants", `photo_id=eq.${photoId}`);
    await restDelete("photos", `id=eq.${photoId}`);
    toast("Photo deleted");
    await loadAll();
    maybeResumeLightbox();
  } catch (e) { toast(e.message, true); }
}
async function saveTaggedPlants(photoId) {
  const checked = Array.from(document.querySelectorAll(".tag-plant-checkbox:checked")).map((el) => el.value);
  const current = state.photoPlants.filter((pp) => pp.photo_id === photoId).map((pp) => pp.plant_id);
  const toAdd = checked.filter((id) => !current.includes(id));
  const toRemove = current.filter((id) => !checked.includes(id));
  try {
    for (const plantId of toAdd) {
      await restPost("photo_plants", { photo_id: photoId, plant_id: plantId });
    }
    for (const plantId of toRemove) {
      const row = state.photoPlants.find((pp) => pp.photo_id === photoId && pp.plant_id === plantId);
      if (row) await restDelete("photo_plants", `id=eq.${row.id}`);
    }
    toast("Tags updated");
    closeModal();
    await loadAll();
  } catch (e) { toast(e.message, true); }
}
function logout() {
  clearStoredSession();
  Object.values(state.photoUrlCache).forEach((url) => URL.revokeObjectURL(url));
  state.photoUrlCache = {};
  state.session = null; state.photos = []; state.plants = []; state.locations = [];
  render();
}
