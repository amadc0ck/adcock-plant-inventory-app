                 button silently did nothing. escapeAttr() exists for exactly
                 this: single-quoted, with quotes and backslashes escaped. */""}
            <button class="task-pick" onclick="addBatchRow(null,'${escapeAttr(state.batchSearch)}')">
              ${icon("plus")}<span style="flex:1;text-align:left;">Add &ldquo;${escapeHtml(state.batchSearch)}&rdquo; as a new species</span>
            </button>` : ""}
        </div>` : ""}

      <div class="section-label">Shared by everything in this batch</div>
      <label>Location</label>
      ${locationField("ba", { empty: "Not planted yet" })}
      <div class="field-help">Leave unset if they are still in the tray. They will show in &ldquo;Plants with no location&rdquo; until you file them.</div>
      ${acquisitionFields("ba", { defaultId: "confirmed" })}

      <button class="btn btn-primary btn-block" style="margin-top:18px;" id="ba-submit"
        ${total ? "" : "disabled"} onclick="createBatch()">${total ? `Create ${total} specimen${total === 1 ? "" : "s"}` : "Add a plant first"}</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "stayNote") {
    const h = state.plantLocationHistory.find((x) => x.id === data.stayId);
    if (!h) return `<p class="subtle">That stay no longer exists.</p><button class="btn-ghost" onclick="closeModal()">Close</button>`;
    const loc = locationById(h.location_id);
    const plt = state.plants.find((x) => x.id === h.plant_id);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Why this move?</h3>
      <p class="subtle" style="margin:0 0 14px;">${plt ? `${escapeHtml(plt.accession_number)} &middot; ` : ""}${loc ? escapeHtml(locationPath(loc)) : "Unknown location"}<br>${escapeHtml(stayRange(h))}</p>
      <textarea id="stay-note" rows="3" placeholder="e.g. consolidating the wall collection">${escapeHtml(h.notes || "")}</textarea>
      <div class="field-help">Annotates a move that already happened. Use this rather than moving the plant again &mdash; it is already where it belongs.</div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="saveStayNote('${h.id}')">Save</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "recheck") {
    const ids = data.plantIds || [];
    const plants = ids.map((id) => state.plants.find((p) => p.id === id)).filter(Boolean);
    const many = plants.length > 1;
    const idList = JSON.stringify(ids).replace(/"/g, "&quot;");
    const opt = (label, days) =>
      `<button class="btn btn-secondary btn-block" style="margin-bottom:8px;" onclick="setRecheck(${idList}, ${days})">${label}</button>`;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">When should you look again?</h3>
      <p class="subtle" style="margin:0 0 14px;">${data.from === "task"
        ? `The task is done, but ${many ? "these are" : "this is"} still marked as needing attention. Pick a date and ${many ? "they stay" : "it stays"} off the list until then.`
        : `${many ? "These plants stay" : "This plant stays"} off the attention list until the date you pick.`}</p>

      <div class="stack" style="margin-bottom:14px;">
        ${plants.map((pl) => `
          <div class="tag-card" style="padding:8px 10px;display:flex;align-items:center;gap:10px;">
            <div class="plant-list-thumb" style="width:40px;height:40px;flex-shrink:0;">
              ${plantCoverPhoto(pl) ? photoImg(plantCoverPhoto(pl)) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
            </div>
            <div style="flex:1;min-width:0;">
              <div class="mono tag-id">${pl.accession_number}</div>
              <div style="font-size:13px;">${plantDisplayHtml(pl)}</div>
            </div>
            <span class="pill-solid ${healthPillClass(pl)}" style="flex-shrink:0;">${HEALTH_LABELS[pl.health_status] || pl.health_status}</span>
          </div>`).join("")}
      </div>

      ${opt("In a week", 7)}
      ${opt("In two weeks", 14)}
      ${opt("In a month", 30)}
      <label style="margin-top:6px;">Or a date</label>
      <input type="date" id="recheck-date" min="${todayISO()}" />
      <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="setRecheck(${idList}, 'pick')">Use that date</button>
      ${/* Not a cancel — an explicit "keep nagging me", which is a real answer. */""}
      <button class="btn-ghost" style="margin-top:12px;" onclick="closeModal()">Leave ${many ? "them" : "it"} on the list</button>`;
  }

  if (type === "movePlant") {
    const pl = state.plants.find((x) => x.id === data.plantId);
    if (!pl) return `<p class="subtle">Plant not found.</p><button class="btn-ghost" onclick="closeModal()">Close</button>`;
    const from = pl.location_id ? locationById(pl.location_id) : null;
    const to = state.moveTarget ? locationById(state.moveTarget) : null;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Move this plant</h3>
      <p class="subtle" style="margin:0 0 14px;">Same plant, new place. The accession number, photos and notes all stay with it &mdash; only where it lives changes, and the move is kept in its history.</p>

      <div class="move-summary">
        <div style="min-width:0;">
          <div class="tag-id">From</div>
          <div style="font-size:13.5px;">${from ? escapeHtml(locationPath(from)) : `<span class="value-blank">No location</span>`}</div>
        </div>
        <div style="color:var(--moss-dim);flex-shrink:0;">&rarr;</div>
        <div style="min-width:0;">
          <div class="tag-id">To</div>
          <div style="font-size:13.5px;">${to ? escapeHtml(locationPath(to)) : `<span class="value-blank">Pick one below</span>`}</div>
        </div>
      </div>

      ${locationPicker("setMoveTarget('{id}')", { onCreatePick: "setMoveTarget" })}

      <label style="margin-top:14px;">Why (optional)</label>
      <input id="move-note" placeholder="e.g. consolidating the wall collection" />
      <div class="field-help">Worth a line. In six months &ldquo;why is this one in Bucket 01?&rdquo; is a real question.</div>

      <button class="btn btn-primary btn-block" style="margin-top:16px;" ${state.moveTarget && state.moveTarget !== pl.location_id ? "" : "disabled"}
        onclick="confirmMovePlant('${pl.id}')">${to ? `Move to ${escapeHtml(to.name)}` : "Pick a location"}</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "assignPlants") {
    // v1.85.0. Was two modals for one question. "Attach to a plant" set
    // photos.plant_id; "Tag plants in this photo" managed photo_plants; "Move"
    // was attach to a different one. Amanda's vocabulary is Assign / Unassign,
    // and a photo showing three plants in a planter is one question, not three
    // verbs. The storage split stays — the primary owns the timeline, the rest
    // are also-visible — but she is no longer asked to care which is which.
    //
    // LOCP-2, preserved: opened from a location it starts narrowed to that
    // location and she can widen it. Reads the live filter rather than the
    // opening intent, so widening does not leave the sentence asserting
    // something that stopped being true.
    const here = data.locationId ? locationById(data.locationId) : null;
    const narrowed = here && state.pickerLocation === here.id;
    const assigned = plantsAssignedToPhoto(data.photoId);
    const ph = state.photos.find((x) => x.id === data.photoId);
    const primaryId = ph ? ph.plant_id : null;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">${assigned.length ? "Plants in this photo" : "Assign a plant"}</h3>
      <p class="subtle" style="margin:0 0 14px;">${narrowed
        ? `Showing the plants in <strong>${escapeHtml(here.name)}</strong> — widen the location filter to reach any plant in the collection.`
        : here
        ? `Showing every plant. Set the location filter back to <strong>${escapeHtml(here.name)}</strong> to see just what is here.`
        : "Assign every plant visible in the frame. The first one owns the photo's timeline; the rest are recorded as also showing in it."}</p>

      ${assigned.length ? `
        <div class="section-label">Assigned</div>
        <div class="stack" style="margin-bottom:14px;">
          ${assigned.map((pl) => `
            <div class="assigned-row">
              <div style="flex:1;min-width:0;">
                <div style="font-size:13.5px;">${escapeHtml(plantPickerName(pl).primary)}</div>
                <div class="mono" style="font-size:10.5px;color:var(--moss-dim);">${pl.accession_number}${pl.id === primaryId ? " · owns this photo" : ""}</div>
              </div>
              ${pl.id !== primaryId ? `<button class="btn-ghost" style="padding:0;font-size:11.5px;" onclick="makePrimaryPlantForPhoto('${data.photoId}','${pl.id}')">Make owner</button>` : ""}
              <button class="btn-ghost icon-btn" style="padding:0;font-size:11.5px;color:var(--terracotta);" title="Unassign this plant" onclick="unassignPlantFromPhoto('${data.photoId}','${pl.id}')">${icon("close")} Unassign</button>
            </div>`).join("")}
        </div>
        <div class="section-label">Assign another</div>` : ""}

      ${plantPicker(`assignPlantToPhoto('${data.photoId}','{id}')`, {
        excludeIds: assigned.map((pl) => pl.id),
        onNew: `openModal('newPlantFromPhoto',{photoId:'${data.photoId}'${data.locationId ? `, locationId:'${data.locationId}'` : ""}})`,
      })}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Done</button>`;
  }

  if (type === "identificationDetail") {
    const suggestion = state.identifications.find((i) => i.id === data.identificationId);
    if (!suggestion) return `<p class="subtle">This suggestion is no longer available.</p><button class="btn-ghost" onclick="closeModal()">Close</button>`;
    const photo = state.photos.find((p) => p.id === suggestion.photo_id);
    const photoBlock = photo ? `<div style="border-radius:8px;overflow:hidden;margin-bottom:16px;">${photoImg(photo, "max-height:220px;")}</div>` : "";

    if (suggestion.source === "Claude") {
      const r = suggestion.raw_response || {};
      return `
        <div class="modal-handle"></div>
        <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Claude's identification</h3>
        <p class="subtle" style="margin:0 0 14px;">A general-purpose read on your photo — reasoning-based, not a computed match score like Pl@ntNet.</p>
        ${photoBlock}
        <div class="surface" style="padding:14px;">
          <div class="row">
            <div>
              <div style="font-size:15px;font-style:italic;">${escapeHtml(suggestion.suggested_name)}</div>
              ${r.common_name ? `<div style="font-size:12.5px;color:#C9D6CC;margin-top:2px;">${escapeHtml(r.common_name)}</div>` : ""}
            </div>
            <span class="pill pill-orange" style="text-transform:capitalize;">${escapeHtml(r.confidence || "—")}</span>
          </div>
          ${r.reasoning ? `<p style="font-size:13px;color:#C9D6CC;margin-top:10px;line-height:1.5;">${escapeHtml(r.reasoning)}</p>` : ""}
        </div>
        <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Close</button>`;
    }

    // Pl@ntNet — candidate list with reference images
    const results = suggestion?.raw_response?.results || [];
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Compare candidates</h3>
      <p class="subtle" style="margin:0 0 14px;">Your photo on top, then each candidate name. Tap a search link to see better reference images than Pl@ntNet carries.</p>

      ${photoBlock}

      ${results.length === 0 ? `<p class="subtle">No candidate details available for this suggestion.</p>` : `
        <div class="stack">
          ${results.map((r) => {
            const name = r.species?.scientificNameWithoutAuthor || "Unknown";
            const score = r.score ? Math.round(r.score * 100) : null;
            const refImages = (r.images || []).slice(0, 3);
            const isCurrent = suggestion.suggested_name === name;
            return `
            <div class="surface" style="padding:12px;">
              <div class="row">
                <div style="min-width:0;">
                  <div style="font-size:15.5px;font-style:italic;font-weight:500;">${escapeHtml(name)}</div>
                  ${r.species?.family?.scientificNameWithoutAuthor ? `<div class="mono" style="font-size:10.5px;color:#8AA090;margin-top:2px;">${escapeHtml(r.species.family.scientificNameWithoutAuthor)}</div>` : ""}
                </div>
                ${score !== null ? `<span class="pill ${isCurrent ? "pill-orange" : "pill-blue"}">${score}%</span>` : ""}
              </div>

              ${/* AI-4. Amanda's read, 2026-08-29: Pl@ntNet's reference photos are
                   the weak half of this screen — unhealthy specimens, and
                   sometimes several different species illustrating one name. The
                   NAME is what she actually uses, by taking it to Google.

                   So the name now leads and the search happens in one tap
                   instead of retyping a botanical name into another app. The
                   reference photos are folded away rather than deleted: when
                   they are good they are still the fastest comparison, and
                   collapsing costs nothing.

                   Plain links, no API. Google Lens has no public API at all, so
                   there is nothing to integrate even if we wanted to. */""}
              <div class="ref-links">
                ${refLink("Google Images", `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(name)}`)}
                ${refLink("iNaturalist", `https://www.inaturalist.org/search?q=${encodeURIComponent(name)}`)}
                ${refLink("Wikipedia", `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(name)}`)}
              </div>

              ${refImages.length ? `
                <details class="ref-fold">
                  <summary class="subtle" style="font-size:11.5px;">Pl@ntNet reference photos (${refImages.length})</summary>
                  <div style="display:flex;gap:6px;margin-top:8px;">
                    ${refImages.map((img) => {
                      const small = img.url?.s || img.url?.m || img.url?.o;
                      const large = img.url?.o || img.url?.m || img.url?.s;
                      const cap = [name, img.author ? `© ${img.author}` : ""].filter(Boolean).join(" · ");
                      return `<img src="${small}" title="Tap to enlarge" style="width:64px;height:64px;object-fit:cover;border-radius:6px;flex-shrink:0;cursor:zoom-in;"
                        onclick="event.stopPropagation();openRefImage('${escapeAttr(large)}','${escapeAttr(cap)}')" />`;
                    }).join("")}
                  </div>
                  <div class="subtle" style="font-size:10.5px;margin-top:5px;">Tap to enlarge. Pl@ntNet's own photos &mdash; quality varies.</div>
                </details>` : ""}

              ${!isCurrent ? `<button class="btn btn-secondary btn-sm btn-on-cream" style="margin-top:10px;" onclick="useIdentificationCandidate('${suggestion.id}','${name.replace(/'/g, "\\'")}',${r.score || "null"})">Use this instead</button>` : `<div class="mono" style="font-size:11px;color:var(--orange);margin-top:10px;">Currently selected</div>`}
            </div>`;
          }).join("")}
        </div>`}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Close</button>`;
  }


  if (type === "bulkAttachPlant") {
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Attach ${activeBulkSelection().size} photos to plant</h3>
      <p class="subtle" style="margin:0 0 14px;">All selected photos will be attached to the same plant.</p>
      ${plantPicker("bulkAttachToPlant('{id}')")}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "bulkAttachLocation") {
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Add Location to ${activeBulkSelection().size} photos</h3>
      <p class="subtle" style="margin:0 0 14px;">All selected photos move onto that container's page.</p>
      ${locationPicker("bulkAttachToLocation('{id}')")}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "appInfo") {
    const driveOk = !!state.driveToken;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">App info</h3>
      <div class="surface" style="padding:14px;">
        <div class="row">
          <span style="font-size:13.5px;">Google Drive</span>
          <span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:${driveOk ? "#9FCBA6" : "#E8A78F"};">
            <span style="width:16px;height:16px;display:inline-flex;">${driveOk ? icon("statusConnected") : icon("statusDisconnected")}</span>
            ${driveOk ? "Connected" : "Needs reconnect"}
          </span>
        </div>
        <div class="row" style="margin-top:10px;">
          <span style="font-size:13.5px;">Signed in as</span>
          <span class="subtle">${state.session?.email || ""}</span>
        </div>
      </div>
      <p class="mono subtle" style="margin-top:14px;text-align:center;">v${APP_VERSION} · ${APP_UPDATED}</p>
      ${!driveOk ? `<button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="closeModal();goTab('settings')">Go reconnect Drive</button>` : ""}
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Close</button>`;
  }

  if (type === "startBloom") {
    const pl = state.plants.find((p) => p.id === data.plantId);
    if (!pl) return `<p>Not found.</p>`;
    const t = pl.taxa_id ? taxonById(pl.taxa_id) : null;
    const expected = t && t.bloom_season ? (listOptionsFor("bloom_season")[t.bloom_season] || t.bloom_season) : null;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Mark as blooming</h3>
      <p class="mono subtle" style="margin:0 0 14px;">${pl.accession_number}${expected ? ` · expected ${escapeHtml(expected)}` : ""}</p>
      <label>Started</label>
      <input type="date" id="bl-start" value="${todayLocalISO()}" />
      <div class="field-help">Backdate it if you noticed late — this is when the plant started flowering, not when you recorded it.</div>
      <label>Notes</label>
      <textarea id="bl-notes" rows="2" placeholder="e.g. first bloom since I've had it"></textarea>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="startBloom('${pl.id}')">Record</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "endBloom") {
    const bloom = state.bloomEvents.find((b) => b.id === data.bloomId);
    if (!bloom) return `<p>Not found.</p>`;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Bloom finished</h3>
      <p class="mono subtle" style="margin:0 0 14px;">Started ${fmtDate(bloom.started_on)}</p>
      <label>Ended</label>
      <input type="date" id="bl-end" value="${todayLocalISO()}" min="${bloom.started_on}" />
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="endBloom('${bloom.id}')">Close it</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "addCareNote") {
    const pl = state.plants.find((p) => p.id === data.plantId);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Add care note</h3>
      <p class="mono subtle" style="margin:0 0 14px;">${pl ? pl.accession_number : ""}</p>
      <label>Date</label>
      <input type="date" id="cn-date" value="${todayLocalISO()}" />
      <label>Note</label>
      <textarea id="cn-body" rows="3" placeholder="e.g. repotted into a 6in terracotta; treated scale on lower pads"></textarea>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="saveCareNote('${data.plantId}')">Save</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "editPhotoNote") {
    const photo = state.photos.find((p) => p.id === data.photoId);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">Photo note</h3>
      <textarea id="edit-note-text" rows="3" placeholder="e.g. new growth on the west side">${escapeHtml(photo?.notes || "")}</textarea>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="savePhotoNote('${data.photoId}')">Save</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "attachLocation") {
    return `
      <div class="modal-handle"></div>
      ${(() => {
        // Same action either way — set photos.location_id — but it reads very
        // differently depending on whether the photo already has one.
        const ph = state.photos.find((x) => x.id === data.photoId);
        const from = ph && ph.location_id ? locationById(ph.location_id) : null;
        return `
        <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">${from ? "Move this photo" : "Add location"}</h3>
        <p class="subtle" style="margin:0 0 14px;">${from
          ? `Currently filed under <strong>${escapeHtml(from.name)}</strong>. Choosing another moves it — any plant it is attached to is unaffected.`
          : "Sets this photo's primary container. You can still identify or tag plants from it afterward."}</p>`;
      })()}
      ${locationPicker(`attachPhotoToLocation('${data.photoId}','{id}')`)}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "newPlantFromPhoto" || type === "newPlant") {
    const suggestion = type === "newPlantFromPhoto" ? pendingIdentification(data.photoId) : null;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">New plant</h3>
      <p class="subtle" style="margin:0 0 14px;">Accession number is generated automatically. The botanical name creates or finds the <strong>species</strong>; this plant becomes a specimen of it. Everything here can be set later.</p>
      ${suggestion ? `<p style="font-size:12.5px;color:var(--blue);margin:0 0 14px;">Pre-filled from AI suggestion — double check before saving.</p>` : ""}
      ${/* AI-3 layer 2. The last moment a duplicate can be prevented. */""}
      ${type === "newPlantFromPhoto" ? (() => {
        const g = duplicateGuardForPhoto(data.photoId);
        const cands = [...g.here, ...(g.suggested ? [g.suggested] : [])];
        if (!cands.length) {
          return g.asked ? "" : `
            <div class="filter-note" style="margin-bottom:14px;">
              <span class="filter-note-head">Before you create a new one</span>
              <p class="subtle" style="margin:6px 0 8px;font-size:12.5px;">Nothing is recorded at this photo's location, so there is nothing obvious to match it against.</p>
              <button type="button" class="btn btn-secondary btn-sm icon-btn" ${state.suggestingPhotoId === data.photoId ? "disabled" : ""}
                onclick="askClaudeAboutPhoto('${data.photoId}',{focus:'plant'})">${state.suggestingPhotoId === data.photoId ? '<span class="spinner"></span>' : icon("claude")} Ask Claude if it is one you have</button>
            </div>`;
        }
        return `
          <div class="filter-note" style="margin-bottom:14px;">
            <span class="filter-note-head">${g.here.length ? "Already recorded where this photo was taken" : "Claude thinks you already have this"}</span>
            <p class="subtle" style="margin:6px 0 8px;font-size:12.5px;">If this photo shows one of these, attach it rather than creating a second record.</p>
            <div class="file-choices">
              ${cands.map((c) => `
                <button type="button" class="row-act" data-plant-card="${c.id}" onclick="usePlantInsteadOfNew('${data.photoId}','${c.id}')">
                  ${escapeHtml(plantPickerName(c).primary)} · ${c.accession_number}
                </button>`).join("")}
            </div>
          </div>`;
      })() : ""}
      <form id="new-plant-form">
        ${/* "New specimen here" has offered a species list since it was built;
             this form never did, so from the Gallery the only way to reach an
             existing species was to type its name and hope the fuzzy match
             caught it. It does not catch a typo in the stored name — Amanda's
             "Echerveria Agavoides 'Lipstick'" never matched "Echeveria …"
             because the genus token differs. Picking is exact and needs no
             matching at all. */""}
        ${(() => {
          const chosen = state.newPlantTaxon ? taxonById(state.newPlantTaxon) : null;
          if (chosen) {
            return `
              <label>Species</label>
              <div class="tag-card plant-list-card" style="padding:8px 10px;margin-bottom:8px;">
                <span class="suggestion-icon" style="color:var(--moss-dim);">${icon("leaf")}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:13.5px;font-weight:500;">${taxonDisplayHtml(chosen)}</div>
                  <div style="font-size:11.5px;color:var(--ink-soft);">${countLabel(specimensOfTaxon(chosen.id).length, "specimen", "specimens")} already${chosen.common_name ? " · " + escapeHtml(chosen.common_name) : ""}</div>
                </div>
                <button type="button" class="btn-ghost" style="padding:0;font-size:12px;" onclick="state.newPlantTaxon='';render()">Change</button>
              </div>
              <div class="field-help">This plant becomes another specimen of that species. No new species record is created.</div>`;
          }
          const q = (state.newPlantTaxonSearch || "").trim().toLowerCase();
          const matches = q ? state.taxa.filter((t) =>
            [taxonDisplayName(t), t.common_name, t.genus, t.family, t.working_label]
              .filter(Boolean).join(" ").toLowerCase().includes(q)).slice(0, 6) : [];
          return `
            <label>Species &mdash; pick one you already have</label>
            <input id="np-taxonsearch" placeholder="Search your species…" value="${escapeHtml(state.newPlantTaxonSearch || "")}"
              oninput="state.newPlantTaxonSearch=this.value;scheduleRender()" />
            ${q ? `<div class="stack" style="margin-top:8px;max-height:26vh;overflow-y:auto;">
              ${matches.length === 0 ? `<p class="subtle" style="font-size:12.5px;margin:0;">Nothing matches &mdash; name it below to create a new species.</p>`
                : matches.map((t) => `
                <button type="button" class="task-pick" onclick="state.newPlantTaxon='${t.id}';state.newPlantTaxonSearch='';render()">
                  ${icon("leaf")}<span style="flex:1;text-align:left;">${escapeHtml(taxonDisplayName(t))}${t.common_name ? ` · ${escapeHtml(t.common_name)}` : ""}</span>
                  <span class="mono" style="font-size:10.5px;opacity:0.7;">${specimensOfTaxon(t.id).length}</span>
                </button>`).join("")}
            </div>` : ""}
            <div class="divider" style="margin:14px 0 10px;"></div>
            <div class="section-label">Or name a new species</div>
            <label>Botanical name</label>
            <input id="np-botanical" placeholder="e.g. Cephalocereus senilis" value="${suggestion ? escapeHtml(suggestion.suggested_name) : ""}" />
            <label>Common name</label>
            <input id="np-common" placeholder="e.g. Old Man Cactus" />`;
        })()}
        ${/* AI-3 layer 1. Filled live by checkDuplicateName() as she types. */""}
        <div id="np-dupe"></div>
        <label>Identification status</label>
        <select id="np-idstatus">
          ${Object.entries(ID_STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${k === (suggestion ? "tentative" : "unidentified") ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Location</label>
        ${locationField("np", { empty: "Not filed to a location" })}
        <label>Collection</label>
        <select id="np-category">
          <option value="current" selected>Current</option>
          <option value="historical">Historical</option>
        </select>
        <div class="checkbox-row">
          <input type="checkbox" id="np-original" />
          <label for="np-original">Part of the original collection</label>
        </div>
        <label>Notes</label>
        <textarea id="np-notes" rows="2"></textarea>

        ${/* Everything below is optional and hidden by default. The form
             previously collected seven fields against the edit form's twenty,
             so anything else meant creating a plant and immediately reopening
             it — but capture from the Inbox has to stay fast, so the extras
             expand rather than crowd (PD-6). */""}
        <button type="button" class="btn-ghost btn-block" style="margin-top:14px;text-align:center;justify-content:center;"
                onclick="state.newPlantExpanded=!state.newPlantExpanded;render()">
          ${state.newPlantExpanded ? "Fewer details ↑" : "More details ↓"}
        </button>
        <div style="display:${state.newPlantExpanded ? "block" : "none"};">
          <div class="section-label">Identity</div>
          <label>Cultivar</label>
          <input id="np-cultivar" placeholder="e.g. Zwartkop (no quotes)" />
          <label>Family</label>
          <input id="np-family" placeholder="e.g. Crassulaceae" />
          <label>Genus</label>
          <input id="np-genus" placeholder="e.g. Aeonium" />
          <label>Species</label>
          <input id="np-species" placeholder="e.g. arboreum" />

          <div class="section-label">Provenance</div>
          <label>Date acquired</label>
          <input type="date" id="np-dateacquired" />
          <label>Source</label>
          <select id="np-acqtype">
            <option value="">— Unspecified —</option>
            ${Object.entries(ACQ_SOURCE_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
          </select>
          <label>Source name</label>
          <input id="np-acqname" placeholder="e.g. Ruth Bancroft Garden" />

          <div class="section-label">Condition</div>
          <label>Health</label>
          <select id="np-health">
            ${Object.entries(HEALTH_LABELS).map(([k, v]) => `<option value="${k}" ${k === "healthy" ? "selected" : ""}>${v}</option>`).join("")}
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Create plant</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "editPlant") {
    const pl = state.plants.find((p) => p.id === data.plantId);
    const otherPlants = state.plants.filter((p) => p.id !== pl.id);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Edit full record</h3>
      <p class="mono subtle" style="margin:0 0 14px;">${pl.accession_number} · permanent, cannot be changed</p>
      <form id="edit-plant-form">

        ${/* SPECIES-1 phase 3. The name belongs to the taxon, not this
             individual — editing it here wrote to specimen columns that
             shadowed the real record and drifted from it. Identification
             status and notes stay: they are facts about THIS plant. */""}
        <div class="section-label">Identification</div>
        <div class="field-help" style="margin:0 0 10px;">Whether <em>this</em> plant has been identified. The name itself belongs to the species — set it under Species below.</div>
        <label>Identification status</label>
        <select id="ep-idstatus">
          ${Object.entries(ID_STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${pl.identification_status === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Identification notes</label>
        <textarea id="ep-idnotes" rows="2" placeholder="e.g. Possible Echinopsis, species uncertain">${escapeHtml(pl.identification_notes || "")}</textarea>

        ${/* Details and Care moved to the taxon in v1.41.0 — editing them here
             would write to columns nothing reads any more. Edit the species
             record from the specimen's Species card instead. */""}
        <div class="section-label">Species</div>
        <label>This specimen is a</label>
        <select id="ep-taxon" onchange="document.getElementById('ep-newtaxon-wrap').style.display = this.value === '__new__' ? 'block' : 'none';">
          <option value="">— Not linked —</option>
          ${/* SPEC-1. Moving ONE specimen off a shared holding record — seven
               plants on "unidentified cactus", one of them now identified — had
               no path. The picker offered existing taxa only, and its help text
               sent you to the Plants tab, which creates a SPECIMEN: you ended up
               with the new species and a duplicate plant on it, and the original
               still sitting under "unidentified".

               This reassigns the specimen you are editing. No plant row is
               created, the accession number and every photo stay put. */""}
          <option value="__new__">＋ New species…</option>
          ${[...state.taxa].sort((a, b) => taxonDisplayName(a).localeCompare(taxonDisplayName(b)))
            .map((t) => `<option value="${t.id}" ${pl.taxa_id === t.id ? "selected" : ""}>${escapeHtml(taxonDisplayName(t))}</option>`).join("")}
        </select>
        <div id="ep-newtaxon-wrap" style="display:none;margin-top:10px;">
          <label>Botanical name</label>
          <input id="ep-newtaxon-name" placeholder="e.g. Mammillaria elongata 'Copper King'" />
          <label style="margin-top:8px;">Common name (optional)</label>
          <input id="ep-newtaxon-common" placeholder="e.g. Lady Finger Cactus" />
          <div class="field-help">Split into genus, species and cultivar automatically. This specimen moves to the new species — it keeps ${escapeHtml(pl.accession_number)}, its photos and its notes, and no second plant is created.</div>
        </div>
        <div class="field-help">Name, description, type, growth habit, bloom season, origin and care all live on the species and apply to every specimen of it.</div>
        ${pl.taxa_id ? `<button type="button" class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="closeModal();openModal('editTaxon',{taxonId:'${pl.taxa_id}'})">Edit species record</button>` : ""}

        <div class="section-label">Collection</div>
        <label>Category</label>
        <select id="ep-category">
          <option value="current" ${pl.collection_category === "current" ? "selected" : ""}>Current</option>
          <option value="historical" ${pl.collection_category === "historical" ? "selected" : ""}>Historical</option>
        </select>
        <div class="checkbox-row">
          <input type="checkbox" id="ep-original" ${pl.original_collection ? "checked" : ""} />
          <label for="ep-original">Part of the original collection</label>
        </div>
        <label>Status</label>
        <select id="ep-status">
          ${Object.entries(STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${pl.status === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Health</label>
        <select id="ep-health">
          ${Object.entries(HEALTH_LABELS).map(([k, v]) => `<option value="${k}" ${pl.health_status === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Next check-in</label>
        <input type="date" id="ep-nextcheck" value="${escapeHtml(pl.next_check_date || "")}" />
        <div class="field-help">Leave blank and this plant is flagged when nothing has been photographed for ${checkInIntervalDays()} days. Set a date to override that for this one plant.</div>

        <div class="section-label">Provenance</div>
        <label>Date acquired</label>
        <input type="date" id="ep-dateacquired" value="${pl.date_acquired || ""}" />
        <label>Acquisition source type</label>
        <select id="ep-acqtype">
          <option value="">— Unspecified —</option>
          ${Object.entries(ACQ_SOURCE_LABELS).map(([k, v]) => `<option value="${k}" ${pl.acquisition_source_type === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Acquisition source name</label>
        <input id="ep-acqname" placeholder="e.g. Ruth Bancroft Garden" value="${escapeHtml(pl.acquisition_source_name || "")}" />
        <label>Acquisition notes</label>
        <textarea id="ep-acqnotes" rows="2" placeholder="Approximate date, context, who gave it to you…">${escapeHtml(pl.acquisition_notes || "")}</textarea>
        <label>Propagated from (parent plant)</label>
        <select id="ep-parent">
          <option value="">— None —</option>
          ${otherPlants.map((p) => `<option value="${p.id}" ${pl.parent_plant_id === p.id ? "selected" : ""}>${p.accession_number} — ${escapeHtml(plantDisplayName(p))}</option>`).join("")}
        </select>

        <div class="section-label">Location</div>
        <label>Current location</label>
        ${locationField("ep", { empty: "No location" })}
        <div class="field-help">Changing this logs the move — the previous location is kept in history automatically.</div>

        <div class="section-label">Notes</div>
        <textarea id="ep-notes" rows="2">${escapeHtml(pl.notes || "")}</textarea>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Save changes</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "newLocation") {
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">New location</h3>
      <form id="new-location-form">
        <label>Name *</label>
        <input id="nl-name" required placeholder="e.g. Bucket 12" />
        <label>Type</label>
        <select id="nl-type" onchange="syncHoldsPlants('nl')">
          <option value="">— Unspecified —</option>
          ${Object.entries(LOCATION_TYPE_LABELS).map(([k, v]) => `<option value="${k}" ${k === "container" ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Parent location</label>
        <select id="nl-parent">${locationSelectOptions(null)}</select>
        <label>Code (optional)</label>
        <input id="nl-code" placeholder="e.g. W-T-12" />
        <div class="checkbox-row">
          <input type="checkbox" id="nl-holdsplants" checked />
          <label for="nl-holdsplants">Plants are assigned directly to this location</label>
        </div>
        ${/* It said "Containers get this automatically" and they did not: the
             form saved this checkbox's raw state, and an unticked box became an
             explicit false that overrode the container default. Now the box
             follows the type select, so what is shown is what is saved. */""}
        <div class="field-help">Follows the type — on for containers, hospitals, staging and work areas; off for areas and rows, whose photos are views of the whole space. Override it here if this one is different.</div>
        <label>Show in the Gallery as</label>
        <select id="nl-galleryrow">
          ${Object.entries(GALLERY_ROW_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
        </select>

        <div class="section-label">If this is a former location</div>
        <p class="subtle" style="margin:0 0 8px;">Somewhere the collection used to live. Fills in the Archives row of the Gallery.</p>
        <label>Locality</label>
        <input id="nl-locality" placeholder="e.g. SF, CA" />
        <div class="row" style="gap:10px;align-items:flex-end;">
          <div style="flex:1;"><label>From</label><input type="date" id="nl-activefrom" /></div>
          <div style="flex:1;"><label>Until</label><input type="date" id="nl-activeto" /></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Add location</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "galleryFilters") {
    const f = state.galleryFilters;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">Filters</h3>
      <label>Location</label>
      <select onchange="state.galleryFilters.locationId=this.value;render()">
        <option value="">All locations</option>
        ${locationOptionList().map((o) => `<option value="${o.id}" ${f.locationId === o.id ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}
      </select>
      <label>Photo type</label>
      <select onchange="state.galleryFilters.photoType=this.value;render()">
        <option value="">All types</option>
        ${Object.entries(PHOTO_TYPE_LABELS).map(([k, v]) => `<option value="${k}" ${f.photoType === k ? "selected" : ""}>${v}</option>`).join("")}
      </select>
      <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="closeModal()">Done</button>
      <button class="btn-ghost btn-block" style="margin-top:8px;text-align:center;justify-content:center;" onclick="state.galleryFilters={locationId:'',photoType:'',search:state.galleryFilters.search};render()">Clear filters</button>`;
  }

  if (type === "linkPlantToLocation") {
    const existingIds = plantsAtLocation(data.locationId).map((p) => p.id);
    const q = (state.attachSearch || "").toLowerCase();
    const candidates = state.plants.filter((p) => !existingIds.includes(p.id) && (!q || plantSearchText(p).includes(q)));
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Link existing plant</h3>
      <p class="subtle" style="margin:0 0 14px;">Adds this location to the plant — either as its main location (if it doesn't have one) or as an additional one.</p>
      <input placeholder="Search accession #, name…" value="${escapeHtml(state.attachSearch || "")}" id="search-attach" oninput="state.attachSearch=this.value;scheduleRender()" style="margin-bottom:14px;" />
      <div class="stack" style="max-height:44vh;overflow-y:auto;">
        ${candidates.length === 0 ? `<p class="subtle">No plants match.</p>` : candidates.map((p) => `
          <button class="btn btn-secondary btn-block" style="justify-content:flex-start;text-align:left;" onclick="linkPlantToLocation('${p.id}','${data.locationId}')">
            <span class="mono" style="opacity:0.6;margin-right:6px;">${p.accession_number}</span>${escapeHtml(plantDisplayName(p))}
          </button>`).join("")}
      </div>
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "chooseTaxonPhoto") {
    const t = taxonById(data.taxonId);
    if (!t) return `<p>Not found.</p>`;
    // Any photo from any specimen of this taxon. Once GAL-1 lands this becomes
    // the favourited ones.
    const photos = specimensOfTaxon(t.id)
      .flatMap((sp) => plantPhotosOrdered(sp.id))
      .filter((p, i, arr) => arr.findIndex((x) => x.id === p.id) === i)
      .sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Choose species photo</h3>
      <p class="subtle" style="margin:0 0 14px;">Any photo of any specimen can represent the species.</p>
      ${photos.length === 0 ? `<p class="subtle">No specimen of this plant has photos yet. Add photos to a specimen first, or upload one from the Inbox.</p>` : `
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:50vh;overflow-y:auto;">
          ${photos.map((p) => `
            <button onclick="setTaxonPhoto('${t.id}','${p.id}')" style="aspect-ratio:1;border-radius:8px;overflow:hidden;border:none;padding:0;cursor:pointer;background:var(--parchment-dim);outline:${t.primary_photo_id === p.id ? "3px solid var(--moss)" : "none"};">
              ${photoImg(p)}
            </button>`).join("")}
        </div>`}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "askClaude") {
    const n = activeBulkSelection().size;
    const opt = (focus, title, sub) => `
      <button class="attn-row" onclick="runClaudeBatch('${focus}')">
        <div style="flex:1;min-width:0;">
          <div class="attn-title">${title}</div>
          <div class="attn-sub">${sub}</div>
        </div>
        <span class="action-chevron">${icon("chevronRight")}</span>
      </button>`;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Ask Claude about ${countLabel(n, "photo", "photos")}</h3>
      <p class="subtle" style="margin:0 0 14px;">One API call per photo. A narrower question is cheaper and more accurate — ask only what you need.</p>
      <div class="tag-card" style="padding:0;overflow:hidden;">
        ${opt("location", "Where was this taken?", "Location only. Weighs the capture date against when the collection lived where.")}
        ${opt("plant", "Which plant is this?", "Specimen only. Leaves any location suggestion alone.")}
        ${opt("all", "Everything", "Plant, location, type, bloom and any health concern.")}
      </div>
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "galleryBatch") {
    const n = state.gallerySelected.size;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Edit ${countLabel(n, "photo", "photos")}</h3>
      <p class="subtle" style="margin:0 0 14px;">Only what you set here changes. Leave a field blank to leave it as it is.</p>

      <label>Location</label>
      <select id="gb-location">
        <option value="">— Leave unchanged —</option>
        <option value="__clear__">Remove location</option>
        ${locationSelectOptions(null)}
      </select>

      ${/* PL-3. Same staged picker as the edit-photo form — picking must not
           apply the batch, so it stages and the Apply button commits. */""}
      <label>Plant</label>
      ${(() => {
        const v = state.batchPlant;
        const chosen = v && v !== "__clear__" ? state.plants.find((x) => x.id === v) : null;
        const nm = chosen ? plantPickerName(chosen) : null;
        const label = chosen ? escapeHtml(nm.primary) : v === "__clear__" ? "Detach from plant" : "Leave unchanged";
        return `
        <div class="tag-card plant-list-card" style="padding:8px 10px;margin-bottom:8px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:13.5px;${chosen ? "font-weight:500;" : "color:var(--ink-soft);"}">${label}</div>
            ${chosen ? `<div class="mono tag-id">${chosen.accession_number}</div>` : ""}
          </div>
          <div style="display:flex;gap:10px;flex-shrink:0;">
            <button type="button" class="btn-ghost" style="padding:0;font-size:12px;" onclick="state.batchPickerOpen=!state.batchPickerOpen;render()">${state.batchPickerOpen ? "Close" : "Choose"}</button>
            ${v ? `<button type="button" class="btn-ghost" style="padding:0;font-size:12px;" onclick="setBatchPlant('')">Reset</button>`
                : `<button type="button" class="btn-ghost" style="padding:0;font-size:12px;color:var(--terracotta);" onclick="setBatchPlant('__clear__')">Detach</button>`}
          </div>
        </div>
        ${state.batchPickerOpen ? plantPicker(`setBatchPlant('{id}')`) : ""}`;
      })()}

      <label>Type</label>
      <select id="gb-type">
        <option value="">— Leave unchanged —</option>
        ${Object.entries(PHOTO_TYPE_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
      </select>
      <div class="field-help"><strong>Overview</strong> and <strong>Progress</strong> mean these show the place rather than a specimen.</div>

      ${photosHaveHistorical() ? `
      <label>Historical</label>
      <select id="gb-historical">
        <option value="">— Leave unchanged —</option>
        <option value="yes">Mark as historical</option>
        <option value="no">Not historical</option>
      </select>
      <div class="field-help">Records how a place used to be. Keeps the type and location, leaves &ldquo;File to a plant&rdquo;.</div>` : ""}

      <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="applyGalleryBatch()">Apply to ${n}</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "duplicatePhotos") {
    const groups = findDuplicatePhotoGroups();
    const extras = groups.reduce((n, g) => n + g.length - 1, 0);
    const sel = state.dupeSelected;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Possible duplicate photos</h3>
      <p class="subtle" style="margin:0 0 12px;">Same capture time to the second, so almost certainly the same shot filed twice. Check before deleting — a burst can share a second.</p>
      ${groups.length === 0 ? `<p class="subtle">No duplicates found.</p>` : `
        <div class="row" style="margin-bottom:12px;">
          <button class="btn btn-secondary btn-sm" onclick="selectDuplicateExtras()">
            ${extras && sel.size === extras ? "Clear selection" : `Select all ${countLabel(extras, "extra", "extras")}`}
          </button>
          <button class="btn btn-danger btn-sm icon-btn" onclick="deleteSelectedDuplicates()">
            ${icon("trash")} Delete ${sel.size}
          </button>
        </div>
        <p class="subtle" style="margin:-6px 0 12px;font-size:11.5px;">Selecting extras keeps the best-filed copy of each — the one attached to a plant, then a location, then carrying notes — and marks the rest.</p>
        <div class="stack">
          ${groups.map((g) => {
            const keepId = bestCopyOf(g).id;
            return `
            <div class="surface" style="padding:12px;">
              <div class="mono subtle" style="font-size:11px;margin-bottom:8px;">${fmtDate(g[0].taken_at)} · ${countLabel(g.length, "copy", "copies")}</div>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
                ${g.map((p) => {
                  const plant = p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null;
                  const loc = p.location_id ? locationById(p.location_id) : null;
                  const picked = sel.has(p.id);
                  return `
                  <div>
                    <div class="card-media ratio-1x1" style="border-radius:6px;cursor:pointer;position:relative;${picked ? "outline:3px solid var(--terracotta);" : ""}"
                         onclick="toggleDupePhotoSelected('${p.id}')">
                      ${photoImg(p)}
                      <div class="select-check ${picked ? "checked" : ""}" style="top:6px;left:6px;z-index:2;${picked ? "background:var(--terracotta);border-color:var(--terracotta);" : ""}">${picked ? icon("check") : ""}</div>
                      ${p.id === keepId ? `<span class="pill pill-orange" style="position:absolute;bottom:5px;left:5px;z-index:2;font-size:9.5px;">Best</span>` : ""}
                    </div>
                    <div style="font-size:10.5px;color:#8AA090;margin-top:4px;line-height:1.35;">
                      ${plant ? escapeHtml(plantDisplayName(plant)) : `<span class="value-blank">No plant</span>`}<br/>
                      ${loc ? escapeHtml(loc.name) : `<span class="value-blank">No location</span>`}
                    </div>
                    <button class="btn-ghost" style="padding:3px 0 0;font-size:10.5px;" onclick="event.stopPropagation();closeModal();openGalleryLightbox('${p.id}')">View</button>
                  </div>`;
                }).join("")}
              </div>
            </div>`;
          }).join("")}
        </div>`}
      <button class="btn-ghost" style="margin-top:16px;" onclick="state.dupeSelected=new Set();closeModal()">Done</button>`;
  }

  if (type === "duplicatePlants") {
    const groups = findDuplicatePlantGroups();
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Possible duplicate plants</h3>
      <p class="subtle" style="margin:0 0 14px;">Same name in the same location — likely one plant entered twice. "Keep this" merges the others into it; photos, tags and history move across.</p>
      ${groups.length === 0 ? `<p class="subtle">No duplicates found.</p>` : `
        <div class="stack">
          ${groups.map((group) => `
            <div class="surface" style="padding:14px;">
              ${group.map((pl) => `
                <div class="row" style="margin-top:6px;">
                  <div style="cursor:pointer;min-width:0;" onclick="closeModal();openPlant('${pl.id}')">
                    <span class="mono" style="font-size:11px;opacity:0.7;">${pl.accession_number}</span>
                    <span style="font-size:13.5px;margin-left:6px;">${escapeHtml(plantDisplayName(pl))}</span>
                  </div>
                  <div style="display:flex;gap:6px;flex-shrink:0;">
                    ${group.filter((other) => other.id !== pl.id).map((other) => `
                      <button class="btn btn-secondary btn-sm" onclick="mergePlants('${pl.id}','${other.id}')" title="Keep ${pl.accession_number}, merge ${other.accession_number} into it">Keep this</button>`).join("")}
                  </div>
                </div>`).join("")}
            </div>`).join("")}
        </div>`}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Done</button>`;
  }

  if (type === "editList") {
    const key = data.listName;
    const title = EDITABLE_LISTS[key] || key;
    const seeded = state.listOptions.some((o) => o.list_name === key);
    const rows = seeded
      ? state.listOptions.filter((o) => o.list_name === key)
          .slice().sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999) || String(a.label).localeCompare(String(b.label)))
      : Object.entries(BUILTIN_LISTS[key] || {}).map(([value, label], i) => ({ id: null, value, label, sort_order: i, active: true }));
    // Count of records already using each value, so retiring one is an informed
    // decision rather than a blind toggle.
    const usage = (value) => key === "light_conditions"
      ? state.taxa.filter((t) => (t.light_conditions || []).includes(value)).length
      : state.taxa.filter((t) => t[key] === value).length;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">${escapeHtml(title)}</h3>
      <p class="subtle" style="margin:0 0 14px;">Retiring an option hides it from dropdowns. Anything already using it keeps showing it.</p>
      ${!seeded ? `<p class="subtle" style="margin:0 0 12px;">These are the built-in defaults. Saving any change copies the whole list into the database, after which it is yours to edit.</p>` : ""}
      <div class="stack">
        ${rows.map((o) => {
          const used = usage(o.value);
          return `
          <div class="surface" style="padding:10px 12px;${o.active === false ? "opacity:0.55;" : ""}">
            <div class="row">
              <div style="flex:1;min-width:0;">
                <input value="${escapeHtml(o.label)}" data-list-label="${escapeHtml(o.value)}" style="margin:0;" />
                <div class="mono subtle" style="font-size:10.5px;margin-top:3px;">${escapeHtml(o.value)}${used ? ` · used by ${countLabel(used, "species", "species")}` : " · unused"}</div>
              </div>
              <button class="btn-ghost" style="padding:0 0 0 10px;font-size:12px;color:${o.active === false ? "var(--moss)" : "var(--terracotta)"};flex-shrink:0;"
                onclick="toggleListOption('${key}','${escapeHtml(o.value)}',${o.active === false})">${o.active === false ? "Restore" : "Retire"}</button>
            </div>
          </div>`;
        }).join("")}
      </div>

      <div class="section-label">Add an option</div>
      <input id="lo-new-label" placeholder="e.g. Dracaena" />
      <div class="field-help">The stored value is generated from the label and never changes afterwards.</div>
      <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="addListOption('${key}')">Add</button>

      <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="saveListLabels('${key}')">Save labels</button>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Done</button>`;
  }

  if (type === "editTaxon") {
    const t = taxonById(data.taxonId);
    if (!t) return `<p>Not found.</p>`;
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Edit species record</h3>
      <p class="subtle" style="margin:0 0 14px;">Applies to every specimen of this plant.</p>
      <form id="edit-taxon-form">
        <div class="section-label">Identity</div>
        <label>Botanical name</label>
        <input id="et-botanical" value="${escapeHtml(t.botanical_name || "")}" />
        <label>Common name</label>
        <input id="et-common" value="${escapeHtml(t.common_name || "")}" />
        <label>Working label</label>
        <input id="et-working" placeholder="For a plant you can't identify yet" value="${escapeHtml(t.working_label || "")}" />
        <div class="field-help">Used as the display name only when there is no botanical name — so an unidentified plant can still be grouped and tracked.</div>

        <div class="section-label">Taxonomy</div>
        <label>Family</label>
        <input id="et-family" placeholder="e.g. Crassulaceae" value="${escapeHtml(t.family || "")}" />
        <label>Genus</label>
        <input id="et-genus" placeholder="e.g. Aeonium" value="${escapeHtml(t.genus || "")}" />
        <label>Species</label>
        <input id="et-species" placeholder="e.g. arboreum" value="${escapeHtml(t.species_epithet || "")}" />
        <label>Infraspecific rank</label>
        <input id="et-infraspecific" placeholder="e.g. var. erinacea" value="${escapeHtml(t.infraspecific || "")}" />
        <div class="field-help">Variety, subspecies or form. Include the abbreviation &mdash; <span class="mono">var.</span>, <span class="mono">subsp.</span>, <span class="mono">f.</span> A bare word is read as <span class="mono">var.</span></div>
        <label>Cultivar</label>
        <input id="et-cultivar" placeholder="e.g. Zwartkop (no quotes)" value="${escapeHtml(t.cultivar || "")}" />
        <div class="checkbox-row">
          <input type="checkbox" id="et-hybrid" ${t.is_hybrid ? "checked" : ""} />
          <label for="et-hybrid">This is a hybrid</label>
        </div>
        <label>Parentage</label>
        <input id="et-parentage" placeholder="e.g. E. gibbiflora 'Metallica' &times; E. elegans 'Potosina'" value="${escapeHtml(t.parentage || "")}" />
        <div class="field-help">The cross this came from. Vendors often put it in the name field &mdash; record the real name above and the pedigree here, so neither is lost.</div>

        <div class="section-label">Details</div>
        <label>Description</label>
        <textarea id="et-description" rows="3" placeholder="What this kind of plant looks like">${escapeHtml(t.description || "")}</textarea>
        <label>Type</label>
        <select id="et-planttype">
          <option value="">— Not recorded —</option>
          ${Object.entries(listChoicesFor("plant_type", t.plant_type)).map(([k, v]) => `<option value="${k}" ${t.plant_type === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Growth habit</label>
        <select id="et-growthhabit">
          <option value="">— Not recorded —</option>
          ${Object.entries(listChoicesFor("growth_habit", t.growth_habit)).map(([k, v]) => `<option value="${k}" ${t.growth_habit === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Mature size</label>
        <input id="et-maturesize" placeholder="e.g. 3&ndash;4 ft tall &times; 5 ft wide" value="${escapeHtml(t.mature_size || "")}" />
        <label>Bloom season</label>
        <select id="et-bloomseason">
          <option value="">— Not recorded —</option>
          ${Object.entries(listChoicesFor("bloom_season", t.bloom_season)).map(([k, v]) => `<option value="${k}" ${t.bloom_season === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
        <label>Origin</label>
        <select id="et-origin">
          ${Object.entries(ORIGIN_LABELS).map(([k, v]) => `<option value="${k}" ${(t.origin || "unknown") === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>

        <div class="section-label">Care</div>
        <label>Native range</label>
        <input id="et-native" placeholder="e.g. Central Mexico" value="${escapeHtml(t.native_range || "")}" />
        <label>Hardy to</label>
        <input id="et-hardy" placeholder="e.g. Zone 9 or 20&deg;F" value="${escapeHtml(t.hardy_to || "")}" />
        <div class="checkbox-row">
          <input type="checkbox" id="et-frosttender" ${isFrostTender(t) ? "checked" : ""} />
          <label for="et-frosttender">Not frost hardy — bring in before a freeze</label>
        </div>
        <div class="field-help">Flags every specimen of this species in the frost report, so a cold night is a list rather than a memory test.</div>
        <label>Light needs</label>
        <div class="wrap-gap" style="margin-top:2px;">
          ${Object.entries(listOptionsFor("light_conditions")).map(([k, v]) => `
            <label class="checkbox-row" style="margin-top:6px;background:var(--bg);padding:6px 10px 6px 8px;border-radius:20px;width:auto;">
              <input type="checkbox" class="et-light-checkbox" value="${k}" ${(t.light_conditions || []).includes(k) ? "checked" : ""} />
              <span style="font-size:13px;">${v}</span>
            </label>`).join("")}
        </div>
        <label>Water needs</label>
        <select id="et-water">
          <option value="">— Unspecified —</option>
          ${Object.entries(listChoicesFor("water_needs", t.water_needs)).map(([k, v]) => `<option value="${k}" ${t.water_needs === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Save changes</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "removeLocation") {
    const l = locationById(data.locationId);
    if (!l) return `<p>Not found.</p>`;
    const kids = directChildLocations(l.id);
    const plants = plantsAtLocation(l.id);
    const photos = photosAtLocation(l.id);
    const history = 0; // counted server-side on delete; surfaced in the confirm
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Remove ${escapeHtml(l.name)}</h3>
      <p class="subtle" style="margin:0 0 14px;">Two different things, for two different reasons.</p>

      ${kids.length ? `
        <div class="surface" style="padding:12px;margin-bottom:14px;border-color:var(--terracotta);">
          <div style="font-size:13px;">This holds ${countLabel(kids.length, "location", "locations")}. Move or remove those first — deleting this would orphan them.</div>
        </div>` : ""}

      <div class="surface" style="padding:14px;margin-bottom:12px;">
        <div style="font-weight:600;font-size:14px;">Archive it</div>
        <p class="subtle" style="margin:6px 0 10px;font-size:12.5px;">For a container that no longer exists — you repotted, the plant moved on. It disappears from pickers and lists, and every photo, plant and move it was ever part of is kept.</p>
        <button class="btn btn-secondary btn-block" onclick="archiveLocation('${l.id}')">${l.archived ? "Un-archive" : "Archive"}</button>
      </div>

      <div class="surface" style="padding:14px;">
        <div style="font-weight:600;font-size:14px;color:var(--terracotta);">Delete it</div>
        <p class="subtle" style="margin:6px 0 10px;font-size:12.5px;">For a location that should never have existed — a duplicate, a typo. ${plants.length || photos.length ? `<strong>${countLabel(plants.length, "plant is", "plants are")} and ${countLabel(photos.length, "photo is", "photos are")} filed here</strong> — they are unassigned, not deleted. Its move history is destroyed.` : "Nothing is filed here."}</p>
        <button class="btn btn-danger btn-block" ${kids.length ? "disabled" : ""} onclick="deleteLocation('${l.id}')">
          ${kids.length ? "Empty it first" : "Delete permanently"}
        </button>
      </div>

      <button class="btn-ghost" style="margin-top:14px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "newSpecimenHere") {
    const l = locationById(data.locationId);
    if (!l) return `<p>Not found.</p>`;
    // Location-first creation. The other direction meant opening the species
    // record and hunting for this location among 149 (LOCP-3).
    const taxa = [...state.taxa].sort((a, b) => taxonDisplayName(a).localeCompare(taxonDisplayName(b)));
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">New specimen here</h3>
      <p class="subtle" style="margin:0 0 14px;">${escapeHtml(locationPath(l))}</p>
      <form id="new-specimen-here-form">
        <label>Which plant is it? *</label>
        <select id="nsh-taxon" required>
          <option value="">— Choose a species —</option>
          ${taxa.map((t) => `<option value="${t.id}">${escapeHtml(taxonDisplayName(t))}</option>`).join("")}
          <option value="__new__">+ A species not listed yet</option>
        </select>
        <div id="nsh-newname-wrap" style="display:none;">
          <label>Botanical name</label>
          <input id="nsh-newname" placeholder="e.g. Echeveria elegans" />
        </div>
        ${acquisitionFields("nsh")}
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Create here</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "newSpecimen") {
    const t = taxonById(data.taxonId);
    if (!t) return `<p>Not found.</p>`;
    const siblings = specimensOfTaxon(t.id);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Add a specimen</h3>
      <p class="subtle" style="margin:0 0 14px;">Another <em>${escapeHtml(taxonDisplayName(t))}</em>. Species details are inherited — you only set where this one lives and where it came from.</p>
      <form id="new-specimen-form">
        <label>Location *</label>
        ${locationField("ns", { empty: "Choose where it lives" })}
        <label>Propagated from</label>
        <select id="ns-parent">
          <option value="">— Not a propagation —</option>
          ${siblings.map((sp) => `<option value="${sp.id}">${sp.accession_number}${sp.location_id && locationById(sp.location_id) ? " — " + escapeHtml(locationById(sp.location_id).name) : ""}</option>`).join("")}
        </select>
        <div class="field-help">Pick the specimen this one was taken off, if it was propagated. It will nest underneath that plant.</div>
        ${acquisitionFields("ns")}
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Create specimen</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "assignLocationPhotos") {
    const l = locationById(data.locationId);
    if (!l) return `<p>Not found.</p>`;
    const orphans = photosAtLocation(l.id).filter((p) => !p.plant_id)
      .sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
    // Specimens here first — they are almost always the answer. Everything else
    // is available below for a photo that turns out to show something moved.
    const here = plantsAtLocation(l.id);
    const elsewhere = state.plants.filter((p) => !here.some((h) => h.id === p.id))
      .sort((a, b) => (a.accession_number || "").localeCompare(b.accession_number || ""));
    const sel = state.assignSelected || new Set();
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Assign photos — ${escapeHtml(l.name)}</h3>
      <p class="subtle" style="margin:0 0 12px;">Pick the photos, then the plant they show.</p>

      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-secondary btn-sm" onclick="toggleAssignAll('${orphans.map((p) => p.id).join(",")}')">
          ${orphans.length && orphans.every((p) => sel.has(p.id)) ? "Clear all" : `Select all ${orphans.length}`}
        </button>
        <span class="subtle">${sel.size} selected</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:34vh;overflow-y:auto;">
        ${orphans.map((p) => {
          const picked = sel.has(p.id);
          return `
          <button onclick="toggleAssignPhoto('${p.id}')" style="border:none;padding:0;background:none;cursor:pointer;position:relative;">
            <div class="card-media ratio-1x1" style="border-radius:6px;${picked ? "outline:3px solid var(--moss);" : ""}">${photoImg(p)}</div>
            ${picked ? `<div class="select-check checked" style="top:5px;left:5px;z-index:2;">${icon("check")}</div>` : ""}
            <div class="mono" style="font-size:9.5px;color:#8AA090;margin-top:3px;">${fmtDate(photoDate(p))}</div>
          </button>`;
        }).join("")}
      </div>

      <div class="section-label">Attach to</div>
      ${here.length ? `
        <div class="stack">
          ${here.map((sp) => `
            <button class="tag-card plant-list-card" style="width:100%;padding:9px 12px;border:none;text-align:left;cursor:pointer;${sel.size ? "" : "opacity:0.5;"}"
                    onclick="assignPhotosToPlant('${sp.id}')" ${sel.size ? "" : "disabled"}>
              <div class="plant-list-thumb" style="width:44px;height:44px;">
                ${plantCoverPhoto(sp) ? photoImg(plantCoverPhoto(sp)) : `<div class="plant-list-thumb-empty">${icon("photo")}</div>`}
              </div>
              <div style="flex:1;min-width:0;">
                <div class="mono tag-id">${sp.accession_number}</div>
                <div style="font-size:13px;">${escapeHtml(plantDisplayName(sp))}</div>
              </div>
            </button>`).join("")}
        </div>` : `<p class="subtle" style="margin:0 0 8px;">No specimens are recorded here yet.</p>`}

      ${sel.size ? `
        <div class="section-label">Or any other plant</div>
        ${plantPicker("assignPhotosToPlant('{id}')", { excludeIds: here.map((h) => h.id) })}` : ""}

      <button class="btn-ghost" style="margin-top:14px;" onclick="state.assignSelected=new Set();closeModal()">Done</button>`;
  }

  if (type === "attachInboxPhoto") {
    const pl = state.plants.find((p) => p.id === data.plantId);
    const specimenLoc = pl && pl.location_id ? locationById(pl.location_id) : null;
    // Every photo not yet assigned to a plant, regardless of its location.
    // Filtering by the specimen's location would hide almost everything,
    // since unassigned photos usually have no location either.
    const available = state.photos
      .filter((p) => !p.plant_id)
      .sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
    // Was a hard cap of 24. Each tile is a Drive fetch, so it still pages
    // rather than loading everything, but the rest is now reachable.
    const CAP = state.attachPhotoLimit || 24;
    const shown = available.slice(0, CAP);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Add photos to this plant</h3>
      <p class="subtle" style="margin:0 0 14px;">
        ${available.length === 0 ? "Nothing waiting." : `Tap a photo to attach it. The list updates as you go, so you can add several.`}
        ${specimenLoc ? ` Photos with no location will be filed under <strong>${escapeHtml(specimenLoc.name)}</strong>.` : ""}
      </p>
      ${available.length === 0 ? `<p class="subtle">Every photo is already assigned to a plant. Upload more from the Inbox.</p>` : `
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:52vh;overflow-y:auto;">
          ${shown.map((p) => {
            const loc = p.location_id ? locationById(p.location_id) : null;
            return `
            <button onclick="attachInboxPhotoToPlant('${p.id}','${data.plantId}')" style="border-radius:8px;overflow:hidden;border:none;padding:0;cursor:pointer;background:var(--parchment-dim);text-align:left;">
              <div style="aspect-ratio:1;">${photoImg(p)}</div>
              <div class="mono" style="font-size:10px;color:#8AA090;padding:4px 5px 2px;">${fmtDate(photoDate(p))}</div>
              ${loc ? `<div style="font-size:10px;color:var(--blue);padding:0 5px 5px;">${escapeHtml(loc.name)}</div>` : ""}
            </button>`;
          }).join("")}
        </div>
        ${available.length > CAP ? `
          <button class="btn btn-secondary btn-block" style="margin-top:12px;" onclick="state.attachPhotoLimit=${CAP + 48};render()">Show more — ${CAP} of ${available.length}</button>` : available.length > 24 ? `<p class="subtle" style="margin-top:10px;">All ${available.length} shown.</p>` : ""}`}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Done</button>`;
  }

  if (type === "chooseLocationPhoto") {
    const photos = photosAtLocation(data.locationId).sort((a, b) => new Date(photoDate(b)) - new Date(photoDate(a)));
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 14px;">Choose main photo</h3>
      ${photos.length === 0 ? `<p class="subtle">No photos of this location yet — add one from here first.</p>` : `
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:50vh;overflow-y:auto;">
          ${photos.map((p) => {
            return `
            <button onclick="setLocationPhoto('${data.locationId}','${p.id}')" style="aspect-ratio:1;border-radius:8px;overflow:hidden;border:none;padding:0;cursor:pointer;background:var(--parchment-dim);">
              ${photoImg(p)}
            </button>`;
          }).join("")}
        </div>`}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "choosePrimaryPhoto") {
    const photos = plantPhotosOrdered(data.plantId);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 4px;">Choose profile picture</h3>
      <p class="subtle" style="margin:0 0 14px;">Upload a fresh photo (a reference/ID image is fine — it won't need to be a dated observation), or pick from existing photos below.</p>

      <form id="profile-photo-upload-form">
        <input type="file" id="profile-photo-file" accept="image/*" required style="padding:10px;" />
        <button type="submit" class="btn btn-accent btn-block" style="margin-top:12px;" id="profile-photo-submit-btn">Upload and use as profile picture</button>
      </form>

      ${photos.length > 0 ? `
        <div class="divider"></div>
        <p class="subtle" style="margin:0 0 10px;">Or choose an existing photo</p>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:38vh;overflow-y:auto;">
          ${photos.map((p) => {
            return `
            <div style="position:relative;aspect-ratio:1;">
              <button onclick="setPrimaryPhoto('${data.plantId}','${p.id}')" style="width:100%;height:100%;border-radius:8px;overflow:hidden;border:none;padding:0;cursor:pointer;background:var(--parchment-dim);">
                ${photoImg(p)}
              </button>
              <button onclick="event.stopPropagation();deletePhoto('${p.id}')" class="thumb-delete-btn" aria-label="Delete photo">${icon("trash")}</button>
            </div>`;
          }).join("")}
        </div>` : ""}
      <button class="btn-ghost" style="margin-top:16px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "propagatePlant") {
    const parent = state.plants.find((p) => p.id === data.parentId);
    const workArea = state.locations.find((l) => l.name === "Propagation / Work Area" && !l.parent_location_id);
    return `
      <div class="modal-handle"></div>
      <h3 class="display" style="font-size:18px;font-weight:500;margin:0 0 2px;">Propagate plant</h3>
      <p class="subtle" style="margin:0 0 14px;">From <strong>${parent.accession_number}</strong> — ${escapeHtml(plantDisplayName(parent))}. Gets its own new accession number.</p>
      <form id="propagate-plant-form">
        ${/* No name fields. An offset is the same kind of plant as its mother
             by definition, so it inherits her taxon; asking again only created
             a chance to disagree with it. */""}
        <label>How many offsets?</label>
        <input type="number" id="pp-count" value="1" min="1" max="25" />
        <div class="field-help">Each becomes its own specimen with its own accession number, all sharing this parent and location. Taking five cuttings should not mean filling this in five times.</div>
        <label>Location</label>
        ${locationField("pp", { empty: "No location" })}
        <label>Notes</label>
        <textarea id="pp-notes" rows="2"></textarea>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Create propagated plant</button>
      </form>
      <button class="btn-ghost" style="margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  }

  if (type === "editLocation") {
