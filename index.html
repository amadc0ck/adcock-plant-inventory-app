async function attachInboxPhotoToPlant(photoId, plantId) {
  const photo = state.photos.find((p) => p.id === photoId);
  const plant = state.plants.find((p) => p.id === plantId);
  if (!photo || !plant) return;
  try {
    const body = { plant_id: plantId };
    // Snapshot the plant's location, never a live link: a photo records where
    // it was taken, so it must not follow the plant when the plant later moves.
    if (!photo.location_id && plant.location_id) body.location_id = plant.location_id;
    await restPatch("photos", `id=eq.${photoId}`, body);

// PHOTO-3. Unassigns the photo without touching the record, so the EXIF date
// and the Drive file survive — deleting and re-uploading loses both.
// Note it does NOT clear location_id: per REFERENCE section 3 a photo is only
// back in the Inbox once BOTH plant_id and location_id are null, so a photo
// with a location stays filed under that location. The toast says which.
// ADM-1 mutations.
// The built-in lists are the starting point, so the first edit to any list
// copies it into the database wholesale. Editing one option must not silently
// discard the other seven.
async function seedListIfNeeded(listName) {
  if (state.listOptions.some((o) => o.list_name === listName)) return;
  const builtin = BUILTIN_LISTS[listName] || {};
  const rows = Object.entries(builtin).map(([value, label], i) => ({
    list_name: listName, value, label, sort_order: i, active: true,
  }));
  if (rows.length) await restPost("list_options", rows);
}

// Values are derived from the label once and then frozen, because every plant
// storing this value would otherwise be orphaned by a rename.
function slugifyListValue(label) {
  return String(label).trim().toLowerCase()
    .replace(/['\u2018\u2019"]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "");
}

async function addListOption(listName) {
  const input = document.getElementById("lo-new-label");
  const label = input.value.trim();
  if (!label) { toast("Give it a name first", true); return; }
  const value = slugifyListValue(label);
  if (!value) { toast("That name has no usable letters or numbers", true); return; }
  try {
    await seedListIfNeeded(listName);
    await loadAll();
    const clash = state.listOptions.find((o) => o.list_name === listName && o.value === value);
    if (clash) {
      // Restoring beats creating a duplicate value that nothing could tell apart.
      if (clash.active === false) {
        await restPatch("list_options", `id=eq.${clash.id}`, { active: true, label });
        toast(`Restored ${label}`);
      } else {
        toast(`${clash.label} already exists`, true);
        return;
      }
    } else {
      const max = state.listOptions.filter((o) => o.list_name === listName)
        .reduce((n, o) => Math.max(n, o.sort_order ?? 0), 0);
      await restPost("list_options", { list_name: listName, value, label, sort_order: max + 1, active: true });
      toast(`Added ${label}`);
    }
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function toggleListOption(listName, value, restore) {
  try {
    await seedListIfNeeded(listName);
    await loadAll();
    const row = state.listOptions.find((o) => o.list_name === listName && o.value === value);
    if (!row) { toast("Option not found", true); return; }
    await restPatch("list_options", `id=eq.${row.id}`, { active: !!restore });
    toast(restore ? "Restored" : "Retired — still shown on records already using it");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

async function saveListLabels(listName) {
  const inputs = Array.from(document.querySelectorAll("[data-list-label]"));
  try {
    await seedListIfNeeded(listName);
    await loadAll();
    let changed = 0;
    for (const el of inputs) {
      const value = el.getAttribute("data-list-label");
      const label = el.value.trim();
      const row = state.listOptions.find((o) => o.list_name === listName && o.value === value);
      if (!row || !label || row.label === label) continue;
      await restPatch("list_options", `id=eq.${row.id}`, { label });
      changed++;
    }
    toast(changed ? `Saved ${countLabel(changed, "label", "labels")}` : "Nothing changed");
    await loadAll();
  } catch (e) { toast(e.message, true); }
}

// Backfills taken_at for photos uploaded before the Edge Function was fixed to
// store it (v1.45.2). Their EXIF was never lost — it is still inside the JPEG
// on Drive — so this re-reads each file and parses the same way the browser
// does at upload time.
//
// Idempotent: only touches rows where taken_at is null, so it can be stopped
// and re-run. Concurrency is deliberately low; every photo is a Drive fetch
// through an Edge Function.
// PHOTOS-1. Three-step flow: create a session, wait while Amanda picks in
// Google Photos' own tab, then import what she chose. Polling is required —
// there is no callback, the picker just sets mediaItemsSet on the session.
// The import queue lives in browser memory, so a refresh used to lose every
// photo not yet imported. Persisting it makes an accidental refresh recoverable.
//
// Two limits worth knowing: baseUrls expire 60 minutes after picking, so a
// resume outside that window cannot work; and a photo that was mid-request when
// the page went away may land twice, which the duplicate-photo report catches.
// Handle on the tab Google Photos opens in. Kept outside `state` because it is
// a live window reference, not data — it must never be serialised or rendered.
// Since the app opened that tab, the app is allowed to close it again.
let photosPickerWindow = null;

// After picking, the user is left sitting in Google Photos with nothing to say
// the import has begun. On a laptop the other tab is at least visible; on a
// phone tabs are hidden, so it reads as though nothing happened.
function closePhotosPickerTab() {
  try {
    if (photosPickerWindow && !photosPickerWindow.closed) photosPickerWindow.close();
  } catch (e) { /* cross-origin or already gone — nothing to recover */ }
  const stillOpen = !!(photosPickerWindow && !photosPickerWindow.closed);
  photosPickerWindow = null;
  // Best-effort: browsers usually return focus to the opener when the tab it
  // opened closes, and often ignore focus() outright.
  try { window.focus(); } catch (e) {}
  return !stillOpen;
}

const PHOTOS_IMPORT_KEY = "abg.photosImport";

function savePhotosImport() {
  const st = state.photosImport;
  try {
    if (!st || st.phase !== "importing" || !st.queue) { localStorage.removeItem(PHOTOS_IMPORT_KEY); return; }
    // With parallel workers `done` is no longer a clean cursor into the queue,
    // so the remainder is whatever has not been accounted for either way.
    const settled = st.done + st.failed + (st.alreadyIn || 0);
    const remaining = st.queue.slice(Math.max(0, settled));
    if (!remaining.length) { localStorage.removeItem(PHOTOS_IMPORT_KEY); return; }
    localStorage.setItem(PHOTOS_IMPORT_KEY, JSON.stringify({
      savedAt: Date.now(),
      locationId: st.locationId || null,
      done: st.done,
      total: st.total,
      remaining,
    }));
  } catch (e) { /* private mode or full quota — resume is a convenience, not a guarantee */ }
}

function loadPhotosImport() {
  try {
    const raw = localStorage.getItem(PHOTOS_IMPORT_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    // baseUrls are dead after an hour; offering a resume that cannot work is
    // worse than not offering one.
    const ageMs = Date.now() - (data.savedAt || 0);
    if (ageMs > 55 * 60 * 1000 || !data.remaining?.length) { localStorage.removeItem(PHOTOS_IMPORT_KEY); return null; }
    data.minutesLeft = Math.max(1, Math.round((60 * 60 * 1000 - ageMs) / 60000));
    return data;
  } catch (e) { return null; }
}

function clearPhotosImportSave() {
  try { localStorage.removeItem(PHOTOS_IMPORT_KEY); } catch (e) {}
}

async function resumePhotosImport() {
  const saved = loadPhotosImport();
  if (!saved) { toast("That import can no longer be resumed — the Google Photos links expired", true); state.resumableImport = null; render(); return; }
  state.resumableImport = null;
  state.photosImport = {
    phase: "importing", locationId: saved.locationId, cancel: false,
    done: saved.done, failed: 0, total: saved.total, queue: saved.remaining, resumed: true,
    startedAt: Date.now(), lastProgressAt: Date.now(), lastError: null,
  };
  render();
  startImportHeartbeat();
  await runPhotosImportQueue(saved.remaining);
}

function dismissResumableImport() {
  clearPhotosImportSave();
  state.resumableImport = null;
  render();
}

// Each import is a Google Photos download plus a Drive upload, so it can
// legitimately take a while — but without a ceiling a single hung request
// blocked the whole sequential queue indefinitely, with the banner frozen on a
// count that never moved and no way to tell stalled from slow.
const PHOTOS_IMPORT_TIMEOUT_MS = 120000;

async function photosPickerCall(action, body) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), PHOTOS_IMPORT_TIMEOUT_MS);
  let res;
  try {
    res = await authedFetch(`${CONFIG.SUPABASE_URL}/functions/v1/photos-picker?action=${action}`, () => ({
      method: "POST",
      headers: apiHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body || {}),
      signal: controller.signal,
    }));
  } catch (e) {
    if (e.name === "AbortError") {
      const err = new Error(`Timed out after ${Math.round(PHOTOS_IMPORT_TIMEOUT_MS / 1000)}s`);
      err.timedOut = true;
      throw err;
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
  const data = await res.json();
  if (!res.ok) {
    const err = new Error(data.error || "Google Photos request failed");
    err.needsReconnect = !!data.needsReconnect;
    err.expired = !!data.expired;
    throw err;
  }
  return data;
}

async function startPhotosPicker(locationId) {
  try {
    const session = await photosPickerCall("create");
    state.photosImport = { phase: "picking", sessionId: session.sessionId, pickerUri: session.pickerUri, locationId, cancel: false, done: 0, failed: 0, total: 0 };
    render();
    // Opened from the click handler so the popup blocker allows it, and the
    // handle is kept so the tab can be closed once picking is done.
    photosPickerWindow = window.open(session.pickerUri, "_blank");
    await pollPhotosPicker(session.pollIntervalMs || 3000);
  } catch (e) {
    state.photosImport = null;
    render();
    // A 403 here means the stored token predates the Photos scope. Nothing is
    // wrong with the picker; she just has to re-consent once.
    toast(e.needsReconnect ? "Google needs reconnecting with Photos access — Settings → Reconnect" : e.message, true);
  }
}

async function pollPhotosPicker(intervalMs) {
  const st = state.photosImport;
  if (!st) return;
  // Sessions expire, so this cannot poll forever.
  const deadline = Date.now() + 15 * 60 * 1000;
  while (state.photosImport && !state.photosImport.cancel) {
    if (Date.now() > deadline) {
      toast("Gave up waiting for a selection — start again when you're ready", true);
      state.photosImport = null;
      render();
      return;
    }
    await new Promise((r) => setTimeout(r, intervalMs));
    if (!state.photosImport || state.photosImport.cancel) return;
    let data;
    try {
      data = await photosPickerCall("poll", { sessionId: st.sessionId });
    } catch (e) {
      toast(e.message, true);
      state.photosImport = null;
      render();
      return;
    }
    if (data.pollIntervalMs) intervalMs = data.pollIntervalMs;
    if (data.mediaItemsSet) {
      // Close Google Photos the moment the selection lands, so the browser
      // drops back to this tab rather than leaving her stranded there.
      const closed = closePhotosPickerTab();
      if (!closed) toast("Selection received — switch back to this tab to watch it import");
      // Carried through so the import screen can account for everything picked
      // rather than showing a smaller number with no explanation.
      await importPickedPhotos(data.items || [], { skipped: data.skipped, selected: data.selected });
      return;
    }
  }
}

async function importPickedPhotos(items, meta) {
  const st = state.photosImport;
  if (!st) return;
  const skipped = (meta && meta.skipped) || { videos: 0, unavailable: 0 };
  const skippedTotal = (skipped.videos || 0) + (skipped.unavailable || 0);
  if (!items.length) {
    toast(skippedTotal
      ? `Nothing to import — ${countLabel(skippedTotal, "item", "items")} skipped (videos aren't supported)`
      : "Nothing was selected");
    state.photosImport = null;
    render();
    return;
  }
  // Anything already imported is dropped here rather than re-downloaded and
  // re-uploaded into a second copy. Picker media item ids are stable across
  // sessions, so an id already on a photo row means this exact item is in.
  //
  // Only protects items imported since v1.54.0 — earlier ones were brought in
  // before the id was recorded, and cannot be matched this way. The
  // capture-time duplicate report still covers those.
  const known = new Set(state.photos.map((p) => p.google_photos_id).filter(Boolean));
  const fresh = items.filter((it) => !it.id || !known.has(it.id));
  const alreadyIn = items.length - fresh.length;

  if (!fresh.length) {
    toast(`Nothing new — ${countLabel(alreadyIn, "photo", "photos")} already imported`);
    state.photosImport = null;
    render();
    return;
  }

  Object.assign(st, {
    phase: "importing", total: fresh.length, done: 0, failed: 0, queue: fresh,
    skipped, skippedTotal, alreadyIn,
    selected: (meta && meta.selected) || items.length,
    startedAt: Date.now(), lastProgressAt: Date.now(), lastError: null,
  });
  render();
  startImportHeartbeat();
  await runPhotosImportQueue(fresh);
}

// A stalled import produces no events, so nothing would re-render and the
// banner would sit on a stale count looking healthy. This ticks the UI so
// elapsed time and the stall warning stay truthful with no progress at all.
let importHeartbeat = null;
// Progress must not go through render(). render() replaces app.innerHTML, so
// calling it per photo over a 2000-photo import meant 2000 full rebuilds —
// every image destroyed and re-created, the banner's body padding toggled each
// time, the screen visibly flashing. Same mistake PERF-1 fixed for photos.
//
// Patches the two things that actually change instead, leaving the rest of the
// DOM alone. Falls back to a full render only when the banner needs to appear
// or disappear, which happens twice per import rather than once per photo.
function refreshImportProgress() {
  const html = taskBanner();
  const el = document.querySelector(".task-banner");
  if (!html || !el) { render(); return; }
  const holder = document.createElement("div");
  holder.innerHTML = html;
  const next = holder.firstElementChild;
  if (next) el.replaceWith(next);

  // The dialog, if it happens to be open on top.
  const live = document.getElementById("import-progress");
  if (live && state.photosImport) {
    const st = state.photosImport;
    live.textContent = `${st.done} of ${st.total}${st.failed ? ` · ${st.failed} failed` : ""}`;
  }
}

function startImportHeartbeat() {
  stopImportHeartbeat();
  importHeartbeat = setInterval(() => {
    if (!state.photosImport || state.photosImport.phase !== "importing") { stopImportHeartbeat(); return; }
    refreshImportProgress();
  }, 10000);
}
function stopImportHeartbeat() {
  if (importHeartbeat) { clearInterval(importHeartbeat); importHeartbeat = null; }
}

async function runPhotosImportQueue(items) {
  const st = state.photosImport;
  if (!st) return;
  savePhotosImport();

  // Was strictly sequential to avoid rate limiting, which overcorrected: at
  // ~4s per photo a 1950-photo selection needs over two hours, while baseUrls
  // die after 60 minutes. The run could not finish, and stopped on expired
  // links having attempted a third of the queue.
  //
  // Three at a time is ~3x the throughput and still gentle; a 429 backs the
  // whole run off rather than each worker racing independently.
  const CONCURRENCY = 3;
  let cursor = 0;
  const worker = async () => {
    while (cursor < items.length && !st.cancel && !st.stoppedEarly) {
      const item = items[cursor++];
      await importOne(item, st);
    }
  };

  async function importOne(item, st) {
    if (st.cancel || st.stoppedEarly) return;
    try {
      const res = await photosPickerCall("import", {
        baseUrl: item.baseUrl,
        filename: item.filename,
        createTime: item.createTime,
        mediaItemId: item.id || null,
        locationId: st.locationId || null,
      });
      // The unique index caught one the client-side check missed — two runs
      // overlapping, say. Counted as skipped rather than imported or failed.
      if (res && res.duplicate) st.alreadyIn = (st.alreadyIn || 0) + 1;
      else st.done++;
      st.lastProgressAt = Date.now();
      st.lastError = null;
    } catch (e) {
      st.failed++;
      st.lastProgressAt = Date.now();
      st.lastError = e.timedOut ? "last one timed out" : (e.message || "failed");
      // A bare count of failures is useless — "286 failed" says nothing about
      // whether to retry, wait, or fix something. Tally by cause instead.
      const reason = e.timedOut ? "timed out"
        : e.expired ? "links expired"
        : /rate|429|quota/i.test(e.message || "") ? "rate limited"
        : /schema cache|column/i.test(e.message || "") ? "database not migrated"
        : (e.message || "unknown").slice(0, 60);
      st.failReasons = st.failReasons || {};
      st.failReasons[reason] = (st.failReasons[reason] || 0) + 1;

      // Transient failures deserve a pause rather than burning through the
      // whole queue at speed. Google rate-limits both the Photos download and
      // the Drive upload, and hammering them turns a slow run into a failed one.
      if (reason === "rate limited") {
        st.backoffMs = Math.min((st.backoffMs || 1000) * 2, 30000);
        await new Promise((r) => setTimeout(r, st.backoffMs));
      }
      if (e.expired) {
        // Sets the flag rather than breaking: every worker checks it, so one
        // expired link stops the whole run instead of only this worker.
        st.stoppedEarly = "links expired";
        toast("Google Photos links expired — reselect the rest, already-imported ones will be skipped", true);
        return;
      }
    }
    savePhotosImport();
    refreshImportProgress();
  }

  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  clearPhotosImportSave();
  stopImportHeartbeat();
  st.phase = "done";
  render();
  await loadAll();
}

// Names what was left behind, so a selection of 2000 arriving as 1957 explains
// itself instead of looking like a failure.
function skippedReason(skipped) {
  const parts = [];
  if (skipped && skipped.videos) parts.push(`${countLabel(skipped.videos, "video", "videos")} skipped`);
  if (skipped && skipped.unavailable) parts.push(`${countLabel(skipped.unavailable, "item", "items")} unavailable`);
  return parts.join(" and ");
}

function cancelPhotosImport() {
  stopImportHeartbeat();

  state.photosImport = null;

async function backfillPhotoDates() {
  if (state.backfill?.running) return;
  const pending = state.photos.filter((p) => !p.taken_at && p.drive_file_id);
  if (!pending.length) { toast("Every photo already has a capture date"); return; }
  if (!confirm(`Read EXIF dates for ${pending.length} photos? This re-downloads each one from Drive and may take a few minutes. You can stop it at any point.`)) return;

  state.backfill = { running: true, done: 0, found: 0, failed: 0, total: pending.length, cancel: false };
  render();

  const CONCURRENCY = 4;
  let cursor = 0;

  const worker = async () => {
    while (cursor < pending.length && !state.backfill.cancel) {
      const photo = pending[cursor++];
      try {
        const res = await authedFetch(`${CONFIG.SUPABASE_URL}/functions/v1/get-photo?id=${encodeURIComponent(photo.drive_file_id)}`, () => ({ headers: apiHeaders() }));
        if (!res.ok) throw new Error("fetch failed");
        const blob = await res.blob();
        // get-photo does not always report image/jpeg, and extractExifDate
        // refuses anything else. Forcing the type is safe because the parser
        // still verifies the JPEG SOI marker and returns null for non-JPEGs.
        const taken = await extractExifDate({ type: "image/jpeg", slice: (a, b) => blob.slice(a, b) });
        if (taken) {
          await restPatch("photos", `id=eq.${photo.id}`, { taken_at: taken });
          state.backfill.found++;
        }
      } catch (e) {
        state.backfill.failed++;
      }
      state.backfill.done++;
      if (state.backfill.done % 5 === 0) debouncedRender();
    }
  };

  try {
    await Promise.all(Array.from({ length: CONCURRENCY }, worker));
    const { found, done, failed, cancel } = state.backfill;
    toast(`${cancel ? "Stopped" : "Done"} — ${found} of ${done} had a capture date${failed ? `, ${failed} could not be read` : ""}`);
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.backfill = null;
    await loadAll();
  }
}

function cancelBackfill() {
  if (state.backfill) { state.backfill.cancel = true; toast("Stopping after the photos in flight…"); }
}

// GAL-1, and GAL-2 with it. A favourited photo is a highlight — one mechanism
// rather than two overlapping ones. It also promotes a photo into the taxon
// gallery, so hearting does real work rather than just decorating.
// Percentages of the displayed box, so the point holds whatever size the image
// is rendered at — a thumbnail and a full-width hero centre on the same spot.
// Measured against the IMAGE, not its container. The container is
// width:fit-content so the two coincide, but measuring the image is what makes
// the percentage mean "this point of the photo" rather than "this point of
// whatever box it happens to sit in" — which is the bug the first version had.
function paintFocal(x, y) {
  const marker = document.getElementById("focal-marker");
  if (marker) { marker.style.left = x + "%"; marker.style.top = y + "%"; }
  ["focal-prev-1x1", "focal-prev-4x3"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.style.objectPosition = x + "% " + y + "%";
  });
}

async function setFocalFromClick(evt, photoId) {
  const img = document.getElementById("focal-img");
  if (!img) return;
  const r = img.getBoundingClientRect();
  const x = Math.round(Math.min(100, Math.max(0, ((evt.clientX - r.left) / r.width) * 100)));
  const y = Math.round(Math.min(100, Math.max(0, ((evt.clientY - r.top) / r.height) * 100)));
  // Paint immediately: waiting on the round-trip makes the tap feel like it
  // missed, and the previews are the whole point of the interaction.
  paintFocal(x, y);
  try {
    await restPatch("photos", `id=eq.${photoId}`, { focal_x: x, focal_y: y });
    const p = state.photos.find((ph) => ph.id === photoId);
    if (p) { p.focal_x = x; p.focal_y = y; }
    toast("Focus set");
  } catch (e) { toast(e.message, true); }
}

async function clearFocal(photoId) {

/* ============================================================
   RENDER
   ============================================================ */
// For values going into a single-quoted inline handler, where escapeHtml's
// entity encoding is not enough — a quote or backslash would break out of the
// attribute.
/* An external search link. target=_blank so the app is not navigated away
   from mid-identification, and rel=noopener because these are third-party
   pages. */
function refLink(label, url) {
  return `<a class="ref-link" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">${escapeHtml(label)}</a>`;
}

function escapeAttr(str) {
  return String(str == null ? "" : str).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;").replace(/[\r\n]+/g, " ");
}

// #5. A minimal overlay for Pl@ntNet reference photos. Deliberately NOT the

function escapeHtml(str) {

  d.textContent = str ?? "";
  return d.innerHTML;
}

// Live-search inputs call render() on every keystroke, and render() replaces
// app.innerHTML wholesale — so the field being typed into is destroyed and
// rebuilt each character, dropping focus and the caret. Capture both before
// the rebuild and restore them after, keyed on the element's id.
// Scroll dies with the DOM on every render, the same way focus does. Toggling
// one checkbox in a long list therefore threw you back to the top.
//
// Restoring unconditionally would be wrong — navigating to a new screen SHOULD
// start at the top. So scroll is only restored when this render is the same
// view as the last one: same tab, same record, same modal. A view key captures
// that; anything else is treated as navigation.
let lastRenderKey = "";

function currentViewKey() {
  return [
    state.tab,
    state.currentPlantId,
    state.currentLocationId,
    state.currentTaxonId,
    state.reportView,
    state.modal ? state.modal.type : "",
  ].join("|");
}

function captureScroll() {
  const modal = document.querySelector(".modal");
  return { page: window.scrollY || 0, modal: modal ? modal.scrollTop : 0 };
}

function restoreScroll(snap) {
  if (!snap) return;
  if (snap.page) window.scrollTo(0, snap.page);
  if (snap.modal) {
    const modal = document.querySelector(".modal");
    if (modal) modal.scrollTop = snap.modal;
  }
}

function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  if (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") return null;
  return { id: el.id, start: el.selectionStart, end: el.selectionEnd };
}
function restoreFocus(snap) {
  if (!snap) return;
  const el = document.getElementById(snap.id);
  if (!el) return;
  el.focus();
  // Throws on input types with no text selection (date, number in some
  // browsers). The focus is the important half; the caret is best-effort.
  try { el.setSelectionRange(snap.start, snap.end); } catch (e) {}
}

/* PERF-2 (1 of 3). Eleven `oninput` handlers called render() on every keystroke,
   and render() replaces app.innerHTML wholesale — so typing one character into
   the Gallery search destroyed and rebuilt every node on screen, every <img>
   included. That is most of the flashing.

   State updates immediately (so the input keeps its value and nothing is lost);
   the repaint is coalesced to one frame after the typing pauses. 90ms is below
   the ~100ms threshold where a UI stops feeling immediate, and comfortably
   above a fast typist's inter-key gap. */
let renderTimer = null;
function scheduleRender(delay = 90) {
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { renderTimer = null; render(); }, delay);
}

function render() {
  // A pending debounce is now redundant — this render supersedes it.
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  const app = document.getElementById("app");
  const focusSnapshot = captureFocus();
  const scrollSnapshot = captureScroll();
  const sameView = currentViewKey() === lastRenderKey;

  if (state.configKey === "REPLACE_WITH_YOUR_PUBLISHABLE_KEY" || !state.configKey) {
    app.innerHTML = configGate();
    document.getElementById("config-form").onsubmit = (e) => {
      e.preventDefault();
      state.configKey = document.getElementById("config-key-input").value.trim();
      render();
    };
    return;
  }

  if (!state.session) {
    app.innerHTML = screenLogin();
    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      state.loading = true;
      render();
      try {
        const data = await login(email, password);
        state.session = {
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          email: data.user.email,
          expires_at: Date.now() + data.expires_in * 1000,
        };
        saveSession(state.session);
        state.loading = false;
        await loadAll();
      } catch (e) {
        state.loading = false;
        toast(e.message, true);
        render();
      }
    };
    return;
  }

  let screen = "";
  if (state.tab === "inbox") screen = screenInbox();
  else if (state.tab === "plants") screen = screenTaxa();
  else if (state.tab === "taxonDetail") screen = screenTaxonDetail();
  else if (state.tab === "plantDetail") screen = screenPlantDetail();
  else if (state.tab === "locations") screen = screenLocations();
  else if (state.tab === "locationDetail") screen = screenLocationDetail();
  // "reports" is retired; anything still pointing at it lands on the queue.
  else if (state.tab === "reports") { state.tab = "inbox"; screen = screenInbox(); }
  else if (state.tab === "gallery") screen = screenGallery();
  else if (state.tab === "settings") screen = screenSettings();

  app.innerHTML = `
    ${topBar()}
    ${screen}
    ${navBar()}
    ${taskBanner()}
    ${state.modal ? `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${modalContent()}</div></div>` : ""}
    ${state.lightbox ? renderLightbox() : ""}
    ${state.refImage ? renderRefImage() : ""}
  `;
  document.body.classList.toggle("has-task-banner", !!taskBanner());
  measureStickyOffset();
  wireModalForms();
  restoreFocus(focusSnapshot);
  // Scroll was preserved when the view stayed the same and simply left alone
  // when it changed — so arriving somewhere new kept the previous page's Y
  // offset. Scrolled far down the Plants list, opening a species landed you at
  // the bottom of a shorter page with the header off screen.
  if (sameView) restoreScroll(scrollSnapshot);
  else window.scrollTo(0, 0);
  lastRenderKey = currentViewKey();
  observeLazyPhotos();
}

// Two sticky layers, one on top of the other: the brand bar and its sub-bar,
// then the screen's own filter row. The second has to start where the first
// ends, and that height is not a constant — the Inbox sub-bar appears and
// disappears, the task banner shifts everything down 46px, and the brand bar
// changes with the breakpoint. Measured rather than guessed.
function measureStickyOffset() {
  const group = document.querySelector(".sticky-header-group");
  const banner = document.body.classList.contains("has-task-banner") ? 46 : 0;
  const h = group ? Math.round(group.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty("--sticky-top", (h + banner) + "px");
}

function renderLightbox() {
  const isInbox = state.lightbox.mode === "inbox";
  const isLocation = state.lightbox.mode === "location";
  const isGallery = state.lightbox.mode === "gallery";
  const { plantId, locationId, photoId } = state.lightbox;
  const list = lightboxPhotoList();
  const idx = list.findIndex((p) => p.id === photoId);
  const p = list[idx];
  if (!p) { state.lightbox = null; return ""; }
  const url = state.photoUrlCache[p.drive_file_id];
  const pl = (!isInbox && !isLocation && !isGallery) ? state.plants.find((x) => x.id === plantId) : (isGallery && p.plant_id ? state.plants.find((x) => x.id === p.plant_id) : null);
  const loc = isLocation ? locationById(locationId) : null;
  const isPrimary = isLocation ? loc?.primary_photo_id === p.id : pl?.primary_photo_id === p.id;
  const plantnetSuggestion = isInbox ? pendingIdentifications(p.id).find((s) => s.source === "PlantNet") : null;
  const claudeSuggestion = isInbox ? pendingIdentifications(p.id).find((s) => s.source === "Claude") : null;
  const isIdentifying = state.identifyingPhotoId === p.id;

  const titleLine = isInbox
    ? `<div style="font-size:13.5px;">Unfiled photo</div>`
    : isGallery
    ? `<div style="font-size:13.5px;">${pl ? escapeHtml(plantDisplayName(pl)) : "Gallery photo"}</div><div style="font-size:11px;color:#9FB0A3;">${allLocationsForPhoto(p).map((l) => escapeHtml(l.name)).join(", ") || "No location"}</div>`
    : isLocation
    ? `<div style="font-size:13.5px;">${loc ? escapeHtml(loc.name) : ""}</div><div style="font-size:11px;color:#9FB0A3;">${loc ? escapeHtml(locationPath(loc)) : ""}</div>`
    : `<div style="font-size:13.5px;">${pl ? escapeHtml(plantDisplayName(pl)) : ""}</div><div style="font-size:11px;color:#9FB0A3;">📍 ${pl && locationById(pl.location_id) ? escapeHtml(locationPath(locationById(pl.location_id))) : "No location set"}</div>`;

  const lightboxSuggestionLine = (s) => `
    <div style="text-align:center;font-size:12.5px;color:var(--cream);margin-bottom:4px;cursor:pointer;" onclick="event.stopPropagation();openModal('identificationDetail',{identificationId:'${s.id}'})">
      <span class="mono" style="font-size:9px;color:var(--blue);text-transform:uppercase;">${s.source}</span> <em>${escapeHtml(s.suggested_name)}</em>${s.confidence ? ` (${Math.round(s.confidence * 100)}%)` : ""} <span style="color:var(--blue);">— compare</span>
    </div>`;

  let bottomActions;
  if (isInbox) {
    bottomActions = `
    ${plantnetSuggestion ? lightboxSuggestionLine(plantnetSuggestion) : ""}
    ${claudeSuggestion ? lightboxSuggestionLine(claudeSuggestion) : ""}
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px;">
      ${photoActionsHtml(p, { mode: "inbox", variant: "full", fromLightbox: true, cls: "btn btn-secondary btn-sm icon-btn", style: "" })}
    </div>`;
  } else if (isLocation) {
    // The audit's worst finding: two actions, one of which ("Edit location")
    // edited the LOCATION RECORD rather than the photo — the same mislabel the
    // plant lightbox carried until v1.84.0. Fixed there and not here, because
    // each surface owned its own buttons. Now they share one.
    bottomActions = `
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
        ${isPrimary ? `<span class="pill pill-orange">Main photo</span>` : ""}
        ${photoActionsHtml(p, { mode: "location", locationId, variant: "full", fromLightbox: true, cls: "btn btn-secondary btn-sm icon-btn", style: "" })}
      </div>`;
  } else if (isGallery) {
    const galleryLocs = allLocationsForPhoto(p);
    bottomActions = `
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
        ${pl ? `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();closeLightbox();openPlant('${pl.id}')">View plant</button>` : ""}
        ${galleryLocs[0] ? `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();closeLightbox();openLocation('${galleryLocs[0].id}')">View location</button>` : ""}
        ${photoActionsHtml(p, { mode: "gallery", plantId: pl ? pl.id : null, variant: "full", fromLightbox: true, cls: "btn btn-secondary btn-sm icon-btn", style: "" })}
      </div>
      ${identificationBadges(p.id, { dark: true })}
      ${suggestionBlock(p.id)}`;
  } else {
    // Plant mode was the poorest of the four: "Set as profile picture" and a
    // button labelled "Edit location" that actually opened the whole Edit Plant
    // modal. So looking at a specimen's photo offered no way to tag the other
    // plants in the shot (a planter holds several) and no way to reach the
    // photo's own bloom type or focal point — both of which exist, but only on
    // the photo ROW behind the lightbox. It now carries the same vocabulary
    // every other mode has.
    bottomActions = `
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
      ${isPrimary ? `<span class="pill pill-orange">Profile picture</span>` : ""}
      ${photoActionsHtml(p, { mode: "plant", plantId, variant: "full", fromLightbox: true, cls: "btn btn-secondary btn-sm icon-btn", style: "" })}
    </div>
  `;
  }

  return `
  <div class="lightbox-backdrop" onclick="if(event.target===this)closeLightbox()">
    <div class="lightbox-top">
      <div>
        ${titleLine}
        <div class="mono" style="font-size:11px;color:#9FB0A3;">${fmtDate(photoDate(p))}</div>
      </div>
      <button class="lightbox-close" onclick="closeLightbox()">${icon("close")}</button>
    </div>
    <div class="lightbox-body">
      ${list.length > 1 ? `<button class="lightbox-nav" style="position:absolute;left:8px;" onclick="event.stopPropagation();lightboxStep(1)">${icon("back")}</button>` : ""}
      ${url ? `<img src="${url}" onclick="event.stopPropagation();this.classList.toggle('zoomed')" />` : `<span class="subtle">Loading…</span>`}
      ${list.length > 1 ? `<button class="lightbox-nav" style="position:absolute;right:8px;transform:scaleX(-1);" onclick="event.stopPropagation();lightboxStep(-1)">${icon("back")}</button>` : ""}
    </div>
    <div class="lightbox-bottom">
      ${list.length > 1 ? `<div class="lightbox-counter">${idx + 1} of ${list.length}</div>` : ""}
      ${bottomActions}
    </div>
  </div>`;
}

// Lifted out of wireModalForms() in v1.95.2. It was defined INSIDE that
// function, so it existed only while wireModalForms was running — every form
// handler closed over it and worked, but createBatch() called it from outside
// and got "ensureTaxonForName is not defined". Batch entry could not create a
// new species at all.
// with the same botanical name, otherwise make a new one. A specimen with no
// name at all keeps taxa_id null on purpose and surfaces in the Unidentified
// group on the taxa list instead.
// SPECIES-1 phase 3. Every species fact entered anywhere in the app lands here
// and goes onto the taxon. `parts` carries cultivar/family/genus/epithet from
// the New Plant form, which used to write them onto the specimen instead.
//
// A common name with no botanical name still deserves a taxon — three plants
// can obviously be the same kind before anyone knows what that kind is, which
// is what working_label is for. Returning null there would strand the specimen.
/* NAME-3. Every taxon created by typing a name landed as free text with no
   parts, because `parts` were only filled from the New Plant form's collapsed
   "More details" fields — which are almost always left blank. 61 of 105 records
   had no genus, and the "Names not split up" list grew with every plant added.

   The name already contains the parts. Parse them.

   Deliberately conservative — it does NOT guess. A token becomes an epithet
   only if it is lowercase, which is the botanical convention; a cultivar only
   if it is quoted. Anything it cannot read confidently is left for NAME-2's
   Claude pass rather than filled in wrongly, because a wrong genus is worse
   than an empty one. */
const INFRA_RANK_RE = /^(nothosubsp|subsp|ssp|subvar|var|subf|f)\.?$/i;
function parseBotanicalName(raw) {
  const out = { genus: null, species_epithet: null, infraspecific: null, cultivar: null, is_hybrid: false };
  let str = String(raw || "").trim();
  if (!str) return out;

  // Cultivar first: it is quoted, so pulling it out leaves a clean botanical
  // name behind. Straight or curly quotes, and never treated as an epithet.
  const q = str.match(/['\u2018\u201C"]([^'\u2019\u201D"]+)['\u2019\u201D"]/);
  if (q) {
    out.cultivar = q[1].trim();
    str = (str.slice(0, q.index) + " " + str.slice(q.index + q[0].length)).trim();
  }

  const tok = str.split(/\s+/).filter(Boolean);
  if (!tok.length) return out;

  // Genus must look like a genus: capitalised, letters only.
  if (!/^[A-Z][a-zA-Z-]+$/.test(tok[0])) return out;
  out.genus = tok[0];
  let i = 1;

  // The hybrid sign sits between genus and epithet, written × or a bare x.
  if (i < tok.length && (tok[i] === "\u00D7" || tok[i].toLowerCase() === "x")) { out.is_hybrid = true; i++; }

  // An epithet is lowercase. "Agavoides" is a miscapitalised epithet and this
  // will not take it — that is NAME-2's job, and guessing here would bake the
  // error in.
  if (i < tok.length && /^[a-z][a-z-]+$/.test(tok[i])) { out.species_epithet = tok[i]; i++; }

  // Infraspecific rank plus its epithet, e.g. "var. erinacea".
  if (i + 1 < tok.length && INFRA_RANK_RE.test(tok[i]) && /^[a-z][a-z-]+$/.test(tok[i + 1])) {
    out.infraspecific = `${tok[i].replace(/\.?$/, ".").toLowerCase()} ${tok[i + 1]}`;
    i += 2;
  }
  // Anything still unconsumed means the name is not a shape this understands
  // ("Austrocylindropuntia subulata monstrose"). What was read stays; the rest
  // is left for NAME-2 rather than forced into a field.
  return out;
}

async function ensureTaxonForName(botanicalName, commonName, parts) {
  const name = (botanicalName || "").trim();
  const common = (commonName || "").trim();
  if (!name && !common) return null;
  const existing = findTaxonByName(name, common);
  if (existing) return existing.id;
  const body = {
    botanical_name: name || null,
    common_name: common || null,
    working_label: name ? null : common,
  };
  // Parse the typed name into its parts, then let anything explicitly passed
  // win — a form field she filled in is a stronger signal than a parse.
  const parsed = parseBotanicalName(name);
  ["genus", "species_epithet", "infraspecific", "cultivar"].forEach((k) => {
    if (parsed[k]) body[k] = parsed[k];
  });
  if (parsed.is_hybrid) body.is_hybrid = true;
  if (parts) {
    ["cultivar", "family", "genus", "species_epithet"].forEach((k) => {
      if (parts[k]) body[k] = parts[k];
    });
  }
  const [created] = await restPost("taxa", body);
  return created ? created.id : null;
}

function wireModalForms() {
  const profilePhotoForm = document.getElementById("profile-photo-upload-form");
  if (profilePhotoForm) {
    profilePhotoForm.onsubmit = async (e) => {
      e.preventDefault();
      const file = document.getElementById("profile-photo-file").files[0];
      if (!file) return;
      const btn = document.getElementById("profile-photo-submit-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        const plantId = state.modal.data.plantId;
        const newPhoto = await uploadPhoto(file, plantId, null, null);
        await restPatch("plants", `id=eq.${plantId}`, { primary_photo_id: newPhoto.id, updated_at: new Date().toISOString() });
        toast("Profile picture updated");
        closeModal();
        await loadAll();
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false;
        btn.textContent = "Upload and use as profile picture";
      }
    };
  }

  const uploadForm = document.getElementById("upload-form");
  if (uploadForm) {
    uploadForm.onsubmit = async (e) => {
      e.preventDefault();
      const files = Array.from(document.getElementById("upload-file").files);
      const notes = document.getElementById("upload-notes").value;
      const locationId = state.modal?.data?.locationId || null;
      // Opened from a specimen, the photo lands on that specimen rather than in
      // the Inbox to be filed back to where it started.
      const uploadPlantId = state.modal?.data?.plantId || null;
      if (!files.length) return;
      const btn = document.getElementById("upload-submit-btn");
      btn.disabled = true;
      let succeeded = 0;
      for (let i = 0; i < files.length; i++) {
        btn.innerHTML = `<span class="spinner"></span> ${i + 1} / ${files.length}`;
        try {
          await uploadPhoto(files[i], uploadPlantId, locationId, notes);
          succeeded++;
        } catch (e) {
          toast(`Failed on ${files[i].name}: ${e.message}`, true);
        }
      }
      if (succeeded) toast(`${succeeded} photo${succeeded === 1 ? "" : "s"} added`);
      closeModal();
      await loadAll();
    };
  }

// SPECIES-1. The Plants tab lists taxa, so a specimen with no taxon is
// invisible there. Every create path must resolve one: reuse an existing taxon


  const newPlantForm = document.getElementById("new-plant-form");
  if (newPlantForm) {
    // AI-3 layer 1. Adding a plant that already exists used to be silent in
    // both directions: an exact match quietly joined the existing species
    // without saying so, and a near miss quietly created a second one. Say
    // which is about to happen, while she can still change it.
    const dupeSlot = document.getElementById("np-dupe");
    const nb = document.getElementById("np-botanical");
    const nc = document.getElementById("np-common");
    const checkDuplicateName = () => {
      if (!dupeSlot) return;
      const botanical = nb ? nb.value : "";
      const common = nc ? nc.value : "";
      if (!nameKey(botanical) && !nameKey(common)) { dupeSlot.innerHTML = ""; return; }
      const hit = findTaxonByName(botanical, common);
      if (hit) {
        const n = specimensOfTaxon(hit.id).length;
        dupeSlot.innerHTML = `<div class="dupe-note is-link">Joins the existing species <strong>${taxonDisplayHtml(hit)}</strong>${n ? ` — ${escapeHtml(countLabel(n, "specimen", "specimens"))} already` : ""}. This plant is saved as another specimen of it, not as a new species.</div>`;
        return;
      }
      const near = similarTaxaByName(botanical, common);
      if (near.length) {
        dupeSlot.innerHTML = `<div class="dupe-note is-warn">Close to ${near.length > 1 ? "species you already have" : "a species you already have"}. Saving as typed creates a <strong>second</strong> species record.
          ${near.map((t) => `<button type="button" class="dupe-pick" data-name="${escapeHtml(taxonDisplayName(t))}">Use ${escapeHtml(taxonDisplayName(t))} instead</button>`).join("")}</div>`;
        dupeSlot.querySelectorAll(".dupe-pick").forEach((btn) => {
          btn.onclick = () => {
            if (nb) nb.value = btn.getAttribute("data-name");
            checkDuplicateName();
          };
        });
        return;
      }
      dupeSlot.innerHTML = "";
    };
    if (nb) nb.oninput = checkDuplicateName;
    if (nc) nc.oninput = checkDuplicateName;
    checkDuplicateName(); // an AI suggestion arrives pre-filled
    newPlantForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        // The name inputs are not rendered once an existing species is picked.
        const nb = document.getElementById("np-botanical");
        const nc = document.getElementById("np-common");
        const botanical = nb ? (nb.value || null) : null;
        const common = nc ? (nc.value || null) : null;
        const body = {
          identification_status: document.getElementById("np-idstatus").value,
          location_id: locFieldValue("np") || null,
          collection_category: document.getElementById("np-category").value,
          original_collection: document.getElementById("np-original").checked,
          notes: document.getElementById("np-notes").value || null,
        };
        // The expandable half may not be in the DOM at all; read defensively so
        // a collapsed form submits exactly as it did before.
        const opt = (id) => { const el = document.getElementById(id); return el && el.value ? el.value : null; };
        Object.assign(body, {
          date_acquired: opt("np-dateacquired"),
          acquisition_source_type: opt("np-acqtype"),
          acquisition_source_name: opt("np-acqname"),
          health_status: opt("np-health") || "healthy",
        });
        // The name and its parts describe the KIND of plant, so they create or
        // find the taxon rather than being copied onto this individual.
        // Picking an existing species is exact — no name matching involved.
        body.taxa_id = state.newPlantTaxon || await ensureTaxonForName(botanical, common, {
          cultivar: opt("np-cultivar"),
          family: opt("np-family"),
          genus: opt("np-genus"),
          species_epithet: opt("np-species"),
        });
        const [newPlant] = await restPost("plants", body);
        if (state.modal.type === "newPlantFromPhoto") {
          const sourcePhoto = state.photos.find((p) => p.id === state.modal.data.photoId);
          if (sourcePhoto && !sourcePhoto.plant_id) {
            // First plant identified from this photo — it becomes the primary attachment
            await restPatch("photos", `id=eq.${state.modal.data.photoId}`, { plant_id: newPlant.id });
          } else {
            // Photo already belongs to another plant (e.g. a container shot with
            // several specimens) — tag this one instead of stealing the attachment,
            // so the same photo can seed multiple plant records without re-uploading.
            await restPost("photo_plants", { photo_id: state.modal.data.photoId, plant_id: newPlant.id });
          }
          const suggestion = pendingIdentification(state.modal.data.photoId);
          if (suggestion) {
            await restPatch("identifications", `id=eq.${suggestion.id}`, {
              status: "confirmed",
              confirmed_name: body.botanical_name,
            });
          }
        }
        toast(`Created ${newPlant.accession_number}`);
        closeModal();
        await loadAll();
        maybeResumeLightbox();
      } catch (e) { toast(e.message, true); }
    };
  }

  const editPhotoForm = document.getElementById("edit-photo-form");
  if (editPhotoForm) {
    editPhotoForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await restPatch("photos", `id=eq.${state.modal.data.photoId}`, {
          photo_type: document.getElementById("eph-type").value || "general",
          // Only sent when the column exists, so the form still saves on an
          // app that has not had the PHOTO-4 migration run against it.
          ...(photosHaveHistorical() ? { historical: !!document.getElementById("eph-historical")?.checked } : {}),
          location_id: state.editPhotoLocation || null,
          plant_id: state.editPhotoPlant || null,
          notes: document.getElementById("eph-notes").value || null,
        });
        toast("Photo updated");
        closeModal();
        await loadAll();
      } catch (e) { toast(e.message, true); }
    };
  }

  const editTaxonForm = document.getElementById("edit-taxon-form");
  if (editTaxonForm) {
    editTaxonForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const body = {
          botanical_name: document.getElementById("et-botanical").value.trim() || null,
          common_name: document.getElementById("et-common").value.trim() || null,
          working_label: document.getElementById("et-working").value.trim() || null,
          family: document.getElementById("et-family").value.trim() || null,
          genus: document.getElementById("et-genus").value.trim() || null,
          species_epithet: document.getElementById("et-species").value.trim() || null,
          infraspecific: document.getElementById("et-infraspecific").value.trim() || null,
          parentage: document.getElementById("et-parentage").value.trim() || null,
          // Stored bare; the display layer adds the quotes, so a name never
          // ends up with two sets of them.
          cultivar: document.getElementById("et-cultivar").value.trim().replace(/^['\u2018\u2019"]+|['\u2018\u2019"]+$/g, "") || null,
          is_hybrid: document.getElementById("et-hybrid").checked,
          description: document.getElementById("et-description").value || null,
          plant_type: document.getElementById("et-planttype").value || null,
          growth_habit: document.getElementById("et-growthhabit").value || null,
          mature_size: document.getElementById("et-maturesize").value || null,
          bloom_season: document.getElementById("et-bloomseason").value || null,
          origin: document.getElementById("et-origin").value || "unknown",
          native_range: document.getElementById("et-native").value || null,
          hardy_to: document.getElementById("et-hardy").value || null,
          frost_tender: document.getElementById("et-frosttender").checked,
          light_conditions: Array.from(document.querySelectorAll(".et-light-checkbox:checked")).map((el) => el.value),
          water_needs: document.getElementById("et-water").value || null,
          updated_at: new Date().toISOString(),
        };
        // Ships ahead of its SQL. PGRST204 is PostgREST saying the column does
        // not exist; retry without it so the rest of the edit still saves and
        // she is told what to run rather than losing the form.
        try {
          await restPatch("taxa", `id=eq.${state.modal.data.taxonId}`, body);
        } catch (err) {
          if (!/PGRST204/.test(err.message) || !("frost_tender" in body)) throw err;
          delete body.frost_tender;
          await restPatch("taxa", `id=eq.${state.modal.data.taxonId}`, body);
          toast("Saved, but the frost flag needs its column added first", true);
          closeModal();
          await loadAll();
          return;
        }
        toast("Species record saved");
        closeModal();
        await loadAll();
      } catch (e) { toast(e.message, true); }
    };
  }

  const newSpecimenHereForm = document.getElementById("new-specimen-here-form");
  if (newSpecimenHereForm) {
    const sel = document.getElementById("nsh-taxon");
    const wrap = document.getElementById("nsh-newname-wrap");
    // Reveal the name field only when it is needed, rather than showing an
    // input that is wrong for the common case.
    if (sel && wrap) sel.onchange = () => { wrap.style.display = sel.value === "__new__" ? "" : "none"; };
    newSpecimenHereForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const choice = document.getElementById("nsh-taxon").value;
        let taxaId = choice && choice !== "__new__" ? choice : null;
        if (choice === "__new__") {
          const name = document.getElementById("nsh-newname").value.trim();
          if (!name) { toast("Give the new species a name", true); return; }
          taxaId = await ensureTaxonForName(name, null);
          await loadAll();
        }
        const t = taxaId ? taxonById(taxaId) : null;
        const [created] = await restPost("plants", {
          taxa_id: taxaId,
          location_id: state.modal.data.locationId,
          ...readAcquisitionFields("nsh"),
          // No taxon at all still means unidentified, whatever the dropdown says.
          ...(taxaId ? {} : { identification_status: "unidentified" }),
          collection_category: "current",
          status: "active",
        });
        toast(`Created ${created ? created.accession_number : "specimen"}`);
        closeModal();
        await loadAll();
      } catch (e) { toast(e.message, true); }
    };
  }

  const newSpecimenForm = document.getElementById("new-specimen-form");
  if (newSpecimenForm) {
    newSpecimenForm.onsubmit = async (e) => {
      e.preventDefault();
      const taxonId = state.modal.data.taxonId;
      const t = taxonById(taxonId);
      // The <select> carried `required`; the staged field cannot, so the check
      // moves here rather than silently creating a homeless specimen.
      if (!locFieldValue("ns")) { toast("Choose where this specimen lives", true); return; }
      try {
        const parentId = document.getElementById("ns-parent").value || null;
        const body = {
          taxa_id: taxonId,
          location_id: locFieldValue("ns") || null,
          parent_plant_id: parentId,
          // Was hardcoded `confirmed` on the reasoning that a specimen of a
          // known taxon is identified by definition. True of a real species,
          // false of a catch-all like "unidentified cactus" — so she picks.
          ...readAcquisitionFields("ns"),
          collection_category: "current",
          status: "active",
        };
        await restPost("plants", body);
        toast("Specimen added");
        closeModal();
        await loadAll();
      } catch (e) { toast(e.message, true); }
    };
  }

  const editPlantForm = document.getElementById("edit-plant-form");
  if (editPlantForm) {
    editPlantForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const body = {
          identification_status: document.getElementById("ep-idstatus").value,
          identification_notes: document.getElementById("ep-idnotes").value || null,
          collection_category: document.getElementById("ep-category").value,
          original_collection: document.getElementById("ep-original").checked,
          status: document.getElementById("ep-status").value,
          health_status: document.getElementById("ep-health").value,
          next_check_date: document.getElementById("ep-nextcheck").value || null,
          date_acquired: document.getElementById("ep-dateacquired").value || null,
          acquisition_source_type: document.getElementById("ep-acqtype").value || null,
          acquisition_source_name: document.getElementById("ep-acqname").value || null,
          acquisition_notes: document.getElementById("ep-acqnotes").value || null,
          parent_plant_id: document.getElementById("ep-parent").value || null,
          location_id: locFieldValue("ep") || null,
          notes: document.getElementById("ep-notes").value || null,
          updated_at: new Date().toISOString(),
        };
        // Linking an existing specimen to a species. Without this an orphaned
        // specimen could never be linked at all — create and propagate resolved
        // a taxon but edit did not.
        const taxonPick = document.getElementById("ep-taxon").value;
        if (taxonPick === "__new__") {
          const newName = document.getElementById("ep-newtaxon-name").value.trim();
          const newCommon = document.getElementById("ep-newtaxon-common").value.trim();
          if (!newName && !newCommon) { toast("Give the new species a name", true); return; }
          // Through ensureTaxonForName, not a direct insert: it is the one choke
          // point that parses the name into parts and returns an EXISTING taxon
          // if the name already matches, so this cannot quietly make a duplicate.
          body.taxa_id = await ensureTaxonForName(newName, newCommon, {});
          if (!body.taxa_id) { toast("Could not create that species", true); return; }
        } else {
          body.taxa_id = taxonPick || null;
        }
        await restPatch("plants", `id=eq.${state.modal.data.plantId}`, body);
        toast(body.taxa_id ? "Saved" : "Saved — not linked to a species");
        closeModal();
        await loadAll();
      } catch (e) { toast(e.message, true); }
    };
  }

  const newLocationForm = document.getElementById("new-location-form");
  if (newLocationForm) {
    newLocationForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const body = {
          name: document.getElementById("nl-name").value,
          type: document.getElementById("nl-type").value || null,
          holds_plants: document.getElementById("nl-holdsplants").checked,
          gallery_row: document.getElementById("nl-galleryrow").value || "none",
          locality: document.getElementById("nl-locality").value.trim() || null,
          active_from: document.getElementById("nl-activefrom").value || null,
          active_to: document.getElementById("nl-activeto").value || null,
          parent_location_id: document.getElementById("nl-parent").value || null,
          code: document.getElementById("nl-code").value || null,
        };
        await restPost("locations", body);
        toast("Location added");
        closeModal();
        await loadAll();
      } catch (e) { toast(e.message, true); }
    };
  }

  const propagateForm = document.getElementById("propagate-plant-form");
  if (propagateForm) {
    propagateForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const parent = state.plants.find((p) => p.id === state.modal.data.parentId);
        const body = {
          taxa_id: parent.taxa_id || null,
          location_id: locFieldValue("pp") || null,
          notes: document.getElementById("pp-notes").value || null,
          parent_plant_id: state.modal.data.parentId,
          acquisition_source_type: "propagation",
          acquisition_source_name: `Propagated from ${parent.accession_number}`,
        };
        const count = Math.min(25, Math.max(1, parseInt(document.getElementById("pp-count").value, 10) || 1));
        // One insert of N rows: the accession trigger numbers each in turn.
        const created = await restPost("plants", Array.from({ length: count }, () => ({ ...body })));
        const newPlant = Array.isArray(created) ? created[0] : created;
        toast(count === 1
          ? `Created ${newPlant.accession_number}`
          : `Created ${count} offsets — ${newPlant.accession_number} onward`);
        closeModal();
        await loadAll();
      } catch (e) { toast(e.message, true); }
    };
  }

  const editLocationForm = document.getElementById("edit-location-form");
  if (editLocationForm) {
    editLocationForm.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const sortVal = document.getElementById("el-sort").value;
        const body = {
          name: document.getElementById("el-name").value,
          type: document.getElementById("el-type").value || null,
          holds_plants: document.getElementById("el-holdsplants").checked,
          gallery_row: document.getElementById("el-galleryrow").value || "none",
          locality: document.getElementById("el-locality").value.trim() || null,
          active_from: document.getElementById("el-activefrom").value || null,
          active_to: document.getElementById("el-activeto").value || null,
          archived: document.getElementById("el-archived").checked,
          parent_location_id: document.getElementById("el-parent").value || null,
          sort_order: sortVal === "" ? null : Number(sortVal),
          code: document.getElementById("el-code").value || null,
          notes: document.getElementById("el-notes").value || null,
        };
        await restPatch("locations", `id=eq.${state.modal.data.locationId}`, body);
        toast("Location updated");
        closeModal();
        await loadAll();
      } catch (e) { toast(e.message, true); }
    };
  }
}

async function boot() {
  // An import interrupted by a refresh or a closed tab can be picked up, as
  // long as the picker links are still inside their 60-minute window.
  loadInboxPrefs();
  state.resumableImport = loadPhotosImport();

  const cameFromDriveConnect = window.location.hash === "#drive-connected";
  if (cameFromDriveConnect) {
    history.replaceState(null, "", window.location.pathname);
  }

  // Attached once — delegated from document, so it survives every re-render.
  wireHoverCards();

  // Not awaited: a slow or failed check must never delay the app starting.
  checkForNewVersion();

  const stored = loadStoredSession();
  if (stored) {
    if (stored.expires_at && Date.now() < stored.expires_at - 60 * 1000) {
      state.session = stored;
      if (cameFromDriveConnect) state.tab = "settings";
      await loadAll();
      if (cameFromDriveConnect) toast("Google Drive connected");
      return;
    }
    // Access token expired — try a silent refresh before giving up
    try {
      const data = await refreshAccessToken(stored.refresh_token);
      state.session = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        email: data.user?.email || stored.email,
        expires_at: Date.now() + data.expires_in * 1000,
      };
      saveSession(state.session);
      if (cameFromDriveConnect) state.tab = "settings";
      await loadAll();
      if (cameFromDriveConnect) toast("Google Drive connected");
      return;
    } catch (e) {
      clearStoredSession();
    }
  }
  render();
}
boot();
</script>
</body>
</html>
